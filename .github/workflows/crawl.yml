name: Hourly Product Roles Crawl + Notify

# Same schedule as role-radar (the software-engineer crawler). Times are UTC; GitHub
# cron has no DST. Hourly ~08:00-21:00 CEST plus one at 00:00 CEST; the 12:19 UTC run
# also sends the daily 24h summary. In winter (CET) local times are one hour earlier.
#
# Required GitHub Secrets:
#   GMAIL_APP_PASSWORD  — App password for puneetjakhar1996@gmail.com
#   GH_PAT              — Personal Access Token with repo scope (used only for the
#                         cross-repo Pages deploy step; checkout uses github.token)
#   ANTHROPIC_API_KEY, SENDER_EMAIL, NOTIFY_EMAIL — scoring and email delivery

on:
  schedule:
    - cron: '19 6-11,13-19 * * *'  # hourly ~08:00-21:00 CEST, minus 14:00 (handled below), offset :19: new roles email
    - cron: '19 22 * * *'          # 00:00 CEST (Amsterdam midnight): new roles email
    - cron: '19 12 * * *'          # 14:00 CEST: new roles email + daily 24h summary
  workflow_dispatch:
    inputs:
      daily:
        description: 'Send daily report'
        required: false
        default: 'false'

jobs:
  crawl-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install dependencies
        run: pip install -q requests beautifulsoup4 python-jobspy pandas lxml playwright anthropic

      # Retries because an unreachable Ubuntu apt mirror (seen 2026-11-11 in role-radar)
      # can fail the whole run. If apt stays down, fall back to the browser alone:
      # ubuntu-latest already ships Chromium's runtime libraries.
      - name: Install Playwright chromium + system deps
        run: |
          # Each attempt is capped at 4 min: a dead mirror otherwise stalls apt for ~10 min.
          for i in 1 2; do
            timeout 240 bash -c 'sudo apt-get update -qq && playwright install chromium --with-deps' && exit 0
            echo "attempt $i failed, retrying in 20s"; sleep 20
          done
          echo "::warning::system deps install failed, falling back to browser-only install"
          playwright install chromium

      - name: Run portal + LinkedIn crawl in parallel
        run: |
          python crawl_internships.py --force &
          PORTAL_PID=$!
          python crawl_linkedin.py --force &
          LINKEDIN_PID=$!
          wait $PORTAL_PID
          PORTAL_EXIT=$?
          wait $LINKEDIN_PID
          exit $PORTAL_EXIT
        continue-on-error: true

      - name: Send hourly new-roles email
        if: "!(github.event_name == 'workflow_dispatch' && github.event.inputs.daily == 'true')"
        run: python notify.py
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DASHBOARD_URL: https://puneetjakhar.github.io/vanshika-nl-jobs-dashboard/

      - name: Send daily 24h summary (12:00 UTC = 14:00 CEST)
        if: >
          github.event.schedule == '19 12 * * *' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.daily == 'true')
        run: python notify.py --daily
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DASHBOARD_URL: https://puneetjakhar.github.io/vanshika-nl-jobs-dashboard/

      - name: Rebuild dashboard with AI scores
        run: python build_dashboard.py

      - name: Strip PII from data files before commit
        run: python strip_pii.py

      - name: Commit updated data back to repo
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add crawled_internships.json linkedin_jobs.json job-search.html seen_jobs.json score_cache.json autoapply.html || true
          git diff --staged --quiet || git commit -m "chore: job data $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --no-rebase -X ours --no-edit origin main
          git push

      - name: Deploy dashboard to public GitHub Pages repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/puneetjakhar/vanshika-nl-jobs-dashboard.git _dashboard
          cp job-search.html _dashboard/index.html
          cp autoapply.html _dashboard/autoapply.html
          cd _dashboard
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html autoapply.html
          git diff --staged --quiet || git commit -m "Update dashboard $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
