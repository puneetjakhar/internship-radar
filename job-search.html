ople leadership, while connecting the Payments domain to the wider priorities and transformation of BMG and ING.\n\n  \n  \n\nAt a time when payments are rapidly evolving through instant payments, APIs, ISO 20022 and real-time processing. You will help shape the future of global treasury and liquidity management.\n\n  \n  \n\nAs a senior leader within BMG, you will contribute to organizational priorities, leadership decisions and cross-domain transformation initiatives beyond your own domain.\n\n  \n  \n\n**The team**\n  \nThe Payments domain is responsible for the end-to-end payment capabilities that power BMG's services, from payment initiation and approval through processing, booking, messaging and connectivity with ING and external partners. The domain plays a critical role in delivering reliable, secure and efficient payment services to multinational clients worldwide.\n\nPayments is a key enabler of BMG’s growth strategy. Scalable, resilient and future-ready payment capabilities are essential to support BMG’s growth ambitions and strengthen its proposition for multinational clients.\n\nKey priorities include the further development of SEPA Instant and Classic payments, ISO 20022 messaging, API-based connectivity, payment tracking and preparation for 24/7 real-time processing. At the same time, the domain continues to simplify and modernize the payments landscape while strengthening operational resilience, scalability and maintainability.\n\nYou will lead a team of Customer Journey Experts and work closely with multidisciplinary delivery teams consisting of engineers, architects and other specialists. As part of the Delivery Management Team, you will collaborate with stakeholders across Product Management, Sales & Account Management, Operations, Risk, Technology and ING to deliver strategic priorities and continuously improve the BMG Way of Working.\n\n  \n  \n\n**Roles and responsibilities**  \nAs Product Domain Le", "source": "indeed"}, {"company": "Ohpen", "job_title": "Senior Product Manager – Lending MidOffice", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ohpen", "job_url": "https://nl.indeed.com/viewjob?jk=d9da71eda9f440f8", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "Amsterdam - Rokin 111, 1012 KN\n\nFull-time\n\nPermanent employee\n\n  \n\n**Description**\n---------------\n\nAre you a **Product Manager** who feels comfortable **in front of customers** but also enjoys **diving into the details**?\n\nWe are looking for a **Senior Product Manager** to join our **Lending team** and help shape the future of our **MidOffice product**.\n\nOur MidOffice plays a **central role in the lending solutions** we provide to banks and lenders. We are continuously improving how our customers assess mortgage applications, making the process **faster, more accurate and less dependent on manual work**. **AI plays a growing role** in this, and we want you to help us take it further.\n\nIn this role, you will work closely with our current Product Manager, **taking ownership of large parts of the MidOffice domain** from early on. You will be **the face of the product** towards customers and prospects, translating their needs into product improvements while ensuring alignment with our overall product strategy.\n\nWe offer a **hybrid working setup**, with **50% of your working time spent at our Amsterdam office** and **50% working remotely**. The role also involves **visiting customers across the Netherlands**.\n\n**Briefing**\n------------\n\n### **What you will do**\n\n* **Lead conversations with customers and prospects** to understand their needs, present our MidOffice product and explore potential solutions.\n* **Take ownership of the product-related aspects of RFIs and RFPs**, including responses, product demonstrations and discovery sessions.\n* **Build strong relationships** with customers, int d customers connect with our financial solutions. Leading a cross-functional team of product managers, design specialists, and digital analysts, you will turn strategic opportunities into seamless, market-leading experiences that support sustainable asset finance.\n\n**Your Mission**\n\n* Lead (Executing): Set and execute the end-to-end digital product strategy for the Europe market, translating commercial priorities into an impactful multi-year roadmap.\n* Lead & Mentor (Executing): Directly lead, inspire, and develop a diverse team of 9 digital professionals spanning product management, user experience, channel operations, and digital analytics.\n* Drive (Executing): Oversee full customer and partner lifecycle products, maximizing conversion rates, self-service efficiency, and post-booking digital services.\n* Champion (Influencing): Drive circular economy and sustainable finance capabilities within our digital touchpoints to advance DLL’s commitment to sustainable business.\n* Partner (Influencing): Steer digital product alignment and tailored digital integrations for strategic business partnerships and joint venture programs (including AGCO Finance and Polaris).\n* Collaborate (Influencing & Participating): align global standards with local customer engagement needs.\n* Optimize (Executing): Steer user experience (UI/UX) standards and leverage digital insight analytics to continuously validate hypotheses, measure user satisfaction, and elevate digital performance.\n* Align (Influencing & Participating): Partner closely with commercial leaders, enterprise technology teams, and global product communities to ensure cohesive delivery and seamless integration.\n\n**Skills and capabilities required**\n\n* Digital Product Leadership: 10+ years of progressive experience leading digital product management, product strategy, or digital transformation teams.\n* People Leadership: Proven track record of managing, coaching, and developing multidisciplinary teams across product, design, and analytics.\n* Lifecycle & Funnel Optimization: Practical experience defining and optimizing customer journeys, from acquisition and onboarding through post-origination servicing.\n* Strategic Stakeholder Engagement: Demonstrated ability to influence executive stakeholders, commercial leaders, and key external corporate partners.\n* Platform & Ecosystem Integration: Experience integrating enterprise platforms (such as CRM and core servicing systems) and scaling joint-venture or partner-specific solutions.\n* Data-Informed Decision Making: Strong comfort using quantitative analytics and qualitative customer feedback to guide backlog prioritization and measure business outcomes.\n* Collaborative & Agile Mindset: An inclusive, adaptable approach to navigating complex matrix organizations and bridging ", "source": "indeed"}, {"company": "stichd", "job_title": "Product Creation Process Manager", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Stichd", "job_url": "https://nl.indeed.com/viewjob?jk=5ce48a22d108b6e5", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-16", "recruiter_email": null, "applicant_count": null, "description": "**The Job**\n\nAs Product Creation Process Manager, you own the seasonal Rolling Program and critical path across all STICHD brands, product categories and regions. You connect the internal teams involved in product creation, ensure clear milestones and accountability, and continuously improve the processes, systems and ways of working that take our products from concept to market.\n  \n  \nYou possess in-depth knowledge of operational processes, think cross-functionally, and proactively seek ways to improve and innovate the Rolling Program and the way we work.\n\n**Your Mission**\n\n* Set up seasonal Rolling Programs for all brands, product categories, and regions.\n\n* Align cross-functionally between international teams and departments involved in the creation and execution of the Rolling Program.\n\n* Monitor progress and ensure stakeholders deliver on their responsibilities to meet critical milestones.\n\n* Continuously assess and improve the Rolling Program and related ways of working.\n\n* Identify and implement improvements in processes, structures, and systems related to product design, development, marketing, and sourcing.\n\n* Collaborate with departments such as Operations and Sales to support product creation and reduce lead time, cost, and effort.\n\n* Support the department with additional relevant activities and projects as needed.\n\n**Your Talent**\n\n* You hold a Bachelor’s degree in Business Administration, Supply Chain, or a related field;\n\n* Experience in process coordination, project management, or operations within a sports-lifestyle industry or international organization with global brands;\n\n* Strong understanding of cross-functional workflows and critical path management;\n\n* Excellent command of English, both written and spoken;\n\n* Proficiency in MS Office (especially Excel and PowerPoint);\n\n* Experience with project management tools is an advantage.\n\nThis role is based in Den Bosch, the Netherlands. Working remotely from other countries is not possible.\n\n  \n  \n\nTo apply for this role, you must already have the legal right to work in the Netherlands. We will not apply for work or residence permits.\n\n  \n\n**We Offer**\n\n* Our salaries are based on 38 hours per week, but fulltime work is 40 hours per week. Instead, you choose between a lot of holidays; 40 per year ór choose for a 40-hour salary per month with still 27 holidays. You can switch every six months;\n\n* Annual bonus scheme;\n\n* New hires (introduction) days;\n\n* Great offer of e-learnings and a training offer for personal development;\n\n* Enough free fruit for you daily vitamins;\n\n* Provided lunch at a low cost;\n\n* Choose between lease-bike, NS Business Card or travel by car for € 0,25 per km (>10km).\n\n* 8% holiday allowance, employee insurances and a good pension scheme;\n\n* Employee discount on the PUMA, Levi’s, Fuelforfans and BMW Lifestyle websites;\n\n* Hybrid working. On fulltime basis 3 days in the office and 2 days at home (incl. allowance for home working);\n\n* Flexible working hours, mo", "source": "indeed"}, {"company": "Google", "job_title": "Technical Program Manager, Technical Excellence, Physical Security", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Google", "job_url": "https://nl.indeed.com/viewjob?jk=44074bdafbb544ef", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-13", "recruiter_email": null, "applicant_count": null, "description": "Note: By applying to this position you will have an opportunity to share your preferred working location from the following: **Dublin, Ireland; Amsterdam, Netherlands; London, UK**.\n\n### **Minimum qualifications:**\n\n* Bachelor's degree in a technical, engineering, security management, or business field, or equivalent practical experience.\n* 5 years of experience managing physical security technology projects (such as enterprise access control, CCTV, intrusion detection systems, and physical barriers) from design through to deployment and commissioning.\n* 3 years of experience in technical program management leading cross-functional teams in a global or regional environment, specifically within logistics, warehousing, or industrial settings.\n\n  \n\n### **Preferred qualifications:**\n\n* 5 years of experience managing cross-functional or cross-team projects.\n* Experience managing security designers and partnering with architects & engineers to drive excellence in the design process.\n\n**About the job**\n-----------------\n\nA problem isn’t truly solved until it’s solved for all. That’s why Googlers build products that help create opportunities for everyone, whether down the street or across the globe. As a Technical Program Manager at Google, you’ll use your technical expertise to lead complex, multi-disciplinary projects from start to finish. You’ll work with stakeholders to plan requirements, identify risks, manage project schedules, and communicate clearly with cross-functional partners across the company. You're equally comfortable explaining your team's analyses and recommendations to executives as you are discussing the technical tradeoffs in product development with engineers.\n\nThe Data Center team designs and operates some of the most sophisticated electrical and HVAC systems in the world. We are an upbeat, creative, team-oriented group of engineers committed to building and operating powerful data centers.\n\nIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\n  \n  \nIreland: €118000 - €120000 (EUR) + 15% bonus target + equity + benefits  \nNetherlands: €130000 - €133000 (EUR) + 15% bonus target + equity + benefits  \n  \nLearn more about benefits at Google.\n\n**Responsibilities**\n--------------------\n\n* Own the lifecycle, governance, and regional adaptation of global physical security standards, master specifications and reference design templates across EMEA and APAC regions.\n* Lead technical change management and design-exception governance across EMEA and APAC, ensuring proposed design variances, alternate hardware selections, and phased turnover postures maintain rigorous security and audit baselines.\n* Partner with engineering and tooling teams to deploy and scale digital tracking dashboards, CAD/BIM design-validation workflows, and automated quality-assurance tools.\n* Partner with global program leads and regional operations teams to scope and enable large-scale brownfield security ", "source": "indeed"}, {"company": "Cronos Group Inc.", "job_title": "Product Development Manager (Netherlands)", "location": "Hellevoetsluis, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Cronos-Group-Inc.", "job_url": "https://nl.indeed.com/viewjob?jk=8a2bf620293fc539", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "Cronos is an innovative global cannabinoid company committed to building disruptive intellectual property by advancing cannabis research, technology, and product development. With a passion to responsibly elevate the consumer experience, Cronos is building an iconic brand portfolio. Cronos’ diverse international brand portfolio includes Spinach®, PEACE NATURALS® and Lord Jones®. For more information about Cronos and its brands, please visit: https://thecronosgroup.com/.\n\nAt Cronos Group, we hire talented people who thrive on solving difficult problems and give them the opportunity to hone new skills and approaches. If you want to play a part in shaping an innovative industry and help build a historically significant company, we want to meet you.\n\nThe Manager, Product Development – Netherlands will lead the local implementation, adaptation, and validation of products and processes transferred from Cronos Group’s Canadian R&D Center of Excellence to Netherlands operations.\n\nThis role executes approved product localization and technology-transfer projects with local Operations, Quality, Regulatory, and global R&D teams, within established global priorities and Netherlands regulatory and operational requirements.\n\nThe Manager, Product Development will also plan, execute, and analyze Netherlands sensory sessions with the PD Technician and the local Marketing lead, using methods and standards established by global Sensory Sciences.\n\nReporting to the Senior Director, Product Development, the Manager, Product Development will lead and develop the Netherlands PD Technician and own local delivery of R&D priorities, partnering closely with Canadian R&D and local cross-functional teams.The successful candidate is a hands-on technical lead with strong project execution and cross-functional coordination skills, and has experience translating established technologies into locally deployable products and processes.\n\n**This position is based out of Hellevoetsluis, South Holland, Netherlands.**\n\n**Key Responsibilities**\n------------------------\n\nProduct Development Coordination and R&D Integration\n\n* Own the execution of approved product development and technology-transfer projects in the Netherlands, in line with priorities set by global R&D leadership.\n* Serve as the local technical contact between the Canadian R&D Center of Excellence and Netherlands operations for technology transfer, knowledge sharing, and local adaptation.\n* Build and maintain local project plans (activities, timelines, resource needs, and technical dependencies), and coordinate with Operations, Quality, and Engineering to deliver agreed milestones.\n* Lead local cross-functional project meetings. Report progress, risks, and technical issues to global R&D, and escalate any decision outside approved scope or technical standards.Drive deployment of global R&D outputs locally in partnership with Netherlands operational teams.\n\nTechnology Transfer & Local Adaptation\n\n* Assess transferred formulat", "source": "indeed"}, {"company": "FitForMe", "job_title": "Product Specialist - NL", "location": "Rotterdam, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Fitforme", "job_url": "https://nl.indeed.com/viewjob?jk=453ff86fd1f29e2a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "**Product Specialist Netherlands & UK**\n\n***Every clinic that refers to us means more patients get the right support after surgery. Your job is to win those clinics, and keep them.***\n\nAt FitForMe we help improve the lives of people living with obesity, with science-based supplements and lifelong support after bariatric surgery. We started in the Netherlands, and Dutch clinics know us well. In the UK, clinics have started referring patients to us on their own initiative. Now we need someone to build on both.\n\nAs Product Specialist you look after a portfolio of Dutch clinics and grow our relationships with UK clinics remotely. Your customers are surgeons, dietitians, coordinators and psychologists. The work is about earning their trust and turning it into referrals you can see in the numbers.\n\n**Why this role**\n\n* **Work that matters.** Every clinic that refers to us means more patients get the right support after surgery.\n* **Commercial, without the hard sell.** You’re judged on relevance and credibility, not on pushing a product.\n* **A strong start in the Netherlands.** FitForMe was founded here, so you open doors from a position of credibility.\n* **Something to build in the UK.** Some of it is new, and you get to shape it.\n* **Your week, your plan.** Field-based in the Netherlands, remote for the UK, and you decide how to spend your time.\n\n**What to expect: the honest version**\n\nGood relationships matter, but they aren’t the goal in themselves. The goal is consistent referral behaviour, and it can take months before your work shows up in the data. You’ll combine planned field work with reactive follow-up, and some of your most important conversations will happen through a screen. If you need quick wins to stay motivated, this probably isn’t the right fit.\n\n**Your day-to-day**\n\n* Own a portfolio of Dutch clinics and build relationships with surgeons, dietitians and coordinators that lead to consistent referrals.\n* Develop UK clinics that already refer to us, starting with the largest, and engage each one beyond a single contact.\n* Follow up when a clinic starts referring patients and help it grow.\n* Support a senior colleague on our most important Dutch account: logistics, quick responses and following up agreed actions.\n* Keep the CRM accurate. Use referral data per clinic to decide *where* to spend your time, and treatment pathway insights to decide *how*.\n\n**What you bring**\n\n* **Experience:** at least 3 years in life sciences or healthcare, a large part of it working directly with healthcare professionals. That could be pharma, medical devices or medical nutrition, or bariatric care itself, for example as a dietitian, nurse specialist or physician assistant. Sales experience isn’t required.\n* **Location:** Ideally based in the Utrecht region or elsewhere in the central or eastern Netherlands.\n* **Level:** you work and think at HBO/WO level and can hold your own in conversations with clinicians at a near-academic level.\n* **Languages:** fluen", "source": "indeed"}, {"company": "LYNX Amsterdam", "job_title": "Product Manager Awareness & Lead Acquisition West", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Lynx-Amsterdam", "job_url": "https://nl.indeed.com/viewjob?jk=6bb5d5e38b5bc003", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "As **Product Manager Awareness & Lead Acquisition West**, you own the awareness and lead-generation journey across the Netherlands, Belgium, France, Finland and our .com domain.\n\nYou translate our global segmentation and targeting approach into market plans and customer-facing campaigns, and turn that into a roadmap your squad can deliver against.\n\nYou’ll work closely with the East team for one consistent marketing approach, and with Client Acquisition on lead handover through to conversion.\n\n**What you’ll do**\n\n* Define a multi-quarter vision for Awareness & Lead Acquisition in the West markets.\n* Adapt LYNX’s global STP approach into market-specific plans, strategies and tactics.\n* Own and prioritise a living roadmap for acquisition capabilities.\n* Drive initiatives from discovery through implementation.\n* Analyse customer behaviour, campaign performance and competitor activity.\n* Own OKRs measured by ntribute to client success across Europe in an informal, collaborative, and growth-oriented environment.\n\nWe’re an equal-", "source": "indeed"}, {"company": "Blackhawk Network (BHN) Europe", "job_title": "Sr. Product Manager", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://uk.linkedin.com/company/bhneurope", "job_url": "https://www.linkedin.com/jobs/view/4466394807", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-24", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Blackhawk Network (BHN) Europe", "job_title": "Senior Product Manager", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://uk.linkedin.com/company/bhneurope", "job_url": "https://www.linkedin.com/jobs/view/4493642091", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-23", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Rituals (B Corp™)", "job_title": "Product Lead, Finance & Sustainability – CHO Keizersgracht Amsterdam | 32-40h", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/rituals", "job_url": "https://www.linkedin.com/jobs/view/4492992268", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "PIDZ - Met zorg verbonden", "job_title": "Product Lead AI", "location": "Amsterdam-Zuidoost, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/pidz", "job_url": "https://www.linkedin.com/jobs/view/4489494630", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "APG", "job_title": "Business Analyst - Regulatory", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Apg-877e77fe", "job_url": "https://nl.indeed.com/viewjob?jk=7e5ea4daca62948f", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-23", "recruiter_email": null, "applicant_count": null, "description": "**Do you want to contribute to the financial future of 4.5 million people in the Netherlands? Apply quickly for the position of Business Analyst - Regulatory and join the team.**\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nLocation\n\nAmsterdam\n\nEmployment\n\n40-40 hours\n\nEducation\n\nUniversity Degree (Bachelor)\n\nPublication date\n\n23 November 2026\n\n  \n\n### **This is going to be your job**\n\nBusiness Analyst - Regulatory\n\n**The role**\n\nAs a Business Analyst within COO Regulatory, you work according to the T-shaped model at the intersection of business, regulatory requirements, and IT. You help translate new and existing regulations into practical IT solutions that enable APG Asset Management to demonstrate compliance while allowing employees to work efficiently. You are naturally curious and continuously look for opportunities to improve.\n\nYou work in a dynamic environment on various regulatory initiatives, including SFDR, MAR, EMIR, and SSR. You are involved in the entire process, from analysis and requirements gathering to development, testing, implementation, and maintenance. While you bring your own area of expertise, the team shares responsibility for the entire end-to-end process.\n\nA key part of our role is empowering stakeholders to take ownership of regulatory processes and accountability for compliance. This means that we not only develop and implement solutions but also provide the insights, monitoring capabilities, and controls needed to enable stakeholders to effectively manage their regulatory responsibilities and demonstrate compliance.\n\n  \n\n**What you would do**\n\n* You translate complex laws, regulations, and business needs into functional and technical requirements and IT solutions.\n* You develop and improve solutions using technologies such as Python, and work with Databricks and SQL for data analysis and processing.\n* You align requirements and priorities with stakeholders from various departments, including Compliance, Legal, Trading, Regulatory Reporting, and Business Management.\n* You investigate incidents, support existing applications, and collaborate with other IT and data teams within APG.\n\n**What you bring**\n\n* You have a bachelor's or master's level of education and thinking, and experience as a Business Analyst, Information Analyst, or in a similar role.\n* You have strong analytical skills and can translate complex challenges into clear requirements and practical, effective solutions.\n* You have an interest in financial markets, financial products, and regulatory requirements. Experience in Asset Management, Regulatory, or Compliance is a plus.\n* **Proven hands-on experience and proficiency in Python and SQL are essential requirements for this role.** You are expected to have the necessary Python skills from day one. Experience with platforms such as Databricks, as well as reporting and dashb", "source": "indeed"}, {"company": "KLM", "job_title": "Business Product Analyst Level 2", "location": "Schiphol, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Klm", "job_url": "https://nl.indeed.com/viewjob?jk=8062879abe312dd2", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "Ready for your next career move? KLM aims to become the most data- and technology-driven airline in the world – and CHIP is right at the heart of it. As a Business Product Analyst (BPA), you keep the engine room of Schiphol’s ground operations running: the system that plans and allocates people and resources every day across Passenger Services, Baggage Services and Apron Services. You don’t just fix what’s broken – you understand why things work the way they do, and turn that insight into smarter, scalable solutions for the entire operation.\n\n**What will you do?**\n\nAs a Business Product Analyst, you help the product team get the most out of our product. That starts in the operation, and we mean that literally: put on your safety shoes and talk to planners, shift leaders and operational staff to understand what’s really going on. With that knowledge, you make sure our IT solution CHIP is configured and maintained according to the right requirements, help implement changes to business processes, and make sure users truly embrace the system.\n\nIn practice, you will:\n\n* translate operational processes into CHIP application logic – model new functionality in Perl and make full use of standard functionality before turning to custom solutions;\n* configure and optimise resource planning and allocation functionality, business rules, parameters, interfaces and system settings (including BDE and .ini configuration);\n* spot improvement opportunities before anyone asks – and reuse solutions across Passenger, Baggage and Aircraft/Apron Services instead of reinventing the wheel every time;\n* dig into incidents with SQL, find the root cause (not just the symptom), and work with vendors and developers to fix it for good;\n* develop and maintain scripts, queries and automated tests in Perl, Python and SQL;\n* coordinate testing, releases, changes and operational handovers, and keep functional and technical documentation sharp and up to date;\n* contribute to CHIP’s cloud journey, and take part in the on-call/standby rotation that supports a business-critical 24/7 operation.\n\n**Where do you land?**\n\nYou’ll join the CHIP team at Platform Ground, part of Data & Technology – working alongside enthusiastic colleagues in Amsterdam and Budapest. CHIP is indispensable to the handling of Passenger Services, Baggage Services and Apron Services, so your work has a direct, visible impact on day-to-day operations at Schiphol. Our department has an innovative culture: think Hackweek, dedicated time for Learning & Development, and participation in the BPA Community of Practice. We’re building an inclusive atmosphere where you can be yourself – regardless of what you look like, what’s in your passport, how you identify, what you believe, or who you hug when you get home. In short: it’s not about who you are, but how you are.\n\n**Your profile**\n\n**What will you learn?:**\n\nThis role doesn’t put you in a box – it’s a springboard. You’ll rotate between Passenger Services, Aircraft Service", "source": "indeed"}, {"company": "ING", "job_title": "CJE-Business Analyst-Mortgages", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ing", "job_url": "https://nl.indeed.com/viewjob?jk=2304698aadbe686f", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "* REQ-10124405\n* 17/11/2026\n* Customer Journey\n* Amsterdam, Netherlands\n* €4.757 - €7.721\n* ING Bank\n\n  \n\nDo you want to make a difference for ING’s mortgage customers and work with your squad to create the best digital customer journeys? We are looking for an experienced Customer Journey Expert with a strong business analysis and product management mindset.\n\nOur customers face changing personal and economic circumstances every day, which can have an impact on their financial situation. At ING Mortgages, we not only help customers finance their ideal home, but we also want to be there for them throughout the lifetime of their mortgage.\n\nING aims to become the leading provider in the mortgage market in every respect. Our ambition is to make the mortgage process a personal, easy, fast and integrated part of buying and owning a home. To deliver on our promises, our mortgage processes need to be supported by IT systems that are ready for the future. This means that over the coming years, we are working on a major migration programme that will enable us to take a significant step forward in our customer service. That is why we are looking for top talent with an innovative mindset and a strong focus on customers, digital and data.\n\nThe Customer Journey Expert position, is part of the 'Inlife Experience' product group. Within this product group, we are jointly responsible for the services we provide to our existing mortgage customers. This means focusing on improving and digitalising the journeys our customers go through during the lifetime of their mortgage, which can be as long as 30 years.\n\n  \n\n**Your role**\n\nAs a Customer Journey Expert, you create simple, digital and personalised journeys for all our mortgage customers. Examples include changing interest rates, making additional mortgage repayments, managing construction deposits, or releasing a borrower from the mortgage deed following a divorce or death.\n\nThere is still a world of opportunity to improve these journeys, and of course you will not do this alone. You will work closely with a team of skilled and driven experts who, just like you, are committed to finding and delivering the very best solutions for our customers.\n\n**How to succeed**\n\nYou are proactive, curious and ask probing questions in your continuous search for opportunities to make processes simpler and more effective. In addition:\n\n* Your starting point is always the customer, mortgage adviser and employee. You identify opportunities and needs through sharp analysis and by translating laws and regulations into concrete solutions.\n* You take ownership and connect the dots in complex issues to develop concrete improvement proposals.\n* You understand future developments, competitors and other relevant stakeholders within the market.\n* You are a true team player and know how to bring people together around a common goal, both within and outside your team.\n\n**Specifically, we are looking for**\n\nA driven professional who recognises the", "source": "indeed"}, {"company": "ABN AMRO", "job_title": "Senior Innovator Business Analyst", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Abn-Amro", "job_url": "https://nl.indeed.com/viewjob?jk=6b9c16cf1a1769f7", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "Senior Innovator Business Analyst\n\n**At a glance**\n---------------\n\nAre you the innovator of data management, - systems and - processes? Can you translate user wishes into data models and actions for your IT colleagues allowing us to provide excellent management information? Do you have previous experience with data modelling and data analysis? Then you are the person we are looking for in the Controlling Domain! You will be part of a multidisciplinary team of Finance and IT professionals working together to achieve the Controlling objectives using an Agile way of working.\n\n**Your job**\n------------\n\nAs a Business Analyst for Controlling, you are involved in the creation and technical analysis of Finance data; specifically, those involving management information.\n\n* You translate business requirements into technical designs and data models which allow for easy development by your IT colleagues within the team.\n* You can understand complex data infrastructure and design. Constantly testing everything that has been developed using pre-defined requirements is second nature to you.\n* Innovating, advising, improving, analysing and implementing are an intrinsic part of your daily routine, because innovation and data management are important topics on the controlling agenda.\n* One of your primary goals is to be a spearhead in data modelling and design solutions based on the current data architecture. After designing ll, "applicant_count": null, "description": "Bouw mee aan de toekomst van Toyota Bedrijfswagens!\n\nHoe zorg je dat bedrijfswagens aansluiten op wat ondernemers en zakelijke klanten nodig hebben? Als Senior Productmanager Bedrijfswagens ontwikkel je het Toyota-bedrijfswagenportfolio voor de Nederlandse markt. Je bepaalt de commerciële koers, stuurt op resultaat en brengt collega’s en partners samen om plannen in de praktijk te realiseren.\n\n**Wat ga je doen?**\n\nJe bent verantwoordelijk voor de commerciële ontwikkeling en resultaten van het Toyota-bedrijfswagenportfolio. Je vertaalt klant- en dealerbehoeften, marktontwikkelingen en organisatiedoelen naar keuzes voor het assortiment, de prijspositionering en de proposities.\n\nJe volgt de resultaten per model en verkoopkanaal, bewaakt budgetten en rendement en stuurt bij als de prestaties daarom vragen. Je ontwikkelt en beoordeelt businesscases voor onder meer prijsaanpassingen, nieuwe uitvoeringen, introducties en commerciële ondersteuning.\n\nOok zorg je dat de zakelijke propositie aansluit op het dagelijkse gebruik van bedrijfswagens. Je verbindt het voertuigaanbod met financiering, leasing, Connected Services, accessoires en ombouw- en opbouwoplossingen.\n\nDaarnaast:\n\n* Ontwikkel je de jaarplannen en portfoliostrategie voor Toyota Bedrijfswagens;\n* Leid je de commerciële voorbereiding en introductie van nieuwe en vernieuwde modellen;\n* Werk je samen met Sales, Toyota Financial Services en Toyota Louwman Financial Services, Toyota Motor Europe en de dealerorganisatie.\n* Geef je collega’s van Marketing, Digital, Sales en Louwman College richting bij productinformatie en verkoopondersteuning;\n* Leid je strategische projecten rond bijvoorbeeld elektrificatie, kanaalontwikkeling of conversieprogramma’s;\n* Geef je leiding aan en coach je productmanagers en/of productspecialisten binnen het domein.\n\n**Wat vragen wij van jou?**\n\nJe bent strategisch sterk, maar houdt ook van aanpakken. Je maakt commerciële keuzes op basis van marktinformatie en resultaten en weet die helder uit te leggen. Je brengt verschillende belangen bij elkaar en helpt teams om samen vooruitgang te boeken.\n\nVerder heb je:\n\n* Hbo werk- en denkniveau.\n* Minimaal vijf jaar ervaring in productmanagement of een vergelijkbare commerciële functie;\n* Ervaring met portfoliostrategie, prijspositionering, businesscases en budgetten;\n* Ervaring met multidisciplinaire projecten en het begeleiden of aansturen van medewerkers;\n* Kennis van de automotive markt, zakelijke verkoopkanalen en relevante fiscale en wettelijke ontwikkelingen;\n* Affiniteit met bedrijfswagens, elektrificatie en de behoeften van ondernemers en fleetklanten;\n* Een goede beheersing van het Nederlands en Engels.\n\n**Wat kun je van ons verwachten?**\n\nJe krijgt een seniorrol met invloed op de commerciële koers en resultaten van Toyota Bedrijfswagens. Je werkt samen met teams uit verschillende disciplines en hebt contact met Toyota Motor Europe, Toyota Financial Services en de dealerorganisatie. Ook geef je richting aan een team van", "source": "indeed"}, {"company": "Dienst Justitiële Inrichtingen", "job_title": "Productmanager", "location": "Den Haag, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Dienst-Justiti%C3%ABle-Inrichtingen", "job_url": "https://nl.indeed.com/viewjob?jk=1d8eb8f83d961ea1", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-25", "recruiter_email": null, "applicant_count": null, "description": "* Den Haag\n* € 4.132 - € 6.275 bruto\n* Schaal 11\n* hbo niveau\n* Min. 32 uur - max. 36 uur\n* Reageer voor 17-12-2026\n\n**Dit ga je doen**\n------------------\n\nAls Productmanager binnen ons ontwikkelteam ben jij de drijvende kracht achter onze productportfolio. Jouw taken reiken verder dan alleen het beheren van bestaande producten; je bent degene die vernieuwing omarmt en implementeert. Met een scherp oog voor Rijksbrede ontwikkelingen, werk je aan het verfijnen van methoden, processen en producten.\n  \n  \nJouw aanpak is niet enkel gebaseerd op intuïtie, maar stevig verankerd in het plan-do-check-act-principe. Het vertalen van interdepartementale standaarden en regelgeving naar onze productportfolio is jouw tweede natuur. Je bent de brug tussen verschillende disciplines, waarbij je het primair proces en de gehele keten niet uit het oog verliest. Jouw advies is niet slechts een suggestie, maar een fundament voor besluitvorming. Door actief draagvlak te creëren en gebruikerstafels te betrekken, beweeg je soepel door organisatorische krachtenvelden.\n  \n  \nAls een ware kennisbron binnen ons team vergaar en deel je expertise op het gebied van facilitaire thema's. Jouw netwerk strekt zich uit binnen DJI, J&V en zelfs interdepartementaal. Het voeren van regie over complexe facilitaire projecten is voor jou een uitdaging die je met vastberadenheid aangaat. Je schroomt niet om interne of externe expertise in te schakelen om de kwaliteit binnen onze productportfolio's te verbeteren.\n  \n  \nAnalyseren, stroomlijnen en verbeteren zit in jouw DNA. Processen, producten en diensten worden onder jouw leiding geoptimaliseerd, altijd in lijn met geldende wet- en regelgeving. Jouw verantwoordelijkheid strekt zich ook uit tot leveranciers- en contractmanagement, waarbij SLA's worden opgesteld en beheerd in nauwe samenwerking met het IUC.\n  \n  \nAls Gedelegeerd Opdrachtgever neem jij het voortouw bij complexe Europese aanbestedingen. Samenwerking met verschillende bedrijfsvoering disciplines is voor jou vanzelfsprekend. Je bent de spil tussen behoeften van afnemers en de aanbestedingsprocessen, waarbij je diverse disciplines samenbrengt voor een gezamenlijk doel.\n  \n  \nAls vertegenwoordiger van JenV / CDV in klantenraden van Rijksbreed categoriemanagement ben jij de stem van onze organisatie. Je brengt behoeften en eisen van onze klanten in, zodat we onze dienstverlening optimaal kunnen afstemmen.\n  \n  \nKortom, als lid van ons team ben jij niet slechts een producteigenaar, maar een essentiële schakel in het voortdurend verbeteren en innoveren van onze dienstverlening. Met jouw expertise en leiderschap tillen we onze producten naar nieuwe hoogten en blijven we een betrouwbare partner voor onze klanten en stakeholders.\n\nKijk jij voorbij aan wat iemand gedaan heeft?\n\n**Gunstige arbeidsvoorwaarden**\n-------------------------------\n\nBij DJI vinden we het belangrijk dat jij je werk goed kunt doen én met plezier naar je werk gaat. Daarom bieden we veel voordelen die je helpen in ", "source": "indeed"}, {"company": "Chalet.nl", "job_title": "Senior Productmanager Oostenrijk bij Chalet.nl", "location": "Woerden, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Chalet.nl", "job_url": "https://nl.indeed.com/viewjob?jk=1b706088acddb6c7", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "**Sluit jij graag een goede deal met een Oostenrijkse partner? En zorg je er vervolgens voor dat de accommodatie online net zo mooi oogt als in het echt? Kijk je kritisch naar foto’s, teksten en prijzen, en draai je je hand niet om voor een ingewikkelde prijscalculatie? Dan willen we jou spreken.**\n\nChalet.nl helpt wintersporters bij het vinden en boeken van de mooiste chalets en appartementen in de Alpen. Op onze website kiezen bezoekers uit bijna 3.000 accommodaties in Oostenrijk, Frankrijk, Zwitserland en Italië. Als Senior Productmanager Oostenrijk zorg jij dat onze chalets en appartementen in Oostenrijk goed aansluiten bij wat onze klanten zoeken, en dat het aanbod er op de website perfect bij staat.\n\n**Wat ga je doen?**\n\n* **Inkoop**: je beheert je eigen portfolio aan partners in Oostenrijk. Je zorgt dat we de juiste accommodaties inkopen, zoekt nieuw interessant aanbod bij bestaande partners en gaat op zoek naar nieuwe partners met aanbod dat bij ons past.\n* **Relatiebeheer**: je bouwt en onderhoudt relaties met (inter)nationale partners. Een aantal keer per jaar reis je af naar Oostenrijk om ze te bezoeken.\n* **Prijzen**: je maakt prijscalculaties, ook als die ingewikkeld worden, en zorgt dat de prijzen op onze website kloppen.\n* **Presentatie**: je schrijft creatieve, wervende teksten, selecteert aantrekkelijk beeldmateriaal en zorgt dat alle informatie over onze chalets en appartementen actueel is.\n* **Samenwerken**: je ondersteunt je collega’s in het Inkoop- en Productmanagementteam en hebt veel overleg met andere afdelingen. Schakelen gaat snel, want de lijntjes zijn kort.\n\n**Kortom**: je zorgt niet alleen dat we het juiste aanbod hebben, maar ook dat klanten het op onze website vinden en willen boeken.\n\n**Jij brengt mee**\n\n* Je hebt een **afgeronde toeristische opleiding**, hbo werk- en denkniveau en een aantal jaar ervaring in een vergelijkbare functie.\n* Je spreekt en schrijft goed Nederlands en **Duits**.\n* Je bent sociaal en **communicatief vaardig**, waardoor je makkelijk een band opbouwt met onze partners.\n* Je hebt er geen moeite mee om onze partners in **Oostenrijk te bezoeken**.\n* Je kunt goed overweg met **Excel**, **Word** en **fotobewerkingsprogramma’s**.\n* Je werkt graag zelfstandig, maar helpt je collega’s net zo makkelijk verder.\n* Wintersportervaring is mooi meegenomen, maar geen harde eis. Komt vanzelf als je bij ons werkt!\n\n**Wat krijg je ervoor terug?**\n\nEen afwisselende rol met goede arbeidsvoorwaarden. Geen dag is hetzelfde! Je krijgt je eigen portfolio, volop ruimte voor persoonlijke ontwikkeling en we staan altijd open voor nieuwe ideeën. Verder staan er regelmatig gezellige uitjes en borrels op het programma, houden we elk jaar een BBQ, komt er maandelijks een stoelmasseur langs en gaan we jaarlijks met elkaar op studiereis naar de sneeuw.\n\nKlinkt dit als jouw volgende stap? Stuur ons je cv en een korte motivatie. We zijn benieuwd naar je verhaal!\n\n**Praktische info**\n\n* **Uren**: 32-39 uur\n* **Startdatum**: i", "source": "indeed"}, {"company": "Forbo Management", "job_title": "Stageopdracht Product Management", "location": "Assendelft, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Forbo-Management", "job_url": "https://nl.indeed.com/viewjob?jk=aa2f9f98d8074f50", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "**De divisie Flooring Systems biedt een breed en aantrekkelijk assortiment milieuvriendelijk linoleum, hoogwaardige vinylvloeren, schoonloopsystemen, tapijttegels, naaldvilt, en Flotex, de wasbare textielen vloerbedekking. Dankzij hun voortreffelijke technische eigenschappen en aantrekkelijke design zijn deze vloerbedekkingen de eerste keus voor openbare gebouwen, warenhuizen, ziekenhuizen en andere zorginstellingen, scholen, bibliotheken, kantoren, vrijetijdscentra, hotels, restaurants en cafés alsmede voor toepassingen in de woonmarkt.**  \n**Met een marktaandeel van ruim 65% is Forbo wereldwijd marktleider in linoleum. Onder de merknaam Eurocol levert Flooring Systems ook kant-en-klare lijmen voor vloerinstallaties en keramische tegels en nivelleermassa's voor de bouwbranche**\n\n**Stageopdracht Product Management**\n------------------------------------\n\nStageopdracht: vergemakkelijken van de installatie van Marmoleum\n\n  \n\n**Korte samenvatting**\n\nIn deze opdracht onderzoek je hoe we het leggen van Marmoleum (linoleum) makkelijker kunnen maken. Niet alleen in de praktijk, maar ook in hoe installateurs dit beleven. Je werkt toe naar concrete hulpmiddelen die installateurs helpen om sneller, makkelijker en met meer vertrouwen te werken.\n\n  \n\n**Achtergrond**\n\nMarmoleum is een sterke en duurzame vloeroplossing. Toch wordt linoleum in de markt soms gezien als lastiger te installeren dan bijvoorbeeld vinyl.\n\n  \n\nDat beeld kan invloed hebben op de keuze voor Marmoleum. Als installateurs, klanten of architecten denken dat het leggen ingewikkelder is of meer vakkennis vraagt, kan dat een drempel zijn. Zeker nu snelheid belangrijk is en goede vakmensen niet altijd makkelijk te vinden zijn.\n\n  \n\nForbo wil daarom kijken hoe we installateurs beter kunnen helpen. Niet door Marmoleum zelf te veranderen, maar door te kijken naar handige hulpmiddelen, tools, uitleg en ondersteuning rond het installatieproces.\n\n  \n\n**Probleemstelling**\n\nDe installatie van Marmoleum wordt regelmatig gezien als specialistisch. De vraag is of dat beeld klopt, waar het vandaan komt en welke onderdelen van het werk echt lastig zijn. Ook als de perceptie niet altijd terecht is, kan die wel invloed hebben op de keuze voor Marmoleum.\n\n  \n\nIn deze opdracht kijk je daarom naar twee dingen: wat er in de praktijk beter kan en welke aannames of beelden er zijn rond het installeren van Marmoleum. Daarna onderzoek je hoe we het werk eenvoudiger, minder foutgevoelig of toegankelijker kunnen maken en welke tools we daarvoor kunnen ontwikkelen.\n\n  \n\n**Doel van de opdracht**\n\nHet doel is om de belangrijkste knelpunten bij het installeren van Marmoleum in beeld te brengen en deze te vertalen naar praktische oplossingen voor installateurs.\n\n  \n\nDe focus ligt op hulpmiddelen, tools, digitale ondersteuning of verbeteringen in het proces.\n\n  \n\nBelangrijk: het gaat niet om het aanpassen van Marmoleum zelf. De opdracht draait om alles eromheen: wat kan installateurs helpen om het product makkelijker en beter", "source": "indeed"}, {"company": "Ridder Growing Solutions", "job_title": "Productmanager Water", "location": "Maasdijk, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ridder-Growing-Solutions", "job_url": "https://nl.indeed.com/viewjob?jk=431c8c281a373a16", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "Bepaal de toekomst van de wateroplossingen van Ridder.\n\n  \n\n**Productmanager Water**\n------------------------\n oepassingen op het gebied van data, AI en nieuwe technologieën. Je onderzoekt nieuwe ontwikkelingen, beoordeelt de toepasbaarheid voor KBD en helpt kansrijke initiatieven verder te brengen van idee naar implementatie.\n\nAls Product Owner:\n\n* Vertaal je businessbehoeften naar een duidelijke productvisie, roadmap en backlog.\n* Prioriteer je werk op basis van klantwaarde, businesswaarde en afhankelijkheden.\n* Werk je nauw samen met business stakeholders, DevOps-teams en andere Product Owners.\n* Signaleer je kansen op het gebied van innovatie, AI en datagedreven werken.\n* Draag je bij aan procesverbeteringen binnen Betalingsverkeer en Debiteurenmanagement.\n* Neem je deel aan Agile- en SAFe-events en bewaak je de voortgang van initiatieven.\n* Zorg je voor verbinding tussen innovatie, businessbehoefte en het bestaande IT-landschap.\n\n**De afdeling**\n\nJe komt terecht binnen KBD: Know Your Customer, Betalingsverkeer en Debiteurenmanagement. Binnen deze omgeving staan innovatie, datagedreven werken en continu verbeteren centraal. Door slim gebruik te maken van data, AI en nieuwe technologieën werken we continu aan het verbeteren van processen, dienstverlening en klantbediening.\n\nJe werkt in het team Product Owners KBD, bestaande uit één Productmanager en vijf Product Owners. Samen zijn jullie verantwoordelijk voor de prioritering, doorontwikkeling en realisatie van initiatieven binnen KYC, Betalingsverkeer en Debiteurenmanagement. Binnen het team werk je nauw samen aan productvisie, prioriteiten, afhankelijkheden en waarderealisatie binnen de Agile Release Train. Zo zorgen jullie ervoor dat oplossingen aansluiten bij de behoeften van klanten, collega's en de organisatie.\n\nVanwege de spreiding van collega's over verschillende locaties hoort regelmatig reizen binnen Nederland bij de functie. Er is", "source": "indeed"}, {"company": "Stichting CliniClowns Nederland", "job_title": "Product Owner", "location": "Amersfoort, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Stichting-Cliniclowns-Nederland-4", "job_url": "https://nl.indeed.com/viewjob?jk=8ef7a88cb3411826", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Geef jij richting aan digitale ontwikkelingen en maak je van ideeën concrete verbeteringen? Als Product Owner bij CliniClowns werk je samen met collega’s aan oplossingen die onze missie ondersteunen.\n\n**Wat ga je doen?**  \nJe bent primair Product Owner voor Microsoft Dynamics 365 en Dynamics 365 Customer Insights en wordt waar nodig ingezet voor andere digitale platformen. Je vertaalt behoeften uit de organisatie naar oplossingen die waarde toevoegen voor CliniClowns en onze gebruikers.  \nJe onderzoekt wat nodig is, brengt belangen bij elkaar en zet prioriteiten om in resultaat. Dat kan nieuwe functionaliteit zijn, slimmer gebruik van bestaande mogelijkheden of een beter proces. Je maakt ook duidelijk wat we niet of nog niet oppakken.\n\n**Samen met de Business Analist**  \nJe werkt nauw samen met onze Business Analist, die bedrijfsprocessen en de samenhang tussen processen, informatie en producten op hoofdlijnen onderzoekt. Samen vertalen jullie relevante inzichten naar verbeteringen voor de producten waar jij verantwoordelijk voor bent. Jij brengt product- en gebruikerskennis in en bepaalt de productkeuzes en prioriteiten.  \nDaarnaast haal je zelf actief behoeften op bij gebruikers en stakeholders. Collega’s kunnen ook rechtstreeks ideeën en verzoeken bij je aandragen.\n\n**Jouw plek in de organisatie**  \nJe werkt samen met onder andere twee applicatiebeheerders. Jij geeft richting en stelt prioriteiten; zij brengen kennis van inrichting, beheer en gebruikersvragen in. Met onze leverancier bespreek je verbeterwensen, knelpunten, roadmap en planning. Je bent betrokken bij de voorbereiding, het testen en de ingebruikname van releases.  \nMet het datateam werk je aan de aansluiting van Dynamics 365 op het dataplatform voor analyses en dashboards. Je stemt informatiebehoeften en datakwaliteit af en prioriteert benodigde productaanpassingen. In het bovenliggende team Innovatie, Technologie en Inzicht (ITI) draag je bij aan de samenhang tussen producten, data, technologie en onze digitale koers.\n\nJouw belangrijkste verantwoordelijkheden\n\n* **Je geeft richting.** Je ontwikkelt en bewaakt de productvisie en roadmap voor Dynamics 365 en Customer Insights en waar nodig andere digitale platformen.\n* **Je vertaalt behoeften naar oplossingen.** Je onderzoekt gebruikersvragen en vertaalt deze naar heldere requirements, user stories en concrete verbeteringen.\n* **Je signaleert kansen voor innovatie.** Je onderzoekt updates, releases en nieuwe mogelijkheden van Microsoft en onze leverancier en vertaalt deze naar verbeterkansen voor CliniClowns.\n* **Je stelt prioriteiten.** Je beheert de backlog en weegt met stakeholders af wat de meeste waarde oplevert: nu, later of niet.\n* **Je bewaakt realisatie en kwaliteit.** Je verbindt gebruikers, specialisten en leveranciers en bewaakt voortgang, afhankelijkheden en resultaat. Je test nieuwe functionaliteit en productupdates zelf en beoordeelt met gebruikers of deze goed werken en bestaande processen blijven ondersteunen.\n* *", "source": "indeed"}, {"company": "Alliander", "job_title": "Productmanager Pricing", "location": "Arnhem, GE, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Alliander", "job_url": "https://nl.indeed.com/viewjob?jk=95160a0af6f27e9b", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "* Staf & Support\n* Fulltime (40 uur)\n* € 5.416 - € 7.738\n* Arnhem\n* HBO\n\n  \n\n*Deze vacature sluit op 01 december 2026*\n\nBouw pricing uit tot een volwassen expertise binnen Liander. Ontwikkel prijsstrategieën voor flexproducten en vertaal data, marktinzichten en regelgeving naar concrete keuzes. Zo help je het elektriciteitsnet slimmer te benutten en maatschappelijke kosten te beheersen. Deze functie heeft als standplaats Arnhem en betreft minimaal 32 uur per week. Jij maakt het net slimmer bij Alliander.\n\n**Dit ga je doen**\n------------------\n\n**De energietransitie is onmogelijk zonder jou als Productmanager Pricing**\n===========================================================================\n\nEen goed doordachte vergoeding kan klanten stimuleren om flexibel met energie om te gaan.Jij ontwikkelt daarom pricingstrategieën en pricingmodellen voor vergoedingen van flexproducten. Je bouwt voort op de eerste fase van dit expertisegebied, rondt openstaande onderdelen af en zorgt dat kennis en werkwijzen blijvend worden gebruikt. Daarbij werk je nauw samen met Product Marketing, accountmanagers, projectmanagers, Klant & Ontwerp en Regulatory.\n\nHet energienet van de toekomst maken we voor iedereen, mét iedereen. Als Productmanager Pricing werk jij hieraan mee. Zo ben jij bezig met het:\n\n* ontwikkelen, beheren en evalueren van pricingmodellen voor bestaande en\n\nnieuwe flexproducten;\n\n* opzetten en evalueren van pilots met Product Marketing, gericht op\n\nprijselasticiteit en klantrespons;\n\n* vertalen van marktdata, pilotresultaten en regelgeving naar strategieën voor\n\nverschillende klantsegmenten;\n\n* adviseren van management en directie over pricing, optimalisaties, risico’s en\n\nrelevante regelgeving;\n\n* borgen van modellen, werkwijzen en kennis, zodat de pricingcapability verder\n\ngroeit binnen Liander.  \n  \n\n**Jij maakt het net completer bij Alliander**\n=============================================\n\nAlliander bestaat uit verschillende bedrijven die samen werken aan een betrouwbaar en toekomstbestendig energienet. Met een grote groep vakmensen ontwikkelen en beheren we het energienet voor miljoenen inwoners en ondernemers in Nederland. Alles wat we doen, doen we met oog voor onze klanten. Samen met jou maken we de energietransitie mogelijk, voor en mét onze klanten.\n\nHier werken we aan het beheer, onderhoud en de ontwikkeling van onze elektriciteits- en gasnetten. Veiligheid staat altijd voorop. Zo leveren we energie op een veilige en betrouwbare manier aan huishoudens, bedrijven en andere klanten.\n\nDe drive om te ontdekken wat mogelijk is, kan alleen als jij genoeg energie hebt. Een passende werkomgeving helpt daarbij. Je werkt binnen Product Management, samen met betrokken en eerlijke collega’s. Binnen deze rol verbind je commerciële, maatschappelijke en bestuurlijke belangen. Je bent het inhoudelijke aanspreekpunt voor pricingvraagstukken rond flexproducten. Je werkt hybride: vanuit Arnhem, thuis en waar samenwerking dat vraagt.\n\nWerken aan een organisat", "source": "indeed"}, {"company": "PIDZ Internal", "job_title": "Product Lead AI", "location": "Amsterdam-Zuidoost, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Pidz-Internal", "job_url": "https://nl.indeed.com/viewjob?jk=07c7a45be55b05ac", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "Wil jij met AI-agents oplossingen bouwen die binnen dagen of weken in de handen van gebruikers liggen? Kom als Product Lead AI ons team in Amsterdam Zuidoost versterken, voor 36 tot 40 uur per week.\n\nWerk je graag direct met de mensen die het probleem hebben, en wil je zelf zorgen dat er een oplossing staat die echt werkt? Als Product Lead AI bij PIDZ zit je dicht op de business. Je vertaalt vage vragen naar heldere doelen, laat AI-agents bouwen wat nodig is en zorgt dat het veilig en betrouwbaar in productie draait. Niet morgen op een roadmap, maar binnen dagen of weken in de handen van gebruikers.\n\nDeze rol combineert drie dingen: productrichting, productontwikkeling en klantgerichte delivery. Het is geen klassieke Product-rol met een backlog voor een ontwikkelteam, en ook geen puur adviserende rol. Jij houdt de eindregie over hoe PIDZ software maakt en stuurt AI-agents, collega’s en externe experts aan als één geheel.\n\n**Wat ga je doen?**\n\n**Richting en regie**\n\n* **Productrichting bepalen.** Je bepaalt wat PIDZ ontwikkelt, waarom en met welke prioriteit. Je vertaalt de strategie naar een heldere productkoers en maakt scherpe keuzes, in afstemming met directie en business.\n* **Eindregie over het agentic proces.** Je stuurt de ‘fabric’ (het samenspel van AI-agents, tooling en koppelingen waarmee we bouwen), je collega’s en externe experts aan als één geheel. Jij bepaalt wie of wat welk werk oppakt.\n* **Samenwerken met externe experts.** Een externe specialist beheert en breidt de technische fabric uit. Jij bent de opdrachtgever: je stelt kaders en prioriteiten en zorgt dat regie en kennis bij PIDZ blijven.\n* **Leidinggeven.** Je geeft leiding aan de productmedewerkers, neemt hen mee in de werkwijze en zorgt dat mens en AI elkaar versterken.\n* **Eigenaar van de werkwijze.** Na de pilot ben jij eigenaar van de nieuwe manier van werken. Je bouwt herbruikbare onderdelen, prompts, templates en evaluaties, zodat elke volgende oplossing sneller en beter gaat.\n\n**Van vraag naar werkende oplossing**\n\n* **Problemen doorgronden.** Je gaat in gesprek met gebruikers: planners, intercedenten, klantenservice, zorgorganisaties en zorgprofessionals. Je brengt processen en knelpunten in kaart en vertaalt vage wensen naar heldere eisen, randvoorwaarden en succescriteria.\n* **Snel een eerste versie neerzetten.** Je laat AI-agents prototypes bouwen en test die zo snel mogelijk met echte gebruikers. Je weet wanneer AI echt waarde toevoegt en wanneer gewone logica of een bestaande oplossing beter werkt.\n* **Agent-ready specificeren en orkestreren.** Je schrijft epics en user stories met toetsbare acceptatiecriteria en precies de context die een AI-agent nodig heeft. Je zet de juiste agents in voor ontwerp, bouw, test en documentatie en stuurt bij op tussenresultaten.\n* **Integreren met wat er al is.** Je zorgt dat oplossingen goed aansluiten op het PIDZ-platform en bestaande systemen zoals Salesforce en AFAS: API’s, datastromen, autorisatie en koppelingen.\n* **Veilig", "source": "indeed"}, {"company": "Enexis", "job_title": "Productmanager kernproducten", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Enexis", "job_url": "https://nl.indeed.com/viewjob?jk=69545c2e81b0d8ce", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "* Den Bosch\n* € 4.223,- en € 6.033,-\n* HBO\n* 32 tot 40 uur\n\n  \n\n* ### **Wat ga je doen?**\n\n  #### **Met jouw energie kan het**\n\n  De energietansitie is in volle gang. Dit betekent nieuwe producten, nieuwe wetgeving en veranderende klantvragen. De energiemarkt is volop in beweging. Jij vertaalt die ontwikkelingen naar producten en diensten die Nederland vooruit helpen in de energietransitie. Samen met experts uit verschillende disciplines maak je producten toekomstbestendig en draag je direct bij aan een flexibel, betrouwbaar en betaalbaar energiesysteem. Je kunt daarbij rekenen op goede arbeidsvoorwaarden zoals een persoonlijk budget, 13e maand en vitaliteitsbudget.\n\n  Als Productmanager kernproducten ben je verantwoordelijk voor de doorontwikkeling van een aantal belangrijke producten en diensten van Enexis voor de zakelijke markt. Je werkt samen met collega's uit de hele organisatie aan de doorontwikkeling van producten en diensten voor de zakelijke markt. Daarbij zorg je dat verbeteringen niet alleen worden bedacht, maar ook succesvol worden gerealiseerd.\n\n  #### **Zo ga jij deze uitdaging aan**\n\n  Als Productmanager kernproducten werk je aan de doorontwikkeling van ons kernproductenportfolio. Denk hierbij aan openbare verlichting, meerdere aansluitingen op één adres, aansluitproducten en andere diensten die dagelijks door klanten worden gebruikt. Je volgt actief ontwikkelingen in wet- en regelgeving, de energiemarkt en klantbehoeften en vertegenwoordigt Enexis in relevante overleggen binnen de sector. De inzichten die je daar opdoet vertaal je naar verbeteringen in producten, processen en dienstverlening. Daarbij overzie je de impact op klantcommunicatie, interne processen, tarieven en de uitvoering binnen Enexis. Je bent de verbindende schakel tussen verschillende disciplines en stakeholders. Om tot de juiste oplossing te komen, werk je nauw samen met collega's uit asset management, IT, relatiemanagement, klantteams en operatie. Jij brengt de juiste mensen bij elkaar, stelt scherpe vragen en zorgt dat verbeteringen niet alleen worden bedacht, maar ook succesvol worden gerealiseerd.\n* ### **Functie-eisen**\n\n  #### **Zo pak jij het aan**\n\n  Je bent analytisch sterk en vindt het leuk om complexe vraagstukken uit te pluizen. Je wacht niet af, maar onderzoekt zelfstandig wat nodig is om een vraagstuk verder te brengen. Daarbij overzie je de gevolgen van veranderingen voor klanten, processen, systemen en andere onderdelen van de organisatie. Je bent communicatief sterk en weet verschillende belangen met elkaar te verbinden. Je werkt graag samen met collega's en stakeholders en creëert draagvlak voor nieuwe ideeën en veranderingen. Dankzij jouw nieuwsgierigheid, zelfstandigheid en organisatiesensitiviteit weet je hoofd- en bijzaken goed van elkaar te onderscheiden in een omgeving die continu in beweging is.\n\n  Verder heb je:\n\n  + Een afgeronde hbo- of wo-opleiding.\n  + Minimaal 3 tot 5 jaar ervaring in productmanagement, propositieontwikkeling, bel", "source": "indeed"}, {"company": "LELY", "job_title": "Product Owner", "location": "Maassluis, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Lely", "job_url": "https://nl.indeed.com/viewjob?jk=0f45a91a2aeae462", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "**Bedrijfsomschrijving**\n\nLely, opgericht in 1948, richt zich op een duurzame, winstgevende en aangename toekomst in de agrarische sector. Met de vraagstukken van de boer en de behoeften van de koe als middelpunt ontwikkelen wij hoogwaardige robots en datasystemen die het dierenwelzijn, de flexibiliteit en productie op het melkveebedrijf verhogen. Met als doel duurzame voedselproductie te ondersteunen.  \n  \nAl meer dan 30 jaar zijn we wereldwijd leidend in de verkoop en service van geautomatiseerde systemen aan opeenvolgende generaties melkveehouders. Elke dag inspireren we onze collega’s om klanten innovatieve oplossingen te bieden, en een vertrouwde partner te zijn voor langetermijnadvies en ondersteuning. Met onze geavanceerde Lely Campus in Maassluis en een wereldwijd netwerk van toegewijde Lely Centers voor verkoop en service op maat, is Lely actief in meer dan vijftig landen.\n\n **Vacatureomschrijving**\n\nBinnen ons Productontwikkelingsteam zijn we op zoek naar een Product Owner om zich aan te sluiten bij bestaande ontwikkelingsteams. Lely is wereldleider in automatisering voor de melkveehouderij; onze productontwikkelingsteams zorgen ervoor dat nieuwe producten voldoen aan onze hoge kwaliteitsnormen. Deze agrarische innovaties omvatten nieuwe producten voor nieuwe markten, evenals updates en ondersteuning.\n\nBij het proces van het brengen van de producten naar onze eindgebruikers hebben de ontwikkelingsteams te maken met veel invloeden. Het team wordt gevoed met informatie van testers, veldinstallaties, data-analisten, engineers, servicetechnici en het ontwikkelingsprogramma van het project. Het behouden van tevredenheid en afstemming onder al deze belanghebbenden is jouw belangrijkste doel.\n\n**Jouw rol en positie**\n\nAls Product Owner Product Development werk je in een softwareontwikkelingsteam. Jouw belangrijkste belanghebbenden zijn Technische Serviceondersteuning, veldtechnici, interne productontwikkelingsteams, de projectmanager, de productmanager, de eindgebruiker en teamleden van andere disciplines in het project. Met de belanghebbenden identificeer je de behoeften van het veld voor de specifieke producten. Je definieert de Product Backlog, organiseert het werk en bepaalt de beste manier om waarde aan het veld toe te voegen. Als Product Owner heb je een toegewijd team van Productontwikkelaars die met je samenwerken.\n\n **Functie-eisen**\n\nWij zijn op zoek naar een Product Owner die weet hoe hij/zij zich moet profileren binnen een hybride wereld van projecten gecombineerd met agile werkwijzen. Alle belanghebbenden worden meegenomen en zijn even belangrijk bij het realiseren van de roadmap. Je bent een zelfstarter.\n\nWe lezen ook graag meer over je motivatie in je motivatiebrief.\n\nBovendien zoeken we iemand die zich kan identificeren met de volgende vaardigheden en competenties:\n\n* Drie jaar ervaring als Scrum Product Owner.\n* Een empirische en ondernemende mentaliteit met klantgerichtheid.\n* Een focus op het valideren en afronden van taken ", "source": "indeed"}, {"company": "LevelUp Group", "job_title": "Head of Product- Content Creation", "location": "Amsterdam Oost, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Levelup-Group", "job_url": "https://nl.indeed.com/viewjob?jk=f30071a32f1b3b8a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "We maken content die mensen willen delen. Voor lovebrands, retailers, foodmerken en bedrijven die durven. Short-form video, YouTube-series, campagnes, employer branding en AI-content: we doen het allemaal, en we doen het goed.\n\nOnze dienstverlening is de afgelopen jaren hard gegroeid. Nu is het tijd om er richting aan te geven. Welke diensten bieden we over twee jaar aan? Hoe maken we ze beter, slimmer en makkelijker op te schalen? En hoe worden we de strategische partner die klanten bellen *voordat* ze een briefing schrijven? Daar zoeken we iemand voor met een heldere visie op content en de drive om die visie te bouwen. Ben jij dat?\n\n**De rol in het kort**\n\nJij bent eigenaar van het ‘product’ van C2B: onze dienstverlening. Je bepaalt welke diensten we aanbieden, hoe ze eruitzien en hoe ze zich ontwikkelen. Je vertaalt trends en klantbehoeften naar proposities, formats en werkwijzen, en zorgt dat ons team ze kan leveren. Onze Creative Lead bewaakt de creatieve lijn en het commerciële team de klantrelaties. Jij zorgt dat wat we aanbieden klopt en werkt, en dat we het blijven vernieuwen.\n\n**Wat ga je doen?**\n\n* **Visie en roadmap.** Je ontwikkelt een visie op de contentmarkt (AI, creators, campagnes, social search, always-on) en vertaalt die naar een productroadmap: welke diensten bouwen we, verbeteren we of stoppen we?\n* **Diensten (door)ontwikkelen.** Je ontwerpt nieuwe proposities en scherpt bestaande aan: inhoud, aanpak, deliverables en prijsmodel.\n* **Van maatwerk naar product.** Je maakt van losse projecten herhaalbare diensten, met heldere formats, werkwijzen en kwaliteitsstandaarden.\n* **Innoveren en testen.** Je volgt nieuwe platforms, formats en AI-tools, start pilots met klanten en schaalt op wat werkt.\n* **Meten en verbeteren.** Je kijkt wat onze diensten klanten opleveren en gebruikt die inzichten om ze beter te maken.\n* **De juiste vragen stellen.** Je schuift aan bij klantgesprekken en haalt op wat klanten echt nodig hebben, ook als ze dat zelf nog niet weten.\n* **Het team meenemen.** Je zorgt dat creatie, studio en productie onze diensten kennen en kunnen leveren, met playbooks, kennisdeling en training.\n* **Commercie voeden.** Je geeft het commerciële team de proposities, cases en argumenten om te verkopen, en denkt mee bij pitches en voorstellen.\n\n**Wie ben jij?**\n\nJe kijkt naar een dienst zoals een productmanager naar een product: voor wie is het, welk probleem lost het op en hoe wordt het beter? Je bent net zo op je plek bij een marketingdirecteur als bij onze makers in de studio. Verder:\n\n* Je hebt een uitgesproken visie op content, social en merken, en op waar die markt naartoe gaat.\n* Je hebt ervaring met het ontwikkelen en lanceren van diensten of proposities, en weet hoe je van idee tot product komt.\n* Je bent strategisch sterk, brengt structuur aan en durft keuzes te maken, ook als dat betekent dat je nee zegt.\n* Je bent commercieel bewust: je weet wat een dienst waardevol maakt voor de klant én rendabel voor ons.\n* Je ben", "source": "indeed"}, {"company": "Blinqx", "job_title": "Product Operations Manager", "location": "Amsterdam-Zuidoost, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Blinqx", "job_url": "https://nl.indeed.com/viewjob?jk=ed29294e827891f8", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-02", "recruiter_email": null, "applicant_count": null, "description": "Onze productmanagers horen bij klanten te zitten, niet in Jira. Jij zorgt dat dat kan. Je bouwt het systeem waarop onze productorganisatie draait: de roadmap die iedereen kan lezen, de processen die niet van één persoon afhangen en de automatisering die handwerk overbodig maakt. En omdat we AI-first werken, is jouw eerste vraag bij elk proces niet \"wie doet dit?\" maar \"moet een mens dit nog doen?\"\n\n**Wat ga je doen?**\n-------------------\n\nBlinqx Verzekering & Hypotheek is gegroeid uit meerdere softwarebedrijven. Dat zie je terug: teams werken elk op hun eigen manier, de status van initiatieven zit te vaak in hoofden en mailboxen en wie wil weten wat er speelt, moet het aan iemand vragen. Daar is het afgelopen halfjaar een begin mee gemaakt, met onder meer een living roadmap in Jira. Jij neemt het van daar over en maakt er een staande organisatie van.\n\nConcreet: je bent eigenaar van de tooling en processen van het productteam. Je zorgt dat elk initiatief een doel, een scope en succescriteria heeft, dat go/no-go-momenten gewoon gebeuren en dat release-communicatie grotendeels vanzelf gaat. Als dat staat, kijk je breder: welke processen rond product, zoals onboarding van nieuwe klanten, kunnen slimmer?\n\n**Jouw verantwoordelijkheden**\n------------------------------\n\n* Je beheert en ontwikkelt de living roadmap in Jira: de initiatieflaag boven de epics, de templates en de afspraken over wat erin hoort.\n* Je bewaakt de ritmes: wekelijkse roadmap-afstemming, go/no-go-momenten en de rapportage richting directie.\n* Je automatiseert release-communicatie: van ticket naar releasenote naar klantbericht, zo min mogelijk handwerk.\n* Je zorgt dat signalen uit support, customer success en sales gestructureerd bij productmanagement landen.\n* Je zet samen met BI de productdashboards op: adoptie, gebruik en resultaat per initiatief.\n* Je zoekt actief naar werk dat AI of automatisering kan overnemen, en bouwt die oplossingen zelf of samen met R&D.\n* Je bent het aanspreekpunt voor Jira en aanverwante tooling, en helpt teams die nog op andere tools of spreadsheets werken over te stappen.\n* Je legt vast hoe we werken, zodat nieuwe collega's snel meedraaien.\n\n**Over het team**\n-----------------\n\nBlinqx Verzekering & Hypotheek bouwt software die dagelijks wordt gebruikt door hypotheekadviseurs, advieskantoren en volmachtkantoren in heel Nederland: voor advies, CRM, compliance, volmachtbeheer en documentbeheer, met AI als kern. We maken deel uit van Blinqx, een groep van ruim 700 collega's op meer dan tien kantoren, die software bouwt voor financiële en zakelijke dienstverleners: verzekeringen en hypotheken, accountancy, legal en finance.\n\nJe werkt vanuit Amsterdam binnen het productteam van Blinqx Verzekering & Hypotheek en rapporteert aan de CPO. Je werkt dagelijks met productmanagers, R&D, sales, support en customer success en je wordt begeleid door de Head of Product van de groep, die deze werkwijze mee heeft opgezet.\n\nJe hoeft dit niet al jaren te doen. Wel moet je sn", "source": "indeed"}, {"company": "Odido Nederland", "job_title": "Senior Proposition Manager", "location": "The Hague, South Holland, Netherlands", "
