    #search { flex: 1; min-width: 220px; font-size: 15px; }

    .stats-bar { padding: 10px 24px; display: flex; gap: 14px; align-items: center;
      font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border); }

    .job-company { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }

": "2026-11-12", "description": "About us Tebi is building a modern connected hospitality operating system that helps entrepreneurs run their business more intelligently and smoothly. In one seamless platform, Tebi embeds sales, reservations, kitchen, inventory, and payments (as well as all the data that powers it) helping to automate work, streamline operations, and give hospitality owners the clarity and time they need to focus on what matters the most: creating great guest experiences. Founded by Arnout Schuijff, co-founder of Adyen, and backed by €50 million in funding from Index Ventures & CapitalG, Tebi is build in service of hospitality first. Thousands of restaurants, cafés, bars, and coffee shops across the Netherlands, UK, Spain, Italy, Denmark, Germany, Finland, and Ireland. About the role As the Senior Product Manager on our AI team, you'll own how AI shows up in Tebi, from an AI agent embedded in the product to the AI capabilities that run through the platform. Tebi sits on a unified foundation of sales, payments, reservations, kitchen and inventory data, which gives our AI something most restaurant software can't offer: the full picture. You'll own the vision, strategy and roadmap, and turn that data into agents and features that save merchants time, cut costs and help them make better decisions on a busy service. What you’ll do: Define and own the vision and roadmap for Tebi's AI agent and AI capabilities across the product. Work with AI engineers and data teams to ship agentic features that take real actions for merchants, not just answer questions. Spend time with restaurant owners, managers and staff, plus Sales and Customer Success, to find the jobs where AI genuinely removes friction in their day. Define how we measure quality and trust in AI features, including evals, accuracy, adoption and merchant outcomes, and use that to iterate quickly. Decide where AI belongs in the product and where it doesn't, including guardrails, human-in-the-loop moments and when the merchant makes the final call. Partner with all the other product teams so AI feels native to Tebi rather than bolted on. What you'll need: 8+ years of product management experience at a fast-growing tech company, with a track record of shipping impactful launches. You are highly collaborative, able to partner effectively across the organization and build trust with both technical and operational teams. Hands-on experience building AI-powered products and a solid grasp of their strengths and limits. A data-driven mindset: you combine quantitative signals and qualitative feedback, and you know how to evaluate non-deterministic products. You care about the balance between craft, speed, and outcomes. This probably isn't the role for you if you're happiest on a structured environment with clear directions. We are looking for someone to set the direction and the vision for this team. People who succeed at Tebi are independent, curious and passionate about hospitality. If this speaks to you we can be the ri", "recruiter_email": null, "notes": "Via Ashby API.", "source": "crawler"}, {"company": "Bitvavo B.V.", "job_title": "Lead Product Manager Crypto Custody - Open to remote", "location": "Headquarters, Netherlands", "careers_url": "https://jobs.bitvavo.com/find-your-role", "job_url": "https://jobs.bitvavo.com/find-your-role/lead-product-manager-crypto-custody---open-to-remote/c03ba2a8-1ec4-4f32-b4e7-628b521109de", "visa_support": null, "relocation_support": null, "date_posted": null, "recruiter_email": null, "notes": "Dept: Product. Via Bitvavo RSC endpoint.", "source": "crawler"}, {"company": "bunq B.V.", "job_title": "Head of Product", "location": "Amsterdam, Netherlands", "careers_url": "https://careers.bunq.com/", "job_url": "https://careers.bunq.com/o/head-of-product-6", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-15", "recruiter_email": null, "description": "As Head of Product, your mission is to lead the product organization that builds what our users bank with every day, ensuring they get the safe, smart and effortless banking they expect. Why this matters: At bunq, our mission is to Make Life Easy, for our users, our teams, and the world around us. Every team plays a unique role in making this mission a reality. The Product team does this by building and improving the products our users bank with, while keeping them safe and compliant. As Head of Product, you contribute by setting product direction and leading the product leaders who deliver it, helping us grow as the bank of The Free. Take ownership: As Head of Product, you’ll take charge of key responsibilities that directly impact bunq’s growth and our users’ seamless experience: Grow our users’ use of bunq’s products by leading product strategy and delivery for your area. Keep growth and safety moving together, so that fraud, compliance and quality are built into the products rather than bolted on. Build a strong, AI-first product organization by leading Product Owners and Team Leads, and redesigning how the function works around AI agents instead of adding headcount by default. Be bunq’s product voice with the management board, regulators, auditors and partners.", "notes": "Via Recruitee API.", "source": "crawler"}, {"company": "bunq B.V.", "job_title": "(Senior) Product Owner", "location": "Amsterdam, Netherlands", "careers_url": "https://careers.bunq.com/", "job_url": "https://careers.bunq.com/o/senior-product-owner-1", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-13", "recruiter_email": null, "description": "At bunq, we're not just building a banking app; we're reshaping how people around the world experience financial freedom. As a (Senior) Product Owner at bunq, you are the driving force behind a core piece of our user's experience. Your mission is to own your product, understand our users (Eva) inside and out, and ship beautiful, effective features that make their lives easy. We have sev ing and implementing the product and its underlying infrastructure to continuous maintenance and improvement. Drive the strategic launch and expansion of our credit products into our current and new markets, navigating the unique complexities of each region. Obsess over the user journey, collaborating with design and engineering teams to craft a world-class, seamless, and bug-free credit experience. Work hand-in-hand with legal, risk, and compliance teams to ensure our credit products are not only innovative but also fully compliant with all regulatory requirements.", "notes": "Via Recruitee API.", "source": "crawler"}, {"company": "Vinted Netherlands B.V.", "job_title": "Director of Product, Order", "location": "Amsterdam", "careers_url": "https://careers.vinted.com/jobs?department=Engineering&location=Amsterdam", "job_url": "https://careers.vinted.com/jobs/5034631101?gh_jid=5034631101", "visa_support": null, "relocation_support": null, "date_posted": null, "recruiter_email": null, "description": "Brief info about Vinted&nbsp; Our mission is to make second-hand the first choice, and we're looking for people who want to help us get there. Every day, we work together to help our members buy and sell pre-loved clothing and lifestyle items, giving each piece a second life – or even a third. The Vinted Group is made up of three business units that support this mission: Vinted Marketplace is Europe’s leading platform for second-hand fashion and a go-to destination for all kinds of pre-loved items, with a growing range of categories. Our platform connects millions of members across 20+ markets, helping great items find a new life. Vinted Go enhances the shipping experience with a vast network of over 500,000 pick-up and drop-off points, partnering with more than 60 carriers across Europe, with added services like item verification for peace of mind on high-value pieces. Vinted Pay is the newest part of the Vinted Group, dedicated to bringing secure, reliable payments to b ms in the Netherlands and the DACH region, you work in an organization with a broad, European perspective. At the same time, the culture remains personal and close-knit. This gives you the opportunity to collaborate internationally at a high level, within a committed and engaged team.\n\n##### **Culture as a catalyst**\n\nOur culture is a key reason why colleagues enjoy working at Highberg. We place trust in our people, value initiative, and believe it is important that everyone can continue to develop. This enables you to get the best out of yourself, while together contributing to sustainable growth.\n\n**Your role as Payroll Product Owner / Payroll Lead**\n-----------------------------------------------------\n\nAs Payroll Product Owner / Payroll Lead at Highberg, you own the payroll chain. Without a clear owner, issues fall between the cracks; you ensure that collective labour agreement (CAO) and legislative changes go live on time, that systems stay aligned and that payroll runs correctly every period. You work within Payroll Services, the Dutch-speaking payroll team of Highberg | Consultday.\n\n  \n\nYour responsibilities include:\n\n* Managing and prioritising the backlog: planning CAO, legislative and system changes, so that statutory changes go live on time.\n* Ven", "source": "indeed"}, {"company": "BNG", "job_title": "Product Owner IAM", "location": "The Hague, South Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/bngbank", "job_url": "https://www.linkedin.com/jobs/view/4492134825", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-19", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Solera Holdings, LLC.", "job_title": "Product Owner III", "location": "Utrecht, Utrecht, Netherlands", "careers_url": "https://www.linkedin.com/company/solera", "job_url": "https://www.linkedin.com/jobs/view/4484107068", "visa_support": null, "relocation_support": null, "da roduct Manager Awareness & Lead Acquisition West", "location": "Amsterdam, Netherlands", "careers_url": "https://www.glassdoor.nl/Overview/W-EI_IE988002.htm", "job_url": "https://www.glassdoor.nl/job-listing/j?jl=1010315591470", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-04", "recruiter_email": null, "applicant_count": null, "description": "", "source": "glassdoor"}, {"company": "World Resources Institute", "job_title": "Senior Product Manager, Core Platform, RestorationWorks", "location": "Den Haag, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/World-Resources-Institute", "job_url": "https://nl.indeed.com/viewjob?jk=d2e0aff20d6a95fe", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-18", "recruiter_email": null, "applicant_count": null, "description": "**This is a hybrid position which requires 8 days per month in the office. You can be based in any one of our offices in Washington, D.C, London, The Hague or Mexico City.**\n\n**Existing work authorization is required at the time of application submission as WRI is unable to sponsor any visa work sponsorship for this position. To be eligible for this position in US, you must be a resident of DC, Maryland or Virginia at the start of employment.**\n\n**About the Program: Global Restoration Initiative**:\n\nWRI’s Global Restoration Initiative informs, enables, and invests in people restoring degraded land, with its flagship TerraFund program supporting over 200 enterprises and community nonprofits across Africa, Latin America, and South Asia. The Restore Local initiative advances this work through a $60M+ portfolio of locally led projects across priority landscapes in Africa, Brazil, and India. The portfolio spans grant funding, as well as debt and equity investments in SMEs and blended finance structures.\n\nIn its next phase, WRI’s Restoration team is leveraging technology and its growing network of local partners to develop scalable finance solutions that mobilize greater public and private capital, delivering measurable outcomes for people, nature, and climate. We are making significant investment in our software products and analytical services to support our work to dramatically increase (from millions to billions of dollars) our ability to bring money to the ground for local restoration. This is an exciting opportunity for someone passionate about applying data innovation and software solutions to mobilize finance for nature-positive solutions and sustainable economic development.\n\nRestoring the world’s 2 billion degraded hectares is currently held back by fragmented, small-scale efforts and a persistent mismatch between local restoration champions — community groups, cooperatives, and NGOs — and the large-scale investors and governments who could fund and scale their work. Our new platform concept, RestorationWorks, has the ambition of closing that gap by bringing the full restoration journey onto one platform: connecting practitioners, funders, and governments; embedding WRI’s locally-led restoration methodology into intuitive digital workflows; and centralizing restoration intelligence — case studies, best practices, and AI-powered geospatial data — to equip any stakeholder in our ecosystem with the tools they need to do restoration well.\n\n  \n\n**About the Program: Data Lab**\n\nThe Data Lab is WRI’s core data innovation and delivery unit. We are a team of over 50 engineers, product managers, and data scientists with deep experience setting data strategy, doing quantitative research, and building data tools and products. We work across WRI’s programs, centers and international offices to use advances in data and technology to help our community improve lives, protect nature, and ensure just transitions. Data of all kinds sits at the heart of how WRI", "source": "indeed"}, {"company": "LYNX Berlin", "job_title": "Product Manager Awareness & Lead Acquisition West", "location": "Amsterdam, NH, Nethe nefits, retirement programs, wellness programs, as well as service and performance awards – not to mention various social and recreational activities, all of which are location specific.\n\n### **Job description**\n\nWe are excited to be named one of the World’s Best Workplaces by Fortune Magazine!\n  \nWe are proud to offer you our total rewards package which includes bonuses, healthcare, insurance benefits, retirement programs, wellness programs, as well as service and performance awards – not to mention various social and recreational activities, all of which are location specific.\n\n**The Job’s Mission:**\n\nAs **Senior Product Manager**, will drive market share growth for Stryker’s **Sports Medicine** business in **Northern Europe (Benelux & Nordics)** – through the formulation and execution of effective, strategic, marketing plans and by collaborating closely with our regional sales teams.\n\nStryker delivers an integrated **Sports Medicine** product portfolio inclusive of the latest technology for arthroscopic and open shoulder, hip, knee and small joint procedures. Find out more about our Sports Medicine business via: https://www.stryker.com/us/en/sports-medicine.html\n\nThis role can be based **across Northern Europe** – and it is an exciting opportunity to **join one of the world's leading medical technology organizations in our mission of making healthcare better**!\n\n**What you will do:**\n\n* In your new role, you will start with a familiarization phase to learn about our portfolio and build relationships with internal/external stakeholders.\n* With the product/clinical knowledge you’ll build up, you will articulate the value proposition and different product features to different customers/stakeholders as appropriate to their needs.\n* Understand the market dynamics and competitive landscape.\n* Play a key role in the development and execution of the strategic plan, Annual Marketing Plan, product launch plans, etc. – towards the achievement of growth, profit and market share targets.\n\n* Drive segmentation and targeting methods to improve commercial efficiency.\n* Create marketing strategies to understand, develop and enhance the relationship between the customer and the product or portfolio.\n* Translate the marketing plans into specific marketing activates. Drive local strategies, action plans and campaigns towards business results – in alignment with internal stakeholders.\n* Manage PLCM activities for the product or portfolio.\n* Collaborate with sales training/sales enablement to develop and execute education plans, sales trainings and to drive new product launches at local level.\n* Develop sales tools, customer engagement programs, events and communication plans for the product or portfolio.\n* Demonstrate financial acumen and prov", "source": "indeed"}, {"company": "stichd", "job_title": "Creative Director Product", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Stichd", "job_url": "https://nl.indeed.com/viewjob?jk=d7313c6ed349a4d5", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-09", "recruiter_email": null, "applicant_count": null, "description": "**The Job**\n\nWe are looking for a Creative Director Product to lead and shape the future of our product categories across some of the most relevant global A-brands in sport and fashion.\n  \nAs a trusted long-term licensing partner, we have built global brand collaborations over decades — translating brand DNA into commercially successful, consumer-relevant products at scale. This role sits at the heart of that model: connecting brand vision, creative direction, and exceptional product execution.\n  \nYou will define a clear product vision, inspire your team, and translate global brand strategies into standout category concepts — from technically advanced first-layer products (socks, bodywear & underwear) to high-impact fanwear collections linked to the world’s leading teams and assets.\n\n**  technische expertise weet te verbinden met commerciële ambities.\n\n**Over de rol**\n---------------\n\nHoe zorg je ervoor dat diensten voor informatiebeveiliging aansluiten op de veranderende behoeften van klanten en markten wereldwijd?\n\nAls Product Manager ISMS speel je een belangrijke rol in de internationale ontwikkeling en groei van ons portfolio voor informatiebeveiliging en cybersecurity. Je combineert diepgaande technische kennis met commercieel inzicht en weet hoe je kansen in de markt vertaalt naar succesvolle producten en diensten.\n\nJe werkt nauw samen met regiomanagers, directeuren, technische experts en commerciële teams in meer dan 30 landen. Daarbij vorm je de verbindende schakel tussen technische expertise, productontwikkeling, marketing en sales.\n\nJe richt je onder andere op certificeringsdiensten rondom ISO/IEC 27001, IEC 62443, ISO/SAE 21434 en TISAX®.\n\nIn deze zelfstandige, internationale functie krijg je de ruimte om nieuwe initiatieven te ontwikkelen, mensen samen te brengen en direct bij te dragen aan de verdere groei van TÜV NORD GROUP.\n\n  \n\nAls Product Manager ISMS ben je verantwoordelijk voor de internationale ontwikkeling, positionering en commerciële groei van ons certificeringsportfolio.\n\nJe houdt je onder andere bezig met:\n\n* Het ontwikkelen en uitbreiden van internationale certificeringsdiensten op het gebied van informatiebeveiliging en cybersecurity.\n* Het ophalen van behoeften en ideeën bij internationale teams en stakeholders en deze vertalen naar relevante producten en diensten.\n* Het volgen van marktontwikkelingen, nieuwe wet- en regelgeving en technologische veranderingen om nieuwe commerciële kansen te signaleren.\n* Het samenwerken met regiomanagers, directeuren en businessleiders in meer dan 30 landen.\n* Het ondersteunen van lokale sales- en keyaccountteams bij het ontwikkelen van commerciële kansen, het binnenhalen van nieuwe opdrachten en het versterken van bestaande klantrelaties.\n* Het samenwerken met marketing en technische expe", "source": "indeed"}, {"company": "Scholt Energy", "job_title": "D365 Finance/F&O product owner", "location": "Eindhoven, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Scholt-Energy-1", "job_url": "https://nl.indeed.com/viewjob?jk=952d814300beb242", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "Location\n\nEindhoven, NL\n\nEmployment type\n\nFull-time\n\nWork mode\n\nOn-site\n\nPosted\n\n16 Sept 2026\n\nOrganisation\n\nScholt Energy\n\nBen jij een ervaren D365 Finance/F&O Consultant die graag verder kijkt dan alleen de technische implementatie?\n\nBij Scholt Energy krijg je een belangrijke rol in onze transitie naar Microsoft Dynamics 365 Finance. Je helpt ons bij het selecteren van de juiste implementatiepartner en begeleidt vervolgens de inrichting en implementatie van het nieuwe platform.\n  \n  \nNa de implementatie ontwikkelt je functie zich verder richting IT Business Partner. Je wordt de verbindende schakel tussen Finance, IT en externe leveranciers. Je begrijpt de processen en behoeften van de organisatie en vertaalt deze naar concrete, toekomstbestendige oplossingen. Daarbij adviseer je stakeholders over systeemwijzigingen, integraties en verbeteringen en bewaak je de samenhang tussen processen, applicaties en data.\n  \n  \nNaast D365 Finance krijg je op termijn ook andere applicaties binnen de ondersteunende afdelingen in je scope, waaronder HR en Legal. Je ontwikkelt hiervoor een heldere applicatievisie en roadmap, bepaalt prioriteiten en bewaakt de kwaliteit en voortgang van wijzigingen. Ook begeleid je test- en releaseprocessen en zorg je voor goede documentatie en duidelijke communicatie richting gebruikers, management en leveranciers.\n\nJe werkt nauw samen met collega’s binnen Finance, IT en andere afdelingen. Je bent inhoudelijk sparringpartner voor de business en weet verschillende belangen bij elkaar te brengen. Je neemt zelfstandig de leiding in complexe projecten, houdt overzicht en zorgt ervoor dat beslissingen leiden tot betrouwbare en werkbare oplossingen.\n\n**Dit breng jij mee** :\n\n* Een afgeronde hbo- of wo-opleiding in Informatica of een vergelijkbare richting\n* Minimaal vijf jaar ervaring met D365 Finance/F&O-implementaties\n* Ervaring met migraties vanuit Exact, AX of Oracle\n* Ervaring binnen internationale finance-organisaties\n* Kennis van integraties met billing- en ERP-platformen\n* Een onafhankelijke positie ten opzichte van mogelijke implementatiepartners\n* Ervaring met Agile/Scrum is een pré\n* Goede beheersing van de Engelse en Nederlandse taal\n  \n\n  \n\n### **Wat wij bieden**\n\nLees hoe wij onze waarde als werkgever bewaken en jou de tools bieden om je werk op de best mogelijke manier te doen.\n\nJe komt terecht bij een ambitieuze en doelgerichte organisatie die zich richt op het leveren van klimaatneutrale energie voor bedrijven, waar een persoonlijke maar professionele cultuur en een sterke teamgeest centraal staan. Het bedrijf ondersteunt je groei, waardeert initiatief en biedt flexibiliteit, aantrekkelijke secundaire arbeidsvoorwaarden en volop mogelijkheden om jezelf te ontwikkelen terwijl je geniet van een positieve en boeiende werkomgeving.\n\n* Duidelijke missie en cultuur: gericht op de energietransitie, met een open, professionele omgeving en een hoge medewerkerstevredenheid\n* Sterke nadruk op werkplezier: wekelijkse borrels, spo", "source": "indeed"}, {"company": "stichd", "job_title": "Product Manager Essentials", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Stichd", "job_url": "https://nl.indeed.com/viewjob?jk=81f353ce61f149d6", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "**The Job**\n\nThe Product Management department oversees the end-to-end product process, ensuring the full collecti function getSector(company) {
  const cl = company.toLowerCase();
  for (const [key, sec] of Object.entries(SECTOR_MAP)) {
    if (cl.includes(key)) return sec;
  }
  return 'Other';
}

// ── Match scoring ─────────────────────────────────────────────────────────────
function scoreJob(j) {
  const title = (j.job_title || '').toLowerCase();
  const company = (j.company || '').toLowerCase();
  const sector = getSector(j.company);
  const desc = (j.description || '').toLowerCase().slice(0, 800);
  let score = 0;

  // Role type (0–50)
  const ROLES = [
    [50, ['technical product manager','product manager','productmanager','product management']],
    [48, ['associate product manager','apm']],
    [44, ['product owner','product lead']],
    [42, ['product operations','product ops','product strategy','growth product','growth manager']],
    [36, ['technical program manager','program manager','programme manager','tpm']],
    [25, ['head of product','director of product','vp of product']],
  ];
  for (const [pts, kws] of ROLES) {
    if (kws.some(k => title.includes(k))) { score += pts; break; }
  }
  if (score === 0) score += 15;

  // Sector fit (0–30)
  score += ({ Tech:30, Industrial:22, Energy:22, Finance:20, FMCG:14, Consulting:12, Other:12 })[sector] || 12;

  // Company bonus (0–20)
  const CO = [
    [20, ['adyen','booking','uber','databricks','prosus','backbase','catawiki','tomtom','mollie','bol.com','just eat','coolblue','exact']],
    [16, ['asml','nxp','signify','philips','wolters kluwer','vanderlande','tno']],
    [14, ['shell','eneco','vattenfall','tennet','alliander','stedin','orsted','ørsted','sbm offshore','neste','fugro']],
    [12, ['ing ','rabobank','abn amro','nn group','aegon','van lanschot']],
    [10, ['unilever','heineken','akzonobel','dsm','firmenich','ahold','frieslandcampina']],
    [6,  ['bcg','bain','mckinsey','oliver wyman','kearney','strategy&','roland berger','ey-parthenon','deloitte','accenture']],
  ];
  for (const [pts, kws] of CO) {
    if (kws.some(k => company.includes(k))) { score += pts; break; }
  }

  // Keyword signals in title/desc (+0–10)
  let bonus = 0;
  for (const [kw, pts] of [['product',3],['platform',2],['data',2],['growth',2],['energy',2],
      ['roadmap',2],['b2b',1],['saas',1],['analytics',1],['strategy',1]]) {
    if (title.includes(kw)) bonus += pts;
    else if (desc.includes(kw)) bonus += Math.round(pts / 2);
  }
  score += Math.min(10, bonus);
  score = Math.min(100, score);
  // She has no full-time PM job yet, so seniority in the title bounds the fit.
  if (/\b(vp|vice president|head of|director|chief|cpo)\b/i.test(title)) return Math.min(score, 25);
  if (/\b(principal|group|staff|lead)\b/i.test(title)) return Math.min(score, 40);
  if (/\b(senior|sr\.?|expert)\b/i.test(title)) return Math.min(score, 60);
  if (/\b(associate|junior|jr\.?|new grad|graduate|entry|apm)\b/i.test(title)) return Math.min(100, score + 10);
  return Math.min(score, 85);
}

function getAiScores() { try { return JSON.parse(localStorage.getItem(AI_SCORES_KEY) || '{}'); } catch { return {}; } }
function saveAiScores(obj) { try { localStorage.setItem(AI_SCORES_KEY, JSON.stringify(obj)); } catch {} }

function getEffectiveScore(j) {
  // Priority: localStorage (user-triggered) > j.ai_score (server-side) > JS rules
  const entry = getAiScores()[jobKey(j)];
  if (entry) return { score: entry.s, reason: entry.r || '', ai: true };
  if (j.ai_score !== undefined) return { score: j.ai_score, reason: '', ai: true };
  return { score: scoreJob(j), reason: '', ai: false };
}

function matchBadgeHtml(score, isAi, reason) {
  let cls;
  if (score >= 85) cls = 'ex';
  else if (score >= 70) cls = 'str';
  else if (score >= 55) cls = 'gd';
  else if (score >= 40) cls = 'ok';
  else cls = 'low';
  const sup    = isAi ? '<sup style="font-size:8px;margin-left:1px">AI</sup>' : '';
  const tipTxt = isAi && reason ? reason : (isAi ? 'AI-scored by Claude' : 'Keyword match score');
  return `<span class="match-badge match-${cls}" title="${esc(tipTxt)}">${score}%${sup}</span>`;
}

async function aiScoreAll() {

  if (!apiKey) {
    const k = prompt('Enter your Claude API key (sk-ant-…) to enable AI scoring:');
    if (!k || !k.trim()) return;
    apiKey = k.trim();
    localStorage.setItem('vanshika_claude_api_key', apiKey);
  }
  const btn = document.getElementById('ai-score-btn');
  btn.disabled = true; btn.textContent = '⏳ Scoring…';

  const aiScores = getAiScores();
  const unscored = JOBS_DATA.filter(j => !aiScores[jobKey(j)]);
  if (!unscored.length) {
    btn.disabled = false; btn.textContent = '✨ Re-score with AI';
    applyFilters(); return;
  }

  const BATCH = 8;   // smaller batches — full descriptions fit comfortably
  let done = 0;
  try {
    for (let i = 0; i < unscored.length; i += BATCH) {
      const batch = unscored.slice(i, i + BATCH);

      const jobLines = batch.map((j, idx) => {
        const sector  = getSector(j.company);
        const desc    = (j.description || '').trim().slice(0, 1200);
        const descTxt = desc ? `\n   Description: ${desc}` : '';
        return `${idx}. Company: ${j.company} | Role: ${j.job_title} | Location: ${j.location || 'Netherlands'} | Sector: ${sector}${descTxt}`;
      }).join('\n\n');

      const userMsg = `Score these ${batch.length} roles for Vanshika. Reply ONLY with a JSON array — no other text:\n[{"i":0,"s":88,"r":"one sentence why"}, ...]\n\nRoles:\n${jobLines}`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-beta': 'prompt-caching-2024-07-31',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 600,
          system: [{
            type: 'text',
            text: AI_SYSTEM_PROMPT,
            cache_control: { type: 'ephemeral' },
          }],
          messages: [{ role: 'user', content: userMsg }],
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'API ' + res.status);
      }
      const data = await res.json();
      const text = data.content?.[0]?.text || '[]';
      const match = text.match(/\[[\s\S]*\]/);
      if (match) {
        const parsed = JSON.parse(match[0]);
        for (const {i, s, r} of parsed) {
          if (batch[i]) {
            aiScores[jobKey(batch[i])] = {
              s: Math.min(100, Math.max(0, Math.round(s))),
              r: (r || '').slice(0, 120),
            };
          }
        }
      }
      done += batch.length;
      btn.textContent = `⏳ ${done}/${unscored.length}…`;
      saveAiScores(aiScores);
    }
    btn.textContent = '✅ AI Scored!';
  } catch(e) {
    btn.textContent = '⚠ Error — Retry?';

    btn.disabled = false;
    applyFilters();
    setTimeout(() => { if (btn.textContent !== '⚠ Error — Retry?') btn.textContent = '✨ Re-score with AI'; }, 3000);
  }
}

// ── Job utils ─────────────────────────────────────────────────────────────────
function jobKey(j) { return j.job_url || (j.company + '|' + j.job_title); }

const LS_KEY = 'vanshika_job_statuses';
let statuses = {};
try { statuses = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch {}

function setStatus(key, val) {
  if (val) statuses[key] = val;
  else delete statuses[key];
  localStorage.setItem(LS_KEY, JSON.stringify(statuses));
  applyFilters();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(raw) {
  if (!raw) return null;
  try {
    const d = new Date(raw);
    if (isNaN(d)) return null;
    const diff = Math.round((Date.now() - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff <= 6) return diff + 'd ago';
    if (diff <= 30) return Math.round(diff/7) + 'w ago';
    return d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
  } catch { return null; }
}

function statusLabel(s) {
  return {applied:'✅ Applied', interview:'🎯 Interview', offer:'🎉 Offer',
    rejected:'❌ Rejected', bookmarked:'🔖 Bookmarked'}[s] || '';
}

// ── Filters + sort ────────────────────────────────────────────────────────────
function applyFilters() {
  const search  = document.getElementById('search').value.toLowerCase();
  const sector  = document.getElementById('sector-filter').value;
  const statusF = document.getElementById('status-filter').value;
  const sourceF    = document.getElementById('source-filter').value;
  const sortBy     = document.getElementById('sort-by').value;
  const maxDays    = parseInt(document.getElementById('date-filter').value) || 0;
  const maxApplied = parseInt(document.getElementById('applicant-filter').value) || 0;
  const now        = Date.now();

  let filtered = JOBS_DATA.filter(j => {
    const key = jobKey(j);
    const jobStatus = statuses[key] || '';
    if (statusF === 'unreviewed' && jobStatus) return false;
    if (statusF && statusF !== 'unreviewed' && jobStatus !== statusF) return false;
    if (sector && getSector(j.company) !== sector) return false;
    if (sourceF && (j.source || 'crawler') !== sourceF) return false;
    if (maxDays && j.date_posted) {
      const d = new Date(j.date_posted);
      if (!isNaN(d) && (now - d.getTime()) > maxDays * 86400000) return false;
    }
    if (maxApplied) {
      const count = j.applicant_count;
      if (count == null || count >= maxApplied) return false;
    }
    if (search) {
      const hay = (j.company + ' ' + j.job_title + ' ' + (j.location||'') + ' ' + (j.notes||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  // Sort
  if (sortBy === 'score') {
    filtered.sort((a, b) => getEffectiveScore(b).score - getEffectiveScore(a).score);
  } else if (sortBy === 'date') {
    filtered.sort((a, b) => {
      const da = a.date_posted ? new Date(a.date_posted).getTime() : 0;
      const db = b.date_posted ? new Date(b.date_posted).getTime() : 0;
      return db - da;
    });
  } else if (sortBy === 'company') {
    filtered.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
  }

  renderJobs(filtered);
  updateStats();
}

function renderJobs(list) {
  const container = document.getElementById('list-container');
  const noRes = document.getElementById('no-results');
  if (!list.length) {
    container.innerHTML = '';
    noRes.style.display = 'block';
    document.getElementById('shown-count').textContent = '0';
    return;
  }
  noRes.style.display = 'none';
  document.getElementById('shown-count').textContent = list.length;

  container.innerHTML = list.map(j => {
    const key = jobKey(j);
    const status = statuses[key] || '';
    const sector = getSector(j.company);
    const dateStr = formatDate(j.date_posted);
    const notes = (j.notes || '').replace(/\[Direct link.*?\]/g,'').trim();
    const src = j.source || 'crawler';
    const srcLabel = {linkedin:'LinkedIn', indeed:'Indeed', glassdoor:'Glassdoor', crawler:'Portal'}[src] || src;
    const { score, reason, ai } = getEffectiveScore(j);
    const applicants = j.applicant_count != null
      ? `<span style="color:${j.applicant_count < 10 ? 'var(--green)' : j.applicant_count < 25 ? 'var(--yellow)' : 'var(--text-muted)'}">${j.applicant_count} applicants</span>`
      : '';
    // Recruiter: show email if known, else show "Find" search link for LinkedIn/Indeed jobs
    const recruiterHtml = j.recruiter_email
      ? `<a class="job-link secondary" href="mailto:${esc(j.recruiter_email)}" title="Email recruiter">${esc(j.recruiter_email.split('@')[0])}</a>`
      : (src !== 'crawler'
          ? `<a class="job-link secondary" href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent((j.company||'') + ' recruiter netherlands')}" target="_blank" rel="noopener" title="Find recruiter on LinkedIn">Find Recruiter</a>`
          : '');
    return `<div class="job-card status-${status || 'none'}">
      <div class="job-card-main">
        <div class="job-top">
          <span class="job-company">${esc(j.company)}</span>
          <span class="job-sector">${esc(sector)}</span>
          <span class="source-badge ${esc(src)}">${esc(srcLabel)}</span>
          ${matchBadgeHtml(score, ai, reason)}
        </div>
        <div class="job-title">${esc(j.job_title)}</div>
        <div class="job-meta">
          ${j.location ? '<span>' + esc(j.location) + '</span>' : ''}
          ${dateStr ? '<span>' + esc(dateStr) + '</span>' : ''}
          ${applicants}
          ${status ? '<span style="color:var(--accent)">' + statusLabel(status) + '</span>' : ''}
        </div>
        ${notes ? '<div class="job-notes">' + esc(notes) + '</div>' : ''}
      </div>
      <div class="job-actions">
        <a class="job-link" href="${esc(j.job_url || j.careers_url)}" target="_blank" rel="noopener">Apply →</a>
        ${recruiterHtml}
        ${j.careers_url && j.job_url && !j.recruiter_email ? '<a class="job-link secondary" href="' + esc(j.careers_url) + '" target="_blank" rel="noopener">Careers</a>' : ''}
        <select class="status-select" data-key="${esc(key)}" onchange="handleStatusChange(this)" title="Track status">
          <option value="" ${!status?'selected':''}>Track…</option>
          <option value="bookmarked" ${status==='bookmarked'?'selected':''}>🔖 Bookmark</option>
          <option value="applied" ${status==='applied'?'selected':''}>✅ Applied</option>
          <option value="interview" ${status==='interview'?'selected':''}>🎯 Interview</option>
          <option value="offer" ${status==='offer'?'selected':''}>🎉 Offer</option>
          <option value="rejected" ${status==='rejected'?'selected':''}>❌ Rejected</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

function handleStatusChange(sel) {
  const key = sel.getAttribute('data-key');
  setStatus(key, sel.value);
}

function updateStats() {
  const counts = {bookmarked:0, applied:0, interview:0, offer:0, rejected:0};
  for (const v of Object.values(statuses)) if (counts[v] !== undefined) counts[v]++;
  document.getElementById('chip-bookmarked').textContent = counts.bookmarked + ' Bookmarked';
  document.getElementById('chip-applied').textContent = counts.applied + ' Applied';
  document.getElementById('chip-interview').textContent = counts.interview + ' Interview';
  document.getElementById('chip-offer').textContent = counts.offer + ' Offer';
  document.getElementById('chip-rejected').textContent = counts.rejected + ' Rejected';
  document.getElementById('total-count').textContent = JOBS_DATA.length;
  document.getElementById('total-badge').textContent = JOBS_DATA.length + ' roles';
}

applyFilters();
</script>
</body>
