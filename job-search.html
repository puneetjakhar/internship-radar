  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    header { background: var(--surface); border-bottom: 1px solid var(--border);

    header h1 { font-size: 18px; font-weight: 700;

    .controls { padding: 16px 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input[type="text"], select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 9px 13px; font-size: 14px; outline: none;

    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    #search { flex: 1; min-width: 220px; font-size: 15px; }

    .stats-bar { padding: 10px 24px; display: flex; gap: 14px; align-items: center;
      font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .stats-bar strong { color: var(--text); }

    .stat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .stat-chip { font-size: 11px; padding: 3px 10px; border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); }
    .stat-chip.applied { background: rgba(34,197,94,0.1); color: var(--green); border-color: rgba(34,197,94,0.3); }

      align-items: flex-start; transition: border-color 0.2s; }

    .job-card.status-interview { border-left: 3px solid #60a5fa; }
    .job-card.status-offer { border-left: 3px solid var(--accent); }
    .job-card.status-rejected { border-left: 3px solid var(--red); opacity: 0.6; }
    .job-card.status-bookmarked { border-left: 3px solid var(--yellow); }

    .job-card-main { flex: 1; min-width: 0; }
    .job-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
    .job-company { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .job-sector { font-size: 10px; color: var(--text-muted); background: var(--surface2);

    .job-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 90px; flex-shrink: 0; }
    .job-link { font-size: 12px; padding: 6px 12px; border-radius: 6px; background: var(--accent);

    #no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); display: none; }
    #no-results h3 { font-size: 18px; margin-bottom: 8px; }
  </style>
</head>

er one million small businesses and 15,000 accountants across Europe.\n  \nWe're a multicultural team working from France, Germany, Denmark and the Netherlands, contributing to a wider European network that spans Spain, Portugal and Belgium.\n  \n  \n**Your hiring experience matters**\n  \nJust as we respect our customers' time, we respect yours. Your experience with Shine and Cegid should feel simple, transparent and genuinely supportive.\n  \nIf this sounds like somewhere you want to grow, we'd love to hear from you.\n\n**The Netherlands Payroll product at Shine**\n--------------------------------------------\n\nOur Netherlands payroll product, today offered as Employes by Shine, is a SaaS solution that helps Dutch companies run accurate, compliant payroll and manage core employee data in one place. It operates in a complex, business‑critical, regulation‑heavy domain where reliability and correctness matter every single month. The product is established and growing with an existing customer base and a full roadmap of improvements and new capabilities.\n\nThis role is an opportunity to take real ownership of that product while still having significant freedom to shape where it goes next. Payroll is inherently complex, and your goal is to make something complicated feel remarkably simple for customers. You will work with a strong, complete cross‑functional team — five engineers, an Engineering Manager, a Product Designer and a Payroll Expert — and have direct access to customers, business stakeholders and leadership. At the same time, the journey goes beyond optimising an existing product: Employes is becoming part of the broader Shine Payroll proposition, creating opportunities to rethink the product, expand its addressable market and build capabilities that can scale beyond the Netherlands. It is a role with significant autonomy, visible business impact and plenty of complex product problems still left to solve.\n\n**Your role as a Senior Product Owner/ Manager, Netherlands Payroll**\n---------------------------------------------------------------------\n\nAs Senior Product Manager for our Netherlands payroll product, you take end‑to‑end", "source": "indeed"}, {"company": "Hilti Group", "job_title": "Global IT Business Analyst Project Management (Large Projects)", "location": "Berkel en Rodenrijs, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Hilti-Group-4", "job_url": "https://nl.indeed.com/viewjob?jk=20d9c2047382e13a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-04", "recruiter_email": null, "applicant_count": null, "description": "* Berkel en Rodenrijs, South Holland, The Netherlands\n* IT, Software & Digital\n* Experienced Professionals\n* 21391\n\n  \n\n**From Data to Decisions, Where Complexity Meets Clarity**\n----------------------------------------------------------\n\nAt Hilti, we provide innovative and market-leading products, software and services to customers in the professional construction industry. Join our Global IT Large Projects team and help shape the digital future of Large Projects execution and project management at Hilti.\n  \n  \nWorking together with international colleagues, you will contribute to the development and continuous improvement of a connected project management solution landscape. The role focuses on end-to-end business processes and the integration of relevant enterprise applications, rather than on a single tool or platform.\n  \n  \nYou will be based in our strategic IT office in Berkel, Rotterdam, the Netherlands, while working as part of an international team across the Netherlands, Malaysia, the United States and Switzerland.\n  \nThis is a full-time position based in the Netherlands, ideally starting as soon as possible.\n  \n  \nThis is a full-time, permanent position. Required travel is up to 15%.\n\n**What You'll do**\n------------------\n\nAs the IT Business Analyst Project Management Solutions, you will play a key role in driving t  NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Neno-Technology", "job_url": "https://nl.indeed.com/viewjob?jk=dfe4dd97dd45a639", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-25", "recruiter_email": null, "applicant_count": null, "description": "**About Neno**\n\nNeno is defining the next era of AI-native financial services. We merge best-in-class financial technology; banking, payments, invoicing, accounting, payroll and tax with our own expert advisory services team.\n\nOur team is made up of ambitious, unapologetically curious, slightly crazy ex-founders, fintech operators, AI engineers, creatives and corporate finance experts from the Big 4, from all over the world. If you thrive in a high-commitment, high-reward culture and want the autonomy to deliver your best work, this will be the most exciting team you ever join.\n\nNeno is backed by Firstminute Capital, Motive Partners and angels from Miro, Coinbase, Mollie, Juni, Deel, Hugging Face & PayPal.\n\n**The Role**\n\nWe are looking for a Founding Product Lead to join Neno's leadership team and own the product vision, strategy and execution that will define how we serve the global mid-market segment for the next decade. This is one of the most consequential hires Neno will make: the person in this role will determine what we build, in what order, for whom, and how those decisions compound into a product that is genuinely irreplaceable for the businesses that rely on it.\n\nYou will report directly to the CEO, alongside the VP Engineering and VP Accounting as one of four functional leaders driving Neno's growth. Your remit spans the full product surface: AI-powered accounting workflows, embedded banking and payments infrastructure, invoicing, payroll, tax compliance, and the advisory layer above it all. You will own the roadmap across our beachhead market (The Netherlands) with future expansion into the UK, US & beyond.\n\nNeno's product thesis is specific and ambitious: The global SME market is trapped between inadequate DIY accounting software and expensive traditional accounting firms and deserves a fundamentally better product and service, a system that gets smarter with every transaction, automates the routine and amplifies the expert. Your job is to make that thesis real in every sprint, every feature decision and every interaction a customer has with the product.\n\nThe right person is analytically rigorous, deeply curious about AI and financial services, and experienced enough to make hard prioritization calls without needing consensus from everyone in the room. You are as comfortable in a customer discovery interview as you are in an architecture review or a future board strategy session. And you understand that at our stage, shipping the right thing quickly matters more than shipping a perfect thing slowly.\n\n**What Impact You Will Have**\n\n* Own Neno's product vision and roadmap across accounting, banking, payments, invoicing, payroll, tax and the AI layer that powers all of them\n* Build and lead the product management function with 2 direct reports (APM and Senior product designer)\n* Drive the Agentic AI automation layer of Neno's core workflows, measurably reducing the manual effort our accountants spend per client, quarter over quarter\n* ", "source": "indeed"}, {"company": "Ohpen", "job_title": "Senior Product Manager – Lending MidOffice", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ohpen", "job_url": "https://nl.indeed.com/viewjob?jk=d9da71eda9f440f8", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "Amsterdam - Rokin 111, 1012 KN\n\nFull-time\n\nPermanent employee\n\n  \n\n**Description**\n---------------\n\nAre you a **Product Manager** who feels comfortable **in front of customers** but also enjoys **diving into the details**?\n\nWe are looking for a **Senior Product Manager** to join our **Lending team** and help shape the future of our **MidOffice product**.\n\nOur MidOffice plays a **central role in the lending solutions** we provide to banks and lenders. We are continuously improving how our customers assess mortgage applications, making the process **faster, more accurate and less dependent on manual work**. **AI plays a growing role** in this, and we want you to help us take it further.\n\nIn this role, you will work closely with our current Product Manager, **taking ownership of large parts of the MidOffice domain** from early on. You will be **the face of the product** towards customers and prospects, translating their needs into product improvements while ensuring alignment with our overall product strategy.\n\nWe offer a **hybrid working setup**, with **50% of your working time spent at our Amsterdam office** and **50% working remotely**. The role also involves **visiting customers across the Netherlands**.\n\n**Briefing**\n------------\n\n### **What you will do**\n\n* **Lead conversations with customers and prospects** to understand their needs, present our MidOffice product and explore potential solutions.\n* **Take ownership of the product-related aspects of RFIs and RFPs**, including responses, product demonstrations and discovery sessions.\n* **Build strong relationships** with customers, internal stakeholders, engineering teams and other Product Managers.\n* **Evaluate customer requests** and determine how they align with our product strategy, translating relevant needs into a **clear product roadmap**.\n* **Work closely with engineering teams** to design and deliver medium to large product features.\n* **Translate business needs into clear requirements**, use cases and functional specifications.\n* **Stay informed about developments in the Dutch lending and mortgage market** and identify opportunities to improve our product.\n* **Identify where AI can make our MidOffice smarter and faster**, and turn these opportunities into concrete product proposals.\n* **Challenge proposed solutions**, balance customer needs with long-term product goals and contribute to product decisions.\n\n**About You**\n-------------\n\n* You have **at least 4 years of experience in product management or product ownership**, preferably within lending, banking or financial software.\n* You have a **strong understanding of lending products and mortgage processes in the Dutch market**.\n* You have **experience working directly with customers**, including presentations, product demonstrations or RFI/RFP processes.\n* You have **strong stakeholder management skills** and can effectively collaborate with customers, engineers and management.\n* You have **hands-on analytical skills** and are comfor", "source": "indeed"}, {"company": "DLL Group", "job_title": "Head of Digital Product - EU", "location": "Eindhoven, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Dll-Group", "job_url": "https://nl.indeed.com/viewjob?jk=6da50a799ccae231", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-19", "recruiter_email": null, "applicant_count": null, "description": "**Europe Head of Digital Product**\n\nAs a **EU Head of Digital Product** , you will lead the digital product vision and execution across our European business, transforming how partners, dealers, and customers connect with our financial solutions. Leading a cross-functional team of product managers, design specialists, and digital analysts, you will turn strategic opportunities into seamless, market-leading experiences that support sustainable asset finance.\n\n**Your Mission**\n\n* Lead (Executing): Set and execute the end-to-end digital product strategy for the Europe market, translating commercial priorities into an impactful multi-year roadmap.\n* Lead & Mentor (Executing): Directly lead, inspire, and develop a diverse team of 9 digital professionals spanning product management, user experience, channel operations, and digital analytics.\n* Drive (Executing): Oversee full customer and partner lifecycle products, maximizing conversion rates, self-service efficiency, and post-booking digital services.\n* Champion (Influencing): Drive circular economy and sustainable finance capabilities within our digital touchpoints to advance DLL’s commitment to sustainable business.\n* Partner (Influencing): Steer digital product alignment and tailored digital integrations for strategic business partnerships and joint venture programs (including AGCO Finance and Polaris).\n* Collaborate (Influencing & Participating): align global standards with local customer engagement needs.\n* Optimize (Executing): Steer user experience (UI/UX) standards and leverage digital insight analytics to continuously validate hypotheses, measure user satisfaction, and elevate digital performance.\n* Align (Influencing & Participating): Partner closely with commercial leaders, enterprise technology teams, and global product communities to ensure cohesive delivery and seamless integration.\n\n**Skills and capabilities required**\n\n* Digital Product Leadership: 10+ years of progressive experience leading digital product management, product strategy, or digital transformation teams.\n* People Leadership: Proven track record of managing, coaching, and developing multidisciplinary teams across product, design, and analytics.\n* Lifecycle & Funnel Optimization: Practical experience defining and optimizing customer journeys, from acquisition and onboarding through post-origination servicing.\n* Strategic Stakeholder Engagement: Demonstrated ability to influence executive stakeholders, commercial leaders, and key external corporate partners.\n* Platform & Ecosystem Integration: Experience integrating enterprise platforms (such as CRM and core servicing systems) and scaling joint-venture or partner-specific solutions.\n* Data-Informed Decision Making: Strong comfort using quantitative analytics and qualitative customer feedback to guide backlog prioritization and measure business outcomes.\n* Collaborative & Agile Mindset: An inclusive, adaptable approach to navigating complex matrix organizations and bridging ", "source": "indeed"}, {"company": "stichd", "job_title": "Product Creation Process Manager", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Stichd", "job_url": "https://nl.indeed.com/viewjob?jk=5ce48a22d108b6e5", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-16", "recruiter_email": null, "applicant_count": null, "description": "**The Job**\n\nAs Product Creation Process Manager, you own the seasonal Rolling Program and critical path across all STICHD brands, product categories and regions. You connect the internal teams involved in product creation, ensure clear milestones and accountability, and continuously improve the processes, systems and ways of working that take our products from concept to market.\n  \n  \nYou possess in-depth knowledge of operational processes, think cross-functionally, and proactively seek ways to improve and innovate the Rolling Program and the way we work.\n\n**Your Mission**\n\n* Set up seasonal Rolling Programs for all brands, product categories, and regions.\n\n* Align cross-functionally between international teams and departments involved in the creation and execution of the Rolling Program.\n\n* Monitor progress and ensure stakeholders deliver on their responsibilities to meet critical milestones.\n\n* Continuously assess and improve the Rolling Program and related ways of working.\n\n* Identify and implement improvements in processes, structures, and systems related to product design, development, marketing, and sourcing.\n\n* Collaborate with departments such as Operations and Sales to support product creation and reduce lead time, cost, and effort.\n\n* Support the department with additional relevant activities and projects as needed.\n\n**Your Talent**\n\n* You hold a Bachelor’s degree in Business Administration, Supply Chain, or a related field;\n\n* Experience in process coordination, project management, or operations within a sports-lifestyle industry or international organization with global brands;\n\n* Strong understanding of cross-functional workflows and critical path management;\n\n* Excellent command of English, both written and spoken;\n\n* Proficiency in MS Office (especially Excel and PowerPoint);\n\n* Experience with project management tools is an advantage.\n\nThis role is based in Den Bosch, the Netherlands. Working remotely from other countries is not possible.\n\n  \n  \n\nTo apply for this role, you must already have the legal right to work in the Netherlands. We will not apply for work or residence permits.\n\n  \n\n**We Offer**\n\n* Our salaries are based on 38 hours per week, but fulltime work is 40 hours per week. Instead, you choose between a lot of holidays; 40 per year ór choose for a 40-hour salary per month with still 27 holidays. You can switch every six months;\n\n* Annual bonus scheme;\n\n* New hires (introduction) days;\n\n* Great offer of e-learnings and a training offer for personal development;\n\n* Enough free fruit for you daily vitamins;\n\n* Provided lunch at a low cost;\n\n* Choose between lease-bike, NS Business Card or travel by car for € 0,25 per km (>10km).\n\n* 8% holiday allowance, employee insurances and a good pension scheme;\n\n* Employee discount on the PUMA, Levi’s, Fuelforfans and BMW Lifestyle websites;\n\n* Hybrid working. On fulltime basis 3 days in the office and 2 days at home (incl. allowance for home working);\n\n* Flexible working hours, mo", "source": "indeed"}, {"company": "FitForMe", "job_title": "Product Specialist - NL", "location": "Rotterdam, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Fitforme", "job_url": "https://nl.indeed.com/viewjob?jk=453ff86fd1f29e2a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "**Product Specialist Netherlands & UK**\n\n***Every clinic that refers to us means more patients get the right support after surgery. Your job is to win those clinics, and keep them.***\n\nAt FitForMe we help improve the lives of people living with obesity, with science-based supplements and lifelong support after bariatric surgery. We started in the Netherlands, and Dutch clinics know us well. In the UK, clinics have started referring patients to us on their own initiative. Now we need someone to build on both.\n\nAs Product Specialist you look after a portfolio of Dutch clinics and grow our relationships with UK clinics remotely. Your customers are surgeons, dietitians, coordinators and psychologists. The work is about earning their trust and turning it into referrals you can see in the numbers.\n\n**Why this role**\n\n* **Work that matters.** Every clinic that refers to us means more patients get the right support after surgery.\n* **Commercial, without the hard sell.** You’re judged on relevance and credibility, not on pushing a product.\n* **A strong start in the Netherlands.** FitForMe was founded here, so you open doors from a position of credibility.\n* **Something to build in the UK.** Some of it is new, and you get to shape it.\n* **Your week, your plan.** Field-based in the Netherlands, remote for the UK, and you decide how to spend your time.\n\n**What to expect: the honest version**\n\nGood relationships matter, but they aren’t the goal in themselves. The goal is consistent referral behaviour, and it can take months before your work shows up in the data. You’ll combine planned field work with reactive follow-up, and some of your most important conversations will happen through a screen. If you need quick wins to stay motivated, this probably isn’t the right fit.\n\n**Your day-to-day**\n\n* Own a portfolio of Dutch clinics and build relationships with surgeons, dietitians and coordinators that lead to consistent referrals.\n* Develop UK clinics that already refer to us, starting with the largest, and engage each one beyond a single contact.\n* Follow up when a clinic starts referring patients and help it grow.\n* Support a senior colleague on our most important Dutch account: logistics, quick responses and following up agreed actions.\n* Keep the CRM accurate. Use referral data per clinic to decide *where* to spend your time, and treatment pathway insights to decide *how*.\n\n**What you bring**\n\n* **Experience:** at least 3 years in life sciences or healthcare, a large part of it working directly with healthcare professionals. That could be pharma, medical devices or medical nutrition, or bariatric care itself, for example as a dietitian, nurse specialist or physician assistant. Sales experience isn’t required.\n* **Location:** Ideally based in the Utrecht region or elsewhere in the central or eastern Netherlands.\n* **Level:** you work and think at HBO/WO level and can hold your own in conversations with clinicians at a near-academic level.\n* **Languages:** fluen", "source": "indeed"}, {"company": "Blackhawk Network (BHN) Europe", "job_title": "Sr. Product Manager", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://uk.linkedin.com/company/bhneurope", "job_url": "https://www.linkedin.com/jobs/view/4466394807", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-24", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Blackhawk Network (BHN) Europe", "job_title": "Senior Product Manager", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://uk.linkedin.com/company/bhneurope", "job_url": "https://www.linkedin.com/jobs/view/4493642091", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-23", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Rituals (B Corp™)", "job_title": "Pro  als de perceptie niet altijd terecht is, kan die wel invloed hebben op de keuze voor Marmoleum.\n\n  \n\nIn deze opdracht kijk je daarom naar twee dingen: wat er in de praktijk beter kan en welke aannames of beelden er zijn rond het installeren van Marmoleum. Daarna onderzoek je hoe we het werk eenvoudiger, minder foutgevoelig of toegankelijker kunnen maken en welke tools we daarvoor kunnen ontwikkelen.\n\n  \n\n**Doel van de opdracht**\n\nHet doel is om de belangrijkste knelpunten bij het installeren van Marmoleum in beeld te brengen en deze te vertalen naar praktische oplossingen voor installateurs.\n\n  \n\nDe focus ligt op hulpmiddelen, tools, digitale ondersteuning of verbeteringen in het proces.\n\n  \n\nBelangrijk: het gaat niet om het aanpassen van Marmoleum zelf. De opdracht draait om alles eromheen: wat kan installateurs helpen om het product makkelijker en beter", "source": "indeed"}, {"company": "Ridder Growing Solutions", "job_title": "Productmanager Water", "location": "Maasdijk, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ridder-Growing-Solutions", "job_url": "https://nl.indeed.com/viewjob?jk=431c8c281a373a16", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "Bepaal de toekomst van de wateroplossingen van Ridder.\n\n  \n\n**Productmanager Water**\n------------------------\n\nWater is essentieel voor de glastuinbouw. Tegelijkertijd worden de eisen op het gebied van efficiënt gebruik, kwaliteit en hergebruik steeds hoger. Als (Senior) Productmanager Water bepaal jij hoe onze oplossingen zich ontwikkelen om daarop in te spelen.\n\n  \n\nVanuit Maasdijk, waar onze watersystemen worden ontwikkeld en geproduceerd, vertaal je klantbehoeften, marktontwikkelingen en technologie naar een heldere productstrategie en roadmap. Daarmee krijg je directe invloed op zowel de ontwikkeling als de internationale positionering van onze Water-portfolio.\n\n### * ondersteunen van een betekenisvolle bedrijfsmissie.\n\n **Vacatureomschrijving**\n\n***Met eigenaarschap en initiatief is er altijd een weg.***\n\nWil jij bepalen hoe onze grootzakelijke klanten hun energiezaken digitaal regelen? Als Product Owner Mijn Vattenfall Zakelijk vertaal je klantbehoeften en bedrijfsdoelstellingen naar digitale oplossingen die onze dienstverlening toegankelijker, slimmer en eenvoudiger maken.\n\n**Over de rol**\n\nMijn Vattenfall Zakelijk is de digitale omgeving voor onze grootzakelijke klanten. Zij krijgen hier inzicht in hun energieverbruik en contractgegevens en kunnen zelf contractzaken regelen, zoals het aanpassen of verlengen van een contract. Ook ontwikkelen we online verkoopmogelijkheden en API’s waarmee klanten gegevens kunnen uitwisselen met hun eigen systemen.\n\nAls Product Owner ben je verantwoordelijk voor de verdere ontwikkeling van deze digitale omgeving. Je werkt nauw samen met developers, testers, UX-specialisten, andere Product Owners en collega’s uit onder meer product- en procesmanagement. Samen bepalen jullie wat wordt ontwikkeld, waarom dit belangrijk is en in welke volgorde het wordt gerealiseerd.\n\nJe maakt deel uit van het Digital Expert Team binnen de zakelijke markt en rapporteert aan de Manager Digital Expert Team. In deze rol combineer je klantgericht denken met commerciële kansen en technische uitvoerbaarheid. Daarmee help je zakelijke klanten hun energiezaken steeds makkelijker en zelfstandiger te organiseren.\n\n**Jouw taken en verantwoordelijkheden**\n\n* Je ontwikkelt en communiceert een heldere productvisie en vertaalt deze naar een roadmap en geprioriteerde backlog.\n* Je houdt overzicht over de roadmap en lopende sprints en duikt waar nodig in de inhoudelijke details.\n* Je beoordeelt nieuwe verzoeken, bewaakt de focus van het team en maakt duidelijke keuzes over prioriteiten.\n* Je geeft vorm aan de inzet van AI binnen het product en in de manier waarop het team analyseert, ontwikkelt en test.\n* Je versterkt samen met het team de agile manier van werken, zowel binnen het team als in de samenwerking met andere afdelingen.\n* Je werkt dagelijks samen met developers, testers, UX-specialisten, stakeholders en andere Product Owners aan de voorbereiding en implementatie van epics, features en user stories.\n* Je brengt wensen en requirements vanuit de org", "source": "indeed"}, {"company": "Oneway", "job_title": "Product Owner NetSuite", "location": "Rotterdam, Netherlands", "careers_url": "https://www.glassdoor.nl/Overview/W-EI_IE8726043.htm", "job_url": "https://www.glassdoor.nl/job-listing/j?jl=1010329861664", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-19", "recruiter_email": null, "applicant_count": null, "description": "", "source": "glassdoor"}, {"company": "LYNX Beleggen", "job_title": "Product Manager Trading Experience", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/lynx", "job_url": "https://www.linkedin.com/jobs/view/4492035723", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-18", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Renesas Electronics", "job_title": "Product Manager, Multiprotocol MCU for industrial and IoT (f/m/d)", "location": "’s-Hertogenbosch, North Brabant, Netherlands", "careers_url": "https://jp.linkedin.com/company/renesas", "job_url": "https://www.linkedin.com/jobs/view/4490432045", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Rentman", "job_title": "Senior Product Manager Transport (Equipment)", "location": "Utrecht, Netherlands", "careers_url": "https://nl.linkedin.com/company/rentman", "job_url": "https://www.linkedin.com/jobs/view/4472732844", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-16", "recru gen we samen met jou als Business Analyst binnen een relatief klein team, dat we veel voor elkaar krijgen en ondersteunen we onze collega’s binnen Defensie bij het bouwen van slimme, veilige en duurzame data gedreven oplossingen.  \n  \nJe belangrijkste verantwoordelijkheden zijn onder andere:\n\n* Eerste contactpunt: Via e-mail, tickets en wellicht telefoon ben jij vaak het eerste contact met ons team.\n* Onboarding en playbook: Wij werken via self-service. Dit betekent de juiste kennis beschikbaar maken voor onze gebruikers zodat zij zoveel mogelijk zelf kunnen. Een kennisbank opzetten en e-learning opzetten.\n* Feedback: Wij willen ons continue verbeteren. Dit kan alleen als we feedback vragen en ook krijgen. Dit help je mee opzetten.\n* Community builder: Organiseren van workshops, voorlichting, presentati", "source": "indeed"}, {"company": "Ministerie van Defensie", "job_title": "Sr. Product specialist Inlichtingen & Veiligheid (I&V)", "location": "Utrecht, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ministerie-Van-Defensie", "job_url": "https://nl.indeed.com/viewjob?jk=b36b815f9552e2f6", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-04", "recruiter_email": null, "applicant_count": null, "description": "**Vacature kenmerken**\n----------------------\n\nStandplaats\n\nUtrecht\n\n  \n\nContractduur\n\nTijdelijke aanstelling met uitzicht op vast.\n\n  \n\nUren per week\n\n- 38\n\n  \n\nMaandsalaris\n\n€5.184,00 - €7.114,00\n\n  \n\nSalarisniveau\n\nBurgerschaal IBBAD 11 - Burgerschaal IBBAD 11\n\n  \n\nNiveau\n\nHBO Bachelor\n\n  \n\nVakgebied\n\nICT\n\n  \n\nVacaturenummer\n\n82684\n\n  \n\nDienstverband\n\nTijdelijke aanstelling met zicht op vaste aanstelling\n\n  \n\nFunctiegroep\n\nBurger\n\n**Dit ga je doen**\n------------------\n\nWil jij een cruciale bijdrage leveren aan de continuïteit en doorontwikkeling van essentiële IT-producten? Als Senior Product Specialist bij I&V ben jij verantwoordelijk voor de dagelijkse operatie, van lifecycle- en problemmanagement tot de instandhouding en vernieuwing van producten. Je verbindt strategie met uitvoering en zorgt ervoor dat vastgestelde kaders effectief worden vertaald naar de praktijk.\n\nWerken bij het ministerie Defensie, maar niet als militair?  \nAls je kiest voor een baan bij Defensie, dan kies je voor maatschappelijk relevant werk. Je draagt echt iets bij aan een veilig Nederland. Naast 42.000 beroepsmilitairen en 7.000 reservisten werken er ook nog zo’n 24.000 burgers bij Defensie. Je gaat werken bij het Commando Materieel en IT (COMMIT). COMMIT zet zich in om collega’s in binnen- en buitenland zo goed mogelijk te ondersteunen: met het beste materieel, de beste voorraden en de beste ICT. Zo kunnen zij hun taken zo effectief en doelmatig mogelijk blijven uitvoeren.\n\nAls Sr. Product Specialist bij de afdeling COC2 & I&V werk je in een complexe technische ICT-architectuur. Samen met het beheerteam zorg je dat de IT-omgevingen stabiel, veilig en beheersbaar blijven. Beheer, automatiseren en verbeteren van infrastructuur en IT-middelen vormen hierbij de kern. Verslaglegging, documenteren en rapporteren zijn voor jou vanzelfsprekend.  \nJe vormt de brug tussen mens en techniek. Je coördineert technische aanpassingen, zorgt dat systeem gerelateerde problemen door beheerders worden opgelost en je stuurt het team inhoudelijk aan. Om verstoringen te minimaliseren plan je je werkzaamheden zorgvuldig en bewaak je procedures, acceptatiecriteria en normenkaders om integriteit en veiligheid van de systemen te borgen.  \nBinnen COC2 & I&V zoeken wij een Sr. Product Specialist die verantwoordelijkheid neemt voor de dagelijkse operatie, lifecyclemanagement en problem management binnen het I&V-domein.  \n  \nIn deze rol:\n\n* Coördineer je de implementatie van omgevingen, inclusief inrichting, beheerborging en acceptatie van projectoverdrachten;\n* Analyseer je complexe (bouwsteen-overstijgende) wijzigingsverzoeken en NSA’s op impact, haalbaarheid en beheerbaarheid;\n* Geef je richtlijnen aan beheerders, stel je prioriteiten en borg je samenhang en volgordelijkheid tussen changes en bouwstenen;\n* Coördineer en borg je de uitvoering van RFC’s, releases en lifecyclemanagement volgens de release- en beheerkalender, inclusief handhaving van acceptatiecriteria en normenkaders;\n* Stuur je", "source": "indeed"}, {"company": "Vinted", "job_title": "Product Manager, Marketplace", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://lt.linkedin.com/company/vinted", "job_url": "https://www.linkedin.com/jobs/view/4493682335", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-23", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "ClickHouse", "job_title": "Langfuse - Product Manager", "location": "Amsterdam Area", "careers_url": "https://www.linkedin.com/company/clickhouseinc", "job_url": "https://www.linkedin.com/jobs/view/4487996845", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "InSpace", "job_title": "Product Domain Lead / Product Owner — AI Platform", "location": "Eindhoven, Netherlands", "careers_url": "https://www.glassdoor.nl/Overview/W-EI_IE6458562.htm", "job_url": "https://www.glassdoor.nl/job-listing/j?jl=1010336731585", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-27", "recruiter_email": null, "applicant_count": null, "description": "", "source": "glassdoor"}, {"company": "TÜV NORD GROUP", "job_title": "Internationaal Product Manager ISMS", "location": "Son en Breugel, Netherlands", "careers_url": "https://www.glassdoor.nl/Overview/W-EI_IE529675.htm", "job_url": "https://www.glassdoor.nl/job-listing/j?jl=1010324697781", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-13", "recruiter_email": null, "applicant_co  and accountability, to achieve our goals. You will join a passionate sales organization working closely with Medical and Market Access colleagues to make a real difference for patients living with dermatological diseases.\n\n  \n\n**Your role**\n\n  \n\nAs **Product Specialist Dermatology,** you are responsible for driving sustainable sales growth in your assigned territory by developing strong, trust-based relationships with dermatologists. You act as a trusted partner, combining strong business acumen with deep product and disease knowledge, always keeping the patient at the center of everything you do.\n\n  \n\n*Your primary tasks will include:*\n\n  \n\n* Building and managing long-term partnerships with dermatologists in your territory\n* Executing the national sales strategy and achieving agreed sales targets\n* Developing and implementing territory business plans and account strategies\n* Collecting and sharing market and customer insights to support cross functional decision-making\n* Planning, documenting, and reporting activities accurately in CRM and related systems\n\n  \n\nPlease take in account that this is a field position, you will be expected to visit professionnals at their office.\n\n  \n\n*The role offers:*\n\n  \n\n* A high-impact commercial role in a leading dermatology-focused pharmaceutical company\n* Continuous scientific and professional development in a fast-evolving therapy area\n* The opportunity to shape your territory and make a visible impact on patient outcomes\n* An open, dynamic work culture where your initiatives and ideas are valued\n* international environment, training programs, flexibility, and genuine career de", "source": "indeed"}, {"company": "stichd", "job_title": "Creative Director Product", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Stichd", "job_url": "https://nl.indeed.com/viewjob?jk=d7313c6ed349a4d5", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-09", "recruiter_email": null, "applicant_count": null, "description": "**The Job**\n\nWe are looking for a Creative Director Product to lead and shape the future of our product categories across some of the most relevant global A-brands in sport and fashion.\n  \nAs a trusted long-term licensing partner, we have built global brand collaborations over decades — translating brand DNA into commercially successful, consumer-relevant products at scale. This role sits at the heart of that model: connecting brand vision, creative direction, and exceptional product execution.\n  \nYou will define a clear product vision, inspire your team, and translate global brand strategies into standout category concepts — from technically advanced first-layer products (socks, bodywear & underwear) to high-impact fanwear collections linked to the world’s leading teams and assets.\n\n**Your Mission**\n\n* Define and drive a creative product strategy and long-term vision across all categories;\n* Translate brand and company strategy into compelling product concepts and seasonal roadmaps;\n* Bring brand DNA and storytelling to life through commercially relevant product design;\n* Lead the development of technically strong, best-in-class first-layer products;\n* Drive product execution at scale, delivering high-volume, commercially successful assortments;\n* Ensure products deliver on best price–value ratio, balancing design, quality and cost;\n* Anticipate and translate consumer needs and trends into relevant assortments;\n* Ensure we are present where the consumer shops, delivering the right product for the right channel;\n\nFanwear (integrated scope):\n  \n\n* Lead the creation of fanwear collections for top-tier teams, translating partnerships into commercially successful products;\n* Operate within a triangle partnership model (brand – team – stichd) to ensure strong alignment and execution;\n* Drive fast, responsive product execution around key moments, turning speed into a differentiat function getSector(company) {

  return 'Other';
}

function scoreJob(j) {
  const title = (j.job_title || '').toLowerCase();
  const company = (j.company || '').toLowerCase();
  const sector = getSector(j.company);
  const desc = (j.description || '').toLowerCase().slice(0, 800);
  let score = 0;

  // Role type (0–50)
  const ROLES = [
    [50, ['technical product manager','product manager','productmanager','product management']],
    [48, ['associate product manager','apm']],
    [44, ['product owner','product lead','product builder']],
    [42, ['product operations','product ops','product strategy','product strategist','growth product','growth manager','growth lead']],
    [38, ['product analyst','go-to-market','gtm']],
    [36, ['technical program manager','program manager','programme manager','tpm']],
    [32, ['business analyst','product specialist']],
    [20, ['forward deployed']],
    [25, ['head of product','director of product','vp of product']],
  ];
  for (const [pts, kws] of ROLES) {
    if (kws.some(k => title.includes(k))) { score += pts; break; }
  }
  if (score === 0) score += 15;

  // Sector fit (0–30)
  score += ({ Tech:30, Industrial:22, Energy:22, Finance:20, FMCG:14, Consulting:12, Other:12 })[sector] || 12;

  // Company bonus (0–20)
  const CO = [
    [20, ['adyen','booking','uber','databricks','prosus','backbase','catawiki','tomtom','mollie','bol.com','just eat','coolblue','exact']],
    [16, ['asml','nxp','signify','philips','wolters kluwer','vanderlande','tno']],
    [14, ['shell','eneco','vattenfall','tennet','alliander','stedin','orsted','ørsted','sbm offshore','neste','fugro']],
    [12, ['ing ','rabobank','abn amro','nn group','aegon','van lanschot']],
    [10, ['unilever','heineken','akzonobel','dsm','firmenich','ahold','frieslandcampina']],
    [6,  ['bcg','bain','mckinsey','oliver wyman','kearney','strategy&','roland berger','ey-parthenon','deloitte','accenture']],
  ];
  for (const [pts, kws] of CO) {
    if (kws.some(k => company.includes(k))) { score += pts; break; }
  }

  // Keyword signals in title/desc (+0–10)
  let bonus = 0;
  for (const [kw, pts] of [['product',3],['platform',2],['data',2],['growth',2],['energy',2],
      ['roadmap',2],['b2b',1],['saas',1],['analytics',1],['strategy',1]]) {
    if (title.includes(kw)) bonus += pts;
    else if (desc.includes(kw)) bonus += Math.round(pts / 2);
  }
  score += Math.min(10, bonus);
  score = Math.min(100, score);
  // She has no full-time PM job yet, so seniority in the title bounds the fit.
  if (/\b(vp|vice president|head of|director|chief|cpo)\b/i.test(title)) return Math.min(score, 25);
  if (/\b(principal|group|staff|lead)\b/i.test(title)) return Math.min(score, 40);
  if (/\b(senior|sr\.?|expert)\b/i.test(title)) return Math.min(score, 60);
  if (/\b(associate|junior|jr\.?|new grad|graduate|entry|apm)\b/i.test(title)) return Math.min(100, score + 10);
  return Math.min(score, 85);
}

// v2: stores {s, r} objects — bump key if schema changes again
const AI_SCORES_KEY = 'vanshika_ai_scores_v3';
function getAiScores() { try { return JSON.parse(localStorage.getItem(AI_SCORES_KEY) || '{}'); } catch { return {}; } }
function saveAiScores(obj) { try { localStorage.setItem(AI_SCORES_KEY, JSON.stringify(obj)); } catch {} }

function getEffectiveScore(j) {
  // Priority: localStorage (user-triggered) > j.ai_score (server-side) > JS rules
  const entry = getAiScores()[jobKey(j)];
  if (entry) return { score: entry.s, reason: entry.r || '', ai: true };
  if (j.ai_score !== undefined) return { score: j.ai_score, reason: '', ai: true };
  return { score: scoreJob(j), reason: '', ai: false };
}

function matchBadgeHtml(score, isAi, reason) {
  let cls;
  if (score >= 85) cls = 'ex';
  else if (score >= 70) cls = 'str';
  else if (score >= 55) cls = 'gd';
  else if (score >= 40) cls = 'ok';
  else cls = 'low';
  const sup    = isAi ? '<sup style="font-size:8px;margin-left:1px">AI</sup>' : '';
  const tipTxt = isAi && reason ? reason : (isAi ? 'AI-scored by Claude' : 'Keyword match score');
  return `<span class="match-badge match-${cls}" title="${esc(tipTxt)}">${score}%${sup}</span>`;
}

// ── AI batch scoring ──────────────────────────────────────────────────────────
async function aiScoreAll() {
  let apiKey = localStorage.getItem('vanshika_claude_api_key');
  if (!apiKey) {
    const k = prompt('Enter your Claude API key (sk-ant-…) to enable AI scoring:');
    if (!k || !k.trim()) return;
    apiKey = k.trim();
    localStorage.setItem('vanshika_claude_api_key', apiKey);
  }
  const btn = document.getElementById('ai-score-btn');
  btn.disabled = true; btn.textContent = '⏳ Scoring…';

  const aiScores = getAiScores();
  const unscored = JOBS_DATA.filter(j => !aiScores[jobKey(j)]);
  if (!unscored.length) {
    btn.disabled = false; btn.textContent = '✨ Re-score with AI';
    applyFilters(); return;
  }

  const BATCH = 8;   // smaller batches — full descriptions fit comfortably
  let done = 0;
  try {
    for (let i = 0; i < unscored.length; i += BATCH) {
      const batch = unscored.slice(i, i + BATCH);

      const jobLines = batch.map((j, idx) => {
        const sector  = getSector(j.company);
        const desc    = (j.description || '').trim().slice(0, 1200);
        const descTxt = desc ? `\n   Description: ${desc}` : '';
        return `${idx}. Company: ${j.company} | Role: ${j.job_title} | Location: ${j.location || 'Netherlands'} | Sector: ${sector}${descTxt}`;
      }).join('\n\n');

      const userMsg = `Score these ${batch.length} roles for Vanshika. Reply ONLY with a JSON array — no other text:\n[{"i":0,"s":88,"r":"one sentence why"}, ...]\n\nRoles:\n${jobLines}`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-beta': 'prompt-caching-2024-07-31',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 600,
          system: [{
            type: 'text',
            text: AI_SYSTEM_PROMPT,
            cache_control: { type: 'ephemeral' },
          }],
          messages: [{ role: 'user', content: userMsg }],
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'API ' + res.status);
      }
      const data = await res.json();
      const text = data.content?.[0]?.text || '[]';
      const match = text.match(/\[[\s\S]*\]/);
      if (match) {
        const parsed = JSON.parse(match[0]);
        for (const {i, s, r} of parsed) {
          if (batch[i]) {
            aiScores[jobKey(batch[i])] = {
              s: Math.min(100, Math.max(0, Math.round(s))),
              r: (r || '').slice(0, 120),
            };
          }
        }
      }
      done += batch.length;
      btn.textContent = `⏳ ${done}/${unscored.length}…`;
      saveAiScores(aiScores);
    }
    btn.textContent = '✅ AI Scored!';
  } catch(e) {
    btn.textContent = '⚠ Error — Retry?';
    console.error('AI scoring error:', e);
  } finally {
    btn.disabled = false;
    applyFilters();
    setTimeout(() => { if (btn.textContent !== '⚠ Error — Retry?') btn.textContent = '✨ Re-score with AI'; }, 3000);
  }
}

// ── Job utils ─────────────────────────────────────────────────────────────────
function jobKey(j) { return j.job_url || (j.company + '|' + j.job_title); }

const LS_KEY = 'vanshika_job_statuses';
let statuses = {};
try { statuses = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch {}

function setStatus(key, val) {
  if (val) statuses[key] = val;
  else delete statuses[key];
  localStorage.setItem(LS_KEY, JSON.stringify(statuses));
  applyFilters();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(raw) {
  if (!raw) return null;
  try {
    const d = new Date(raw);
    if (isNaN(d)) return null;
    const diff = Math.round((Date.now() - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff <= 6) return diff + 'd ago';
    if (diff <= 30) return Math.round(diff/7) + 'w ago';
    return d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
  } catch { return null; }
}

function statusLabel(s) {
  return {applied:'✅ Applied', interview:'🎯 Interview', offer:'🎉 Offer',
    rejected:'❌ Rejected', bookmarked:'🔖 Bookmarked'}[s] || '';
}

// ── Filters + sort ────────────────────────────────────────────────────────────
function applyFilters() {
  const search  = document.getElementById('search').value.toLowerCase();
  const sector  = document.getElementById('sector-filter').value;
  const statusF = document.getElementById('status-filter').value;
  const sourceF    = document.getElementById('source-filter').value;
  const sortBy     = document.getElementById('sort-by').value;
  const maxDays    = parseInt(document.getElementById('date-filter').value) || 0;
  const maxApplied = parseInt(document.getElementById('applicant-filter').value) || 0;
  const now        = Date.now();

  let filtered = JOBS_DATA.filter(j => {
    const key = jobKey(j);
    const jobStatus = statuses[key] || '';
    if (statusF === 'unreviewed' && jobStatus) return false;
    if (statusF && statusF !== 'unreviewed' && jobStatus !== statusF) return false;
    if (sector && getSector(j.company) !== sector) return false;
    if (sourceF && (j.source || 'crawler') !== sourceF) return false;
    if (maxDays && j.date_posted) {
      const d = new Date(j.date_posted);
      if (!isNaN(d) && (now - d.getTime()) > maxDays * 86400000) return false;
    }
    if (maxApplied) {
      const count = j.applicant_count;
      if (count == null || count >= maxApplied) return false;
    }
    if (search) {
      const hay = (j.company + ' ' + j.job_title + ' ' + (j.location||'') + ' ' + (j.notes||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  // Sort
  if (sortBy === 'score') {
    filtered.sort((a, b) => getEffectiveScore(b).score - getEffectiveScore(a).score);
  } else if (sortBy === 'date') {
    filtered.sort((a, b) => {
      const da = a.date_posted ? new Date(a.date_posted).getTime() : 0;
      const db = b.date_posted ? new Date(b.date_posted).getTime() : 0;
      return db - da;
    });
  } else if (sortBy === 'company') {
    filtered.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
  }

  renderJobs(filtered);
  updateStats();
}

function renderJobs(list) {
  const container = document.getElementById('list-container');
  const noRes = document.getElementById('no-results');
  if (!list.length) {
    container.innerHTML = '';
    noRes.style.display = 'block';
    document.getElementById('shown-count').textContent = '0';
    return;
  }
  noRes.style.display = 'none';
  document.getElementById('shown-count').textContent = list.length;

  container.innerHTML = list.map(j => {
    const key = jobKey(j);
    const status = statuses[key] || '';
    const sector = getSector(j.company);
    const dateStr = formatDate(j.date_posted);
    const notes = (j.notes || '').replace(/\[Direct link.*?\]/g,'').trim();
    const src = j.source || 'crawler';
    const srcLabel = {linkedin:'LinkedIn', indeed:'Indeed', glassdoor:'Glassdoor', crawler:'Portal'}[src] || src;
    const { score, reason, ai } = getEffectiveScore(j);
    const applicants = j.applicant_count != null
      ? `<span style="color:${j.applicant_count < 10 ? 'var(--green)' : j.applicant_count < 25 ? 'var(--yellow)' : 'var(--text-muted)'}">${j.applicant_count} applicants</span>`
      : '';
    // Recruiter: show email if known, else show "Find" search link for LinkedIn/Indeed jobs
    const recruiterHtml = j.recruiter_email
      ? `<a class="job-link secondary" href="mailto:${esc(j.recruiter_email)}" title="Email recruiter">${esc(j.recruiter_email.split('@')[0])}</a>`
      : (src !== 'crawler'
          ? `<a class="job-link secondary" href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent((j.company||'') + ' recruiter netherlands')}" target="_blank" rel="noopener" title="Find recruiter on LinkedIn">Find Recruiter</a>`
          : '');
    return `<div class="job-card status-${status || 'none'}">
      <div class="job-card-main">
        <div class="job-top">
          <span class="job-company">${esc(j.company)}</span>
          <span class="job-sector">${esc(sector)}</span>
          <span class="source-badge ${esc(src)}">${esc(srcLabel)}</span>
          ${matchBadgeHtml(score, ai, reason)}
        </div>
        <div class="job-title">${esc(j.job_title)}</div>
        <div class="job-meta">
          ${j.location ? '<span>' + esc(j.location) + '</span>' : ''}
          ${dateStr ? '<span>' + esc(dateStr) + '</span>' : ''}
          ${applicants}
          ${status ? '<span style="color:var(--accent)">' + statusLabel(status) + '</span>' : ''}
        </div>
        ${notes ? '<div class="job-notes">' + esc(notes) + '</div>' : ''}
      </div>
      <div class="job-actions">
        <a class="job-link" href="${esc(j.job_url || j.careers_url)}" target="_blank" rel="noopener">Apply →</a>
        ${recruiterHtml}
        ${j.careers_url && j.job_url && !j.recruiter_email ? '<a class="job-link secondary" href="' + esc(j.careers_url) + '" target="_blank" rel="noopener">Careers</a>' : ''}
        <select class="status-select" data-key="${esc(key)}" onchange="handleStatusChange(this)" title="Track status">
          <option value="" ${!status?'selected':''}>Track…</option>
          <option value="bookmarked" ${status==='bookmarked'?'selected':''}>🔖 Bookmark</option>
          <option value="applied" ${status==='applied'?'selected':''}>✅ Applied</option>
          <option value="interview" ${status==='interview'?'selected':''}>🎯 Interview</option>
          <option value="offer" ${status==='offer'?'selected':''}>🎉 Offer</option>
          <option value="rejected" ${status==='rejected'?'selected':''}>❌ Rejected</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

function handleStatusChange(sel) {
  const key = sel.getAttribute('data-key');
  setStatus(key, sel.value);
}

function updateStats() {
  const counts = {bookmarked:0, applied:0, interview:0, offer:0, rejected:0};
  for (const v of Object.values(statuses)) if (counts[v] !== undefined) counts[v]++;
  document.getElementById('chip-bookmarked').textContent = counts.bookmarked + ' Bookmarked';
  document.getElementById('chip-applied').textContent = counts.applied + ' Applied';
  document.getElementById('chip-interview').textContent = counts.interview + ' Interview';
  document.getElementById('chip-offer').textContent = counts.offer + ' Offer';
  document.getElementById('chip-rejected').textContent = counts.rejected + ' Rejected';
  document.getElementById('total-count').textContent = JOBS_DATA.length;
  document.getElementById('total-badge').textContent = JOBS_DATA.length + ' roles';
}

applyFilters();
</script>
