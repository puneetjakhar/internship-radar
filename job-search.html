  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    header { background: var(--surface); border-bottom: 1px solid var(--border);

    header h1 { font-size: 18px; font-weight: 700;

    .controls { padding: 16px 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input[type="text"], select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 9px 13px; font-size: 14px; outline: none;
      transition: border-color 0.2s; }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    #search { flex: 1; min-width: 220px; font-size: 15px; }

    .stats-bar { padding: 10px 24px; display: flex; gap: 14px; align-items: center;
      font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .stats-bar strong { color: var(--text); }

    .stat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }

      background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); }

      align-items: flex-start; transition: border-color 0.2s; }

    .job-card.status-interview { border-left: 3px solid #60a5fa; }
    .job-card.status-offer { border-left: 3px solid var(--accent); }
    .job-card.status-rejected { border-left: 3px solid var(--red); opacity: 0.6; }
    .job-card.status-bookmarked { border-left: 3px solid var(--yellow); }

    .job-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
    .job-company { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .job-sector { font-size: 10px; color: var(--text-muted); background: var(--surface2);

    .job-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 90px; flex-shrink: 0; }
    .job-link { font-size: 12px; padding: 6px 12px; border-radius: 6px; background: var(--accent);

    #no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); display: none; }
    #no-results h3 { font-size: 18px; margin-bottom: 8px; }
  </style>

ority. Support teams with their own roadmaps and priorities to build on the shared foundations you provide. Measure what matters. Set clear metrics for adoption, speed and experience quality, and use them to decide where to invest and when to reset course. Work across disciplines. Partner closely with engineering and design within the team, and with product, design and engineering leads across Adyen. Go deep with your customers. Understand the engineers and designers who build on your foundations, and the merchants and shoppers who use what they build. &nbsp; Who you are Platform Product Experience. You've built products whose customers are other developers or teams, and you understand what that demands: clear contracts, careful change, and not breaking the people downstream of you. Design Sensib", "notes": "Dept: Product Management. Via Greenhouse board.", "source": "crawler"}, {"company": "Adyen N.V.", "job_title": "Senior Product Manager, AML", "location": "Amsterdam, Netherlands", "careers_url": "https://careers.adyen.com", "job_url": "https://job-boards.greenhouse.io/adyen/jobs/8281712", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-19", "recruiter_email": null, "description": "This is Adyen Adyen provides payments, data, and financial products in a single solution for customers like Meta, Uber, H&amp;M, and Microsoft - making us the financial technology platform of choice. At Adyen, everything we do is engineered for ambition.&nbsp; For our teams, we create an environment with opportunities for our people to succeed, backed by the culture and support to ensure they are enabled to truly own their careers. We are motivated individuals who tackle unique technical challenges at scale and solve them as a team. Together, we deliver innovative and ethical solutions that help businesses achieve their ambitions faster. The opportunity:&nbsp; We are seeking a Senior Product Manager to lead our Anti-Money Laundering (AML) detection product within Identity &amp; Risk Intelligence. Financial crime keeps getting more complex, and as Adyen expands into new products and markets, our detection needs to scale with it - without becoming a bottleneck for growth. This role needs a Product Manager who can take a clear strategy and drive it to execution, make strong trade-offs, and build trust with Compliance and other senior stakeholders. You need a track record of building ML-driven products in a regulated environment. You'll lead a team of Data Scientists, Data Analysts and Backend Engineers, and work closely with Compliance, Operations and other product teams. What you'll do: Risk Detection &amp; ML Modeling: Lead the build and scaling of Machine Learning models, rules and risk signals that detect financial crimes across Adyen's products, markets and customer base. Scalable, Self-Service Detection: Move financial crime detection toward a self-service framework that picks up new typologies quickly, using ML, GenAI and agentic approaches to reduce manual effort and keep pace with Adyen's growth without adding headcount. Strategy Execution &amp; Prioritization: Own the execution of the financial crime detection strategy. Prioritize ruthlessly, make data-driven trade-offs, and stop or descope work when the evidence shows it is not worth pursuing. Compliance &amp; Regulatory Partnership: Act as the main product partner for Compliance. Translate regulatory expectations into clear product boundaries, agree how the team delivers within them, and demonstrate continuous improvement to regulators. Performance &amp; Effectiveness: Define how detection quality and efficiency are measured in a domain where the ground truth is often unknown, and continuously improve signal quality for our Investigations team. Cross-Functional Leadership: Lead a team of Data Scientists, Data Analysts and Backend Engineers alongside your engineering lead, and keep Compliance, Operations, and other risk teams aligned on the roadmap. Who you are: ss coverage, equity, a 401(k) plan with employer match, 20 paid v", "recruiter_email": null, "notes": "Via Ashby API.", "source": "crawler"}, {"company": "Zorginstituut Nederland", "job_title": "Product Owner", "location": "Diemen, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Zorginstituut-Nederland", "job_url": "https://nl.indeed.com/viewjob?jk=d5601c7fba637eef", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "**Zorginstituut Nederland**\n\nVAN GOEDE ZORG VERZEKERD\n\n**Wij zoeken een Product Owner Geneesmiddeleninformatie**\n\nHet team Geneesmiddelen zoekt een nieuwe collega! Wil jij als Product Owner de regie voeren over de ontwikkeling en implementatie van een nieuw informatiemanagementsysteem? Ben jij sterk in prioriteren, pionieren en het verbinden van interne en externe stakeholders? En wil jij bijdragen aan goede, passende zorg in Nederland? Dan maken wij graag kennis met je.\n\n**Over het team**\n\nTeam Geneesmiddelen is een dynamisch team dat onder andere bestaat uit redacteuren, beoordelaars en adviseurs. Onze belangrijkste taken zijn het opstellen van adviezen aan de minister van Volksgezondheid, Welzijn en Sport (VWS) over de opname van geneesmiddelen in het verzekerde pakket. Maar ook het onderhouden van het Farmacotherapeutisch Kompas, een waardevolle bron van informatie voor iedere arts in Nederland. We werken samen aan concrete doelen in een spannend en snel ontwikkelend deel van het zorgveld. Wat ons werk zo leuk maakt? Onze adviezen hebben impact: niet alleen of een geneesmiddel wel of niet in het verzekerde pakket belandt, maar ook dat we randvoorwaarden kunnen stellen voor gepast gebruik. De sfeer in het team is informeel en open. Daarnaast maken we ruimte voor jouw ontwikkeling. Waar jij naartoe wil groeien, denken wij in mee. Dat is het streven.\n\n**Wat ga je doen?**\n\nAls Product Owner ben je verantwoordelijk voor de ontwikkeling, implementatie en verdere doorontwikkeling van een nieuw Informatiemanagementsysteem (IMS). Dit systeem ondersteunt het programma Toekomstbestendig Stelsel Geneesmiddelen (TSG), dat ervoor moet zorgen dat nieuwe geneesmiddelen zorgvuldig, efficiënt en risicogericht worden beoordeeld voor toelating tot het basispakket.\n\nHet eerste jaar staat vooral in het teken van pionieren, ontwikkelen en implementeren. Je bouwt samen met de leverancier, interne collega's en externe zorgpartijen aan een systeem dat nog volop in ontwikkeling is. Daarbij neem je de regie, verbind je verschillende belangen en bepaal je welke functionaliteiten prioriteit krijgen. Je werkt toe naar een eerste werkbare versie (MVP), waarbij je rekening houdt met wet- en regelgeving, gebruikersbehoeften en technische mogelijkheden.\n\nNa oplevering van de eerste werkbare versie (MVP) verschuift de focus naar het beheer en de verdere ontwikkeling van het IMS. Samen met interne collega’s en betrokken veldpartijen breng je in kaart hoe het systeem het geneesmiddelbeoordelingsproces steeds beter kan ondersteunen. Je vertaalt deze inzichten en gebruikersbehoeften naar een heldere productvisie, roadmap en concrete verbeteringen in de productbacklog. Daarbij houd je rekening met technologische ontwikkelingen en benut je waar mogelijk de mogelijkheden van open-sourcesoftware.\n\nJe belangrijkste werkzaamheden zijn:\n\n* Regie voeren op de ontwikkeling, implementatie en doorontwikkeling van het IMS.\n* Gebruikerswensen, wet- en regelgeving en procesbehoeften vertalen naa", "source": "indeed"}, {"company": "Talk360", "job_title": "Senior Product Manager", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Talk360-1", "job_url": "https://nl.indeed.com/viewjob?jk=428e9f208935507e", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-18", "recruiter_email": null, "applicant_count": null, "description": "**The challenge**  \nAn entrepreneur chasing an unpaid invoice in Lagos. A shop owner confirming a shipment in Guangzhou. A consultant navigating a bank's phone menu in London. For a growing share of Talk360's 6 million+ users, a call is how they get paid, keep a client or close a deal.\n\nThese business customers choose us because we're cheaper than carrier and roaming rates, reach mobile, landline and company numbers, need no contract, and use one balance for every country. Today we serve them with a consumer app. Tomorrow we want to be the obvious way small businesses call the world.\n\nWe're looking for a **Senior Product Manager** to own and scale the Calling for Work product proposition from 1 to 100. There's no mature roadmap to inherit: you'll write it, test it with customers and scale what works, with our Product & Tech team, to deliver a step change in segment growth.\n\n**What you’ll do**\n\n* **Own the product proposition:** Set the vision, strategy, roadmap and targets for Calling for Work, and be responsible for its user growth and retention.\n* **Shape the business proposition:** Define what Talk360's business offer is and how it's priced, together with our commercial teams.\n* **Learn from customers continuously:** Use interviews, surveys, support tickets and app store reviews to turn pains into a ranked opportunity roadmap.\n* **Experiment fast:** Ship small bets, A/B test the journeys that matter, observe real world behaviour and turn results into roadmap decisions.\n* **Lead delivery:** Work in an agile Product & Tech team; keep scope tight, priorities clear and releases flowing.\n* **AI-native execution:** Use AI across discovery, specs, analysis and prototyping, and help shape how the team builds with AI.\n* **Partner across the business:** Work with Revenue, Marketing, Support and Data on go-to-market, acquisition, retention and the metrics that show we're winning.\n\n**The Team**\n\nYou'll join a lean Product & Engineering team where product, design, mobile, web, backend, VoIP and QA work closely together. No silos, no layers: turn a customer insight on Monday into a live experiment by Friday.\n\n**What you’ll bring**\n\n* 5+ years in product management, including owning a product line or new proposition end to end.\n\n* A track record of scaling a product from early traction, with commercial results to show.\n* Hands-on experience with B2B, SMB or prosumer products; telecoms is a plus.\n* Strong discovery skills: customer interviews, research synthesis and jobs-to-be-done thinking.\n* Experimentation fluency: A/B testing, product analytics (Mixpanel or similar) and data analysis and data-driven decision making.\n* Experience optimising MAU, ARPU, LTV, retention and conversion, with the business acumen to make strategic and tactical calls.\n* Experience leading agile, cross-functional mobile product teams, with the technical depth to discuss trade-offs with engineers.\n* **Active, daily use of AI** across your product workflow: research, analysis, specs ", "source": "indeed"}, {"company": "Rabobank", "job_title": "Lead Product Manager | WR Innovation", "location": "Utrecht, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Rabobank", "job_url": "https://nl.indeed.com/viewjob?jk=387e8ae66ce92738", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "**This is what we offer you**\n-----------------------------\n\n* **Salary:** Gross monthly salary between EUR 5,994 and EUR 8,563 (scale 10) for a 36-hour work week.\n* **Extras:** a thirteenth month, 8% holiday allowance, and a 10% Employee Benefit Budget.\n* **Development budget:** EUR 1,400 development budget per year for your growth and development.\n* **Hybrid working:** a balance between home and office work (possible for most roles).\n* **Pension:** decide for yourself the amount of your personal contribution.\n\nOr view all our benefits.\n\nIdentify new initiatives, manage the pipeline and work together with different development teams to launch and scale innovative (GenAI) products that create measurable value for customers and Rabobank while shaping the future of Product Management within WR Innovation.\n\n**You & your role**\n-------------------\n\nAs Lead Product Manager, you know the secrets of turning emerging technologies, customer needs, and strategic opportunities into scalable products that create lasting impact. Within WR Innovation, you are responsible for shaping product vision, driving innovation portfolios, and helping Rabobank explore the future of Wholesale & Rural Banking. In this role, you will provide direction across multiple product and project teams, driving alignment, execution, and portfolio outcomes across a range of strategic initiatives. You combine customer focus, strategic thinking, and execution excellence to bring products from idea to adoption, while coaching Product Owners and strengthening Product Management capabilities across the organisation.\n\n**Book results**\n----------------\n\n* Accelerate the growth and execution of the innovation portfolio, delivering measurable customer value and strategic business impact.\n* Successfully navigate innovative products and GenAI initiatives from vision and validation to adoption and scale within the WR Tribes.\n* Strengthen WR Innovation’s leadership position by advancing Product Owner and Product Management capabilities across the organisation.\n\n**Facts & Figures**\n-------------------\n\n* 36 hours per week.\n* Working on innovative products and GenAI solutions for Wholesale & Rural Banking customers.\n* 9.5 million customers worldwide.\n\n**Top 3 responsibilities**\n--------------------------\n\n* Coach Product Owners and provide thought leadership on product strategy, ways of working, and capability development.\n* Drive innovation & GenAI product execution across complex initiatives, managing timelines, governance, stakeholder communication, and portfolio decisions.\n* Communicate clearly and effectively on the change ahead as a result of executing the product visions and drive adoption preparations.\n\nWR Innovation is where ideas become products that transform and create measurable impact. We explore emerging technologies, validate new opportunities, and translate them into scalable products and services. You will be part of the Product Development team and play a key role in shaping a gro", "source": "indeed"}, {"company": "CALDIC", "job_title": "Program Manager (Global)", "location": "Rotterdam, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Caldic", "job_url": "https://nl.indeed.com/viewjob?jk=2a9687d73b65126d", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-16", "recruiter_email": null, "applicant_count": null, "description": "**Job Details**\n---------------\n\n**Job Title:** Program Manager (Global)\n\n**Based in:** Rotterdam, Netherlands\n\n**Work Arrangement:** Hybrid\n\n**Working Hours:** Full-time\n\n**About the Role**\n------------------\n\nThe Program Manager is responsible for the day-to-day coordination and delivery of Program Nexus, Caldic's global product and supplier data program. The role translates approved objectives, scope and priorities into practical workplans, actions, deliverables and implementation activities. Working closely with functional experts, regional teams, IT, vendors and implementation partners, the Program Manager maintains the integrated plan, organizes working sessions and governance meetings, tracks actions, risks and dependencies, follows up deliverables, and supports testing, deployment and adoption activities.\n\nThe role is hands-on and execution-focused. Product, regulatory, quality, sustainability, business-process, data and technical decisions remain with the accountable functional owners and governance bodies. The Program Manager ensures that required inputs are collected, documented, reviewed, approved and translated into completed implementation activities.\n\nManaging Program Nexus is the primary focus. At natural transition points between program phases or gates, the role may also support other Caldic projects and ESG initiatives, as agreed with the Global ESG Director.\n\n**Key Responsibilities**\n------------------------\n\nAs Program Coordinator, you will play a central role in driving the successful delivery of the Nexus program. You will coordinate project plans, milestones, risks, dependencies, and governance activities, ensuring alignment across global functions, regional teams, IT, data owners, and external partners. Acting as the connective link between stakeholders, you will facilitate workshops, support requirements gathering and decision-making, and ensure actions are followed through to completion.You will also support software selection and implementation activities, coordinate testing, training, deployment, and hypercare, and help ensure a smooth transition into business-as-usual operations. Success in this role requires strong organizational skills, the ability to manage multiple workstreams and stakeholders, and a proactive approach to driving progress in a complex international environment.\n\n**Knowledge & Experience**\n--------------------------\n\n* Bachelor’s or master’s degree in Business Administration, Engineering, Supply Chain, Information Management, Data, Product Management, or a related discipline; equivalent experience is acceptable.\n* Project or program management certification (e.g., PMP, PRINCE2, Agile, Scrum) is a plus.\n* 5+ years of experience in project coordination, PMO, implementation, or transformation roles.Proven experience managing project plans, workstreams, stakeholders, governance, and decision-making processes.\n* Experience facilitating workshops, gathering requirements, and supporting software implemen", "source": "indeed"}, {"company": "Alcor", "job_title": "Product Owner Cloud", "location": "Apeldoorn, GE, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Alcor", "job_url": "https://nl.indeed.com/viewjob?jk=2c34aaf627211b1e", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Caseware combines over 35 years of industry expertise with AI-powered technology to transform how audit and accounting professionals work. Serving organizations across 130 countries, we bring intelligent automation directly into audit and financial reporting workflows—helping professionals reduce manual work, navigate complexity, and focus on informed decisions. Join our global team and help build technology that strengthens trust in financial information.  \n  \nAs **Product Owne**r for our Cloud solutions, you are responsible for driving the development, maintenance, and continuous improvement of our products. You work closely with a full team—both functional and development—so affinity with both is important. You organize and prioritize the team's work through a well-managed backlog and sprint board, ensuring delivery of maximum value to our customers.  \n  \nThis is a **Full time permanent** position **Location:** This is a **hybrid** role requiring the successful candidate to work **3** **days a week in our Apeldoorn, Netherlands office**, located at **Fauststraat 3, 7323 BA Apeldoorn, Netherlands**\n\n### **What you will be doing:**\n\n* Drive the development, maintenance, and continuous improvement of our Cloud products.\n* Collaborate closely with a full team—both functional and development—so affinity with both is important.\n* Organize and prioritize the team's work through a well-managed backlog and sprint board.\n* Ensure delivery of maximum value to our customers.\n* Define the product roadmap in alignment with strategic goals and market developments.\n* Coach the team to stay aligned with our overall product vision.\n* Focus on financial reporting, audit, and related workflows for the Dutch accountancy market.\n* Act as the final responsible for the success of our Cloud solutions.\n* Understand customer needs and balance various stakeholder demands.\n* Translate insights into clear product decisions and priorities.\n* Share progress regularly via roadmap presentations and other communications.\n* Create clarity and alignment across internal and external stakeholders.\n\n### **What you will bring:**\n\n* Experience or a strong affinity with audit and accounting (hands-on experience in practice is a plus)\n* Possesses deep understanding of the Dutch market and user needs\n* Supports the team in delivering accurate, high-quality, and compliant product content\n* Works effectively both independently and collaboratively, with excellent prioritization skills\n* Excels at translating complex concepts into intuitive, user-friendly solutions\n* Is available full-time and ready to take ownership as a proactive leader within the team\n\n### **What's in it for you:**\n\n* Shape what's next with AI: Help transform audit and accounting through AI-powered technology. Explore new ways to bring AI into our own workflows, rethink how work gets done, and turn ideas into meaningful improvements for our teams and customers.\n* Make an impact that matters: Contribute to solutions that h", "source": "indeed"}, {"company": "Tebi", "job_title": "Senior Product Manager - AI Team", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Tebi-2", "job_url": "https://nl.indeed.com/viewjob?jk=b4979873fc13292a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "**About us**\n------------\n\nTebi is building a modern connected hospitality operating system that helps entrepreneurs run their business more intelligently and smoothly. In one seamless platform, Tebi embeds sales, reservations, kitchen, inventory, and payments (as well as all the data that powers it) helping to automate work, streamline operations, and give hospitality owners the clarity and time they need to focus on what matters the most: creating great guest experiences.\n\nFounded by Arnout Schuijff, co-founder of Adyen, and backed by €50 million in funding from Index Ventures & CapitalG, Tebi is build in service of hospitality first. Thousands of restaurants, cafés, bars, and coffee shops across the Netherlands, UK, Spain, Italy, Denmark, Germany, Finland, and Ireland.\n\n**About the role**\n------------------\n\nAs the Senior Product Manager on our AI team, you'll own how AI shows up in Tebi, from an AI agent embedded in the product to the AI capabilities that run through the platform. Tebi sits on a unified foundation of sales, payments, reservations, kitchen and inventory data, which gives our AI something most restaurant software can't offer: the full picture. You'll own the vision, strategy and roadmap, and turn that data into agents and features that save merchants time, cut costs and help them make better decisions on a busy service.\n\n**What you’ll do:**\n-------------------\n\n* Define and own the vision and roadmap for Tebi's AI agent and AI capabilities across the product.\n* Work with AI engineers and data teams to ship agentic features that take real actions for merchants, not just answer questions.\n* Spend time with restaurant owners, managers and staff, plus Sales and Customer Success, to find the jobs where AI genuinely removes friction in their day.\n* Define how we measure quality and trust in AI features, including evals, accuracy, adoption and merchant outcomes, and use that to iterate quickly.\n* Decide where AI belongs in the product and where it doesn't, including guardrails, human-in-the-loop moments and when the merchant makes the final call.\n* Partner with all the other product teams so AI feels native to Tebi rather than bolted on.\n\n**What you'll need:**\n---------------------\n\n* 8+ years of product management experience at a fast-growing tech company, with a track record of shipping impactful launches.\n* You are highly collaborative, able to partner effectively across the organization and build trust with both technical and operational teams.\n* Hands-on experience building AI-powered products and a solid grasp of their strengths and limits.\n* A data-driven mindset: you combine quantitative signals and qualitative feedback, and you know how to evaluate non-deterministic products.\n* You care about the balance between craft, speed, and outcomes.\n\nThis probably isn't the role for you if you're happiest on a structured environment with clear directions. We are looking for someone to set the direction and the vision for this team.\n\nPe", "source": "indeed"}, {"company": "LELY", "job_title": "Product Owner Digital Farming", "location": "Maassluis, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Lely", "job_url": "https://nl.indeed.com/viewjob?jk=38fdff91909a5dde", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "**Company Description**\n\nLely, founded in 1948, is committed to creating a sustainable, profitable, and enjoyable future in agriculture. Driven by the challenges farmers face and the needs of cows, we develop high-quality robots and data systems that improve animal welfare, flexibility, and productivity on dairy farms. Our mission is to support sustainable food production.\n\nFor more than 30 years, we have been a global leader in the sales and service of automated systems for successive generations of dairy farmers. Every day, we inspire our colleagues to provide customers with innovative solutions and to be a reliable partner for long-term advice and support. With our state-of-the-art Lely Campus in Maassluis and a worldwide network of dedicated Lely Centers offering tailored sales and service, Lely operates in more than fifty countries.\n\n **Job Description**\n\nWhat is your role?\n\nImagine your product decisions helping farmers organize their farms more efficiently every day. As Product Owner Digital Farming, you shape digital solutions that help farmers plan, carry out and track their daily work. From task management and smart routing to reporting and operational insights, you make sure technology connects with the realities of day-to-day life on the farm.\n\nYou will join the Farm Managers team within the Digital Farming domain. This team works on Horizon, Lely’s farm management platform. Within the platform, Farm Managers focuses on the daily processes that help farmers stay in control and carry out their work efficiently.\n\nIn this role, you combine strategic product ownership with hands-on business analysis. Together with stakeholders, you shape the product direction while working closely with the development team. You explore what farmers need, balance different interests and translate insights into clear user stories, requirements and acceptance criteria.\n\nYou collaborate closely with software engineers, UX designers, business stakeholders and farmers. Through conversations with them, you identify opportunities, validate solutions and help the team focus on improvements that create real value. This role is ideal for someone who enjoys both defining direction and working closely with a development team to turn ideas into well-defined solutions. Beyond product ownership, you help the team strengthen its focus, collaboration and ways of working, enabling the team to become increasingly effective as our product organization continues to develop.\n\nKey responsibilities include:\n\n* You develop and maintain the product vision, roadmap and priorities for the Farm Managers domain.\n* You bring together customer value, business objectives, technical sustainability and operational needs to make clear product decisions.\n* You build and prioritize the product backlog based on conversations with farmers, product data, business value and technical possibilities.\n* You translate needs into concrete requirements, user stories and acceptance criteria, preparing th", "source": "indeed"}, {"company": "Google", "job_title": "Data Center Site Program Manager", "location": "Groningen, GR, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Google", "job_url": "https://nl.indeed.com/viewjob?jk=fadbc47fee5209c0", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "Candidates must be able to work 100% onsite.\n\nCandidates are strongly encouraged to possess a driver's license and have access to their own transportation given travel to data center sites in their scope.\n\n  \nNote: By applying to this position you will have an opportunity to share your preferred working location from the following: **Eemshaven, Netherlands; Winschoten, Netherlands; Groningen, Netherlands**.\n\n### **Minimum qualifications:**\n\n* Bachelor's degree or equivalent practical experience.\n* 5 years of experience in program, project management, data center operations (e.g., facilities/operations management, capacity planning, or site operations), or equivalent.\n* 5 years of experience using analytics to solve product or business problems, performing statistical analysis.\n* Experience with technical integration, system integration, risk mitigation, deployment planning, or data center operations.\n\n  \n\n### **Preferred qualifications:**\n\n* Professional certifications in Project Management (e.g., PMP, PgMP).\n* Ability to identify key issues, gather and analyze large data sets to support hypotheses, and develop actionable recommendations.\n* Ability to be creative, non-standard, and develop innovative solutions using data and analytics to drive impact.\n* Excellent project management skills, with the ability to create workable project plans including project scope.\n* Excellent written and verbal communication and presentation skills.\n\n**About the job**\n-----------------\n\nA problem isn’t truly solved until it’s solved for all. That’s why Googlers build products that help create opportunities for everyone, whether down the street or across the globe. As a Program Manager at Google, you’ll lead complex, multi-disciplinary projects from start to finish — working with stakeholders to plan requirements, manage project schedules, identify risks, and communicate clearly with cross-functional partners across the company. Your projects will often span offices, time zones, and hemispheres. It's your job to coordinate the players and keep them up to date on progress and deadlines.\n\nThe AI and Infrastructure team is redefining what’s possible. We empower Google customers with breakthrough capabilities and insights by delivering AI and Infrastructure at unparalleled scale, efficiency, reliability and velocity. Our customers include Googlers, Google Cloud customers, and billions of Google users worldwide.\n\nWe're the driving force behind Google's groundbreaking innovations, empowering the development of our cutting-edge AI models, delivering unparalleled computing power to global services, and providing the essential platforms that enable developers to build the future. From software to hardware our teams are shaping the future of world-leading hyperscale computing, with key teams working on the development of our TPUs, Vertex AI for Google Cloud, Google Global Networking, Data Center operations, systems research, and much more.\n\nIndividual pay is determined by fa", "source": "indeed"}, {"company": "Solera", "job_title": "Product Owner III", "location": "Nieuwegein, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Solera", "job_url": "https://nl.indeed.com/viewjob?jk=58618b4b8ab806e9", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-28", "recruiter_email": null, "applicant_count": null, "description": "**About Solera**\n\n  \n\nAt Solera, we continuously improve our products and services to deliver measurable value to insurers, MGAs, and other insurance market participants. Within the Netherlands market, our Data Processing portfolio consists of CHV (Clearing House Volmachten) and VRA (Volmacht Resultaat Analyse), services that process, validate, enrich, reconcile and deliver insurance portfolio, financial and claims information to insurers and delegated authority organizations.\n\nThe CHV/VRA platform supports critical insurer processes, operational reporting, regulatory reporting, portfolio analysis, data quality monitoring, and management information services. The platform currently serves dozens of insurers and hundreds of MGA data providers and remains a strategic component of Solera's International Underwriting portfolio.\n\n**The Role**\n\nAs Product Owner for CHV/VRA Dataprocessing, you are responsible for defining and executing the product vision, roadmap and backlog for the CHV/VRA portfolio.\n\nYou act as the primary liaison between insurers, MGA organizations, Product Management, Engineering, Operations, Data Processing specialists and commercial teams. You ensure that customer requirements, market developments, regulatory obligations and operational needs are translated into clear priorities and deliverables.\n\nYou provide day-to-day direction to AI driven teams and maintain ownership of the product backlog, release planning and roadmap execution. You balance customer commitments, technical debt, compliance requirements, operational stability and strategic product investments.\n\n**Key Responsibilities:**\n\n**Product Ownership**\n\n* Own and maintain the CHV/VRA product backlog.\n* Define product vision and roadmap in alignment with Product Management.\n* Prioritize features, enhancements and maintenance activities.\n* Translate customer and market needs into epics, features and user stories.\n* Ensure backlog readiness and sprint preparation.\n* Lead backlog grooming and iteration planning activities.\n* Coordinate release planning and product ioritization and measure business outcomes.\n* Collaborative & Agile Mindset: An inclusive, adaptable approach to navigating complex matrix organizations and bridging ", "source": "indeed"}, {"company": "KLM", "job_title": "Business Product Analyst Level 2", "location": "Schiphol, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Klm", "job_url": "https://nl.indeed.com/viewjob?jk=8062879abe312dd2", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "Ready for your next career move? KLM aims to become the most data- and technology-driven airline in the world – and CHIP is right at the heart of it. As a Business Product Analyst (BPA), you keep the engine room of Schiphol’s ground operations running: the system that plans and allocates people and resources every day across Passenger Services, Baggage Services and Apron Services. You don’t just fix what’s broken – you understand why things work the way they do, and turn that insight into smarter, scalable solutions for the entire operation.\n\n**What will you do?**\n\nAs a Business Product Analyst, you help the product team get the most out of our product. That starts in the operation, and we mean that literally: put on your safety shoes and talk to planners, shift leaders and operational staff to understand what’s really going on. With that knowledge, you make sure our IT solution CHIP is configured and maintained according to the right requirements, help implement changes to business processes, and make sure users truly embrace the system.\n\nIn practice, you will:\n\n* translate operational processes into CHIP application logic – model new functionality in Perl and make full use of standard functionality before turning to custom solutions;\n* configure and optimise resource planning and allocation functionality, business rules, parameters, interfaces and system settings (including BDE and .ini configuration);\n* spo itted and engaged team.\n\n##### **Culture as a catalyst**\n\nOur culture is a key reason why colleagues enjoy working at Highberg. We place trust in our people, value initiative, and believe it is important that everyone can continue to develop. This enables you to get the best out of yourself, while together contributing to sustainable growth.\n\n**Your role as Payroll Product Owner / Payroll Lead**\n-----------------------------------------------------\n\nAs Payroll Product Owner / Payroll Lead at Highberg, you own the payroll chain. Without a clear owner, issues fall between the cracks; you ensure that collective labour agreement (CAO) and legislative changes go live on time, that systems stay aligned and that payroll runs correctly every period. You work within Payroll Services, the Dutch-speaking payroll team of Highberg | Consultday.\n\n  \n\nYour responsibilities include:\n\n* Managing and prioritising the backlog: planning CAO, legislative and system changes, so that statutory changes go live on time.\n* Ven", "source": "indeed"}, {"company": "Lefebvre Sdu", "job_title": "Product Analyst | Legal Tech", "location": "The Randstad, Netherlands", "careers_url": "https://nl.linkedin.com/company/sdu-nl", "job_url": "https://www.linkedin.com/jobs/view/4492925263", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "KLM Royal Dutch Airlines", "job_title": "Business Product Analyst Level 2", "location": "Schiphol, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/klm", "job_url": "https://www.linkedin.com/jobs/view/4492013704", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Rituals (B Corp™)", "job_title": "Product Analyst – Learning – CHO Keizersgracht Amsterdam | 32-40h", " rg jij dat onze chalets en appartementen in Oostenrijk goed aansluiten bij wat onze klanten zoeken, en dat het aanbod er op de website perfect bij staat.\n\n**Wat ga je doen?**\n\n* **Inkoop**: je beheert je eigen portfolio aan partners in Oostenrijk. Je zorgt dat we de juiste accommodaties inkopen, zoekt nieuw interessant aanbod bij bestaande partners en gaat op zoek naar nieuwe partners met aanbod dat bij ons past.\n* **Relatiebeheer**: je bouwt en onderhoudt relaties met (inter)nationale partners. Een aantal keer per jaar reis je af naar Oostenrijk om ze te bezoeken.\n* **Prijzen**: je maakt prijscalculaties, ook als die ingewikkeld worden, en zorgt dat de prijzen op onze website kloppen.\n* **Presentatie**: je schrijft creatieve, wervende teksten, selecteert aantrekkelijk beeldmateriaal en zorgt dat alle informatie over onze chalets en appartementen actueel is.\n* **Samenwerken**: je ondersteunt je collega’s in het Inkoop- en Productmanagementteam en hebt veel overleg met andere afdelingen. Schakelen gaat snel, want de lijntjes zijn kort.\n\n**Kortom**: je zorgt niet alleen dat we het juiste aanbod hebben, maar ook dat klanten het op onze website vinden en willen boeken.\n\n**Jij brengt mee**\n\n* Je hebt een **afgeronde toeristische opleiding**, hbo werk- en denkniveau en een aantal jaar ervaring in een vergelijkbare functie.\n* Je spreekt en schrijft goed Nederlands en **Duits**.\n* Je bent sociaal en **communicatief vaardig**, waardoor je makkelijk een band opbouwt met onze partners.\n* Je hebt er geen moeite mee om onze partners in **Oostenrijk te bezoeken**.\n* Je kunt goed overweg met **Excel**, **Word** en **fotobewerkingsprogramma’s**.\n* Je werkt graag zelfstandig, maar helpt je collega’s net zo makkelijk verder.\n* Wintersportervaring is mooi meegenomen, maar geen harde eis. Komt vanzelf als je bij ons werkt!\n\n**Wat krijg je ervoor terug?**\n\nEen afwisselende rol met goede arbeidsvoorwaarden. Geen dag is hetzelfde! Je krijgt je eigen portfolio, volop ruimte voor persoonlijke ontwikkeling en we staan altijd open voor nieuwe ideeën. Verder staan er regelmatig gezellige uitjes en borrels op het programma, houden we elk jaar een BBQ, komt er maandelijks een stoelmasseur langs en gaan we jaarlijks met elkaar op studiereis naar de sneeuw.\n\nKlinkt dit als jouw volgende stap? Stuur ons je cv en een korte motivatie. We zijn benieuwd naar je verhaal!\n\n**Praktische info**\n\n* **Uren**: 32-39 uur\n* **Startdatum**: i", "source": "indeed"}, {"company": "Forbo Management", "job_title": "Stageopdracht Product Management", "location": "Assendelft, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Forbo-Management", "job_url": "https://nl.indeed.com/viewjob?jk=aa2f9f98d8074f50", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "**De divisie Flooring Systems biedt een breed en aantrekkelijk assortiment milieuvriendelijk linoleum, hoogwaardige vinylvloeren, schoonloopsystemen, tapijttegels, naaldvilt, en Flotex, de wasbare textielen vloerbedekking. Dankzij hun voortreffelijke technische eigenschappen en aantrekkelijke design zijn deze vloerbedekkingen de eerste keus voor openbare gebouwen, warenhuizen, ziekenhuizen en andere zorginstellingen, scholen, bibliotheken, kantoren, vrijetijdscentra, hotels, restaurants en cafés alsmede voor toepassingen in de woonmarkt.**  \n**Met een marktaandeel van ruim 65% is Forbo wereldwijd marktleider in linoleum. Onder de merknaam Eurocol levert Flooring Systems ook kant-en-klare lijmen voor vloerinstallaties en keramische tegels en nivelleermassa's voor de bouwbranche**\n\n**Stageopdracht Product Management**\n------------------------------------\n\nStageopdracht: vergemakkelijken van de installatie van Marmoleum\n\n  \n\n**Korte samenvatting**\n\nIn deze opdracht onderzoek je hoe we het leggen van Marmoleum (linoleum) makkelijker kunnen maken. Niet alleen in de praktijk, maar ook in hoe installateurs dit beleven. Je werkt toe naar concrete hulpmiddelen die installateurs helpen om sneller, makkelijker en met meer vertrouwen te werken.\n\n  \n\n**Achtergrond**\n\nMarmoleum is een sterke en duurzame vloeroplossing. Toch wordt linoleum in de markt soms gezien als lastiger te installeren dan bijvoorbeeld vinyl.\n\n  \n\nDat beeld kan invloed hebben op de keuze voor Marmoleum. Als installateurs, klanten of architecten denken dat het leggen ingewikkelder is of meer vakkennis vraagt, kan dat een drempel zijn. Zeker nu snelheid belangrijk is en goede vakmensen niet altijd makkelijk te vinden zijn.\n\n  \n\nForbo wil daarom kijken hoe we installateurs beter kunnen helpen. Niet door Marmoleum zelf te veranderen, maar door te kijken naar handige hulpmiddelen, tools, uitleg en ondersteuning rond het installatieproces.\n\n  \n\n**Probleemstelling**\n\nDe installatie van Marmoleum wordt regelmatig gezien als specialistisch. De vraag is of dat beeld klopt, waar het vandaan komt en welke onderdelen van het werk echt lastig zijn. Ook als de perceptie niet altijd terecht is, kan die wel invloed hebben op de keuze voor Marmoleum.\n\n  \n\nIn deze opdracht kijk je daarom naar twee dingen: wat er in de praktijk beter kan en welke aannames of beelden er zijn rond het installeren van Marmoleum. Daarna onderzoek je hoe we het werk eenvoudiger, minder foutgevoelig of toegankelijker kunnen maken en welke tools we daarvoor kunnen ontwikkelen.\n\n  \n\n**Doel van de opdracht**\n\nHet doel is om de belangrijkste knelpunten bij het installeren van Marmoleum in beeld te brengen en deze te vertalen naar praktische oplossingen voor installateurs.\n\n  \n\nDe focus ligt op hulpmiddelen, tools, digitale ondersteuning of verbeteringen in het proces.\n\n  \n\nBelangrijk: het gaat niet om het aanpassen van Marmoleum zelf. De opdracht draait om alles eromheen: wat kan installateurs helpen om het product makkelijker en beter", "source": "indeed"}, {"company": "Dienst Toeslagen", "job_title": "Senior productmanager", "location": "Den Haag, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Dienst-Toeslagen", "job_url": "https://nl.indeed.com/viewjob?jk=c8a2a54fad0f28ac", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-19", "recruiter_email": null, "applicant_count": null, "description": "Reageer t/m 2 december 2026\n\nDienst Toeslagen bouwt iets nieuws. We lappen geen oude systemen op, we bouwen een eigen IT-landschap vanaf de basis. Als eerste voor de nieuwe financiering van kinderopvang: vanaf 2029 moet de overheid zo’n 3.000 kinderopvangorganisaties rechtstreeks betalen, in plaats van via toeslag aan ouders.\n\nWe willen af van het idee dat goede tech niet bij of door de overheid gebouwd kan worden. Daarom bestaat Programma Digitale Diensten (PDD) uit ambitieuze engineers en productspecialisten die in-house bouwen, in kleine multidisciplinaire teams. We testen met echte ouders, kinderopvangorganisaties en gastouderbureaus. Grote blauwdrukken maken we niet. We prototypen snel en gaan vroeg live. Geen versie is af: na elke release zien we wat beter kan, en dan maken we dat ook beter.\n\nWe zoeken een senior productmanager die ervoor zorgt dat we snel leren wat we moeten bouwen. Iemand die opkomt voor de mensen die het straks gebruiken. Deze functie past bij je als je je zowel thuis voelt in strategisch prioriteren en het maken van keuzes, als enthousiast wordt van zelf prototypes bouwen en testen met gebruikers. Kortom, je hebt een volle gereedschapskist, weinig geduld voor “zo doen we het nu eenmaal” en krijgt dingen uit je handen.\n\n**Dit doe je bij Dienst Toeslagen**\n-----------------------------------\n\nJe bent de stem van de mensen die met onze diensten moeten werken. De kinderopvangorganisatie die op maandag een betaalverzoek bij ons indient en wil weten of het geld op tijd binnen is. De ouder die wil snappen wat er voor haar verandert. De collega die dossiers behandelt en voor één dossier van scherm naar scherm moet. Jij weet wat zij nodig hebben omdat je het zelf hebt gehoord en gezien. En je komt voor ze op, ook als een stakeholder het liever anders ziet of als het beleid iets anders voorschrijft dan wat mensen nodig hebben.\n\nHoe je dat aanpakt, hangt af van het probleem. Soms beslecht een prototype van een middag een discussie die al weken loopt. Soms moet je eerst bij een gastouder aan de keukentafel zitten. En soms is een scherp gesprek met een stakeholder de snelste weg. Je pakt wat het snelst tot inzicht leidt en je begint bij het probleem, niet bij de oplossing.\n\nWe werken met multidisciplinaire teams. Dat betekent dat je binnen je team werkt met engineers, beleidscollega’s en uitvoeringsspecialisten. Ieder team is verantwoordelijk voor een specifiek stuk van een dienst en krijgt daarbij een groot mandaat. Het team bepaalt wat er moet gebeuren en hoeft met die ideeën niet langs poortwachters om aan de slag te kunnen. Dat betekent veel vrijheid en ook veel verantwoordelijkheid. Binnen het team is geen hiërarchie Iedereen is gezamenlijk verantwoordelijk en argumenten zijn belangrijker dan petten. Vanuit jouw achtergrond is het wel je taak om ervoor te zorgen dat het team extreem snel leert en dat collega’s die niet gewend zijn om in korte cycli van een maand te werken daarin worden meegenomen.\n\nHet werk wisselt van heel kle", "source": "indeed"}, {"company": "Ridder Group", "job_title": "Productmanager Water", "location": "Maasdijk, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ridder-Group", "job_url": "https://nl.indeed.com/viewjob?jk=e917b294aab6e10e", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "Bepaal de toekomst van de wateroplossingen van Ridder.\n\n  \n\nWater is essentieel voor de glastuinbouw. Tegelijkertijd worden de eisen op het gebied van efficiënt gebruik, kwaliteit en hergebruik steeds hoger. Als (Senior) Productmanager Wate ist beheert en breidt de technische fabric uit. Jij bent de opdrachtgever: je stelt kaders en prioriteiten en zorgt dat regie en kennis bij PIDZ blijven.\n* **Leidinggeven.** Je geeft leiding aan de productmedewerkers, neemt hen mee in de werkwijze en zorgt dat mens en AI elkaar versterken.\n* **Eigenaar van de werkwijze.** Na de pilot ben jij eigenaar van de nieuwe manier van werken. Je bouwt herbruikbare onderdelen, prompts, templates en evaluaties, zodat elke volgende oplossing sneller en beter gaat.\n\n**Van vraag naar werkende oplossing**\n\n* **Problemen doorgronden.** Je gaat in gesprek met gebruikers: planners, intercedenten, klantenservice, zorgorganisaties en zorgprofessionals. Je brengt processen en knelpunten in kaart en vertaalt vage wensen naar heldere eisen, randvoorwaarden en succescriteria.\n* **Snel een eerste versie neerzetten.** Je laat AI-agents prototypes bouwen en test die zo snel mogelijk met echte gebruikers. Je weet wanneer AI echt waarde toevoegt en wanneer gewone logica of een bestaande oplossing beter werkt.\n* **Agent-ready specificeren en orkestreren.** Je schrijft epics en user stories met toetsbare acceptatiecriteria en precies de context die een AI-agent nodig heeft. Je zet de juiste agents in voor ontwerp, bouw, test en documentatie en stuurt bij op tussenresultaten.\n* **Integreren met wat er al is.** Je zorgt dat oplossingen goed aansluiten op het PIDZ-platform en bestaande systemen zoals Salesforce en AFAS: API’s, datastromen, autorisatie en koppelingen.\n* **Veilig", "source": "indeed"}, {"company": "Enexis", "job_title": "Productmanager kernproducten", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Enexis", "job_url": "https://nl.indeed.com/viewjob?jk=69545c2e81b0d8ce", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "* Den Bosch\n* € 4.223,- en € 6.033,-\n* HBO\n* 32 tot 40 uur\n\n  \n\n* ### **Wat ga je doen?**\n\n  #### **Met jouw energie kan het**\n\n  De energietansitie is in volle gang. Dit betekent nieuwe producten, nieuwe wetgeving en veranderende klantvragen. De energiemarkt is volop in beweging. Jij vertaalt die ontwikkelingen naar producten en diensten die Nederland vooruit helpen in de energietransitie. Samen met experts uit verschillende disciplines maak je producten toekomstbestendig en draag je direct bij aan een flexibel, betrouwbaar en betaalbaar energiesysteem. Je kunt daarbij rekenen op goede arbeidsvoorwaarden zoals een persoonlijk budget, 13e maand en vitaliteitsbudget.\n\n  Als Productmanager kernproducten ben je verantwoordelijk voor de doorontwikkeling van een aantal belangrijke producten en diensten van Enexis voor de zakelijke markt. Je werkt samen met collega's uit de hele organisatie aan de doorontwikkeling van producten en diensten voor de zakelijke markt. Daarbij zorg je dat verbeteringen niet alleen worden bedacht, maar ook succesvol worden gerealiseerd.\n\n  #### **Zo ga jij deze uitdaging aan**\n\n  Als Productmanager kernproducten werk je aan de doorontwikkeling van ons kernproductenportfolio. Denk hierbij aan openbare verlichting, meerdere aansluitingen op één adres, aansluitproducten en andere diensten die dagelijks door klanten worden gebruikt. Je volgt actief ontwikkelingen in wet- en regelgeving, de energiemarkt en klantbehoeften en vertegenwoordigt Enexis in relevante overleggen binnen de sector. De inzichten die je daar opdoet vertaal je naar verbeteringen in producten, processen en dienstverlening. Daarbij overzie je de impact op klantcommunicatie, interne processen, tarieven en de uitvoering binnen Enexis. Je bent de verbindende schakel tussen verschillende disciplines en stakeholders. Om tot de juiste oplossing te komen, werk je nauw samen met collega's uit asset management, IT, relatiemanagement, klantteams en operatie. Jij brengt de juiste mensen bij elkaar, stelt scherpe vragen en zorgt dat verbeteringen niet alleen worden bedacht, maar ook succesvol worden gerealiseerd.\n* ### **Functie-eisen**\n\n  #### **Zo pak jij het aan**\n\n  Je bent analytisch sterk en vindt het leuk om complexe vraagstukken uit te pluizen. Je wacht niet af, maar onderzoekt zelfstandig wat nodig is om een vraagstuk verder te brengen. Daarbij overzie je de gevolgen van veranderingen voor klanten, processen, systemen en andere onderdelen van de organisatie. Je bent communicatief sterk en weet verschillende belangen met elkaar te verbinden. Je werkt graag samen met collega's en stakeholders en creëert draagvlak voor nieuwe ideeën en veranderingen. Dankzij jouw nieuwsgierigheid, zelfstandigheid en organisatiesensitiviteit weet je hoofd- en bijzaken goed van elkaar te onderscheiden in een omgeving die continu in beweging is.\n\n  Verder heb je:\n\n  + Een afgeronde hbo- of wo-opleiding.\n  + Minimaal 3 tot 5 jaar ervaring in productmanagement, propositieontwikkeling, bel", "source": "indeed"}, {"company": "LELY", "job_title": "Product Owner", "location": "Maassluis, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Lely", "job_url": "https://nl.indeed.com/viewjob?jk=0f45a91a2aeae462", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "**Bedrijfsomschrijving**\n\nLely, opgericht in 1948, richt zich op een duurzame, winstgevende en aangename toekomst in de agrarische sector. Met de vraagstukken van de boer en de behoeften van de koe als middelpunt ontwikkelen wij hoogwaardige robots en datasystemen die het dierenwelzijn, de flexibiliteit en productie op het melkveebedrijf verhogen. Met als doel duurzame voedselproductie te ondersteunen.  \n  \nAl meer dan 30 jaar zijn we wereldwijd leidend in de verkoop en service van geautomatiseerde systemen aan opeenvolgende generaties melkveehouders. Elke dag inspireren we onze collega’s om klanten innovatieve oplossingen te bieden, en een vertrouwde partner te zijn voor langetermijnadvies en ondersteuning. Met onze geavanceerde Lely Campus in Maassluis en een wereldwijd netwerk van toegewijde Lely Centers voor verkoop en service op maat, is Lely actief in meer dan vijftig landen.\n\n **Vacatureomschrijving**\n\nBinnen ons Productontwikkelingsteam zijn we op zoek naar een Product Owner om zich aan te sluiten bij bestaande ontwikkelingsteams. Lely is wereldleider in automatisering voor de melkveehouderij; onze productontwikkelingsteams zorgen ervoor dat nieuwe producten voldoen aan onze hoge kwaliteitsnormen. Deze agrarische innovaties omvatten nieuwe producten voor nieuwe markten, evenals updates en ondersteuning.\n\nBij het proces van het brengen van de producten naar onze eindgebruikers hebben de ontwikkelingsteams te maken met veel invloeden. Het team wordt gevoed met informatie van testers, veldinstallaties, data-analisten, engineers, servicetechnici en het ontwikkelingsprogramma van het project. Het behouden van tevredenheid en afstemming onder al deze belanghebbenden is jouw belangrijkste doel.\n\n**Jouw rol en positie**\n\nAls Product Owner Product Development werk je in een softwareontwikkelingsteam. Jouw belangrijkste belanghebbenden zijn Technische Serviceondersteuning, veldtechnici, interne productontwikkelingsteams, de projectmanager, de productmanager, de eindgebruiker en teamleden van andere disciplines in het project. Met de belanghebbenden identificeer je de behoeften van het veld voor de specifieke producten. Je definieert de Product Backlog, organiseert het werk en bepaalt de beste manier om waarde aan het veld toe te voegen. Als Product Owner heb je een toegewijd team van Productontwikkelaars die met je samenwerken.\n\n **Functie-eisen**\n\nWij zijn op zoek naar een Product Owner die weet hoe hij/zij zich moet profileren binnen een hybride wereld van projecten gecombineerd met agile werkwijzen. Alle belanghebbenden worden meegenomen en zijn even belangrijk bij het realiseren van de roadmap. Je bent een zelfstarter.\n\nWe lezen ook graag meer over je motivatie in je motivatiebrief.\n\nBovendien zoeken we iemand die zich kan identificeren met de volgende vaardigheden en competenties:\n\n* Drie jaar ervaring als Scrum Product Owner.\n* Een empirische en ondernemende mentaliteit met klantgerichtheid.\n* Een focus op het valideren en afronden van taken ", "source": "indeed"}, {"company": "LevelUp Group", "job_title": "Head of Product- Content Creation", "location": "Amsterdam Oost, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Levelup-Group", "job_url": "https://nl.indeed.com/viewjob?jk=f30071a32f1b3b8a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "We maken content die mensen willen delen. Voor lovebrands, retailers, foodmerken en bedrijven die durven. Short-form video, YouTube-series, campagnes, employer branding en AI-content: we doen het allemaal, en we doen het goed.\n\nOnze dienstverlening is de afgelopen jaren hard gegroeid. Nu is het tijd om er richting aan te geven. Welke diensten bieden we over twee jaar aan? Hoe maken we ze beter, slimmer en makkelijker op te schalen? En hoe worden we de strategische partner die klanten bellen *voordat* ze een briefing schrijven? Daar zoeken we iemand voor met een heldere visie op content en de drive om die visie te bouwen. Ben jij dat?\n\n**De rol in het kort**\n\nJij bent eigenaar van het ‘product’ van C2B: onze dienstverlening. Je bepaalt welke diensten we aanbieden, hoe ze eruitzien en hoe ze zich ontwikkelen. Je vertaalt trends en klantbehoeften naar proposities, formats en werkwijzen, en zorgt dat ons team ze kan leveren. Onze Creative Lead bewaakt de creatieve lijn en het commerciële team de klantrelaties. Jij zorgt dat wat we aanbieden klopt en werkt, en dat we het blijven vernieuwen.\n\n**Wat ga je doen?**\n\n* **Visie en roadmap.** Je ontwikkelt een visie op de contentmarkt (AI, creators, campagnes, social search, always-on) en vertaalt die naar een productroadmap: welke diensten bouwen we, verbeteren we of stoppen we?\n* **Diensten (door)ontwikkelen.** Je ontwerpt nieuwe proposities en scherpt bestaande aan: inhoud, aanpak, deliverables en prijsmodel.\n* **Van maatwerk naar product.** Je maakt van losse projecten herhaalbare diensten, met heldere formats, werkwijzen en kwaliteitsstandaarden.\n* **Innoveren en testen.** Je volgt nieuwe platforms, formats en AI-tools, start pilots met klanten en schaalt op wat werkt.\n* **Meten en verbeteren.** Je kijkt wat onze diensten klanten opleveren en gebruikt die inzichten om ze beter te maken.\n* **De juiste vragen stellen.** Je schuift aan bij klantgesprekken en haalt op wat klanten echt nodig hebben, ook als ze dat zelf nog niet weten.\n* **Het team meenemen.** Je zorgt dat creatie, studio en productie onze diensten kennen en kunnen leveren, met playbooks, kennisdeling en training.\n* **Commercie voeden.** Je geeft het commerciële team de proposities, cases en argumenten om te verkopen, en denkt mee bij pitches en voorstellen.\n\n**Wie ben jij?**\n\nJe kijkt naar een dienst zoals een productmanager naar een product: voor wie is het, welk probleem lost het op en hoe wordt het beter? Je bent net zo op je plek bij een marketingdirecteur als bij onze makers in de studio. Verder:\n\n* Je hebt een uitgesproken visie op content, social en merken, en op waar die markt naartoe gaat.\n* Je hebt ervaring met het ontwikkelen en lanceren van diensten of proposities, en weet hoe je van idee tot product komt.\n* Je bent strategisch sterk, brengt structuur aan en durft keuzes te maken, ook als dat betekent dat je nee zegt.\n* Je bent commercieel bewust: je weet wat een dienst waardevol maakt voor de klant én rendabel voor ons.\n* Je ben", "source": "indeed"}, {"company": "Blinqx", "job_title": "Product Operations Manager", "location": "Amsterdam-Zuidoost, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Blinqx", "job_url": "https://nl.indeed.com/viewjob?jk=ed29294e827891f8", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-02", "recruiter_email": null, "applicant_count": null, "description": "Onze productmanagers horen bij klanten te zitten, niet in Jira. Jij zorgt dat dat kan. Je bouwt het systeem waarop onze productorganisatie draait: de roadmap die iedereen kan lezen, de processen die niet van één persoon afhangen en de automatisering die handwerk overbodig maakt. En omdat we AI-first werken, is jouw eerste vraag bij elk proces niet \"wie doet dit?\" maar \"moet een mens dit nog doen?\"\n\n**Wat ga je doen?**\n-------------------\n\nBlinqx Verzekering & Hypotheek is gegroeid uit meerdere softwarebedrijven. Dat zie je terug: teams werken elk op hun eigen manier, de status van initiatieven zit te vaak in hoofden en mailboxen en wie wil weten wat er speelt, moet het aan iemand vragen. Daar is het afgelopen halfjaar een begin mee gemaakt, met onder meer een living roadmap in Jira. Jij neemt het van daar over en maakt er een staande organisatie van.\n\nConcreet: je bent eigenaar van de tooling en processen van het productteam. Je zorgt dat elk initiatief een doel, een scope en succescriteria heeft, dat go/no-go-momenten gewoon gebeuren en dat release-communicatie grotendeels vanzelf gaat. Als dat staat, kijk je breder: welke processen rond product, zoals onboarding van nieuwe klanten, kunnen slimmer?\n\n**Jouw verantwoordelijkheden**\n------------------------------\n\n* Je beheert en ontwikkelt de living roadmap in Jira: de initiatieflaag boven de epics, de templates en de afspraken over wat erin hoort.\n* Je bewaakt de ritmes: wekelijkse roadmap-afstemming, go/no-go-momenten en de rapportage richting directie.\n* Je automatiseert release-communicatie: van ticket naar releasenote naar klantbericht, zo min mogelijk handwerk.\n* Je zorgt dat signalen uit support, customer success en sales gestructureerd bij productmanagement landen.\n* Je zet samen met BI de productdashboards op: adoptie, gebruik en resultaat per initiatief.\n* Je zoekt actief naar werk dat AI of automatisering kan overnemen, en bouwt die oplossingen zelf of samen met R&D.\n* Je bent het aanspreekpunt voor Jira en aanverwante tooling, en helpt teams die nog op andere tools of spreadsheets werken over te stappen.\n* Je legt vast hoe we werken, zodat nieuwe collega's snel meedraaien.\n\n**Over het team**\n-----------------\n\nBlinqx Verzekering & Hypotheek bouwt software die dagelijks wordt gebruikt door hypotheekadviseurs, advieskantoren en volmachtkantoren in heel Nederland: voor advies, CRM, compliance, volmachtbeheer en documentbeheer, met AI als kern. We maken deel uit van Blinqx, een groep van ruim 700 collega's op meer dan tien kantoren, die software bouwt voor financiële en zakelijke dienstverleners: verzekeringen en hypotheken, accountancy, legal en finance.\n\nJe werkt vanuit Amsterdam binnen het productteam van Blinqx Verzekering & Hypotheek en rapporteert aan de CPO. Je werkt dagelijks met productmanagers, R&D, sales, support en customer success en je wordt begeleid door de Head of Product van de groep, die deze werkwijze mee heeft opgezet.\n\nJe hoeft dit niet al jaren te doen. Wel moet je sn", "source": "indeed"}, {"company": "Kieback&Peter Nederland", "job_title": "(Junior) Product Owner Dataplatform - IoT & Slimme Gebouwen", "location": "Zwolle, OV, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Kieback&Peter-Nederland", "job_url": "https://nl.indeed.com/viewjob?jk=169ae07ee2dda53e", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-29", "recruiter_email": null, "applicant_count": null, "description": "**(Junior) Product Owner Dataplatform – IoT & Slimme Gebouwen**\n\n**Zwolle | 40 uur | Internationaal team | € 3.200–€ 5.500 bruto per maand**\n\nPremievrij pensioen · Strategische rol · Eigen dataplatform · Ook voor ambitieuze starters\n\nGebouwen produceren elke dag enorm veel data. Met brix2bytes, het dataplatform van Kieback&Peter, analyseren we die data automatisch met AI. Dat doen we op een soevereine manier: gebouwdata gaat nooit naar derden zonder duidelijke afspraken. Als Product Owner bepaal jij mee welke kant dit platform op gaat.\n\nJe werkt in een internationaal team van ontwikkelaars, data- en gebouwspecialisten binnen de Kieback&Peter-groep. Je standplaats is ons kantoor in Zwolle. Een goed product begint bij de praktijk. Daarom is het ideaal als je zoveel mogelijk fysiek aanwezig bent, dicht bij applicatiebeheer, service en de operatie. Zo hoor je direct wat er speelt en zie je hoe het platform dagelijks wordt gebruikt.\n\n**Wat ga je doen?**\n\nJe bent eigenaar van de productbacklog. Daarnaast denk je op strategisch niveau mee over de koers van ons digitale dienstenportfolio.\n\n**Product en backlog**\n\n* Je vertaalt wensen van klanten, installateurs, service en applicatiebeheer naar heldere user stories met acceptatiecriteria.\n* Je beheert en prioriteert de backlog. Je weegt daarbij klantwaarde, bedrijfsresultaat en technische haalbaarheid.\n* Je werkt dagelijks samen met het internationale ontwikkelteam: refinement, sprintplanning, reviews en acceptatie.\n* Je zorgt dat functies voor onboarding, digital twins, datakoppelingen en analyses passen bij hoe het platform in de praktijk wordt ingericht en beheerd.\n\n**Klant en praktijk**\n\n* Je werkt nauw samen met de applicatiebeheerders. Zij richten klantomgevingen in, bouwen digital twins en bewaken verbindingen. Hun ervaringen zijn je belangrijkste bron.\n* Je praat met klanten en partners, toetst ideeën en test nieuwe functies met echte gebruikers.\n* Je meet of functies gebruikt worden en waarde opleveren, en je stuurt bij waar nodig.\n\n**Strategie**\n\n* Je ontwikkelt de productvisie en roadmap van brix2bytes en bewaakt die. Ze sluiten aan op de strategie van Kieback&Peter Nederland en de groep.\n* Samen met management, verkoop en marketing denk je mee over het verdienmodel, de positionering en nieuwe digit
