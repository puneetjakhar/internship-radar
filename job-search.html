e_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Thales", "job_title": "Product Manager Delivery Services", "location": "Utrecht, Netherlands", "careers_url": "https://fr.linkedin.com/company/thales", "job_url": "https://www.linkedin.com/jobs/view/4486824851", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "LevelUp Group", "job_title": "Product Lead", "location": "Amsterdam Oost, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Levelup-Group", "job_url": "https://nl.indeed.com/viewjob?jk=59cb1d66816df3cf", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-25", "recruiter_email": null, "applicant_count": null, "description": "**Leadscope zoekt een Product Lead, het derde lid van ons managementteam naast de Lead Commercie en Lead Operations. Samen bouw je aan de toekomst van B2B-groei, voor klanten en voor Leadscope zelf. Kortom: iemand die keuzes durft te maken!**\n\n**Wij bieden**\n\n* 32-, 36- of 40-urige werkweek - hybride werken;\n* Salaris: €4.500 – €6.500 (o.b.v. 40 uur, afhankelijk van ervaring en niveau);\n* Een ruime lijfrenteregeling, behoorlijke bonusregeling en aandelenparticipatie;\n* Een positie in het managementteam van Leadscope, met doorgroeimogelijkheden tot Product Director;\n* 100% OV-vergoeding én reiskostenvergoeding voor elke gereden kilometer – ook op de fiets;\n* Opleidingsbudget van €2.500 per jaar;\n* Elke dag een verse, gezonde lunch op kantoor.\n\n**De functie**\n\nAls Product Lead ben je een van de drie MT-leden van Leadscope. Je bent eindverantwoordelijk voor de kwaliteit en vernieuwing van onze dienstverlening. Daarmee ben je verantwoordelijk voor:\n\n***Visie & Innovatie***  \nJij bepaalt waar onze dienstverlening naartoe gaat. Je signaleert ontwikkelingen in ons vakgebied en vertaalt die naar nieuwe diensten. AI-automatisering is zo vanzelfsprekend voor je, dat we dat eigenlijk niet hoeven te benoemen. Je gebruikt het om alles wat we nu doen steeds beter en slimmer te maken.\n\n***Strategie***  \nDoor je ervaring ken jij de hele commerciële funnel van B2B-organisaties, van marketing tot sales en van change management tot de inrichting van systemen en processen. Je ziet bij klanten waar de groei blijft hangen en weet welke aanpak dat oplost. Dat vertaal je naar jaar- en kwartaalplannen die klanten echt verder helpen.\n\n***Resultaat van het label***  \nMet het gehele MT ben je eindverantwoordelijk voor het resultaat van het label. Jij houdt je bezig met omzetgroei en winst uit nieuwe producten. Daarnaast ben je in staat om het team een geoliede machine te bouwen om tot de beste resultaten te komen.\n\n**Jij bent**\n\nJe zoekt een baan waar je eigenaarschap kunt nemen over de resultaten van het team. Je wilt graag de eindverantwoordelijkheid dragen, omdat je daarmee ook de koers kunt bepalen. Je geniet ervan om een team aan te sturen en samen tot mooie successen te komen. Je voldoet aan het volgende profiel:\n\n* **Je bent een trusted advisor**: je bent sterk in het bouwen van relaties en wordt gezien als een strategische sparringpartner van de klant. Je wilt klanten en hun uitdagingen leren kennen en kunt deze door je aantoonbare ervaring vertalen naar een sterke B2B Go-to-Market-strategie;\n* **Je bent een leider**: je wacht niet tot een ander de koers bepaalt, maar neemt zelf de leiding over het resultaat en weet mensen in beweging te krijgen om die visie samen waar te maken;\n* **Je bent organisatorisch sterk** en vindt het makkelijk om mensen om je heen doelen te geven en te voorzien van heldere verantwoordelijkheden en werkzaamheden;\n* **Je hebt minimaal 5 jaar ervaring** in een commerciële B2B-rol, Demand Generation, RevOps en/of commerciële strategie\n* **Erva", "source": "indeed"}, {"company": "Brand New Day", "job_title": "ALM Risk Transformation & Product Lead", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Brand-New-Day-eb65d4e5", "job_url": "https://nl.indeed.com/viewjob?jk=91cbe3471acea442", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-25", "recruiter_email": null, "applicant_count": null, "description": "* Amsterdam\n* Finance & Treasury\n\n**Waarom Brand New Day ?**\n--------------------------\n\n* Een enthousiast en gedreven team om je heen dat vooruit wil\n* Een informele organisatie zonder politiek of hiërarchisch geneuzel\n* Goede bereikbaarheid op loopafstand van station Amsterdam Bijlmer ArenA\n\n**ALM Risk Transformation & Product Lead**\n==========================================\n\nMaak jij van complexe vraagstukken een duidelijk plan? En zorg je ervoor dat plannen niet op papier blijven staan, maar ook in de praktijk werken? Dan zoeken we jou als lead product & transformatie voor BSM & Risk Management.\n\nJe werkt aan het verbeteren van processen en systemen voor balansbeheer en risicomanagement. Daarbij houd je je onder meer bezig met ALCO, ICLAAP en rapportages aan toezichthouders. Je eerste grote opdracht is de implementatie en verdere ontwikkeling van ERMAS, onze applicatie voor balansbeheer en risicomanagement.\n\n**Wat ga je doen?**\n  \nBij Brand New Day maken we onze processen en systemen steeds slimmer. Jij brengt onze ambities, de eisen van toezichthouders en mogelijkheden voor verbetering bij elkaar. Vervolgens vertaal je die naar oplossingen die echt werken.\n\nDaarbij kijk je naar wat het beste past: ERMAS, ons dataplatform, rapportage- en analysetools of verbeteringen in andere processen en applicaties. Je kijkt ook verder dan vandaag. Want wat we nu ontwikkelen, moet met ons mee kunnen groeien.\n\n**Je belangrijkste werkzaamheden:**\n\n* Je beheert de veranderagenda en backlog en stelt prioriteiten.\n* Je bent eigenaar van ERMAS, leidt de implementatie en stuurt de verdere functionele ontwikkeling aan.\n* Je leidt businessanalyses, brengt knelpunten in kaart en vertaalt de behoeften van de organisatie en eisen van toezichthouders naar functionele eisen en data-eisen. Ook werk je aan het verbeteren en automatiseren van processen.\n* Je coördineert de werkzaamheden van teams en externe partners. Daarbij bewaak je de onderlinge afhankelijkheden, risico's, besluiten en voortgang.\n* Je stelt richtlijnen op voor het testen en in gebruik nemen van nieuwe oplossingen. Je coördineert gebruikersacceptatietesten en zorgt dat medewerkers en processen klaar zijn voor de ingebruikname.\n* Je zorgt dat veranderingen gecontroleerd verlopen, goed worden vastgelegd en controleerbaar zijn voor audits. Ook houd je alle betrokkenen op de hoogte.\n\n**Het team**\n\nJe thuisbasis is de afdeling Balance Sheet Management (BSM), die bestaat uit de teams Treasury, Investment Management (IM) en Change. Het Change-team ondersteunt zowel BSM als Risk Management.\n\nJe geeft leiding aan twee analisten en werkt nauw samen met collega's van onder meer Treasury, Investment Management, Risk Management, Finance, Data en IT.\n\nIedereen heeft daarbij een eigen rol. BSM en Risk Management brengen de vakkennis in, maken de inhoudelijke keuzes en zijn verantwoordelijk voor de resultaten. Het datateam zorgt voor betrouwbare gegevens en de benodigde technische ondersteuning voor de verwerking ervan", "source": "indeed"}, {"company": "CleVR B.V.", "job_title": "Product Owner bij CleVR b.v.", "location": "Rijswijk, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Clevr-B.v.", "job_url": "https://nl.indeed.com/viewjob?jk=d286a829f9cb1a1a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-19", "recruiter_email": null, "applicant_count": null, "description": "**Wil jij werken aan innovatieve Virtual Reality-oplossingen die écht impact maken?**\n\nCleVR ontwikkelt interactieve VR-software voor onder andere de geestelijke gezondheidszorg, het onderwijs en het veiligheidsdomein. Om onze producten verder te ontwikkelen en onze ambities te realiseren, zoeken wij een Product Owner die de verbinding vormt tussen onze klanten, interne stakeholders en het developmentteam.\n\nAls Product Owner werk je samen met een klein, multidisciplinair team van enthousiaste developers en artists. Jij zorgt ervoor dat ideeën, wensen en behoeften worden vertaald naar concrete productfeatures en heldere prioriteiten. Daarbij kijk je niet alleen naar wat technisch mogelijk is, maar vooral naar wat de meeste waarde oplevert voor onze gebruikers én voor CleVR.\n\n**Wat ga je doen?**\n\nJe bent verantwoordelijk voor het begeleiden en prioriteren van de ontwikkeling van onze software. Je haalt actief wensen en functionele eisen op bij klanten en collega’s en vertaalt deze samen met het team naar concrete ontwikkelopdrachten. In overleg bepaal je welke ontwikkelingen prioriteit krijgen. Daarbij houd je overzicht over de roadmap, deadlines, workload en kwaliteit van nieuwe releases.\n\nJe werkzaamheden bestaan onder andere uit:\n\n* wensen en behoeften van klanten en interne stakeholders vertalen naar duidelijke productfeatures;\n* prioriteiten bepalen en beheren binnen de productbacklog;\n* nauw samenwerken met developers en artists;\n* bewaken van voortgang, deadlines en kwaliteit van releases;\n* blokkades voor het developmentteam signaleren en waar mogelijk wegnemen;\n* Actief bijdragen aan een efficiënt en overzichtelijk ontwikkelproces;\n* continu zoeken naar manieren om onze producten beter, gebruiksvriendelijker en relevanter te maken.\n\n**Wat zoeken wij?**\n\nWe zoeken iemand die makkelijk schakelt tussen techniek, gebruikers en organisatie. Je houdt overzicht, durft keuzes te maken en vindt het leuk om samen met een team aan een innovatief product te bouwen.\n\n**Je hebt:**\n\n* ervaring als Product Owner, Business Analyst of Project Manager binnen een Agile ontwikkelomgeving;\n* ervaring met project- en issuetrackingsoftware, zoals Jira, of YouTrack;\n* sterke communicatieve en organisatorische vaardigheden;\n* een goede beheersing van zowel Nederlands als Engels;\n* het vermogen om verschillende belangen te vertalen naar duidelijke prioriteiten.\n\n**Mooi meegenomen:**\n\n* minimaal 2 jaar werkervaring als Product Owner;\n* affiniteit met psychologie, geestelijke gezondheidszorg of onderwijs;\n* interesse in nieuwe technologieën zoals Virtual Reality, AI en interactieve software.\n\n**Wat bieden wij?**\n\nBij CleVR krijg je de kans om te werken aan technologie die niet alleen innovatief is, maar ook daadwerkelijk wordt ingezet om mensen te helpen, professionals te trainen en behandelingen te verbeteren.\n\n**Je kunt rekenen op:**\n\n* werken met de nieuwste ontwikkelingen op het gebied van Virtual Reality en interactieve technologie;\n* een betekenisvolle functie b", "source": "indeed"}, {"company": "OCTA Farmacie Groep", "job_title": "Product Owner", "location": "Almere, FL, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Octa-Farmacie-Groep", "job_url": "https://nl.indeed.com/viewjob?jk=4c328e846e290eb9", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-19", "recruiter_email": null, "applicant_count": null, "description": "**Over Fresco Farma, onderdeel van OCTA Farmacie Groep**\n\nFresco Farma is de farmaceutische groothandel van de OCTA Farmacie Groep en toonaangevend in instellingsfarmacie en kliniekfarmacie. Vanuit onze locatie in Almere verzorgen we dagelijks de inkoop, het assortimentsbeheer, de opslag, central filling en distributie van geneesmiddelen voor instellingsapotheken en zorginstellingen door heel Nederland: snel, nauwkeurig en foutloos, ook onder soms lastige omstandigheden. Zo krijgen apotheken de ruimte om zich volledig te richten op hun zorgtaak.\n\nBij Fresco Farma werk je in een hecht en divers team waarin samenwerking centraal staat, met korte lijntjes en een informele sfeer. Je krijgt volop kansen om jezelf te ontwikkelen binnen de OCTA Farmacie Groep, via trainingen of doorgroei in je functie.\n\nOCTA Farmacie Groep is een landelijke farmaceutische organisatie met meer dan 900 medewerkers, bestaande uit 60+ openbare apotheken, instellingsapotheken, een kliniekapotheek en Fresco Farma als eigen groothandel en hub-organisatie. Zie ook www.frescofarma.nl en www.octa.nl.\n\n**Over de rol**\n\nAls Product Owner van het Core-team bepaal jij wat onze productiesoftware elke week beter maakt. Je stuurt het team dat de software beheert en verbetert voor de Central Fill-hubs, Local Fill in de instellingsapotheek en de GDS-productie.\n\nOCTA bouwt de kernsoftware zelf: OCTAfill voor de hubs en Local Fill, en Panacea voor de GDS-productie. Je ziet jouw keuzes daardoor binnen weken terug op de werkvloer. Je houdt overzicht, prioriteert en stemt af met stakeholders.\n\n**Het team**\n\nJe werkt dagelijks met de engineers van Core en stakeholders van de hubs en instellingsapotheek. Je rapporteert aan de manager digitale transformatie en schakelt daarnaast met de people lead en lead-engineers. Het IT-team werkt met Python, PostgreSQL, GitLab en Linear.\n\n**Wat ga je doen?**\n\n**Per onderdeel**\n\n* Hubs: vertaal wensen van de hubs naar verbeteringen in OCTAfill, OCTAcheck en OCTAtrace en zorg dat de software meegroeit met het aantal aangesloten apotheken.\n* Local Fill: beheer de backlog voor OCTAfill in de instellingsapotheek, waar dezelfde software draait als in de hubs, met eigen variaties.\n* GDS: wees eigenaar van de backlog van Panacea en zorg dat de GDS-productie stabiel en efficiënt draait.\n\n**Voor het hele team**\n\n* Haal wensen en knelpunten op bij gebruikers en kwaliteit en vertaal deze naar heldere user stories met acceptatiecriteria.\n* Houd één geprioriteerde backlog bij in Linear en plan het werk per cyclus samen met de engineers.\n* Weeg beheer, incidenten en verbeteringen tegen elkaar af, accepteer opgeleverd werk en informeer gebruikers en stakeholders over veranderingen.\n\n**Wat breng je mee?**\n\n* Hbo- of wo-denkniveau en minimaal 3 jaar ervaring als Product Owner, business analist of in een vergelijkbare rol binnen een softwareteam.\n* Ervaring met software voor operationele processen, zoals productie, logistiek of fulfilment.\n* Ervaring met backlogbeheer, user sto", "source": "indeed"}, {"company": "Vattenfall", "job_title": "Product Owner - Mijn Vattenfall Zakelijk", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Vattenfall", "job_url": "https://nl.indeed.com/viewjob?jk=6238888687503d2e", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "**Bedrijfsomschrijving**\n\nVattenfall is één van de grootste energiebedrijven in Europa. We maken stroom en warmte en leveren energie aan miljoenen klanten. Dat doen we in Zweden, Duitsland, het Verenigd Koninkrijk, Frankrijk, Denemarken, Finland én Nederland.\n\nMet zo’n 21.000 werknemers maken we een toekomst mogelijk waarin we voor onze energie minder afhankelijk zijn van het gebruik van fossiele brandstoffen. We lopen voorop in de transitie naar een duurzaam energiesysteem. Om dit ambitieuze doel te kunnen bereiken zijn wij op zoek naar getalenteerde personen die naast hun passie voor hun eigen rol ook een sterke teamspirit hebben en willen bijdragen aan het ondersteunen van een betekenisvolle bedrijfsmissie.\n\n **Vacatureomschrijving**\n\n***Met eigenaarschap en initiatief is er altijd een weg.***\n\nWil jij bepalen hoe onze grootzakelijke klanten hun energiezaken digitaal regelen? Als Product Owner Mijn Vattenfall Zakelijk vertaal je klantbehoeften en bedrijfsdoelstellingen naar digitale oplossingen die onze dienstverlening toegankelijker, slimmer en eenvoudiger maken.\n\n**Over de rol**\n\nMijn Vattenfall Zakelijk is de digitale omgeving voor onze grootzakelijke klanten. Zij krijgen hier inzicht in hun energieverbruik en contractgegevens en kunnen zelf contractzaken regelen, zoals het aanpassen of verlengen van een contract. Ook ontwikkelen we online verkoopmogelijkheden en API’s waarmee klanten gegevens kunnen uitwisselen met hun eigen systemen.\n\nAls Product Owner ben je verantwoordelijk voor de verdere ontwikkeling van deze digitale omgeving. Je werkt nauw samen met developers, testers, UX-specialisten, andere Product Owners en collega’s uit onder meer product- en procesmanagement. Samen bepalen jullie wat wordt ontwikkeld, waarom dit belangrijk is en in welke volgorde het wordt gerealiseerd.\n\nJe maakt deel uit van het Digital Expert Team binnen de zakelijke markt en rapporteert aan de Manager Digital Expert Team. In deze rol combineer je klantgericht denken met commerciële kansen en technische uitvoerbaarheid. Daarmee help je zakelijke klanten hun energiezaken steeds makkelijker en zelfstandiger te organiseren.\n\n**Jouw taken en verantwoordelijkheden**\n\n* Je ontwikkelt en communiceert een heldere productvisie en vertaalt deze naar een roadmap en geprioriteerde backlog.\n* Je houdt overzicht over de roadmap en lopende sprints en duikt waar nodig in de inhoudelijke details.\n* Je beoordeelt nieuwe verzoeken, bewaakt de focus van het team en maakt duidelijke keuzes over prioriteiten.\n* Je geeft vorm aan de inzet van AI binnen het product en in de manier waarop het team analyseert, ontwikkelt en test.\n* Je versterkt samen met het team de agile manier van werken, zowel binnen het team als in de samenwerking met andere afdelingen.\n* Je werkt dagelijks samen met developers, testers, UX-specialisten, stakeholders en andere Product Owners aan de voorbereiding en implementatie van epics, features en user stories.\n* Je brengt wensen en requirements vanuit de org", "source": "indeed"}, {"company": "GlobalOrange", "job_title": "Product Manager", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Globalorange", "job_url": "https://nl.indeed.com/viewjob?jk=3651a1dcf839e828", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Amsterdam · hybride\n\n32–40 uur\n\nBouw digitale producten die echt impact maken, sneller en slimmer met AI. Bij GlobalOrange bouwen we SaaS-producten en platformen voor startups, scale-ups en grotere bedrijven. Als Product Manager ben jij de schakel tussen klant en team: je begrijpt wat de klant nodig heeft, stuurt op waarde en zorgt dat het juiste product op de juiste manier wordt gebouwd.\n\nSolliciteer nu\n\n**Productmanagement met AI**\n----------------------------\n\nAI speelt daarin op twee manieren een grote rol. We gebruiken AI en agents om sneller en beter te bouwen, en we bouwen AI-functionaliteit in de producten van onze klanten, zodat hun eindgebruikers er echt iets aan hebben. Jij snapt beide kanten: hoe je een project met AI aanstuurt, en waar AI in een product waarde toevoegt (en waar niet).\n\nJe werkt nauw samen met onze engineers en architecten aan innovatieve producten. Je bent analytisch sterk, communiceert helder en krijgt energie van klantcontact en productstrategie.\n\n**Wat je gaat doen**\n--------------------\n\n### **Het product**\n\n* Je ontdekt samen met de klant wat écht belangrijk is voor hun eindgebruikers.\n* Je ziet kansen om AI in het product in te zetten, zoals beeldherkenning en -generatie, het automatisch plannen van activiteiten of LLM-integraties en MCP-servers, en je weegt waarde af tegen kosten, risico’s en kwaliteit.\n* Je maakt impact met slimme keuzes: wat bouwen we wel, wat juist niet?\n* Je prioriteert features, beheert de roadmap en bewaakt voortgang en budget.\n\n### **Het project**\n\n* Je stuurt projecten aan waarin AI en agents een groot deel van het bouwwerk doen.\n* Je zorgt voor heldere specificaties en tickets, waar zowel developers als agents mee verder kunnen.\n* Je trekt samen op met een engineer: belangrijke keuzes, zoals het introduceren van AI in een klantproduct, neem je niet alleen.\n* Je communiceert helder en regelmatig met de klant en het team, ook over wat AI wel en niet kan.\n\n### **Het team**\n\n* Je deelt wat werkt en wat niet, zodat het hele team het volgende project sneller en beter doet.\n* Je bouwt mee aan onze gezamenlijke standaarden, tooling en werkwijze, onder andere in onze Product & Tech Guild.\n\n**Jij brengt mee**\n------------------\n\n* 3 tot 5\\* jaar ervaring in digital product ownership of projectmanagement.\n* Je spreekt en schrijft **vloeiend Nederlands én Engels**.\n* Je werkt dagelijks met AI-tools en weet uit ervaring hoe je ze inzet om sneller en beter te werken.\n* Je begrijpt hoe AI-functionaliteit in een product werkt, wat het kost en waar het mis kan gaan, en je kunt dat helder uitleggen aan een klant.\n* Je hebt AI-features in een product gezien of helpen bouwen, of je kunt laten zien hoe je dat zou aanpakken.\n* Je hebt affiniteit met tech en praat makkelijk met developers en architecten.\n* Je hebt een sterk analytisch vermogen en denkt altijd een stap vooruit.\n* Je krijgt energie van klantcontact en het achterhalen van hun échte behoefte.\n* Je werkt gestructureerd, houdt overzicht en neemt ", "source": "indeed"}, {"company": "Inkubis", "job_title": "Product Owner AI bij Flowmark", "location": "Amsterdam Westpoort, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Inkubis", "job_url": "https://nl.indeed.com/viewjob?jk=9b4bd859479fb8e3", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "**Product Owner AI bij Flowmark**\n\nPraten over AI kan iedereen. Jij bouwt er liever iets mee.\n\nMet Flowmark beginnen we iets nieuws. Flowmark is een Integratie Intelligentie platform dat organisaties helpt hun integraties beter te begrijpen en beheersen. Het geeft management en teams meer grip op risico’s, continuïteit en veranderingen, zonder dat zij zich hoeven te verdiepen in alle onderliggende technische details.\n\nAls Product Owner be g behaviors of simplification, collaboration, and accountability, to achieve our goals. You will join a passionate sales organization working closely with Medical and Market Access colleagues to make a real difference for patients living with dermatological diseases.\n\n  \n\n**Your role**\n\n  \n\nAs **Product Specialist Dermatology,** you are responsible for driving sustainable sales growth in your assigned territory by developing strong, trust-based relationships with dermatologists. You act as a trusted partner, combining strong business acumen with deep product and disease knowledge, always keeping the patient at the center of everything you do.\n\n  \n\n*Your primary tasks will include:*\n\n  \n\n* Building and managing long-term partnerships with dermatologists in your territory\n* Executing the national sales strategy and achieving agreed sales targets\n* Developing and implementing territory business plans and account strategies\n* Collecting and sharing market and customer insights to support cross functional decision-making\n* Planning, documenting, and reporting activities accurately in CRM and related systems\n\n  \n\nPlease take in account that this is a field position, you will be expected to visit professionnals at their office.\n\n  \n\n*The role offers:*\n\n  \n\n* A high-impact commercial role in a leading dermatology-focused pharmaceutical company\n* Continuous scientific and professional development in a fast-evolving therapy area\n* The opportunity to shape your territory and make a visible impact on patient outcomes\n* An open, dynamic work culture where your initiatives and ideas are valued\n* international environment, training programs, flexibility, and genuine career de", "source": "indeed"}, {"company": "stichd", "job_title": "Creative Director Product", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Stichd", "job_url": "https://nl.indeed.com/viewjob?jk=d7313c6ed349a4d5", "visa_support": null, "relocat ey moments, turning speed into a differentiator ;\n* Translate real-time consumer insights (e.g. trackside, DTC) into scalable products that meet fan expectations;\n* Build focused assortments and capsule drops that drive engagement, conversion and sell-through.\n\n**Your Talent**\n\nYou bring the creative vision, product instinct and commercial sharpness to shape collections that move at the speed of culture — and perform in the real world.\n\n  \n  \n\n**You have:**  \n\n* 10+ years of experience in a senior creative or product leadership role within sport, fashion, lifestyle or a connected consumer goods environment;\n* A proven track record of working with global brands, preferably within a licensing, partnership or brand-led product environment;\n* Strong experience in building multi-year product visions and translating them into clear seasonal strategies, concepts and roadmaps;\n* A deep understanding of technical product development, ideally within first-layer categories such as socks, bodywear and underwear;\n* Experience creating high-volume, commercially successful product ranges that balance brand heat, consumer relevance, qual", "source": "indeed"}, {"company": "stichd", "job_title": "Product Manager Essentials", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Stichd", "job_url": "https://nl.indeed.com/viewjob?jk=81f353ce61f149d6", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "**The Job**\n\nThe Product Management department oversees the end-to-end product process, ensuring the full collection is delivered on time. As Product Manager, you align the collection with market needs and the stichd strategy by connecting internal processes and creative teams. You act as the central coordinator across Product Development, Product Design, Operations, Marketing, and Sales.\n  \n  \nWorking with a brand focus across several product utch)", "location": "Utrecht, Netherlands", "careers_url": "https://nl.linkedin.com/company/us3-consulting", "job_url": "https://www.linkedin.com/jobs/view/4488142077", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-06", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "allnex", "job_title": "Global Maintenance Program Lead", "location": "Bergen op Zoom, North Brabant, Netherlands", "careers_url": "https://de.linkedin.com/company/allnex", "job_url": "https://www.linkedin.com/jobs/view/4484641846", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Booking.com", "job_title": "Technical Program Manager - ServiceNow", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/booking.com", "job_url": "https://www.linkedin.com/jobs/view/4491760966", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-18", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "LTM", "job_title": "Program Manager – IT Integration", "location": "Rotterdam, South Holland, Netherlands", "careers_url": "https://in.linkedin.com/company/ltm-larsenandtoubrocompany", "job_url": "https://www.linkedin.com/jobs/view/4488694010", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Murphy AI", "job_title": "Forward Deployed Engineer, Mid-Market - Amsterdam", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Murphy-Ai", "job_url": "https://nl.indeed.com/viewjob?jk=241c4c547c7fbfc3", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-31", "recruiter_email": null, "applicant_count": null, "description": "**Murphy** deploys AI agents for banks starting with the most straightforward business case: **voice AI for debt collection**. We’ve built a fully-fledged platform designed to optimize recovery rates while maintaining respectful and personalized communication.\n\nOur AI-powered agents adapt instantly, engaging with debtors across channels like voice, messengers, email and SMS to maximize results while preserving trust.\n\nWe’re live with **Santander, Revolut, BBVA** and dozens others. We’ve proven the product in large-scale pilots with top-tier banks. And now we need to move fast to **secure leadership in this $300Bn+ industry**.\n\n#### **About the team**\n\nOur mid-market customers need a collections agent that works within weeks. To do that for many customers at once, we rely on standard workflows, reusable components and strong tooling, tuned to each customer segment.\n\nForward Deployed Engineers on the mid-market team launch these agents and keep improving the system behind them. Each launch should be faster and more reliable than the last.\n\n#### **About the role**\n\nAs a Forward Deployed Engineer on the mid-market team, you run several implementations in parallel, each taking a customer from kickoff to a live agent in about four weeks. You configure agents on Murphy's platform using our templates, adapt them to each customer, and test them before launch. After go-live, you track how each agent performs, explain the results to the customer, and tune the agent and contact strategy. Over time, you improve those templates and tools so the whole team can deliver more with less effort.\n\nThis is also where new FDEs at Murphy learn the craft. Strong mid-market FDEs move on to our enterprise team, which builds custom deployments for banks.\n\n**You'll be based in Amsterdam and launch agents for lenders, telcos, utilities, healthcare providers and servicers in the Netherlands.**\n\n#### **In this role, you will**\n\n* Run multiple mid-market implementations at the same time, from kickoff to go-live, on a fixed timeline.\n* Configure and adapt agents from our segment templates to each customer's policies, products and tone.\n* Configure how and when we reach debtors: call windows, retry and frequency rules within each country's regulations, channel mix (voice, SMS, RCS, WhatsApp), payment links and hand-offs to human agents.\n* Set up customer data imports and exports using our standard integration flows.\n* Test agents with simulations and evaluations before launch, and fix what fails.\n* Analyze production performance (contact rates, promises, payments, funnel) with SQL and dashboards, explain results to customers, and turn findings into agent or strategy improvements.\n* Spot repeated work across implementations and turn it into templates, scripts or tooling.\n* Help shape the standard workflow for each segment (telco, utilities, healthcare, servicers, lenders).\n* Hand over live customers to our Deployment Strategists with clear documentation.\n* Share product gaps and cu", "source": "indeed"}, {"company": "Murphy AI", "job_title": "Forward Deployed Engineer, Enterprise - Amsterdam", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Murphy-Ai", "job_url": "https://nl.indeed.com/viewjob?jk=6157f6e81497cbac", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-31", "recruiter_email": null, "applicant_count": null, "description": "**Murphy** deploys AI agents for banks starting with the most straightforward business case: **voice AI for debt collection**. We’ve built a fully-fledged platform designed to optimize recovery rates while maintaining respectful and personalized communication.\n\nOur AI-powered agents adapt instantly, engaging with debtors across channels like voice, messengers, email and SMS to maximize results while preserving trust.\n\nWe’re live with **Santander, Revolut, BBVA** and dozens others. We’ve proven the product in large-scale pilots with top-tier banks. And now we need to move fast to **secure leadership in this $300Bn+ industry**.\n\n#### **About the team**\n\nCollections agents only work in production when someone owns the build in detail. Each one handles regulated conversations, sensitive customer situations and payment outcomes, and has to behave correctly every time.\n\nForward Deployed Engineers own that build. They turn a customer's collections strategy, policies and systems into a working agent, prove it in a POC, and take it to full production. They work with Account Executives during the sale, with Deployment Strategists after go-live, and with Product and Engineering to make the platform better with every deployment.\n\n#### **About the role**\n\nAs a Forward Deployed Engineer, you own the technical execution of AI agent builds for our enterprise customers, mainly banks and large lenders. You scope with the customer's technical and operations leads, design the agent, build and test it, and launch it on their systems. After launch, you own the agent's performance: you analyze production data, explain results to the customer, and decide what to change in the agent and the contact strategy. Each deployment should leave behind patterns, tools and tests that make the next one faster.\n\n**You'll be based in Amsterdam and lead enterprise deployments for banks and large lenders in the Netherlands.**\n\n#### **In this role, you will**\n\n* Own end-to-end delivery of enterprise agent builds, from POC scoping through implementation, evaluation and production launch.\n* Define the agent operating procedures (actions, guardrails, escalations) with the customer, and turn them into agent behavior.\n* Design and engineer the prompt and agent logic that drives identification, negotiation and payment conversations, across languages and channels.\n* Configure Murphy to fit each client’s needs on how and when to reach debtors: call windows, retry and frequency rules within each country's regulations, channel mix (voice, SMS, RCS, WhatsApp), payment links and hand-offs to human agents.\n* Build evaluation and simulation harnesses, plus regression tests against real call outcomes, to catch errors and drift before customers do.\n* Build, validate and maintain integrations with customer systems: core banking, collections platforms, data pipelines, telephony.\n* Diagnose failures from transcripts, traces and logs, find the root cause, and fix it in the agent or flag it to Engineering.\n", "source": "indeed"}, {"company": "Utilus", "job_title": "Senior Product Manager", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/utilus", "job_url": "https://www.linkedin.com/jobs/view/4494156279", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-24", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Sendcloud", "job_title": "Senior Product Manager", "location": "Eindhoven, North Brabant, Netherlands", "careers_url": "https://nl.linkedin.com/company/sendcloud", "job_url": "https://www.linkedin.com/jobs/view/4448554728", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-21", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Wolters Kluwer", "job_title": "Director, Product Strategy & Transformation", "location": "Alphen aan den Rijn, South Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/wolters-kluwer", "job_url": "https://www.linkedin.com/jobs/view/4492149160", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-19", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Optics11", "job_title": "Senior Product Manager (Towed Array Solutions)", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/optics11bv", "job_url": "https://www.linke rtners.\n\nJij bent de perfecte match voor Zeppelin Power als je daarnaast beschikt over de volgende vaardigheden en ervaring:\n\n* Een afgeronde technische hbo-opleiding, bijvoorbeeld Werktuigbouwkunde;\n* Meerdere jaren relevante technische ervaring met dieselmotoren en hun toepassingen;\n* Gedegen kennis van dieselmotoren, generatorsets en aandrijfsystemen en ervaring met mechanische en elektrotechnische storingsdiagnose;\n* Ervaring met troubleshooting, failure analysis en root cause analysis;\n* Ervaring met of kennis van inbedrijfstelling, proefvaarten en prestatievalidatie;\n* Kennis van relevante technische principes zoals stromingsleer en warmteoverdracht;\n* Kennis van technische vakgebieden zoals productbetrouwbaarheid, conditiebewaking en trendanalyse, waaronder olie- en brandstofanalyse, trillingsanalyse en sys", "source": "indeed"}, {"company": "Chroma ATE Europe", "job_title": "Product Specialist", "location": "Maarssen, Utrecht, Netherlands", "careers_url": "https://nl.linkedin.com/company/chromaateeurope", "job_url": "https://www.linkedin.com/jobs/view/4493097428", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-25", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Lely", "job_title": "Commercieel product specialist milking", "location": "Nederland, Overijssel, Netherlands", "careers_url": "https://nl.linkedin.com/company/lely-industries-nv", "job_url": "https://www.linkedin.com/jobs/view/4469853254", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-24", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Lely", "job_title": "Commercial Product Specialist", "location": "Maassluis, South Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/lely-industries-nv", "job_url": "https://www.linkedin.com/jobs/view/4404081460", "visa_support": null, "relocation_support": null, "date_p p our community improve lives, protect nature, and ensure just transitions. Data of all kinds sits at the heart of how WRI", "source": "indeed"}, {"company": "Nopan", "job_title": "GTM Lead", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://www.linkedin.com/company/nopan", "job_url": "https://www.linkedin.com/jobs/view/4494435180", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-24", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Supermicro", "job_title": "Sr. Product Manager", "location": "’s-Hertogenbosch, North Brabant, Netherlands", "careers_url": "https://www.linkedin.com/company/supermicro", "job_url": "https://www.linkedin.com/jobs/view/4454820031", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-09", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Sogeti", "job_title": "Forward Deployed Engineer", "location": "Groningen, GR, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Sogeti", "job_url": "https://nl.indeed.com/viewjob?jk=451cfcb3dfb70ec7", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "**Word de beste versie van jezelf als Forward Deployed Engineer**\n-----------------------------------------------------------------\n\nBij Sogeti krijg je de ruimte om te groeien als professional, collega en mens. Als Forward Deployed Engineer bevind jij je op het snijvlak van AI, software engineering, architectuur en consultancy. Je werkt samen met gelijkgestemde experts die kennis delen, elkaar uitdagen en continu willen verbeteren. In deze rol krijg je de vrijheid om samen met klanten innovatieve AI-, data- en automation-oplossingen te realiseren die daadwerkelijk impact maken. Je werkt aan vraagstukken die ertoe doen, leert continu nieuwe technologieën en aanpakken kennen   'tno': 'Industrial',
};

function getSector(company) {
  const cl = company.toLowerCase();
  for (const [key, sec] of Object.entries(SECTOR_MAP)) {
    if (cl.includes(key)) return sec;
  }
  return 'Other';
}

// ── Match scoring ─────────────────────────────────────────────────────────────
function scoreJob(j) {
  const title = (j.job_title || '').toLowerCase();
  const company = (j.company || '').toLowerCase();
  const sector = getSector(j.company);
  const desc = (j.description || '').toLowerCase().slice(0, 800);
  let score = 0;

  // Role type (0–50)
  const ROLES = [
    [50, ['technical product manager','product manager','productmanager','product management']],
    [48, ['associate product manager','apm']],
    [44, ['product owner','product lead','product builder']],
    [42, ['product operations','product ops','product strategy','product strategist','growth product','growth manager','growth lead']],
    [38, ['product analyst','go-to-market','gtm']],
    [36, ['technical program manager','program manager','programme manager','tpm']],
    [32, ['business analyst','product specialist']],
    [20, ['forward deployed']],
    [25, ['head of product','director of product','vp of product']],
  ];
  for (const [pts, kws] of ROLES) {
    if (kws.some(k => title.includes(k))) { score += pts; break; }
  }
  if (score === 0) score += 15;

  // Sector fit (0–30)
  score += ({ Tech:30, Industrial:22, Energy:22, Finance:20, FMCG:14, Consulting:12, Other:12 })[sector] || 12;

  // Company bonus (0–20)
  const CO = [
    [20, ['adyen','booking','uber','databricks','prosus','backbase','catawiki','tomtom','mollie','bol.com','just eat','coolblue','exact']],
    [16, ['asml','nxp','signify','philips','wolters kluwer','vanderlande','tno']],
    [14, ['shell','eneco','vattenfall','tennet','alliander','stedin','orsted','ørsted','sbm offshore','neste','fugro']],
    [12, ['ing ','rabobank','abn amro','nn group','aegon','van lanschot']],
    [10, ['unilever','heineken','akzonobel','dsm','firmenich','ahold','frieslandcampina']],
    [6,  ['bcg','bain','mckinsey','oliver wyman','kearney','strategy&','roland berger','ey-parthenon','deloitte','accenture']],
  ];
  for (const [pts, kws] of CO) {
    if (kws.some(k => company.includes(k))) { score += pts; break; }
  }

  // Keyword signals in title/desc (+0–10)
  let bonus = 0;
  for (const [kw, pts] of [['product',3],['platform',2],['data',2],['growth',2],['energy',2],
      ['roadmap',2],['b2b',1],['saas',1],['analytics',1],['strategy',1]]) {
    if (title.includes(kw)) bonus += pts;
    else if (desc.includes(kw)) bonus += Math.round(pts / 2);
  }
  score += Math.min(10, bonus);
  score = Math.min(100, score);
  // She has no full-time PM job yet, so seniority in the title bounds the fit.
  if (/\b(vp|vice president|head of|director|chief|cpo)\b/i.test(title)) return Math.min(score, 25);
  if (/\b(principal|group|staff|lead)\b/i.test(title)) return Math.min(score, 40);
  if (/\b(senior|sr\.?|expert)\b/i.test(title)) return Math.min(score, 60);
  if (/\b(associate|junior|jr\.?|new grad|graduate|entry|apm)\b/i.test(title)) return Math.min(100, score + 10);
  return Math.min(score, 85);
}

// v2: stores {s, r} objects — bump key if schema changes again
const AI_SCORES_KEY = 'vanshika_ai_scores_v3';
function getAiScores() { try { return JSON.parse(localStorage.getItem(AI_SCORES_KEY) || '{}'); } catch { return {}; } }
function saveAiScores(obj) { try { localStorage.setItem(AI_SCORES_KEY, JSON.stringify(obj)); } catch {} }

function getEffectiveScore(j) {
  // Priority: localStorage (user-triggered) > j.ai_score (server-side) > JS rules
  const entry = getAiScores()[jobKey(j)];
  if (entry) return { score: entry.s, reason: entry.r || '', ai: true };
  if (j.ai_score !== undefined) return { score: j.ai_score, reason: '', ai: true };
  return { score: scoreJob(j), reason: '', ai: false };
}

function matchBadgeHtml(score, isAi, reason) {
  let cls;
  if (score >= 85) cls = 'ex';
  else if (score >= 70) cls = 'str';
  else if (score >= 55) cls = 'gd';
  else if (score >= 40) cls = 'ok';
  else cls = 'low';
  const sup    = isAi ? '<sup style="font-size:8px;margin-left:1px">AI</sup>' : '';
  const tipTxt = isAi && reason ? reason : (isAi ? 'AI-scored by Claude' : 'Keyword match score');
  return `<span class="match-badge match-${cls}" title="${esc(tipTxt)}">${score}%${sup}</span>`;
}

// ── AI batch scoring ──────────────────────────────────────────────────────────
async function aiScoreAll() {
  let apiKey = localStorage.getItem('vanshika_claude_api_key');
  if (!apiKey) {
    const k = prompt('Enter your Claude API key (sk-ant-…) to enable AI scoring:');
    if (!k || !k.trim()) return;
    apiKey = k.trim();
    localStorage.setItem('vanshika_claude_api_key', apiKey);
  }
  const btn = document.getElementById('ai-score-btn');
  btn.disabled = true; btn.textContent = '⏳ Scoring…';

  const aiScores = getAiScores();
  const unscored = JOBS_DATA.filter(j => !aiScores[jobKey(j)]);
  if (!unscored.length) {
    btn.disabled = false; btn.textContent = '✨ Re-score with AI';
    applyFilters(); return;
  }

  const BATCH = 8;   // smaller batches — full descriptions fit comfortably
  let done = 0;
  try {
    for (let i = 0; i < unscored.length; i += BATCH) {
      const batch = unscored.slice(i, i + BATCH);

      const jobLines = batch.map((j, idx) => {
        const sector  = getSector(j.company);
        const desc    = (j.description || '').trim().slice(0, 1200);
        const descTxt = desc ? `\n   Description: ${desc}` : '';
        return `${idx}. Company: ${j.company} | Role: ${j.job_title} | Location: ${j.location || 'Netherlands'} | Sector: ${sector}${descTxt}`;
      }).join('\n\n');

      const userMsg = `Score these ${batch.length} roles for Vanshika. Reply ONLY with a JSON array — no other text:\n[{"i":0,"s":88,"r":"one sentence why"}, ...]\n\nRoles:\n${jobLines}`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-beta': 'prompt-caching-2024-07-31',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 600,
          system: [{
            type: 'text',
            text: AI_SYSTEM_PROMPT,
            cache_control: { type: 'ephemeral' },
          }],
          messages: [{ role: 'user', content: userMsg }],
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'API ' + res.status);
      }
      const data = await res.json();
      const text = data.content?.[0]?.text || '[]';
      const match = text.match(/\[[\s\S]*\]/);
      if (match) {
        const parsed = JSON.parse(match[0]);
        for (const {i, s, r} of parsed) {
          if (batch[i]) {
            aiScores[jobKey(batch[i])] = {
              s: Math.min(100, Math.max(0, Math.round(s))),
              r: (r || '').slice(0, 120),
            };
          }
        }
      }
      done += batch.length;
      btn.textContent = `⏳ ${done}/${unscored.length}…`;
      saveAiScores(aiScores);
    }
    btn.textContent = '✅ AI Scored!';
  } catch(e) {
    btn.textContent = '⚠ Error — Retry?';
    console.error('AI scoring error:', e);
  } finally {
    btn.disabled = false;
    applyFilters();
    setTimeout(() => { if (btn.textContent !== '⚠ Error — Retry?') btn.textContent = '✨ Re-score with AI'; }, 3000);
  }
}

// ── Job utils ─────────────────────────────────────────────────────────────────
function jobKey(j) { return j.job_url || (j.company + '|' + j.job_title); }

const LS_KEY = 'vanshika_job_statuses';
let statuses = {};
try { statuses = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch {}

function setStatus(key, val) {
  if (val) statuses[key] = val;
  else delete statuses[key];
  localStorage.setItem(LS_KEY, JSON.stringify(statuses));
  applyFilters();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(raw) {
  if (!raw) return null;
  try {
    const d = new Date(raw);
    if (isNaN(d)) return null;
    const diff = Math.round((Date.now() - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff <= 6) return diff + 'd ago';
    if (diff <= 30) return Math.round(diff/7) + 'w ago';
    return d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
  } catch { return null; }
}

function statusLabel(s) {
  return {applied:'✅ Applied', interview:'🎯 Interview', offer:'🎉 Offer',
    rejected:'❌ Rejected', bookmarked:'🔖 Bookmarked'}[s] || '';
}

// ── Filters + sort ────────────────────────────────────────────────────────────
function applyFilters() {
  const search  = document.getElementById('search').value.toLowerCase();
  const sector  = document.getElementById('sector-filter').value;
  const statusF = document.getElementById('status-filter').value;
  const sourceF    = document.getElementById('source-filter').value;
  const sortBy     = document.getElementById('sort-by').value;
  const maxDays    = parseInt(document.getElementById('date-filter').value) || 0;
  const maxApplied = parseInt(document.getElementById('applicant-filter').value) || 0;
  const now        = Date.now();

  let filtered = JOBS_DATA.filter(j => {
    const key = jobKey(j);
    const jobStatus = statuses[key] || '';
    if (statusF === 'unreviewed' && jobStatus) return false;
    if (statusF && statusF !== 'unreviewed' && jobStatus !== statusF) return false;
    if (sector && getSector(j.company) !== sector) return false;
    if (sourceF && (j.source || 'crawler') !== sourceF) return false;
    if (maxDays && j.date_posted) {
      const d = new Date(j.date_posted);
      if (!isNaN(d) && (now - d.getTime()) > maxDays * 86400000) return false;
    }
    if (maxApplied) {
      const count = j.applicant_count;
      if (count == null || count >= maxApplied) return false;
    }
    if (search) {
      const hay = (j.company + ' ' + j.job_title + ' ' + (j.location||'') + ' ' + (j.notes||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  // Sort
  if (sortBy === 'score') {
    filtered.sort((a, b) => getEffectiveScore(b).score - getEffectiveScore(a).score);
  } else if (sortBy === 'date') {
    filtered.sort((a, b) => {
      const da = a.date_posted ? new Date(a.date_posted).getTime() : 0;
      const db = b.date_posted ? new Date(b.date_posted).getTime() : 0;
      return db - da;
    });
  } else if (sortBy === 'company') {
    filtered.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
  }

  renderJobs(filtered);
  updateStats();
}

function renderJobs(list) {
  const container = document.getElementById('list-container');
  const noRes = document.getElementById('no-results');
  if (!list.length) {
    container.innerHTML = '';
    noRes.style.display = 'block';
    document.getElementById('shown-count').textContent = '0';
    return;
  }
  noRes.style.display = 'none';
  document.getElementById('shown-count').textContent = list.length;

  container.innerHTML = list.map(j => {
    const key = jobKey(j);
    const status = statuses[key] || '';
    const sector = getSector(j.company);
    const dateStr = formatDate(j.date_posted);
    const notes = (j.notes || '').replace(/\[Direct link.*?\]/g,'').trim();
    const src = j.source || 'crawler';
    const srcLabel = {linkedin:'LinkedIn', indeed:'Indeed', glassdoor:'Glassdoor', crawler:'Portal'}[src] || src;
    const { score, reason, ai } = getEffectiveScore(j);
    const applicants = j.applicant_count != null
      ? `<span style="color:${j.applicant_count < 10 ? 'var(--green)' : j.applicant_count < 25 ? 'var(--yellow)' : 'var(--text-muted)'}">${j.applicant_count} applicants</span>`
      : '';
    // Recruiter: show email if known, else show "Find" search link for LinkedIn/Indeed jobs
    const recruiterHtml = j.recruiter_email
      ? `<a class="job-link secondary" href="mailto:${esc(j.recruiter_email)}" title="Email recruiter">${esc(j.recruiter_email.split('@')[0])}</a>`
      : (src !== 'crawler'
          ? `<a class="job-link secondary" href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent((j.company||'') + ' recruiter netherlands')}" target="_blank" rel="noopener" title="Find recruiter on LinkedIn">Find Recruiter</a>`
          : '');
    return `<div class="job-card status-${status || 'none'}">
      <div class="job-card-main">
        <div class="job-top">
          <span class="job-company">${esc(j.company)}</span>
          <span class="job-sector">${esc(sector)}</span>
          <span class="source-badge ${esc(src)}">${esc(srcLabel)}</span>
          ${matchBadgeHtml(score, ai, reason)}
        </div>
        <div class="job-title">${esc(j.job_title)}</div>
        <div class="job-meta">
          ${j.location ? '<span>' + esc(j.location) + '</span>' : ''}
          ${dateStr ? '<span>' + esc(dateStr) + '</span>' : ''}
          ${applicants}
          ${status ? '<span style="color:var(--accent)">' + statusLabel(status) + '</span>' : ''}
        </div>
        ${notes ? '<div class="job-notes">' + esc(notes) + '</div>' : ''}
      </div>
      <div class="job-actions">
        <a class="job-link" href="${esc(j.job_url || j.careers_url)}" target="_blank" rel="noopener">Apply →</a>
        ${recruiterHtml}
        ${j.careers_url && j.job_url && !j.recruiter_email ? '<a class="job-link secondary" href="' + esc(j.careers_url) + '" target="_blank" rel="noopener">Careers</a>' : ''}
        <select class="status-select" data-key="${esc(key)}" onchange="handleStatusChange(this)" title="Track status">
          <option value="" ${!status?'selected':''}>Track…</option>
          <option value="bookmarked" ${status==='bookmarked'?'selected':''}>🔖 Bookmark</option>
          <option value="applied" ${status==='applied'?'selected':''}>✅ Applied</option>
          <option value="interview" ${status==='interview'?'selected':''}>🎯 Interview</option>
          <option value="offer" ${status==='offer'?'selected':''}>🎉 Offer</option>
          <option value="rejected" ${status==='rejected'?'selected':''}>❌ Rejected</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

function handleStatusChange(sel) {
  const key = sel.getAttribute('data-key');
  setStatus(key, sel.value);
}

function updateStats() {
  const counts = {bookmarked:0, applied:0, interview:0, offer:0, rejected:0};
  for (const v of Object.values(statuses)) if (counts[v] !== undefined) counts[v]++;
  document.getElementById('chip-bookmarked').textContent = counts.bookmarked + ' Bookmarked';
  document.getElementById('chip-applied').textContent = counts.applied + ' Applied';
  document.getElementById('chip-interview').textContent = counts.interview + ' Interview';
  document.getElementById('chip-offer').textContent = counts.offer + ' Offer';
  document.getElementById('chip-rejected').textContent = counts.rejected + ' Rejected';
  document.getElementById('total-count').textContent = JOBS_DATA.length;
  document.getElementById('total-badge').textContent = JOBS_DATA.length + ' roles';
}

applyFilters();
</script>
