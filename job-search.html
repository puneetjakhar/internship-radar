  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    header { background: var(--surface); border-bottom: 1px solid var(--border);

    header h1 { font-size: 18px; font-weight: 700;

    .controls { padding: 16px 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input[type="text"], select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 9px 13px; font-size: 14px; outline: none;

    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    #search { flex: 1; min-width: 220px; font-size: 15px; }

    .stats-bar { padding: 10px 24px; display: flex; gap: 14px; align-items: center;
      font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .stats-bar strong { color: var(--text); }

    .stat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .stat-chip { font-size: 11px; padding: 3px 10px; border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); }
    .stat-chip.applied { background: rgba(34,197,94,0.1); color: var(--green); border-color: rgba(34,197,94,0.3); }

      align-items: flex-start; transition: border-color 0.2s; }

    .job-card.status-interview { border-left: 3px solid #60a5fa; }
    .job-card.status-offer { border-left: 3px solid var(--accent); }
    .job-card.status-rejected { border-left: 3px solid var(--red); opacity: 0.6; }
    .job-card.status-bookmarked { border-left: 3px solid var(--yellow); }

    .job-card-main { flex: 1; min-width: 0; }
    .job-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
    .job-company { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .job-sector { font-size: 10px; color: var(--text-muted); background: var(--surface2);

    .job-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 90px; flex-shrink: 0; }
    .job-link { font-size: 12px; padding: 6px 12px; border-radius: 6px; background: var(--accent);

    #no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); display: none; }
    #no-results h3 { font-size: 18px; margin-bottom: 8px; }
  </style>
</head>

: null, "description": "", "source": "linkedin"}, {"company": "ING", "job_title": "Product Manager – Physical Workplace & Physical Security Services", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ing", "job_url": "https://nl.indeed.com/viewjob?jk=0b509e5e9cb91ab0", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-26", "recruiter_email": null, "applicant_count": null, "description": "* REQ-10124576\n* 25/11/2026\n* Change Execution\n* Amsterdam, Netherlands\n* €6.728 - €10.753\n* ING Bank\n\n  \n\nPeople & Hubs shapes the employee experience and provides the technology capabilities, services and environments that help ING’s people and corporate functions perform at their best. Within People & Hubs, Corporate Technology serves ING globally with secure, scalable and sustainable products and platforms. Corporate Technology is moving to a product-led operating model with clearer end-to-end ownership, stronger alignment between product and engineering, and shared capabilities that can be scaled across the portfolio.\n\nThe Physical Workplace & Physical Security Services product family supports three distinct stakeholder domains: CREFS NL, CREFS Global and Personal and Physical Security Services (PPSS). Its portfolio comprises 20+ IT assets spanning real estate, facilities and workplace services, enterprise asset management, physical access and security operations.\n\n  \n  \n\nProduct & Experience owns the product-family strategy, outcomes, roadmaps, priorities, investment choices, adoption and value realisation. The Enterprise Platforms & Services IT Area provides technology and engineering accountability through the Physical Workplace & Physical Security Platforms chapter and, where applicable, through Platform Enablement & SaaS for shared capabilities and custodianship of maintenance-heavy SaaS.\n\n  \n  \n\nAs Product Manager IV – Physical Workplace & Physical Security Services, you own the product-family vision, strategy, integrated roadmaps and prioritised investment agenda across CREFS NL, CREFS Global and PPSS. You align stakeholder needs, user insights, business outcomes, cost, lifecycle, architecture, capacity and risk across the 20+ asset portfolio. Within the direction and governance set by the Tribe Lead Products, you are accountable for measurable outcomes, value and adoption, including the critical CREFS NL delivery agenda and PPSS DORA remediation.\n\n  \n  \n  \n\n**The Role and Team**\n\nYou are the individual-contributor product leader for this product family. The Tribe Lead Products leads Product & Experience, owns the overarching four-family portfolio and sets product-management standards. You translate that direction into one coherent product-family roadmap and investment agenda for CREFS NL, CREFS Global and PPSS.\n\n  \n  \n\nYou lead discovery, prioritisation, backlog direction, adoption, benefits and product performance. You prepare business cases and provide total-cost, value and service-economics insight for investment and recharge decisions. Together with the Tribe Lead Products, IT Area Lead and Chapter Leads, you shape priorities, capacity trade-offs, delivery commitments and risk responses. The IT Area Lead and engineering chapters remain accountable for technology strategy, engineering execution, operational service health, resilience, supplier performance and engineering capability.\n\n  \n  \n\nThe stakeholder environment is global, m", "source": "indeed"}, {"company": "Thales", "job_title": "Product Manager Engineering Support", "location": "Hengelo OV, OV, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Thales", "job_url": "https://nl.indeed.com/viewjob?jk=4fb80d00790c0082", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-25", "recruiter_email": null, "applicant_count": null, "description": "Location: Hengelo, Netherlands\n\n**Product Manager Engineering support**\n\n*32 - 40 hours per week, Hengelo*\n\n  \n\nIn fast changing markets, customers worldwide rely on Thales. Thales is a business where brilliant people from all over the world come together to share ideas and inspire each other. In aerospace, transportation, defense, security and space, our architects design innovative solutions that make our tomorrow's possible, today.  \n  \n*TOGETHER WE MAKE THE BIG AMBITIONS OF TOMORROW HAPPEN TODAY*  \nIn this position you will join the Thales Netherlands IS/IT team. IS/IT is at the core of the Thales digital transformation and there is a close relationship between IS/IT and business. With a team of 150 colleagues we provide IS/IT support to our 3000 NL colleagues in several Business Lines and functions. As a learning organization we fully embrace agile principles and strive for excellence by continuous improvement. We do not fear to fail as long as we can learn from it.  \n  \nWithin the Engineering support domain we support many applications. You are responsible for coordinating complex IT initiatives, working with, and influencing key stakeholders within the Engineering organization for alignment on the IS/IT projects and roadmap. Together with the Product Owners you are responsible for the successful implementation of projects (Epics). You take the lead, challenge your IT colleagues as well as business colleagues, and ensure that we are spending the IT resources in line with the most urgent business demand. Besides your NL scope, you also are an active contributor to the international communities through several ‘Value Towers’ in which you influence the international roadmaps and be an advocate for the Dutch stakes and interests.\n\n**About the job**  \nYour typical day will look as follows:  \nThe day starts with a brief standup of the Leadership team in which you update each other and pick up actions. Afterwards, take your time with a cup of coffee to work on some administrative tasks and questions. Then it is time to participate (as a spectator) in the standup of one of your teams.\n\nAfterwards, you have an international meeting to start up a new international project. Next, you have some 1-to-1 conversations with (international) IS/IT colleagues to know more about the impact of this new initiative.\n\nAfter lunch and a short walk you meet with the NL Product Owners within your domain to discuss what went well, what could be improved and where they need help. You maintain an aligned vision with the Product Owners and foster collaboration between Product Owners. You contact the Local Chapter Lead and Enterprise Architect to give an update about new activities/epics to be started. After this you participate in a steerco with business stakeholders to aggregate and prioritize IT demand. At the end of the day you sit down with the CIO to discuss challenges, celebrate successes and receive coaching.\n\n**Your responsibilities include:**\n\n* Aggregating dema", "source": "indeed"}, {"company": "Decent", "job_title": "Growth Lead – Authentic market leader", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Decent-8", "job_url": "https://nl.indeed.com/viewjob?jk=7091a138f8ca871a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-25", "recruiter_email": null, "applicant_count": null, "description": "Suppose you are the oldest independent (private) bank/asset manager in the Netherlands, how do you deal with fintech, a.i. big data and a completely new target group/generation of customers? Whether you are an entrepreneur, physician, executive, association/foundation or just wealthy private individual, the financial landscape has changed dramatically in recent years. Wealth building, pension or a mortgage, how do you know whether a product is suitable for you? However, wealth is more than just money. Creating social relevance and value for future generations is a great asset. This financial service provider has therefore been building a sustainable financial future for tomorrow's generations since 1737. In order to remain and/or become the market leader in various markets, they are looking for a (Senior) Growth Marketer to reach new customers.\n\n  \n\n**Characteristics of the organization:**\n  \nSince its foundation in 1737, every generation has ensured progress, innovation, relevance and value creation. Whether it concerns assets, mortgages, fiduciary management or investment strategies, Van Lanschot Kempen competes at the top in every target segment. With more than 100 billion under management, a position has been acquired in the market that demands continuous improvement and innovation. Van Lanschot Kempen, based in Amsterdam, believes that wealth is more than just money. That is why they commit themselves at several levels to initiatives in the field of art, culture, society and sustainability. As a result, they have received several awards regarding transparency, but they also receive a high rating from sustainalytics and the carbon disclosure project. In addition, they have their own foundation to give back to society. This involvement is reflected in mindset and behavior in all layers of the organization. The employees are characterized by professionalism, common sense, informality and enthusiasm.\n\nNow that the aging population is developing a new generation of wealthy target groups, there is a need for the next step in acquisition, awareness and activation. This is pioneered with multi-disciplinary teams of both local specialists who are responsible for a customer segment and from a center of excellence. These teams consist of both generalists and specialists and operate from the following core values: Accelerate – Advance – Act as one – Attract, develop and retain for Achievement. Their goal; preserving and building wealth in a sustainable way, both for our clients and for the society of which we are a part. Of course there are regulations to comply with, but the organization is characterized by autonomy, entrepreneurship and team success. They embrace digital as a tool to serve customers faster, more efficiently and effectively. Data is the engine for further personalization throughout the entire customer journey.\n\n  \n\n**What are you responsible for as a Growth Lead?**\n  \nSummarized in one sentence, your responsibility is to acquire and ac", "source": "indeed"}, {"company": "Rabobank", "job_title": "Lead Business Analyst - Tech4Ops", "location": "Utrecht, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Rabobank", "job_url": "https://nl.indeed.com/viewjob?jk=27d5ca1e46b1944d", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-24", "recruiter_email": null, "applicant_count": null, "description": "**This is what we offer you**\n-----------------------------\n\n* **Salary:** Gross monthly salary between EUR 5,994 and EUR 8,563 (scale 10) for a 36-hour work week.\n* **Extras:** a thirteenth month, 8% holiday allowance, and a 10% Employee Benefit Budget.\n* **Development budget:** EUR 1,400 development budget per year for your growth and development.\n* **Hybrid working:** a balance between home and office work (possible for most roles).\n* **Pension:** decide for yourself the amount of your personal contribution.\n\nOr view all our benefits.\n\nBuild and lead the Business Analysis capability that turns complex technology demand into clear decisions and executable work.\n\n**Summary**\n-----------\n\nAs Lead Business Analyst at Rabobank, you will build and lead the Business Analysis capability within Tech4Ops and personally lead complex analysis topics. You will turn ambiguous technology demand into clear options, evidence-based recommendations and executable initiatives for squads. You will work with Product Owners, engineers, architects, security specialists and technology leadership across observability, monitoring and IT operations.\n\n  \n\n* Work 36 to 40 hours per week.\n* Lead and develop a team of 6 to 8 Business Analysts within Tech4Ops.\n* Connect squad priorities with area-wide objectives, governance and dependencies.\n\n**Which results will you deliver as a Lead Business Analyst?**\n--------------------------------------------------------------\n\n* Establish a consistent Business Analysis capability with reusable standards, methods and quality expectations, so squads receive clear and actionable analysis.\n* Lead and develop the Business Analysis team through coaching, quality improvement and clear allocation of demand, priorities and capacity.\n* Own demand, intake and backlog management, including prioritisation, capacity planning, resource allocation and progress monitoring.\n* Personally lead complex cross-tool analyses and translate strategic technology objectives into feasible options, recommendations and executable initiatives.\n* Improve team effectiveness while giving analysts ownership and support when complexity increases.\n\n**Skills, tools and areas of expertise**\n----------------------------------------\n\n* Business analysis methods, including IST/SOLL analysis, gap analysis, process analysis, requirements engineering, impact assessment and solution option evaluation.\n* Demand and backlog management, including prioritisation, capacity planning and resource allocation across competing workstreams.\n* Agile and DevOps delivery, including CI/CD, automation, lifecycle ownership and collaboration between development and operations.\n* Technology operations, platform services and monitoring environments, with the ability to connect technical complexity to practical recommendations.\n* Clear verbal, written and visual communication for senior stakeholders, including executive-ready recommendations and presentations.\n\n**Together we achieve more than alone**\n-", "source": "indeed"}, {"company": "Rabobank", "job_title": "Product Owner Tech4Ops", "location": "Utrecht, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Rabobank", "job_url": "https://nl.indeed.com/viewjob?jk=c8eb27e12a0185b0", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-23", "recruiter_email": null, "applicant_count": null, "description": "**This is what we offer you**\n-----------------------------\n\n* **Salary:** Gross monthly salary between EUR 5,994 and EUR 8,563 (scale 10) for a 36-hour work week.\n* **Extras:** a thirteenth month, 8% holiday allowance, and a 10% Employee Benefit Budget.\n* **Development budget:** EUR 1,400 development budget per year for your growth and development.\n* **Hybrid working:** a balance between home and office work (possible for most roles).\n* **Pension:** decide for yourself the amount of your personal contribution.\n\nOr view all our benefits.\n\nLead Tech4Ops products impacting 9.5 million Rabobank customers and thousands of engineers, enabling ZeroOps through automation and operational excellence.\n\n**You & your role**\n-------------------\n\nShape the future of operations as Product Owner Tech4Ops by owning a strategic product domain within Tech4Ops. Translate the product vision into a clear roadmap and well-prioritized backlog, balancing customer needs, operational excellence, technical sustainability, security and compliance, business priorities, and innovation opportunities while maximizing value for customers, engineers, and Rabobank.\n\nOur mission is clear: minimize disruptions, maximize operational efficiency, enable compliance, and reduce operational overhead through standardization, automation, observability, security monitoring, and intelligent remediation.\n\n**Examples for practices**\n--------------------------\n\n* Define and continuously evolve the product vision and strategy, translating strategic ambitions into a roadmap with a 12-month horizon.\n* Prioritize the backlog to maximize customer and business value, deciding what functionality is delivered and when.\n* Drive data-driven decision making, measurable outcomes, and continuous improvement of operational efficiency and engineer experience.\n\n**Facts & figures**\n-------------------\n\n* 36 or 40 hours per week\n* Roadmap with a 12-month horizon\n* 9.5 million customers worldwide\n\n**Top responsibilities**\n------------------------\n\n* Own a strategic product domain within Tech4Ops and translate vision into clear priorities, roadmap choices, and measurable product outcomes.\n* Engage stakeholders across business and technology, aligning Product Owners, Chapter Leads, Architects, Security, Operations, and Engineering teams.\n* Enable the squad with focus, transparency, Agile ceremonies, and the ambition to move beyond incremental improvement toward transformation.\n* This Product Owner position is part of the Tech4Ops Area within the Tech4Engineering Tribe, reports to the Area Lead Tech4Ops, and is based in Utrecht / Hybrid. The role operates in a complex ecosystem with organization-wide impact and considerable autonomy.\n\n**Together we achieve more than alone**\n---------------------------------------\n\nWe believe in the power of differences. It is precisely by combining people's differences that we become an even better bank. We are curious about what you add to our team of Tech4Ops Area.\n\n*'Together, we a", "source": "indeed"}, {"company": "Rabobank", "job_title": "Junior Business Analyst IAM | Early Career Program IT | Utrecht", "location": "Utrecht, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Rabobank", "job_url": "https://nl.indeed.com/viewjob?jk=8071f9a32f12436b", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-23", "recruiter_email": null, "applicant_count": null, "description": "**This is what we offer you**\n-----------------------------\n\n* **Salary:** Gross monthly salary between EUR 3,516 and EUR 5,021 (scale 07) for a 36-hour work week.\n* **Extras:** a thirteenth month, 8% holiday allowance, and a 10% Employee Benefit Budget.\n* **Development budget:** EUR 1,400 development budget per year for your growth and development.\n* **Hybrid working:** a balance between home and office work (possible for most roles).\n* **Pension:** decide for yourself the amount of your personal contribution.\n\nOr view all our benefits.\n\nWould you like to learn how to connect business needs and IT solutions as a Junior Business Analyst within Identity & Access Management? Join a rapidly changing and important environment in one of the largest IAM organisations within banking.\n\n**Summary**\n-----------\n\nAs a Junior Business Analyst at Rabobank, you will learn business analysis in practice and contribute to improving Identity & Access Management services. You will work in an IT-focused environment in Utrecht, where services need to be secure and available for colleagues across the bank. You will speak with stakeholders and end users, analyse questions and problems, and translate between business needs and technical teams. Curiosity about IT, communication, initiative and ownership are more important than extensive work experience.\n\nAt a glance:\n\n* Analyse business needs, service issues and opportunities for improvement within Identity & Access Management.\n* Speak with stakeholders, internal customers and end users and translate their needs into clear input for IT teams.\n* Learn how security, availability, processes and technology come together in services used across Rabobank.\n\n**What will you learn and do as a Junior Business Analyst?**\n------------------------------------------------------------\n\n  \n\n* Learn to analyse business questions and improvement opportunities. You will investigate what is happening, who is affected and what the consequences are before helping the team define a possible improvement.\n* Connect IT and business. You will help translate technical work into its purpose for the bank and clarify what stakeholders expect from the services your team provides.\n* Speak with stakeholders and end users. You will gather information from colleagues within Identity & Access Management and from users across the Rabobank to understand their needs and how services work for them.\n* Turn observations into proposals. When you see unclear responsibilities, inefficient processes or recurring issues, you will learn to describe the problem, identify its impact and propose a way forward instead of simply accepting the current situation.\n* Develop your understanding of secure and available IT services. You will learn to consider topics such as security, service availability, processes and the wider impact of Identity & Access Management services on Rabobank.\n\n**Skills, tools and areas of expertise**\n----------------------------------------\n\n  \n\n* Bus", "source": "indeed"}, {"company": "Zorginstituut Nederland", "job_title": "Product Owner", "location": "Diemen, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Zorginstituut-Nederland", "job_url": "https://nl.indeed.com/viewjob?jk=d5601c7fba637eef", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "**Zorginstituut Nederland**\n\nVAN GOEDE ZORG VERZEKERD\n\n**Wij zoeken een Product Owner Geneesmiddeleninformatie**\n\nHet team Geneesmiddelen zoekt een nieuwe collega! Wil jij als Product Owner de regie voeren over de ontwikkeling en implementatie van een nieuw informatiemanagementsysteem? Ben jij sterk in prioriteren, pionieren en het verbinden van interne en externe stakeholders? En wil jij bijdragen aan goede, passende zorg in Nederland? Dan maken wij graag kennis met je.\n\n**Over het team**\n\nTeam Geneesmiddelen is een dynamisch team dat onder andere bestaat uit redacteuren, beoordelaars en adviseurs. Onze belangrijkste taken zijn het opstellen van adviezen aan de minister van Volksgezondheid, Welzijn en Sport (VWS) over de opname van geneesmiddelen in het verzekerde pakket. Maar ook het onderhouden van het Farmacotherapeutisch Kompas, een waardevolle bron van informatie voor iedere arts in Nederland. We werken samen aan concrete doelen in een spannend en snel ontwikkelend deel van het zorgveld. Wat ons werk zo leuk maakt? Onze adviezen hebben impact: niet alleen of een geneesmiddel wel of niet in het verzekerde pakket belandt, maar ook dat we randvoorwaarden kunnen stellen voor gepast gebruik. De sfeer in het team is informeel en open. Daarnaast maken we ruimte voor jouw ontwikkeling. Waar jij naartoe wil groeien, denken wij in mee. Dat is het streven.\n\n**Wat ga je doen?**\n\nAls Product Owner ben je verantwoordelijk voor de ontwikkeling, implementatie en verdere doorontwikkeling van een nieuw Informatiemanagementsysteem (IMS). Dit systeem ondersteunt het programma Toekomstbestendig Stelsel Geneesmiddelen (TSG), dat ervoor moet zorgen dat nieuwe geneesmiddelen zorgvuldig, efficiënt en risicogericht worden beoordeeld voor toelating tot het basispakket.\n\nHet eerste jaar staat vooral in het teken van pionieren, ontwikkelen en implementeren. Je bouwt samen met de leverancier, interne collega's en externe zorgpartijen aan een systeem dat nog volop in ontwikkeling is. Daarbij neem je de regie, verbind je verschillende belangen en bepaal je welke functionaliteiten prioriteit krijgen. Je werkt toe naar een eerste werkbare versie (MVP), waarbij je rekening houdt met wet- en regelgeving, gebruikersbehoeften en technische mogelijkheden.\n\nNa oplevering van de eerste werkbare versie (MVP) verschuift de focus naar het beheer en de verdere ontwikkeling van het IMS. Samen met interne collega’s en betrokken veldpartijen breng je in kaart hoe het systeem het geneesmiddelbeoordelingsproces steeds beter kan ondersteunen. Je vertaalt deze inzichten en gebruikersbehoeften naar een heldere productvisie, roadmap en concrete verbeteringen in de productbacklog. Daarbij houd je rekening met technologische ontwikkelingen en benut je waar mogelijk de mogelijkheden van open-sourcesoftware.\n\nJe belangrijkste werkzaamheden zijn:\n\n* Regie voeren op de ontwikkeling, implementatie en doorontwikkeling van het IMS.\n* Gebruikerswensen, wet- en regelgeving en procesbehoeften vertalen naa", "source": "indeed"}, {"company": "ING", "job_title": "BMG Head of Commercial Product Management", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ing", "job_url": "https://nl.indeed.com/viewjob?jk=733ac58105491461", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "* REQ-10124205\n* 20/11/2026\n* Transaction Services\n* Amsterdam, Netherlands\n* €9.136 - €14.457\n* ING Bank\n\n  \n\n**BMG Head of Commercial Product Management**\n\nDo you want to shape the future of global treasury and liquidity management for some of the world's most sophisticated multinational organisations? Are you a commercial leader who combines strategic vision, market and customer insight and people leadership to deliver sustainable growth and stronger product capabilities?\n\n  \n  \n\nAt Bank Mendes Gans (BMG), part of ING, we are looking for a Head of Commercial Product Management to establish and lead the BMG’s Commercial Product Management function. In this highly visible leadership role, you will own the commercial and product strategy, and the end-to-end commercial performance of BMG’s cash pooling, netting and in-house banking propositions, including portfolio performance, revenues, risks and returns. You will ensure that BMG's products and services remain commercially viable, competitive, customer-focused and within the approved risk appetite. This is a unique opportunity to shape the future of treasury services in a rapidly evolving market influenced by digital currencies, AI, advanced analytics and increasing competition from FinTech’s.\n\n  \n  \n\n**The team**\n  \nYou will lead the newly established Commercial Product Management (CPM) department within BMG, consisting of 10 professionals across Commercial Product Management, Contracting & Legal Support, Marketing & Communications, and a Data Analyst. You will also work closely together with dedicated Wholesale Banking Legal Support.\n  \n  \nThe department brings together Commercial Product ownership, contracting and legal support, marketing and communications, and commercial data analytics. Its mandate is to unlock existing business potential, activate new client and market opportunities, and create stable and sustainable income flows. The CPM team makes a difference for our clients by developing and managing the best in class and fit-for purpose products and services while continuously improving our existing proposition and enables the development and commercialisation of new propositions.\n\nThe CPM department works across the full value chain and acts as the linking pin between Sales & Account Management and the Delivery organisation. You will partner closely with Sales, Operations, Tech, Change, Risk, Compliance, Finance and ING Compliance and Transaction Services to align strategic priorities, translate market insights into business requirements and roadmaps, and deliver faster, scalable client solutions.\n\nAs a member of the BMG Management Team and several strategic governance forums, you will be at the heart of key business decisions and profitable growth initiatives. Together with the Regional Heads Sales & Account Management and the CEO, you are part of the Commercial Management Team. You will set commercial direction, prioritise clients and products for value and safeguard BMG’s different", "source": "indeed"}, {"company": "Cleopatra Enterprise", "job_title": "Business Analyst", "location": "Zwijndrecht, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Cleopatra-Enterprise", "job_url": "https://nl.indeed.com/viewjob?jk=f1ab35861854da42", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-20", "recruiter_email": null, "applicant_count": null, "description": "3-5 years of experience\n\nBsc or Msc (in (Business) Information Management, Industrial Engineering & Management or a related field)\n\nSelf-starter\n\nCommunicative\n\n### **We offer**\n\n€ 4500 - € 5500\n\n32-40 hours per week\n\n29,5 holidays\n\nHybrid working\n\n### **Why Cleopatra?**\n\nInnovation\n\nExcellence\n\nLearning & Growth\n\nCollaboration\n\n**Business Analyst**\n--------------------\n\n**Do you enjoy understanding complex business processes and translating them into innovative software solutions? At Cleopatra Enterprise, you will help shape an enterprise SaaS platform used by international companies to manage some of the world’s most complex capital projects. As a Business Analyst, you will connect our clients, internal stakeholders, and software development teams to identify opportunities, challenge existing processes, and turn business needs into valuable product improvements.**\n\nCleopatra Enterprise is a B2B SaaS platform that helps global industry leaders successfully execute large scale technical projects. Our solutions enable clients to estimate costs, control project budgets, and streamline work preparation. Our clients include leading Engineering, Procurement, and Construction (EPC) contractors and Owner Operators. To succeed in this role, you must be curious about complex business processes and able to understand the challenges of our technical users.\n\n**What You’ll Do**\n\nAs a Business Analyst, you will work closely with international clients and internal stakeholders to understand business processes, identify opportunities, and translate requirements into effective software solutions. You will independently lead specification workshops, challenge assumptions, and align stakeholders on functional requirements and priorities. Working closely with our software engineers, you will drive product discovery, translate business needs into actionable specifications, and manage and prioritise requirements throughout the development process. You will combine strong analytical capabilities with product thinking and a practical understanding of software functionality to ensure our solutions deliver real business value.\n\n**Key Responsibilities**\n\n* Identify and engage internal and external stakeholders to understand business needs, challenges, and opportunities.\n* Independently lead requirements and specification workshops, facilitating discussions and aligning different stakeholder perspectives.\n* Analyse complex business processes and identify opportunities for improvement through software.\n* Translate business requirements into intuitive, scalable software solutions, including functional specifications, process maps, user stories, and acceptance criteria.\n* Drive product discovery, evaluate business value, and contribute to product roadmap decisions.\n* Manage and prioritise requirements and maintain a clear, actionable development backlog.\n* Challenge client requirements and evaluate solutions in the context of our standard SaaS platform.\n* Collaborate with soft", "source": "indeed"}, {"company": "Talk360", "job_title": "Senior Product Manager", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Talk360-1", "job_url": "https://nl.indeed.com/viewjob?jk=428e9f208935507e", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-18", "recruiter_email": null, "applicant_count": null, "description": "**The challenge**  \nAn entrepreneur chasing an unpaid invoice in Lagos. A shop owner confirming a shipment in Guangzhou. A consultant navigating a bank's phone menu in London. For a growing share of Talk360's 6 million+ users, a call is how they get paid, keep a client or close a deal.\n\nThese business customers choose us because we're cheaper than carrier and roaming rates, reach mobile, landline and company numbers, need no contract, and use one balance for every country. Today we serve them with a consumer app. Tomorrow we want to be the obvious way small businesses call the world.\n\nWe're looking for a **Senior Product Manager** to own and scale the Calling for Work product proposition from 1 to 100. There's no mature roadmap to inherit: you'll write it, test it with customers and scale what works, with our Product & Tech team, to deliver a step change in segment growth.\n\n**What you’ll do**\n\n* **Own the product proposition:** Set the vision, strategy, roadmap and targets for Calling for Work, and be responsible for its user growth and retention.\n* **Shape the business proposition:** Define what Talk360's business offer is and how it's priced, together with our commercial teams.\n* **Learn from customers continuously:** Use interviews, surveys, support tickets and app store reviews to turn pains into a ranked opportunity roadmap.\n* **Experiment fast:** Ship small bets, A/B test the journeys that matter, observe real world behaviour and turn results into roadmap decisions.\n* **Lead delivery:** Work in an agile Product & Tech team; keep scope tight, priorities clear and releases flowing.\n* **AI-native execution:** Use AI across discovery, specs, analysis and prototyping, and help shape how the team builds with AI.\n* **Partner across the business:** Work with Revenue, Marketing, Support and Data on go-to-market, acquisition, retention and the metrics that show we're winning.\n\n**The Team**\n\nYou'll join a lean Product & Engineering team where product, design, mobile, web, backend, VoIP and QA work closely together. No silos, no layers: turn a customer insight on Monday into a live experiment by Friday.\n\n**What you’ll bring**\n\n* 5+ years in product management, including owning a product line or new proposition end to end.\n\n* A track record of scaling a product from early traction, with commercial results to show.\n* Hands-on experience with B2B, SMB or prosumer products; telecoms is a plus.\n* Strong discovery skills: customer interviews, research synthesis and jobs-to-be-done thinking.\n* Experimentation fluency: A/B testing, product analytics (Mixpanel or similar) and data analysis and data-driven decision making.\n* Experience optimising MAU, ARPU, LTV, retention and conversion, with the business acumen to make strategic and tactical calls.\n* Experience leading agile, cross-functional mobile product teams, with the technical depth to discuss trade-offs with engineers.\n* **Active, daily use of AI** across your product workflow: research, analysis, specs ", "source": "indeed"}, {"company": "Insify", "job_title": "Product Manager Insurance P&C", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Insify", "job_url": "https://nl.indeed.com/viewjob?jk=864b69409912a01c", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-18", "recruiter_email": null, "applicant_count": null, "description": "Insify is looking for a smart, ambitious and relentlessly driven **Insurance Product Manager** to join our team. In this role you’ll be a driving force behind our product expansions and building the digital platform for SME insurance. A rare opportunity to take real ownership in a fast-scaling European insurtech and shape outcomes that matter.\n\nAt Insify, we build insurance for entrepreneurs because we are entrepreneurs ourselves. We know what it’s like to build something from scratch, to take risks, and to carry responsibility that doesn’t switch off at 5 pm.\n\nOur mission is simple but ambitious: **to make business insurance 10x simpler, faster, and fairer for entrepreneurs and SMEs across Europe**. No paperwork. No fine print. No legacy complexity. Just modern software, smart automation, and a relentless focus on the customer.\n\nWe are a **high-growth European scale-up**, backed by **€43M from world-class investors**, on a mission to become a global leader in digital insurance for entrepreneurs and SMEs. Starting in the Netherlands, we’ve expanded into France and Germany, and we’re only accelerating from here.\n\nAt our core, we’re a **tech company**. We build our own insurtech platform and rely heavily on data, automation, and AI to redesign the end-to-end insurance experience: from underwriting to claims. Combined with a fully digital customer portal and strong UX, we’re turning insurance into something surprisingly simple, transparent, and fair.\n\nWe’re led by seasoned entrepreneurs who’ve built and scaled companies before, and we bring that same ambition, urgency, and ownership mindset to everything we do.\n\n### **What you'll be doing:**\n\nInsify is looking for an entrepreneurial and analytical **Product Manager** to drive the growth and evolution of our **Property & Casualty (P&C) portfolio**. This role focuses on the essential \"bread and butter\" products for SMEs: including General Liability, Professional Indemnity, and Property insurance.\n\nUnlike traditional PM roles, you won't just be managing features; you will be the \"CEO\" of your products. You will bridge the gap between complex insurance logic and a seamless digital user experience. You use your deep understanding of our customers and data native approach to translate technical policy wordings and insurance products into automated underwriting flows and digital-first customer journeys taking away the complexity for our customers.\n\nThis is a perfect role for someone with a background in business operations, consulting, or insurance who wants to move into a high-growth tech environment and take tangible ownership of a product's performance.\n\n### **What you’ll be up to (some examples):**\n\n* **Drive Product Strategy:** Manage the roadmap for your products, ensuring they remain competitive, compliant, and easy to purchase online.\n* **Optimize the Funnel:** Use data to identify friction points in the application process and work with Design and Tech to improve conversion rates.\n* **Scale New Ma", "source": "indeed"}, {"company": "CGI", "job_title": "Product Specialist - Space Unit", "location": "Randstad, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/CGI", "job_url": "https://nl.indeed.com/viewjob?jk=ebac4568a03ecb40", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-18", "recruiter_email": null, "applicant_count": null, "description": "Please note: Due to mandatory security clearance requirements, only EU nationals are eligible for this position.  \n  \nDo you want to contribute to the future of European space infrastructure? As a Product Specialist within CGI's Space unit, you will play a pivotal role in shaping and delivering solutions for some of Europe's flagship programs, including Galileo, the global satellite navigation system.  \n  \nAt CGI, we value ownership, trust, and innovation. You will work with multidisciplinary, international teams, bridging the gap between business stakeholders and development teams. Your leadership will ensure that the product vision is translated into a clear roadmap, requirements are captured and prioritized effectively, and delivery is executed with excellence following Agile principles.  \n  \n**Your role in our team**  \nYou will define and communicate the product vision and roadmap, gather and prioritize requirements, and help the team deliver solutions that meet customer and program objectives. You will work closely with stakeholders and development teams to keep the product focused, delivery aligned and progress visible.  \n  \nYou:  \n\n* Define, maintain, and communicate the product roadmap in alignment with program objectives, customer milestones, and technical feasibility.\n* Lead requirements gathering and backlog management, ensuring clear prioritization and traceability from business needs to delivered features.\n* Act as the voice of the customer and stakeholders, translating business goals into actionable user stories and acceptance criteria.\n* Collaborate closely with development teams, architects, and testers to ensure high-quality delivery that meets agreed timelines.\n* Facilitate Agile ceremonies, such as sprint planning, reviews, and retrospectives, and keep the team focused, engaged, and aligned with the product vision.\n* Identify, assess, and mitigate risks that could impact delivery, while ensuring dependencies across teams are managed effectively.\n* Monitor progress and report on key product KPIs to stakeholders and leadership, ensuring transparency and accountability.\n* Foster a culture of continuous improvement, using retrospectives and lessons learned to improve team performance and product outcomes.\n\n  \n**How you strengthen our team**  \nThis is you:  \n  \n\n* You have a Bachelor's degree or higher in Aerospace Engineering, Computer Science, Telecommunications, or a related technical field.\n* You have at least five years of experience as a Product Owner or in a similar role, ideally, though not exclusively, in aerospace, defense, or other mission-critical sectors.\n* You have demonstrated achievements in product roadmap definition, requirements gathering, and stakeholder alignment.\n* You have a proven track record of leading Agile teams and delivering in a structured way that aligns with business priorities.\n* You have strong organizational and analytical skills and a clear focus on execution and delivery.\n* You communicate confi", "source": "indeed"}, {"company": "KLM", "job_title": "Business Analyst Level 1", "location": "Schiphol, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Klm", "job_url": "https://nl.indeed.com/viewjob?jk=3a540c5ea98a6c0b", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-18", "recruiter_email": null, "applicant_count": null, "description": "At Air-France-KLM, the Information Management Organization (IMO) Finance and Procurements is a knowledge center responsible for the collection, storage, management and maintenance of data and other types of information, for all financial processes. The IMO acts as an integrator between the user organization and the external and internal IT suppliers. It allows our data-driven businesses to make better decisions and achieve goals.\n\nThe IMO organization is continuously optimizing its services, with the aim to reach the best business architecture and optimal processes. You will be part of this continuous improvement, allowing you to steer your career beyond the limitation of this vacancy.\n\nOur current pool of business analysts at IMO Controlling is heavily involved in managing data and processes associated with Finance Reporting, Finance Advanced Analytics and Finance Data Hub. You will be part of this team consisting of 8 specialists (joint AF and KL), and you will support IMO’s strategy to move to the Cloud.\n\n**What will you do?**\n\nAs a Business Analyst, you will be the link between the Product Owners, Project Managers, and the technical IT teams. Your primary role is to comprehend and translate business requirements into meaningful insights for the IT developers. The other way around, you will need to translate technical concepts into non-technical language so that everyone understands what is happening.\n\nAlso, you will:\n\n* work closely with stakeholders to understand the problem, define it, narrow its scope, and then specify the requirements for a solution;\n* refine the Epics and User Stories created by the Product Owner and make sure that it meets the Acceptance criteria. You make sure that every business rule is covered, and the functionality of the User Story is proper.\n* think of the interoperability of the modules i.e. how new features and updates would affect the other modules.\n* create documentation that lays out how users will interact with a product or service while also explaining why they need it;\n* anticipate and analyze the needs of the businesses to find solutions to address their problems.\n\n**Where do you land?**\n\nYou will have the choice to work at the KLM HQ in Amstelveen or Building 102 in Schiphol-Oost. You will be part of the IMO Controlling team, which is part of the IMO Finance and Procurement organization.\n\n**Your profile**\n\nWe are looking for a Business Analyst who can work efficiently and switch quickly between projects within IMO Controlling. You are eager to understand and map business processes, to be a strong sparring partner for the project teams. You are not afraid to take ownership of the processes and applications within the domain. Not only do you continuously look for ways to optimize our processes, but you are also equipped with the right tools to implement your ideas.\n\nFor this position, it's important to have a strong analytical, advisory, and reporting skills. You have a passion for working on challenging a", "source": "indeed"}, {"company": "Nebul", "job_title": "Product Owner HPC Infrastructure", "location": "Werk van thuis, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Nebul", "job_url": "https://nl.indeed.com/viewjob?jk=03a719d66219fe9b", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Nebul - Netherlands office, Remote\n\nFull-time\n\nPermanent employee\n\n  \n\n**about us**\n------------\n\n**Product Owner / Architect – Datacenter Infrastructure | NVIDIA | Mellanox | High Performance Computing | Procurement | English-speaking | EU Work Permit Required**\n---------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\n  \nAt Nebul, we’re building Europe’s sovereign cloud infrastructure — trusted, secure, and scalable for the future of AI. We’re looking for a **Product Owner / Architect Datacenter & Infrastructure** to define the roadmap and architecture of our high-performance datacenter platforms, including procurement and design, reference architecture, power infrastructure, and high-speed networking technologies (NVIDIA, Mellanox).  \nIf you understand what it takes to design, procure, and run a modern HPC datacenter optimized for AI workloads, and thrive at the intersection of product strategy and technical excellence — this role is for you.  \n  \n**What You’ll Do**  \nYou will own and drive the full datacenter infrastructure strategy, including power design, network architecture, and procurement of hardware such as NVIDIA GPUs and Mellanox networking components. You will define the reference architecture for high-performance compute environments, guiding everything from procurement processes to infrastructure deployment. You’ll work closely with engineering and operations to ensure seamless delivery and optimal performance of our AI-ready infrastructure, while interfacing directly with vendors like NVIDIA, NVIDIA Networking (Mellanox), and others to secure best-in-class solutions.  \n  \n**What we’re Looking For**  \nYou have 5+ years of experience in datacenter infrastructure and architecture, including hands-on experience with procurement, reference architectures, and high-performance networking. You are familiar with NVIDIA GPU platforms and networking technologies (Ethernet, InfiniBand). You are a structured, detail-oriented thinker with strong communication skills and experience translating complex infrastructure requirements into scalable designs.  \n  \n**Bonus If You Have**  \n\n* Deep experience with datacenter design for AI/HPC environments\n* Knowledge of OpenStack, Kubernetes and infrastructure automation tools\n* Understanding of lifecycle management for datacenter environments (power, cooling, network scaling)\n* Background in working with sinfrastructure providers\n\n  \n**Why Nebul?**  \n\n* Help design and scale Europe’s most advanced sovereign AI datacenter infrastructure\n* Work directly with NVIDIA, Mellanox and best-in-class vendors\n* Join a growing, mission-driven team building AI infrastructure from the ground up\n* Flexible hybrid setup, based near The Hague and Amsterdam\n* Competitive compensation, equity options, and career growth opportunities\n\n  \n**Must Haves**  \n\n* Based in the Netherlands (commute to The Hague)\n* Valid EU w", "source": "indeed"}, {"company": "Nebul", "job_title": "Product Owner / Architect – Datacenter Infrastructure", "location": "Werk van thuis, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Nebul", "job_url": "https://nl.indeed.com/viewjob?jk=089aaabb7c24d4be", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Nebul - Netherlands office, Remote\n\nFull-time\n\nPermanent employee\n\n  \n\n**about us**\n------------\n\n**Product Owner / Architect – Datacenter Infrastructure**  \n**NVIDIA | HPC | Datacenter Design | Hardware Procurement | EU Work Permit Required**\n\nAt **Nebul**, we’re building Europe’s sovereign cloud infrastructure—trusted, secure, and designed for the future of AI. We're hiring a **Product Owner / Architect, Datacenter Infrastructure** to define and drive the roadmap for our high-performance computing environments. This includes datacenter architecture, hardware procurement, power and cooling strategy, and vendor management with key partners like **NVIDIA**.\n\nIf you know what it takes to design, negotiate, and operate advanced AI datacenters—and you thrive at the intersection of deep technical expertise and strategic execution—this role is for you.\n\n### **What You’ll Do**\n\n* Own the **end-to-end datacenter infrastructure strategy**, including compute, network, power, and physical layout\n* Define **reference architectures** optimized for AI/HPC workloads using NVIDIA GPUs and high-performance systems\n* Lead **hardware procurement**, including vendor evaluations, contract negotiations, and technical alignment\n* Work cross-functionally with engineering, operations, and leadership to ensure on-time infrastructure delivery\n* Oversee **deployment planning**, including power and cooling design, rack layouts, and network architecture\n* Collaborate with leading vendors like **NVIDIA** to assess technologies, secure competitive pricing, and ensure supply chain alignment\n\n### **What We’re Looking For**\n\n* **5+ years** of experience in datacenter infrastructure, system architecture, or hardware procurement—ideally in HPC, hyperscale, or AI environments\n* In-depth knowledge of **NVIDIA GPU platforms** and high-performance compute infrastructure\n* Experience managing **RFPs, BOMs**, and vendor relationships for compute, storage, and network hardware\n* Familiarity with **power, cooling, and lifecycle management** in datacenter environments\n* Strategic mindset with strong communication skills and attention to detail\n\n### **Nice to Have**\n\n* Experience with **AI/HPC-oriented datacenter design**\n* Knowledge of **OpenStack, Kubernetes, or automation tools**\n* Hands-on experience working with **colocation providers or enterprise IT teams**\n* Understanding of **infrastructure compliance and security** in cloud or regulated settings\n\n### **Why Join Nebul?**\n\n* Help build the foundation of **Europe’s sovereign AI infrastructure**\n* Work directly with **NVIDIA** and other world-class technology partners\n* Join a mission-driven team shaping the future of high-performance computing\n* Flexible hybrid work model near **The Hague and Amsterdam**\n* Competitive salary, **equity options**, and clear **career growth paths**\n\n### **Must-Haves**\n\n* **Based in the Netherlands** (commutable to The Hague)\n* Valid **EU work permit** (no sponsorship available)\n* Fluent in **English** (Du", "source": "indeed"}, {"company": "Alcor", "job_title": "Product Owner Cloud", "location": "Apeldoorn, GE, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Alcor", "job_url": "https://nl.indeed.com/viewjob?jk=2c34aaf627211b1e", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Caseware combines over 35 years of cations.\n* Create clarity and alignment across internal and external stakeholders.\n\n### **What you will bring:**\n\n* Experience or a strong affinity with audit and accounting (hands-on experience in practice is a plus)\n* Possesses deep understanding of the Dutch market and user needs\n* Supports the team in delivering accurate, high-quality, and compliant product content\n* Works effectively both independently and collaboratively, with excellent prioritization skills\n* Excels at translating complex concepts into intuitive, user-friendly solutions\n* Is available full-time and ready to take ownership as a proactive leader within the team\n\n### **What's in it for you:**\n\n* Shape what's next with AI: Help transform audit and accounting through AI-powered technology. Explore new ways to bring AI into our own workflows, rethink how work gets done, and turn ideas into meaningful improvements for our teams and customers.\n* Make an impact that matters: Contribute to solutions that h", "source": "indeed"}, {"company": "Tebi", "job_title": "Senior Product Manager - AI Team", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Tebi-2", "job_url": "https://nl.indeed.com/viewjob?jk=b4979873fc13292a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "**About us**\n------------\n\nTebi is building a modern connected hospitality operating system that helps entrepreneurs run their business more intelligently and smoothly. In one seamless platform, Tebi embeds sales, reservations, kitchen, inventory, and payments (as well as all the data that powers it) helping to automate work, streamline operations, and give hospitality owners the clarity and time they need to focus on what matters the most: creating great guest experiences.\n\nFounded by Arnout Schuijff, co-founder of Adyen, and backed by €50 million in funding from Index Ventures & CapitalG, Tebi is build in service of hospitality first. Thousands of restaurants, cafés, bars, and coffee shops across the Netherlands, UK, Spain, Italy, Denmark, Germany, Finland, and Ireland.\n\n**About the role**\n------------------\n\nAs the Senior Product Manager on our AI team, you'll own how AI shows up in Tebi, from an AI agent embedded in the product to the AI capabilities that run through the platform. Tebi sits on a unified foundation of sales, payments, reservations, kitchen and inventory data, which gives our AI something most restaurant software can't offer: the full picture. You'll own the vision, strategy and roadmap, and turn that data into agents and features that save merchants time, cut costs and help them make better decisions on a busy service.\n\n**What you’ll do:**\n-------------------\n\n* Define and own the vision and roadmap for Tebi's AI agent and AI capabilities across the product.\n* Work with AI engineers and data teams to ship agentic features that take real actions for merchants, not just answer questions.\n* Spend time with restaurant owners, managers and staff, plus Sales and Customer Success, to find the jobs where AI genuinely removes friction in their day.\n* Define how we measure quality and trust in AI features, including evals, accuracy, adoption and merchant outcomes, and use that to iterate quickly.\n* Decide where AI belongs in the product and where it doesn't, including guardrails, human-in-the-loop moments and when the merchant makes the final call.\n* Partner with all the other product teams so AI feels native to Tebi rather than bolted on.\n\n**What you'll need:**\n---------------------\n\n* 8+ years of product management experience at a fast-growing tech company, with a track record of shipping impactful launches.\n* You are highly collaborative, able to partner effectively across the organization and build trust with both technical and operational teams.\n* Hands-on experience building AI-powered products and a solid grasp of their strengths and limits.\n* A data-driven mindset: you combine quantitative signals and qualitative feedback, and you know how to evaluate non-deterministic products.\n* You care about the balance between craft, speed, and outcomes.\n\nThis probably isn't the role for you if you're happiest on a structured environment with clear directions. We are looking for someone to set the direction and the vision for this team.\n\nPe", "source": "indeed"}, {"company": "Insify", "job_title": "Insurance Product Manager / Underwriter, Europe (P&C)", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Insify", "job_url": "https://nl.indeed.com/viewjob?jk=5a47ca3e46adde94", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "Most insurance product roles ask you to perfect one product in one market. This one asks you to build Europe’s SME insurance products: decide what we cover and who we insure, negotiate it with our carriers and get it live, market after market.\n\n**Deep in the wording. Fast in the build.**\n\n**About Insify**\n\nInsurance for entrepreneurs is still built the old way: one market at a time, wordings nobody reads, and cover that leaves out the very businesses that need it most.\n\nWe're doing it differently.\n\nInsify is a high-growth scale-up backed by €43M in total funding from world-class investors like Accel, Munich Re Ventures, and Formula 1 champion Nico Rosberg. In five years, we've expanded from the Netherlands into France, Germany and Ireland, and we're just getting started. Our mission: become the European leader in AI-powered SME insurance.\n\nWe aren't just building a company; we're leading a revolution. Our culture is intense, high-stakes, and mission-driven. We hire smart, ambitious \"owners\" who possess a relentless drive to win. This is an environment for those who thrive on challenges, value intellectual honesty, and share our mindset of becoming a global category leader.\n\nOur founding team consists of seasoned entrepreneurs who have previously built iconic businesses like HelloFresh, Bloomon, and SumUp. We bring that same bias for speed, scale, and high standards to one of the most structurally broken experiences in financial services. Together, we combine that deep fintech and e-commerce expertise with cutting-edge AI to stay ahead of the curve.\n\n### **What you’ll own in your first year**\n\nYou won’t inherit a finished product shelf. You’ll build the engine that fills it.\n\n* **Build the product engine.** Turn how we benchmark a market into a system: compare cover, limits and exclusions across local players, our Dutch home product and our other markets, so every new product starts from facts, not gut feeling.\n\n* **Make the call on cover.** Decide what we cover, what we don’t and who we insure, and turn it into a proposal. The tools do the comparison; the judgment is yours.\n\n* **Get it signed.** Take the proposal to our risk carriers and negotiate it. You know what to push on, what to let go and which clause will set off six red flags.\n\n* **Get it live.** Adapt our wordings to each new market, run the legal review and launch. Less writing from scratch, more making one strong product fit the next market. Then track loss ratios, competition and customer feedback, and sharpen it.\n\n* **Build what doesn’t exist yet.** In the markets where we double down, own custom products from the insurance side, including cover for the trades and businesses others decline.\n\n### **Who you are**\n\nYou’re an insurance expert first and a builder second, but a real one.\n\n* You have **5+ years hands-on** in commercial P&C (Property & Casualty) at an insurer, MGA, (re)insurer or specialist broker, across underwriting, product and wordings, ideally for SMEs.\n* You know **wh", "source": "indeed"}, {"company": "LELY", "job_title": "Product Owner Digital Farming", "location": "Maassluis, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Lely", "job_url": "https://nl.indeed.com/viewjob?jk=38fdff91909a5dde", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "**Company Description**\n\nLely, founded in 1948, is committed to creating a sustainable, profitable, and enjoyable future in agriculture. Driven by the challenges farmers face and the needs of cows, we develop high-quality robots and data systems that improve animal welfare, flexibility, and productivity on dairy farms. Our mission is to support sustainable food production.\n\nFor more than 30 years, we have been a global leader in the sales and service of automated systems for successive generations of dairy farmers. Every day, we inspire our colleagues to provide customers with innovative solutions and to be a reliable partner for long-term advice and support. With our state-of-the-art Lely Campus in Maassluis and a worldwide network of dedicated Lely Centers offering tailored sales and service, Lely operates in more than fifty countries.\n\n **Job Description**\n\nWhat is your role?\n\nImagine your product decisions helping farmers organize their farms more efficiently every day. As Product Owner Digital Farming, you shape digital solutions that help farmers plan, carry out and track their daily work. From task management and smart routing to reporting and operational insights, you make sure technology connects with the realities of day-to-day life on the farm.\n\nYou will join the Farm Managers team within the Digital Farming domain. This team works on Horizon, Lely’s farm management platform. Within the platform, Farm Managers focuses on the daily processes that help farmers stay in control and carry out their work efficiently.\n\nIn this role, you combine strategic product ownership with hands-on business analysis. Together with stakeholders, you shape the product direction while working closely with the development team. You explore what farmers need, balance different interests and translate insights into clear user stories, requirements and acceptance criteria.\n\nYou collaborate closely with software engineers, UX designers, business stakeholders and farmers. Through conversations with them, you identify opportunities, validate solutions and help the team focus on improvements that create real value. This role is ideal for someone who enjoys both defining direction and working closely with a development team to turn ideas into well-defined solutions. Beyond product ownership, you help the team strengthen its focus, collaboration and ways of working, enabling the team to become increasingly effective as our product organization continues to develop.\n\nKey responsibilities include:\n\n* You develop and maintain the product vision, roadmap and priorities for the Farm Managers domain.\n* You bring together customer value, business objectives, technical sustainability and operational needs to make clear product decisions.\n* You build and prioritize the product backlog based on conversations with farmers, product data, business value and technical possibilities.\n* You translate needs into concrete requirements, user stories and acceptance criteria, preparing th", "source": "indeed"}, {"company": "VML/WPP Enterprise Solutions", "job_title": "Business Analyst - Enterprise & AI Solutions", "location": "Amsterdam, NH, Netherlands", "careers_url": "", "job_url": "https://nl.indeed.com/viewjob?jk=3d47581c502796f4", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "#### **Who We Are**\n\nWPP Enterprise Solutions designs, builds, and operates the growth systems that competitive businesses rely on. In a world where Al is reshaping how companies drive growth, we lead clients in business transformation and marketing modernization, connecting strategy directly to executi  and liquidity positions.\n\nWorking in an international team across Amsterdam, Bucharest and Manila, you will collaborate with Product Leadership, Customer Journey Experts, Operations, Finance, Risk, Group Treasury Front Offices, engineers, IT integrators and architects worldwide. You will report to the CLM Service Owner.\n\n  \n  \n\n**Key Responsibilities**\n\n* Roles and responsibilitiesYou will turn complex liquidity challenges and data into clear requirements and implementable solutions aligned with the functional roadmap. Your key responsibilities include:\n* Shape new intraday liquidity management capabilities with Treasury, Operations and Technology, from the initial business problem through implementation.\n* Translate the CLM and intraday liquidity management roadmap into functional designs, business requirements, process flows, business rules, user stories and acceptance criteria.\n* Define requirements for real-time liquidity positions and views, monitoring across relevant hierarchy levels, payment flow control, liquidity usage monitoring and intraday liquidity forecasting.\n* Analyse payment, settlement and account flows to determine their impact on intraday liquidity positions and how these should be represented in the solution.\n* Define the information and business logic needed to calculate and present liquidity positions accurately, working closely with technology teams.\n* Lead workshops with Group Treasury Front Offices, Operations, Risk, Finance, architects and Technology, clearly documenting requirements, decisions and open points.\n* Connect liquidity experts and engineering teams by making complex Treasury, liquidity, payment and settlement concepts accessible to colleagues without specialist domain knowledge.\n* Guide requirements through development, testing and implementation, keeping delivered functionality aligned with the intended business outcome.\n* Identify dependencies, functional gaps and design decisions across liquidity management, payments, settlement and related systems\n  \n\n  \n\n**Who Are We Looking For?**\n\nWe hire smart people like you for your potential. Our biggest expectation is that you remain curious. Keep lear", "source": "indeed"}, {"company": "VML/WPP Enterprise Solutions", "job_title": "PXM Business Analyst", "location": "Amsterdam, NH, Netherlands", "careers_url": "", "job_url": "https://nl.indeed.com/viewjob?jk=68c6dee27832d6f2", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-09", "recruiter_email": null, "applicant_count": null, "description": "#### **Who We Are**\n\nWPP Enterprise Solutions designs, builds, and operates the growth systems that competitive businesses rely on. In a world where Al is reshaping how companies drive growth, we lead clients in business transformation and marketing modernization, connecting strategy directly to execution. Our 12,000 experts in engineering and platforms, commerce, consulting, content transformation, CRM, and CX work within a unified global operating unit across 40+ markets. WPP Enterprise Solutions works alongside best-in-class partners including Adobe, AWS, Braze, Google, Microsoft, Salesforce, and Shopify, as well as innovators in AI, to deliver growth solutions tailored to the needs of our clients' businesses. VML, part of WPP, supports WPP Enterprise Solutions by helping brands activate transformation through creativity and experience.\n\n**About the role**\n\nWPP Enterprise Solutions in Amsterdam is home to the PXM (Product Experience Management) Centre of Excellence. We help global brands manage, enrich and syndicate their product content to retailers and marketplaces, covering the full product content supply chain from data model and PIM to the digital shelf.Our team of Business Consultants, Business Analysts, Configuration Specialists, Solution Architects and engineers works across the Netherlands, Spain and India, and is growing. We are therefore looking for a **Business Analyst - PXM** to strengthen our delivery teams.\n\nThis is not a generic Business Analyst role. Product data is the substance of the work: attribute models, taxonomies, validation rules, retailer requirements and syndication. Here, requirements are data requirements as much as process requirements.\n\nYou run business analysis independently on a defined scope, typically one work stream within a larger client programme. A Senior Business Analyst or Business Consultant sets the overall approach; you own the requirements for your part of it and work directly with the client to get them right.\n\n**What you will do**\n\nAs a Medior Business Analyst, you are responsible for the quality of the requirements in your work stream, so that what gets built is what the client actually needs.\n\n**Your responsibilities will include:**\n\n* Preparing and running elicitation for your workstream: interviews, workshops, document analysis of existing data and retailer specifications, and observation of how teams really work with product data.\n* Arriving prepared: knowing what you must leave each session knowing, asking the questions that surface the real requirement behind the stated one, and confirming results with stakeholders afterwards.\n* Specifying requirements using process and data models, user stories, acceptance criteria and functional and non-functional analysis, and verifying and validating them with the client.\n* Analysing product data: attribute models, hierarchies, taxonomies, validation rules, data quality requirements and digital asset needs.\n* Translating retailer and channel requiremen", "source": "indeed"}, {"company": "landal", "job_title": "IT Business Analyst - Finance", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Landal-1", "job_url": "https://nl.indeed.com/viewjob?jk=501ea773c79d25ee", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "**About  project management at Hilti.\n  \n  \nWorking together with international colleagues, you will contribute to the development and continuous improvement of a connected project management solution landscape. The role focuses on end-to-end business processes and the integration of relevant enterprise applications, rather than on a single tool or platform.\n  \n  \nYou will be based in our strategic IT office in Berkel, Rotterdam, the Netherlands, while working as part of an international team across the Netherlands, Malaysia, the United States and Switzerland.\n  \nThis is a full-time position based in the Netherlands, ideally starting as soon as possible.\n  \n  \nThis is a full-time, permanent position. Required travel is up to 15%.\n\n**What You'll do**\n------------------\n\nAs the IT Business Analyst Project Management Solutions, you will play a key role in driving the digitalization and optimization of project management processes across Large Projects.\n  \nYou will help build a connected solution landscape that brings together relevant project information from multiple business systems and provides project teams and management with a consistent end-to-end view of project execution. Operational planning and transactional execution will remain within their respective source systems.\n  \nYour role is to ensure that business processes, data and applications work seamlessly together, creating greater transparency across project structures, WBS elements, schedules, milestones, dependencies, deliverables, risks, issues and performance.\n  \n  \nYou will act as an active bridge between business and IT teams. Rather than simply collecting requirements, you will challenge process design, clarify ownership and dependencies, and translate business needs into clear process flows, functional requirements, user stories, business rules, acceptance criteria, integration requirements and user-friendly solutions.\n  \n  \nKey responsibilities:\n\n* Partner with LP Project Management, Engineering, Supply Chain, Finance and other stakeholders to understand project management challenges, business requirements and improvement opportunities, while challenging process design and clarifying ownership and dependencies.\n* Translate business requirements into technical specifications, user stories, process flows, solution designs, business rules, acceptance criteria and integration requirements, creating user-friendly solutions that connect business needs with IT.\n* Analyse project structures, identifiers, WBS elements, da", "source": "indeed"}, {"company": "Google", "job_title": "Data Center Site Program Manager", "location": "Groningen, GR, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Google", "job_url": "https://nl.indeed.com/viewjob?jk=fadbc47fee5209c0", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "Candidates must be able to work 100% onsite.\n\nCandidates are strongly encouraged to possess a driver's license and have access to their own transportation given travel to data center sites in their scope.\n\n  \nNote: By applying to this position you will have an opportunity to share your preferred working location from the following: **Eemshaven, Netherlands; Winschoten, Netherlands; Groningen, Netherlands**.\n\n### **Minimum qualifications:**\n\n* Bachelor's degree or equivalent practical experience.\n* 5 years of experience in program, project management, data center operations (e.g., facilities/operations management, capacity planning, or site operations), or equivalent.\n* 5 years of experience using analytics to solve product or business problems, performing statistical analysis.\n* Experience with technical integration, system integration, risk mitigation, deployment planning, or data center operations.\n\n  \n\n### **Preferred qualifications:**\n\n* Professional certifications in Project Management (e.g., PMP, PgMP).\n* Ability to identify key issues, gather and analyze large data sets to support hypotheses, and develop actionable recommendations.\n* Ability to be creative, non-standard, and develop innovative solutions using data and analytics to drive impact.\n* Excellent project management skills, with the ability to create workable project plans including project scope.\n* Excellent written and verbal communication and presentation skills.\n\n**About the job**\n-----------------\n\nA problem isn’t truly solved until it’s solved for all. That’s why Googlers build products that help create opportunities for everyone, whether down the street or across the globe. As a Program Manager at Google, you’ll lead complex, multi-disciplinary projects from start to finish — working with stakeholders to plan requirements, manage project schedules, identify risks, and communicate clearly with cross-functional partners across the company. Your projects will often span offices, time zones, and hemispheres. It's your job to coordinate the players and keep them up to date on progress and deadlines.\n\nThe AI and Infrastructure team is redefining what’s possible. We empower Google customers with breakthrough capabilities and insights by delivering AI and Infrastructure at unparalleled scale, efficiency, reliability and velocity. Our customers include Googlers, Google Cloud customers, and billions of Google users worldwide.\n\nWe're the driving force behind Google's groundbreaking innovations, empowering the development of our cutting-edge AI models, delivering unparalleled computing power to global services, and providing the essential platforms that enable developers to build the future. From software to hardware our teams are shaping the future of world-leading hyperscale computing, with key teams working on the development of our TPUs, Vertex AI for Google Cloud, Google Global Networking, Data Center operations, systems research, and much more.\n\nIndividual pay is determined by fa", "source": "indeed"}
