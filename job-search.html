    #search { flex: 1; min-width: 220px; font-size: 15px; }

    .stats-bar { padding: 10px 24px; display: flex; gap: 14px; align-items: center;
      font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border); }

    .job-company { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }

assdoor"}, {"company": "Blyce", "job_title": "Product Owner", "location": "Netherlands", "careers_url": "https://www.glassdoor.nl/Overview/W-EI_IE3204575.htm", "job_url": "https://www.glassdoor.nl/job-listing/j?jl=1010302518709", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-22", "recruiter_email": null, "applicant_count": null, "description": "", "source": "glassdoor"}, {"company": "Highberg B.V.", "job_title": "Payroll Product Owner / Payroll Lead", "location": "Utrecht, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Highberg-B.v.", "job_url": "https://nl.indeed.com/viewjob?jk=cf67967a18ad84fd", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-28", "recruiter_email": null, "applicant_count": null, "description": "##### **Hybrid**\n\n**About the role**\n------------------\n\nIn this role, you take charge of the entire payroll chain at large organisations that have outsourced their payroll to a BPO partner, or where multiple countries and systems come together. You are the linchpin between HR, Finance, IT, the payroll provider and the (local) payroll leads. You make sure risks are identified early and that the provider delivers what has been agreed. At the same time, you help build our growing Payroll Services team. Is this the next step you are looking for?\n\n**Why Highberg?**\n-----------------\n\nAt Highberg, everything revolves around people. Around colleagues who want to make a difference, take ownership, and work together based on trust and craftsmanship. We believe real change happens when strategy, execution, and humanity come together. That starts with our own team. This is why we create an environment where you can continue to grow, apply your expertise, and expand it further. An environment where you can make lasting impact.\n\n##### **Bringing strategy to life**\n\nAt Highberg, you are not a remote advisor. You work closely with clients on challenges that truly matter, from strategy through to implementation. This allows you to make an immediate impact and see the results of your work in practice.\n\n##### **Collaborative, human, and professional**\n\nWe work closely together, share knowledge, and strengthen one another to achieve the best possible outcomes. Our culture is open and built on trust, with room for both ambition and humanity. We listen, celebrate successes, and hold each other accountable, always with attention to people as well as to quality.\n\n##### **European outlook, locally rooted**\n\nWith teams in the Netherlands and the DACH region, you work in an organization with a broad, European perspective. At the same time, the culture remains personal and close-knit. This gives you the opportunity to collaborate internationally at a high level, within a committed and engaged team.\n\n##### **Culture as a catalyst**\n\nOur culture is a key reason why colleagues enjoy working at Highberg. We place trust in our people, value initiative, and believe it is important that everyone can continue to develop. This enables you to get the best out of yourself, while together contributing to sustainable growth.\n\n**Your role as Payroll Product Owner / Payroll Lead**\n-----------------------------------------------------\n\nAs Payroll Product Owner / Payroll Lead at Highberg, you own the payroll chain. Without a clear owner, issues fall between the cracks; you ensure that collective labour agreement (CAO) and legislative changes go live on time, that systems stay aligned and that payroll runs correctly every period. You work within Payroll Services, the Dutch-speaking payroll team of Highberg | Consultday.\n\n  \n\nYour responsibilities include:\n\n* Managing and prioritising the backlog: planning CAO, legislative and system changes, so that statutory changes go live on time.\n* Ven", "source": "indeed"}, {"company": "C-Teleport BV", "job_title": "Product Owner – Flights (Hybrid, the NL-based)", "location": "Rotterdam, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/C--teleport-Bv", "job_url": "https://nl.indeed.com/viewjob?jk=a45fce3f03a3c706", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-22", "recruiter_email": null, "applicant_count": null, "description": "You will own our most booked product, and decide what flight booking looks like when no one has to search anymore.\n\nFlights are the backbone of crew travel. Miss one and a vessel sails short-handed, or a rig waits for its relief crew. And plans rarely hold: >40% of crew bookings change or get cancelled.\n\nBusiness travel tools wait for someone to search. We don't. Crew travel starts with an operational schedule, so we know who needs to fly before they do. We're moving from \"search and book\" to \"recommended and ready to approve\". Our AI predicts the next booking within the customer's travel policy. It plans 10 crew joining and 10 leaving as one decision. And when the schedule shifts, changes that took hours of handling take minutes. No OTA or TMC is building this, because none of them see the schedule.\n\n#### **Creative within complexity**\n\nFlights are full of rules written to protect airlines, not travellers. Fare rules, re-issue logic and the way airlines handle changes and cancellations often work against our customers. The airlines have no reason to change that.\n\nThe best solutions hide inside those rules. Finding them means understanding the mechanics of distribution deeply enough to see a solution where others see a dead end. That's the job: build what others say can't be done.\n\n#### **About C Teleport**\n\nWe automate crew travel for maritime, aviation and energy companies, and we power white-label booking tools for travel management companies. We're about 90 people in Rotterdam, working lean: small squads, short lines and real ownership.\n\n#### **What success looks like**\n\n* 6 months: You know our flight stack inside out (sources, fares, booking flow, servicing). You've shipped your first improvements, and you've brought at least one new customer opportunity to the roadmap with a clear case behind it.\n* 12 months: Recommended, ready-to-approve bookings are live with pilot customers. You've moved [metric] measurably from [baseline].\n* 18–24 months: C Teleport is the reference for workforce flight booking. Customers approve crew travel instead of searching for it.\n\n#### **Must-haves**\n\n* Hands-on experience as a PO or PM shipping with engineering teams.\n* Deep knowledge of flight distribution: GDS, NDC, fares and fare rules, ticketing, and servicing (re-issues, refunds, exchanges).\n* You've shipped products where data or AI drives the decision, not just the interface.\n* You find creative solutions inside complex rules, and you can show us one you built.\n* You're comfortable with APIs and supplier integrations, enough to work as an equal with engineers.\n\n#### **Nice-to-haves (not required)**\n\n* Experience at an airline, OTA, TMC, GDS or NDC aggregator.\n* Marine or offshore fares, group bookings, or other B2B corporate travel.\n* Building recommendation or prediction models into a product.\n\n#### **This is not for you if…**\n\n* You accept \"the airline doesn't support that\" as an answer.\n* You see flights as a search-and-book funnel to optimise.\n* You'", "source": "indeed"}, {"company": "CaseWare International", "job_title": "Product Owner Cloud", "location": "Apeldoorn, GE, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Caseware-International", "job_url": "https://nl.indeed.com/viewjob?jk=8ab97fc9ede949be", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-22", "recruiter_email": null, "applicant_count": null, "description": "Caseware combines over 35 years of industry expertise with AI-powered technology to transform how audit and accounting professionals work. Serving organizations across 130 countries, we bring intelligent automation directly into audit and financial reporting workflows—helping professionals reduce manual work, navigate complexity, and focus on informed decisions. Join our global team and help build technology that strengthens trust in financial information.\n\nAs **Product Owne**r for our Cloud solutions, you are responsible for driving the development, maintenance, and continuous improvement of our products. You work closely with a full team—both functional and development—so affinity with both is important. You organize and prioritize the team’s work through a well-managed backlog and sprint board, ensuring delivery of maximum value to our customers.\n\n❗This is a **Full time permanent** position\n\n**Location:**\n\nThis is a **hybrid** role requiring the successful candidate to work **3** **days a week in our Apeldoorn, Netherlands office**, located at **Fauststraat 3, 7323 BA Apeldoorn, Netherlands**\n\n### **What you will be doing:**\n\n* Drive the development, maintenance, and continuous improvement of our Cloud products.\n* Collaborate closely with a full team—both functional and development—so affinity with both is important.\n* Organize and prioritize the team’s work through a well-managed backlog and sprint board.\n* Ensure delivery of maximum value to our customers.\n* Define the product roadmap in alignment with strategic goals and market developments.\n* Coach the team to stay aligned with our overall product vision.\n* Focus on financial reporting, audit, and related workflows for the Dutch accountancy market.\n* Act as the final responsible for the success of our Cloud solutions.\n* Understand customer needs and balance various stakeholder demands.\n* Translate insights into clear product decisions and priorities.\n* Share progress regularly via roadmap presentations and other communications.\n* Create clarity and alignment across internal and external stakeholders.\n\n### **What you will bring:**\n\n* Experience or a strong affinity with audit and accounting (hands-on experience in practice is a plus)\n* Possesses deep understanding of the Dutch market and user needs\n* Supports the team in delivering accurate, high-quality, and compliant product content\n* Works effectively both independently and collaboratively, with excellent prioritization skills\n* Excels at translating complex concepts into intuitive, user-friendly solutions\n* Is available full-time and ready to take ownership as a proactive leader within the team\n\n**What's in it for you:**\n\n  \n\n* Shape what’s next with AI: Help transform audit and accounting through AI-powered technology. Explore new ways to bring AI into our own workflows, rethink how work gets done, and turn ideas into meaningful improvements for our teams and customers.\n\n* Make an impact that matters: Contribute to solutions that help ", "source": "indeed"}, {"company": "UWV", "job_title": "Productowner Cluster Bedrijfsproces, automatisering en Integratie (2 vacatures)", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/uwv", "job_url": "https://www.linkedin.com/jobs/view/4491195412", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "QLS", "job_title": "Product Owner", "location": "Dordrecht, South Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/qls-nl", "job_url": "https://www.linkedin.com/jobs/view/4477063904", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Cboe Global Markets", "job_title": "Senior Analyst, Lead UX & Product Owner", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://www.linkedin.com/company/cboe", "job_url": "https://www.linkedin.com/jobs/view/4491746865", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_c s. You connect the internal teams involved in product creation, ensure clear milestones and accountability, and continuously improve the processes, systems and ways of working that take our products from concept to market.\n  \n  \nYou possess in-depth knowledge of operational processes, think cross-functionally, and proactively seek ways to improve and innovate the Rolling Program and the way we work.\n\n**Your Mission**\n\n* Set up seasonal Rolling Programs for all brands, product categories, and regions.\n\n* Align cross-functionally between international teams and departments involved in the creation and execution of the Rolling Program.\n\n* Monitor progress and ensure stakeholders deliver on their responsibilities to meet critical milestones.\n\n* Continuously assess and improve the Rolling Program and related ways of working.\n\n* Identify and implement improvements in processes, structures, and systems related to product design, development, marketing, and sourcing.\n\n* Collaborate with departments such as Operations and Sales to support product creation and reduce lead time, cost, and effort.\n\n* Support the department with additional relevant activities and projects as needed.\n\n**Your Talent**\n\n* You hold a Bachelor’s degree in Business Administration, Supply Chain, or a related field;\n\n* Experience in process coordination, project management, or operations within a sports-lifestyle industry or international organization with global brands;\n\n* Strong understanding of cross-functional workflows and critical path management;\n\n* Excellent command of English, both written and spoken;\n\n* Proficiency in MS Office (especially Excel and PowerPoint);\n\n* Experience with project management tools is an advantage.\n\nThis role is based in Den Bosch, the Netherlands. Working remotely from other countries is not possible.\n\n  \n  \n\nTo apply for this role, you must already have the legal right to work in the Netherlands. We will not apply for work or residence permits.\n\n  \n\n**We Offer**\n\n* Our salaries are based on 38 hours per week, but fulltime work is 40 hours per week. Instead, you choose between a lot of holidays; 40 per year ór choose for a 40-hour salary per month with still 27 holidays. You can switch every six months;\n\n* Annual bonus scheme;\n\n* New hires (introduction) days;\n\n* Great offer of e-learnings and a training offer for personal development;\n\n* Enough free fruit for you daily vitamins;\n\n* Provided lunch at a low cost;\n\n* Choose between lease-bike, NS Business Card or travel by car for € 0,25 per km (>10km).\n\n* 8% holiday allowance, employee insurances and a good pension scheme;\n\n* Employee discount on the PUMA, Levi’s, Fuelforfans and BMW Lifestyle websites;\n\n* Hybrid working. On fulltime basis 3 days in the office and 2 days at home (incl. allowance for home working);\n\n* Flexible working hours, mo", "source": "indeed"}, {"company": "LYNX Berlin", "job_title": "Product Manager Awareness & Lead Acquisition West", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Lynx-Berlin", "job_url": "https://nl.indeed.com/viewjob?jk=0494dc393ed702b6", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-16", "recruiter_email": null, "applicant_count": null, "description": "As **Product Manager Awareness & Lead Acquisition West**, you own the awareness and lead-generation journey across the Netherlands, Belgium, France, Finland and our .com domain.\n\nYou translate our global segmentation and targeting approach into market plans and customer-facing campaigns, and turn that into a roadmap your squad can deliver against.\n\nYou’ll work closely with the East team for one consistent marketing approach, and with Client Acquisition on lead handover through to conversion.\n\n**What you’ll do**\n\n* Define a multi-quarter vision for Awareness & Lead Acquisition in the West markets.\n* Adapt LYNX’s global STP approach into market-specific plans, strategies and tactics.\n* Own and prioritise a living roadmap for acquisition capabilities.\n* Drive initiatives from discovery through implementation.\n* Analyse customer behaviour, campaign performance and competitor activity.\n* Own OKRs measured by brand awareness, MQLs, cost per lead, conversion rate, ROMI and estimated CLV.\n* Ensure marketing and acquisition capabilities comply with privacy and financial promotion requirements.\n\n**Who you are**\n\nYou’re a product professional with genuine marketing craft and a feel for the Dutch/Belgian market.\n\n* 3–5 years in product management with proven, measurable business outcomes.\n* Strong experience with digital and brand marketing, acquisition funnels and customer research.\n* Data-driven mindset: marketing analytics, KPI management, self-serve BI or SQL.\n* Strong stakeholder management across Marketing, Engineering, Sales and Operations.\n* Experience operating in regulated contexts (privacy, security, KYC/AML/MiFID).\n* Fluent English and Dutch, spoken and written.\n\n**Nice to have**\n\n* Experience within fintech, brokerage or financial services.\n* Deep SEO, SEA and paid-media expertise.\n* Experience with CRM, marketing automation and attribution modelling.\n\n**What we offer**\n\n* A competitive salary based on experience.\n* Flexible working hours at our office in the heart of the city.\n* A fixed 13th-month salary.\n* Pension scheme for NL/DE/BE.\n* Travel expense reimbursement.\n* An annual training budget of €2,000, freely allocated to your professional development.\n* Team outings, social drinks, and an annual weekend trip with the entire team.\n\n**Who we are**\n\n*“LYNX helps you invest in yourself.” “Working at LYNX means joining the LYNX family.” “The development opportunities make LYNX the best place to work.”*\n\nThis is what our employees say about LYNX, and it reflects exactly what we aim to offer: an environment where you can get the best out of yourself.\n\nFrom our offices in Amsterdam, Ghent, Berlin, and Prague, we work every day to provide private and professional clients with the best trading opportunities through a fast, user-friendly, and reliable platform.\n\nLYNX is an international FinTech company where around 300 colleagues contribute to client success across Europe in an informal, collaborative, and growth-oriented environment.\n\nWe’re an equal-", "source": "indeed"}, {"company": "Google", "job_title": "Technical Program Manager, Technical Excellence, Physical Security", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Google", "job_url": "https://nl.indeed.com/viewjob?jk=44074bdafbb544ef", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-13", "recruiter_email": null, "applicant_count": null, "description": "Note: By applying to this position you will have an opportunity to share your preferred working location from the following: **Dublin, Ireland; Amsterdam, Netherlands; London, UK**.\n\n### **Minimum qualifications:**\n\n* Bachelor's degree in a technical, engineering, security management, or business field, or equivalent practical experience.\n* 5 years of experience managing physical security technology projects (such as enterprise access control, CCTV, intrusion detection systems, and physical barriers) from design through to deployment and commissioning.\n* 3 years of experience in technical program management leading cross-functional teams in a global or regional environment, specifically within logistics, warehousing, or industrial settings.\n\n  \n\n### **Preferred qualifications:**\n\n* 5 years of experience managing cross-functional or cross-team projects.\n* Experience managing security designers and partnering with architects & engineers to drive excellence in the design process.\n\n**About the job**\n-----------------\n\nA problem isn’t truly solved until it’s solved for all. That’s why Googlers build products that help create opportunities for everyone, whether down the street or across the globe. As a Technical Program Manager at Google, you’ll use your technical expertise to lead complex, multi-disciplinary projects from start to finish. You’ll work with stakeholders to plan requirements, identify risks, manage project schedules, and communicate clearly with cross-functional partners across the company. You're equally comfortable explaining your team's analyses and recommendations to executives as you are discussing the technical tradeoffs in product development with engineers.\n\nThe Data Center team designs and operates some of the most sophisticated electrical and HVAC systems in the world. We are an upbeat, creative, team-oriented group of engineers committed to building and operating powerful data centers.\n\nIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\n  \n  \nIreland: €118000 - €120000 (EUR) + 15% bonus target + equity + benefits  \nNetherlands: €130000 - €133000 (EUR) + 15% bonus target + equity + benefits  \n  \nLearn more about benefits at Google.\n\n**Responsibilities**\n--------------------\n\n* Own the lifecycle, governance, and regional adaptation of global physical security standards, master specifications and reference design templates across EMEA and APAC regions.\n* Lead technical change management and design-exception governance across EMEA and APAC, ensuring proposed design variances, alternate hardware selections, and phased turnover postures maintain rigorous security and audit baselines.\n* Partner with engineering and tooling teams to deploy and scale digital tracking dashboards, CAD/BIM design-validation workflows, and automated quality-assurance tools.\n* Partner with global program leads and regional operations teams to scope and enable large-scale brownfield security ", "source": "indeed"}, {"company": "Cronos Group Inc.", "job_title": "Product Development Manager (Netherlands)", "location": "Hellevoetsluis, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Cronos-Group-Inc.", "job_url": "https://nl.indeed.com/viewjob?jk=8a2bf620293fc539", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "Cronos is an innovative global cannabinoid company committed to building disruptive intellectual property by advancing cannabis research, technology, and product development. With a passion to responsibly elevate the consumer experience, Cronos is building an iconic brand portfolio. Cronos’ diverse international brand portfolio includes Spinach®, PEACE NATURALS® and Lord Jones®. For more information about Cronos and its brands, please visit: https://thecronosgroup.com/.\n\nAt Cronos Group, we hire talented people who thrive on solving difficult problems and give them the opportunity to hone new skills and approaches. If you want to play a part in shaping an innovative industry and help build a historically significant company, we want to meet you.\n\nThe Manager, Product Development – Netherlands will lead the local implementation, adaptation, and validation of products and processes transferred from Cronos Group’s Canadian R&D Center of Excellence to Netherlands operations.\n\nThis role executes approved product localization and technology-transfer projects with local Operations, Quality, Regulatory, and global R&D teams, within established global priorities and Netherlands regulatory and operational requirements.\n\nThe Manager, Product Development will also plan, execute, and analyze Netherlands sensory sessions with the PD Technician and the local Marketing lead, using methods and standards established by global Sensory Sciences.\n\nReporting to the Senior Director, Product Development, the Manager, Product Development will lead and develop the Netherlands PD Technician and own local delivery of R&D priorities, partnering closely with Canadian R&D and local cross-functional teams.The successful candidate is a hands-on technical lead with strong project execution and cross-functional coordination skills, and has experience translating established technologies into locally deployable products and processes.\n\n**This position is based out of Hellevoetsluis, South Holland, Netherlands.**\n\n**Key Responsibilities**\n------------------------\n\nProduct Development Coordination and R&D Integration\n\n* Own the execution of approved product development and technology-transfer projects in the Netherlands, in line with priorities set by global R&D leadership.\n* Serve as the local technical contact between the Canadian R&D Center of Excellence and Netherlands operations for technology transfer, knowledge sharing, and local adaptation.\n* Build and maintain local project plans (activities, timelines, resource needs, and technical dependencies), and coordinate with Operations, Quality, and Engineering to deliver agreed milestones.\n* Lead local cross-functional project meetings. Report progress, risks, and technical issues to global R&D, and escalate any decision outside approved scope or technical standards.Drive deployment of global R&D outputs locally in partnership with Netherlands operational teams.\n\nTechnology Transfer & Local Adaptation\n\n* Assess transferred formulat", "source": "indeed"}, {"company": "Signify", "job_title": "Global Product Manager Home Entertainment Philips Hue", "location": "Eindhoven, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Signify-4", "job_url": "https://nl.indeed.com/viewjob?jk=a7ffc15b4c5f0e37", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "Eindhoven, Netherlands Category Marketing Posted Date 11/12/2026 Job Id 366971\n\n  \n\n**About Signify**\n\n  \n  \n\nThrough bold discovery and cutting-edge innovation, we lead an industry that is vital for the future of our planet: lighting. Through our leadership in connected lighting and the Internet of Things, we're breaking new ground in data analytics, AI, and smart solutions for homes, offices, cities, and beyond.\n\n  \n  \n\nAt Signify, you can shape tomorrow by building on our incredible 125+ year legacy while working toward even bolder sustainability goals. Our culture of continuous learning, creativity, and commitment to diversity and inclusion empowers you to grow your skills and career.\n\n  \n  \n\nJoin us, and together, we’ll transform our industry, making a lasting difference for brighter lives and a better world.\n\n  \n  \n\n**More about the role**\n\n  \n  \n\nWe’re looking for a Global Product Manager with a passion for Home Entertainment to join our Philips Hue Product Management team in Eindhoven.\n\nWorking for Signify means being creative and adaptive while working in a fast-paced company. Our culture of continuous learning and commitment to diversity and inclusion creates an environment that allows you to build your skills and career while transforming our industry.\n\nAs the world leader in lighting, we are constantly ahead of the curve. Through our leadership in connected lighting and the Internet of Things, we are breaking new grounds in data analytics, AI, and smart homes, offices, cities and more!\n\nSignify is one of the few companies in the world to achieve carbon neutrality and our next sustainability goals are even bolder: doubling our positive impact on the environment and society by 2025.\n\nAs a Global Product Manager for Philips Hue you will be responsible for leading and developing the global offer strategy and roadmap for our Philips Hue hardware portfolio with a strong focus on home entertainment and gaming propositions. You will help building the business by translating consumer insights into propositions that address end user needs with clear benefits. You will work together with an international team to develop a compelling product roadmap and go-to-market strategy to reach consumers nified reporting platform, governed data consumption, reporting standards, reusable components, and migration from legacy reporting solutions.\n\n**The team**\n\nThe Data & Reporting expert team is on a transformation journey to establish a modern reporting ecosystem built on trusted data products and standardized reporting capabilities. The Reporting Factory is a strategic initiative that will provide a single reporting experience, reduce duplication across platforms, improve governance, and accelerate delivery of management information and business insights.\n\nWorking closely with business stakeholders, Report Managers, Data Management teams, Architects, Engineers, and Leadership teams, you will help define how reporting products are designed, delivered, governed, and adopted across the organization.\n\nThis is an opportunity to shape a high-visibility strategic product that sits at the intersection of Data, Analytics, Reporting, Governance, and Digital Transformation.\n\nWe value leadership impact and adaptability as much as strict checklist experience. If your background aligns with the core vision of this role, even if you don't tick every single bullet point, we strongly encourage you to apply. Tell us in your application or cover note what unique perspective and track record you’ll bring to the team.\n\n  \n  \n\n**Roles and responsibilities**\n\nYou will own the Reporting Factory vision and roadmap, ensuring it delivers measurable business value while creating a scalable and future-ready reporting ecosystem.\n\n* Define and own the Reporting Factory product vision, strategy, roadmap, and value proposition.\n* Translate business objectives and reporting needs into a prioritized product backlog.\n* Drive stakeholder alignment across business, data, reporting, architecture, and technology domains.\n* Lead the design and adoption of standardized reporting products, processes, and governance frameworks.\n* Partner with Data Factory, Data Management, and Engineer ": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "As **Product Manager Awareness & Lead Acquisition West**, you own the awareness and lead-generation journey across the Netherlands, Belgium, France, Finland and our .com domain.\n\nYou translate our global segmentation and targeting approach into market plans and customer-facing campaigns, and turn that into a roadmap your squad can deliver against.\n\nYou’ll work closely with the East team for one consistent marketing approach, and with Client Acquisition on lead handover through to conversion.\n\n**What you’ll do**\n\n* Define a multi-quarter vision for Awareness & Lead Acquisition in the West markets.\n* Adapt LYNX’s global STP approach into market-specific plans, strategies and tactics.\n* Own and prioritise a living roadmap for acquisition capabilities.\n* Drive initiatives from discovery through implementation.\n* Analyse customer behaviour, campaign performance and competitor activity.\n* Own OKRs measured by brand awareness, MQLs, cost per lead, conversion rate, ROMI and estimated CLV.\n* Ensure marketing and acquisition capabilities comply with privacy and financial promotion requirements.\n\n**Who you are**\n\nYou’re a product professional with genuine marketing craft and a feel for the Dutch/Belgian market.\n\n* 3–5 years in product management with proven, measurable business outcomes.\n* Strong experience with digital and brand marketing, acquisition funnels and customer research.\n* Data-driven mindset: marketing analytics, KPI management, self-serve BI or SQL.\n* Strong stakeholder management across Marketing, Engineering, Sales and Operations.\n* Experience operating in regulated contexts (privacy, security, KYC/AML/MiFID).\n* Fluent English and Dutch, spoken and written.\n\n**Nice to have**\n\n* Experience within fintech, brokerage or financial services.\n* Deep SEO, SEA and paid-media expertise.\n* Experience with CRM, marketing automation and attribution modelling.\n nd is supported by world-renowned investors including Benchmark, IVP, and Index Ventures.\n\nOur goal is to become the global leader in trusted, intelligent AI technology, building products that drive better communication, foster connections, and create a meaningful impact. To achieve this, we need talented people like you to join our journey. If you’re ready to shape the future of AI and grow your career in a fast-moving, purpose-driven environment, DeepL is your next destination.\n\n**What sets us apart**\n----------------------\n\nWhat sets us apart is our blend of cutting-edge AI technology, meaningful work, and a culture where people truly thrive. We’re a team of innovators, researchers, and creators driven by a shared purpose to unlock human potential by making work simpler, smarter, and more connected.\n\nWhen we share what it’s like to work at DeepL, the reactions are overwhelmingly positive. This might be because of our technology that helps millions of people and businesses communicate and work better every day, or because of the trust, curiosity, and care that shape our culture.\n\nWhat we know for sure is this: being part of DeepL means joining a team dedicated to innovation, growth, and well-being. Discover more about life at DeepL onLinkedIn,Instagram, and our Blog.\n\n**Meet the team behind this journey**\n-------------------------------------\n\nDeepL runs product-led growth alongside our sales-led motion, with media translation as the strategic wedge. This role is responsible for turning DeepL into the default platform for translation worldwide driving adoption through product usage, and converting that usage into strong Product Qualified Leads (PQLs) tha convert into revenues and strengthen our sales pipeline. This role drives adoption of our core DeepL Translate features (e.g. Customization Hub, TQE) and cross-sell into adjacent products like DeepL Voice. You will start with a focus on Media Translation.\n\nYour Mission: Put DeepL Translate in the rnationale markt introduceren.\n* Sturen op omzet, marge, kostprijs en prestaties gedurende de gehele levenscyclus van het product.\n  \n\n### **Dit is typisch iets voor jou**\n\nJe combineert technisch inzicht met commercieel ondernemerschap. Je bent nieuwsgierig, gaat actief op zoek naar klanten en de markt en denkt vanuit de vraag: welk probleem lossen we op en waarom kiest een klant voor Ridder?\n\n  \n\nTegelijkertijd weet je binnen het bedrijf dynamiek te creëren. Je brengt verschillende disciplines samen, zorgt voor focus en durft duidelijke keuzes te maken. Je hoeft onze watersystemen nog niet tot in detail te kennen, zolang je maar verstand hebt van technische producten en snel kansen in de markt herkent.\n\n*Wat breng je mee?*\n\n* HBO/WO-werk- en denkniveau.\n* Ruime ervaring met productmanagement binnen een technische B2B-omgeving.\n* Ervaring met productstrategie, portfolio-, roadmap- en levenscyclusbeheer.\n* Commercieel inzicht en affiniteit met watertechnologie, irrigatie, procesinstallaties of industriële automatisering.\n* Goede beheersing van het Nederlands en het Engels.\n* Bereidheid om ongeveer vier keer per jaar naar het buitenland te reizen.\n* Ervaring in de glastuinbouw of op het gebied van watertechnologie is een groot pluspunt.\n  \n\n*Wat vind je bij Ridder?*\n\n* Een strategische functie met grote invloed op de verdere ontwikkeling van onze waterportefeui", "source": "indeed"}, {"company": "Maxxton B.V.", "job_title": "Product Manager", "location": "Amsterdam Area", "careers_url": "https://www.linkedin.com/company/maxxton-b.v.", "job_url": "https://www.linkedin.com/jobs/view/4491740064", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Adyen", "job_title": "Senior Product Manager - Split Payments", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/adyen" function getSector(company) {
  const cl = company.toLowerCase();
  for (const [key, sec] of Object.entries(SECTOR_MAP)) {
    if (cl.includes(key)) return sec;
  }
  return 'Other';
}

// ── Match scoring ─────────────────────────────────────────────────────────────
function scoreJob(j) {
  const title = (j.job_title || '').toLowerCase();
  const company = (j.company || '').toLowerCase();
  const sector = getSector(j.company);
  const desc = (j.description || '').toLowerCase().slice(0, 800);
  let score = 0;

  // Role type (0–50)
  const ROLES = [
    [50, ['technical product manager','product manager','productmanager','product management']],
    [48, ['associate product manager','apm']],
    [44, ['product owner','product lead']],
    [42, ['product operations','product ops','product strategy','growth product','growth manager']],
    [36, ['technical program manager','program manager','programme manager','tpm']],
    [25, ['head of product','director of product','vp of product']],
  ];
  for (const [pts, kws] of ROLES) {
    if (kws.some(k => title.includes(k))) { score += pts; break; }
  }
  if (score === 0) score += 15;

  // Sector fit (0–30)
  score += ({ Tech:30, Industrial:22, Energy:22, Finance:20, FMCG:14, Consulting:12, Other:12 })[sector] || 12;

  // Company bonus (0–20)
  const CO = [
    [20, ['adyen','booking','uber','databricks','prosus','backbase','catawiki','tomtom','mollie','bol.com','just eat','coolblue','exact']],
    [16, ['asml','nxp','signify','philips','wolters kluwer','vanderlande','tno']],
    [14, ['shell','eneco','vattenfall','tennet','alliander','stedin','orsted','ørsted','sbm offshore','neste','fugro']],
    [12, ['ing ','rabobank','abn amro','nn group','aegon','van lanschot']],
    [10, ['unilever','heineken','akzonobel','dsm','firmenich','ahold','frieslandcampina']],
    [6,  ['bcg','bain','mckinsey','oliver wyman','kearney','strategy&','roland berger','ey-parthenon','deloitte','accenture']],
  ];
  for (const [pts, kws] of CO) {
    if (kws.some(k => company.includes(k))) { score += pts; break; }
  }

  // Keyword signals in title/desc (+0–10)
  let bonus = 0;
  for (const [kw, pts] of [['product',3],['platform',2],['data',2],['growth',2],['energy',2],
      ['roadmap',2],['b2b',1],['saas',1],['analytics',1],['strategy',1]]) {
    if (title.includes(kw)) bonus += pts;
    else if (desc.includes(kw)) bonus += Math.round(pts / 2);
  }
  score += Math.min(10, bonus);
  score = Math.min(100, score);
  // She has no full-time PM job yet, so seniority in the title bounds the fit.
  if (/\b(vp|vice president|head of|director|chief|cpo)\b/i.test(title)) return Math.min(score, 25);
  if (/\b(principal|group|staff|lead)\b/i.test(title)) return Math.min(score, 40);
  if (/\b(senior|sr\.?|expert)\b/i.test(title)) return Math.min(score, 60);
  if (/\b(associate|junior|jr\.?|new grad|graduate|entry|apm)\b/i.test(title)) return Math.min(100, score + 10);
  return Math.min(score, 85);
}

// v2: stores {s, r} objects — bump key if schema changes again
const AI_SCORES_KEY = 'vanshika_ai_scores_v3';
function getAiScores() { try { return JSON.parse(localStorage.getItem(AI_SCORES_KEY) || '{}'); } catch { return {}; } }
function saveAiScores(obj) { try { localStorage.setItem(AI_SCORES_KEY, JSON.stringify(obj)); } catch {} }

function getEffectiveScore(j) {
  // Priority: localStorage (user-triggered) > j.ai_score (server-side) > JS rules
  const entry = getAiScores()[jobKey(j)];
  if (entry) return { score: entry.s, reason: entry.r || '', ai: true };
  if (j.ai_score !== undefined) return { score: j.ai_score, reason: '', ai: true };
  return { score: scoreJob(j), reason: '', ai: false };
}

function matchBadgeHtml(score, isAi, reason) {
  let cls;
  if (score >= 85) cls = 'ex';
  else if (score >= 70) cls = 'str';
  else if (score >= 55) cls = 'gd';
  else if (score >= 40) cls = 'ok';
  else cls = 'low';
  const sup    = isAi ? '<sup style="font-size:8px;margin-left:1px">AI</sup>' : '';
  const tipTxt = isAi && reason ? reason : (isAi ? 'AI-scored by Claude' : 'Keyword match score');
  return `<span class="match-badge match-${cls}" title="${esc(tipTxt)}">${score}%${sup}</span>`;
}

1. Rare profile: hard science (IIT Bombay) + 5yr industrial leadership (ONGC) + top MBA (RSM)
2. Energy sector insider: direct advantage at Shell, Eneco, Vattenfall, Alliander, SBM, Orsted, Stedin
3. Proven under pressure: Business Games winner = cross-functional execution in competitive setting
4. Quantitative strategy: Markstrat 1st place = pricing/positioning/market share decisions, not just conceptual
5. Community leadership: Product Club president = drove structured learning for 100+ members
6. Rotterdam-based: available immediately, no logistics friction

TARGET ROLES (in priority order)
1. Product Manager / Technical Product Manager / Associate Product Manager at tech or tech-enabled companies
2. Product Owner
3. Product operations / Product strategy / Growth product roles
4. Program Manager / Technical Program Manager in a product or engineering organisation
She has no full-time PM job yet: realistic for APM, PM and some mid-level PM roles, a stretch for Senior, not realistic for Principal/Head/Director.

CV VARIANTS
- CV_Uber (ops/strategy/energy/consulting focus): best for ONGC-adjacent and strategy roles
- CV_Product (PM/product/analytics focus): best for product, tech, and data-adjacent roles

=== SCORING RUBRIC ===
90–100  Perfect fit: digital/technical product role at her level + strong employer or domain match (e.g. TomTom Product Manager, Adyen Associate PM, energy-tech Product Manager)
75–89   Strong fit: 2 of 3 dimensions align well; clear mutual value
60–74   Good fit: relevant role or sector, some match gaps
45–59   Decent fit: worth applying but not a standout match
30–44   Weak fit: significant skill/interest mismatch
0–29    Poor fit: wrong language, wrong seniority, or fundamentally misaligned

SENIORITY IS THE MAIN FILTER (judge from title AND description: years asked, people management, scope)
- VP / Head of / Director / Chief: 0-15
- Principal / Group / Staff / Lead PM, or 7+ years of PM experience: 5-25
- Senior PM, or 4-6 years of PM experience: 20-45 at most, even at a dream company
- PM asking about 2-3 years: 45-70 depending on domain match
- Associate / junior / new-grad / MBA programme, or PM with no hard years requirement: 65-95
Do not give a high score just because the title says Product Manager or the company is famous.

PENALISE when:
- Job description or title implies Dutch fluency required ("vloeiend Nederlands", "native Dutch")
- Role is primarily coding/software engineering, design, product marketing or sales (not product management)
- Role is an internship, working-student or thesis position
- 'Product manager' for physical goods / FMCG brand or category with no digital or technical product
- Requires 5+ years of product management experience (Senior/Principal/Head/Director)
- Role is outside Netherlands or requires relocation`;

// ── AI batch scoring ──────────────────────────────────────────────────────────
async function aiScoreAll() {
  let apiKey = localStorage.getItem('vanshika_claude_api_key');
  if (!apiKey) {
    const k = prompt('Enter your Claude API key (sk-ant-…) to enable AI scoring:');
    if (!k || !k.trim()) return;
    apiKey = k.trim();
    localStorage.setItem('vanshika_claude_api_key', apiKey);
  }
  const btn = document.getElementById('ai-score-btn');
  btn.disabled = true; btn.textContent = '⏳ Scoring…';

  const aiScores = getAiScores();
  const unscored = JOBS_DATA.filter(j => !aiScores[jobKey(j)]);
  if (!unscored.length) {
    btn.disabled = false; btn.textContent = '✨ Re-score with AI';
    applyFilters(); return;
  }

  const BATCH = 8;   // smaller batches — full descriptions fit comfortably
  let done = 0;
  try {
    for (let i = 0; i < unscored.length; i += BATCH) {
      const batch = unscored.slice(i, i + BATCH);

      const jobLines = batch.map((j, idx) => {
        const sector  = getSector(j.company);
        const desc    = (j.description || '').trim().slice(0, 1200);
        const descTxt = desc ? `\n   Description: ${desc}` : '';
        return `${idx}. Company: ${j.company} | Role: ${j.job_title} | Location: ${j.location || 'Netherlands'} | Sector: ${sector}${descTxt}`;
      }).join('\n\n');

      const userMsg = `Score these ${batch.length} roles for Vanshika. Reply ONLY with a JSON array — no other text:\n[{"i":0,"s":88,"r":"one sentence why"}, ...]\n\nRoles:\n${jobLines}`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-beta': 'prompt-caching-2024-07-31',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 600,
          system: [{
            type: 'text',
            text: AI_SYSTEM_PROMPT,
            cache_control: { type: 'ephemeral' },
          }],
          messages: [{ role: 'user', content: userMsg }],
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'API ' + res.status);
      }
      const data = await res.json();
      const text = data.content?.[0]?.text || '[]';
      const match = text.match(/\[[\s\S]*\]/);
      if (match) {
        const parsed = JSON.parse(match[0]);
        for (const {i, s, r} of parsed) {
          if (batch[i]) {
            aiScores[jobKey(batch[i])] = {
              s: Math.min(100, Math.max(0, Math.round(s))),
              r: (r || '').slice(0, 120),
            };
          }
        }
      }
      done += batch.length;
      btn.textContent = `⏳ ${done}/${unscored.length}…`;
      saveAiScores(aiScores);
    }
    btn.textContent = '✅ AI Scored!';
  } catch(e) {
    btn.textContent = '⚠ Error — Retry?';
    console.error('AI scoring error:', e);
  } finally {
    btn.disabled = false;
    applyFilters();
    setTimeout(() => { if (btn.textContent !== '⚠ Error — Retry?') btn.textContent = '✨ Re-score with AI'; }, 3000);
  }
}

// ── Job utils ─────────────────────────────────────────────────────────────────
function jobKey(j) { return j.job_url || (j.company + '|' + j.job_title); }

const LS_KEY = 'vanshika_job_statuses';
let statuses = {};
try { statuses = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch {}

function setStatus(key, val) {
  if (val) statuses[key] = val;
  else delete statuses[key];
  localStorage.setItem(LS_KEY, JSON.stringify(statuses));
  applyFilters();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(raw) {
  if (!raw) return null;
  try {
    const d = new Date(raw);
    if (isNaN(d)) return null;
    const diff = Math.round((Date.now() - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff <= 6) return diff + 'd ago';
    if (diff <= 30) return Math.round(diff/7) + 'w ago';
    return d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
  } catch { return null; }
}

function statusLabel(s) {
  return {applied:'✅ Applied', interview:'🎯 Interview', offer:'🎉 Offer',
    rejected:'❌ Rejected', bookmarked:'🔖 Bookmarked'}[s] || '';
}

// ── Filters + sort ────────────────────────────────────────────────────────────
function applyFilters() {
  const search  = document.getElementById('search').value.toLowerCase();
  const sector  = document.getElementById('sector-filter').value;
  const statusF = document.getElementById('status-filter').value;
  const sourceF    = document.getElementById('source-filter').value;
  const sortBy     = document.getElementById('sort-by').value;
  const maxDays    = parseInt(document.getElementById('date-filter').value) || 0;
  const maxApplied = parseInt(document.getElementById('applicant-filter').value) || 0;
  const now        = Date.now();

  let filtered = JOBS_DATA.filter(j => {
    const key = jobKey(j);
    const jobStatus = statuses[key] || '';
    if (statusF === 'unreviewed' && jobStatus) return false;
    if (statusF && statusF !== 'unreviewed' && jobStatus !== statusF) return false;
    if (sector && getSector(j.company) !== sector) return false;
    if (sourceF && (j.source || 'crawler') !== sourceF) return false;
    if (maxDays && j.date_posted) {
      const d = new Date(j.date_posted);
      if (!isNaN(d) && (now - d.getTime()) > maxDays * 86400000) return false;
    }
    if (maxApplied) {
      const count = j.applicant_count;
      if (count == null || count >= maxApplied) return false;
    }
    if (search) {
      const hay = (j.company + ' ' + j.job_title + ' ' + (j.location||'') + ' ' + (j.notes||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  // Sort
  if (sortBy === 'score') {
    filtered.sort((a, b) => getEffectiveScore(b).score - getEffectiveScore(a).score);
  } else if (sortBy === 'date') {
    filtered.sort((a, b) => {
      const da = a.date_posted ? new Date(a.date_posted).getTime() : 0;
      const db = b.date_posted ? new Date(b.date_posted).getTime() : 0;
      return db - da;
    });
  } else if (sortBy === 'company') {
    filtered.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
  }

  renderJobs(filtered);
  updateStats();
}

function renderJobs(list) {
  const container = document.getElementById('list-container');
  const noRes = document.getElementById('no-results');
  if (!list.length) {
    container.innerHTML = '';
    noRes.style.display = 'block';
    document.getElementById('shown-count').textContent = '0';
    return;
  }
  noRes.style.display = 'none';
  document.getElementById('shown-count').textContent = list.length;

  container.innerHTML = list.map(j => {
    const key = jobKey(j);
    const status = statuses[key] || '';
    const sector = getSector(j.company);
    const dateStr = formatDate(j.date_posted);
    const notes = (j.notes || '').replace(/\[Direct link.*?\]/g,'').trim();
    const src = j.source || 'crawler';
    const srcLabel = {linkedin:'LinkedIn', indeed:'Indeed', glassdoor:'Glassdoor', crawler:'Portal'}[src] || src;
    const { score, reason, ai } = getEffectiveScore(j);
    const applicants = j.applicant_count != null
      ? `<span style="color:${j.applicant_count < 10 ? 'var(--green)' : j.applicant_count < 25 ? 'var(--yellow)' : 'var(--text-muted)'}">${j.applicant_count} applicants</span>`
      : '';
    // Recruiter: show email if known, else show "Find" search link for LinkedIn/Indeed jobs
    const recruiterHtml = j.recruiter_email
      ? `<a class="job-link secondary" href="mailto:${esc(j.recruiter_email)}" title="Email recruiter">${esc(j.recruiter_email.split('@')[0])}</a>`
      : (src !== 'crawler'
          ? `<a class="job-link secondary" href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent((j.company||'') + ' recruiter netherlands')}" target="_blank" rel="noopener" title="Find recruiter on LinkedIn">Find Recruiter</a>`
          : '');
    return `<div class="job-card status-${status || 'none'}">
      <div class="job-card-main">
        <div class="job-top">
          <span class="job-company">${esc(j.company)}</span>
          <span class="job-sector">${esc(sector)}</span>
          <span class="source-badge ${esc(src)}">${esc(srcLabel)}</span>
          ${matchBadgeHtml(score, ai, reason)}
        </div>
        <div class="job-title">${esc(j.job_title)}</div>
        <div class="job-meta">
          ${j.location ? '<span>' + esc(j.location) + '</span>' : ''}
          ${dateStr ? '<span>' + esc(dateStr) + '</span>' : ''}
          ${applicants}
          ${status ? '<span style="color:var(--accent)">' + statusLabel(status) + '</span>' : ''}
        </div>
        ${notes ? '<div class="job-notes">' + esc(notes) + '</div>' : ''}
      </div>
      <div class="job-actions">
        <a class="job-link" href="${esc(j.job_url || j.careers_url)}" target="_blank" rel="noopener">Apply →</a>
        ${recruiterHtml}
        ${j.careers_url && j.job_url && !j.recruiter_email ? '<a class="job-link secondary" href="' + esc(j.careers_url) + '" target="_blank" rel="noopener">Careers</a>' : ''}
        <select class="status-select" data-key="${esc(key)}" onchange="handleStatusChange(this)" title="Track status">
          <option value="" ${!status?'selected':''}>Track…</option>
          <option value="bookmarked" ${status==='bookmarked'?'selected':''}>🔖 Bookmark</option>
          <option value="applied" ${status==='applied'?'selected':''}>✅ Applied</option>
          <option value="interview" ${status==='interview'?'selected':''}>🎯 Interview</option>
          <option value="offer" ${status==='offer'?'selected':''}>🎉 Offer</option>
          <option value="rejected" ${status==='rejected'?'selected':''}>❌ Rejected</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

function handleStatusChange(sel) {
  const key = sel.getAttribute('data-key');
  setStatus(key, sel.value);
}

function updateStats() {
  const counts = {bookmarked:0, applied:0, interview:0, offer:0, rejected:0};
  for (const v of Object.values(statuses)) if (counts[v] !== undefined) counts[v]++;
  document.getElementById('chip-bookmarked').textContent = counts.bookmarked + ' Bookmarked';
  document.getElementById('chip-applied').textContent = counts.applied + ' Applied';
  document.getElementById('chip-interview').textContent = counts.interview + ' Interview';
  document.getElementById('chip-offer').textContent = counts.offer + ' Offer';
  document.getElementById('chip-rejected').textContent = counts.rejected + ' Rejected';
  document.getElementById('total-count').textContent = JOBS_DATA.length;
  document.getElementById('total-badge').textContent = JOBS_DATA.length + ' roles';
}

applyFilters();
</script>
