erdeel van OCTA Farmacie Groep**\n\nFresco Farma is de farmaceutische groothandel van de OCTA Farmacie Groep en toonaangevend in instellingsfarmacie en kliniekfarmacie. Vanuit onze locatie in Almere verzorgen we dagelijks de inkoop, het assortimentsbeheer, de opslag, central filling en distributie van geneesmiddelen voor instellingsapotheken en zorginstellingen door heel Nederland: snel, nauwkeurig en foutloos, ook onder soms lastige omstandigheden. Zo krijgen apotheken de ruimte om zich volledig te richten op hun zorgtaak.\n\nBij Fresco Farma werk je in een hecht en divers team waarin samenwerking centraal staat, met korte lijntjes en een informele sfeer. Je krijgt volop kansen om jezelf te ontwikkelen binnen de OCTA Farmacie Groep, via trainingen of doorgroei in je functie.\n\nOCTA Farmacie Groep is een landelijke farmaceutische organisatie met meer dan 900 medewerkers, bestaande uit 60+ openbare apotheken, instellingsapotheken, een kliniekapotheek en Fresco Farma als eigen groothandel en hub-organisatie. Zie ook www.frescofarma.nl en www.octa.nl.\n\n**Over de rol**\n\nAls Product Owner van het Core-team bepaal jij wat onze productiesoftware elke week beter maakt. Je stuurt het team dat de software beheert en verbetert voor de Central Fill-hubs, Local Fill in de instellingsapotheek en de GDS-productie.\n\nOCTA bouwt de kernsoftware zelf: OCTAfill voor de hubs en Local Fill, en Panacea voor de GDS-productie. Je ziet jouw keuzes daardoor binnen weken terug op de werkvloer. Je houdt overzicht, prioriteert en stemt af met stakeholders.\n\n**Het team**\n\nJe werkt dagelijks met de engineers van Core en stakeholders van de hubs en instellingsapotheek. Je rapporteert aan de manager digitale transformatie en schakelt daarnaast met de people lead en lead-engineers. Het IT-team werkt met Python, PostgreSQL, GitLab en Linear.\n\n**Wat ga je doen?**\n\n**Per onderdeel**\n\n* Hubs: vertaal wensen van de hubs naar verbeteringen in OCTAfill, OCTAcheck en OCTAtrace en zorg dat de software meegroeit met het aantal aangesloten apotheken.\n* Local Fill: beheer de backlog voor OCTAfill in de instellingsapotheek, waar dezelfde software draait als in de hubs, met eigen variaties.\n* GDS: wees eigenaar van de backlog van Panacea en zorg dat de GDS-productie stabiel en efficiënt draait.\n\n**Voor het hele team**\n\n* Haal wensen en knelpunten op bij gebruikers en kwaliteit en vertaal deze naar heldere user stories met acceptatiecriteria.\n* Houd één geprioriteerde backlog bij in Linear en plan het werk per cyclus samen met de engineers.\n* Weeg beheer, incidenten en verbeteringen tegen elkaar af, accepteer opgeleverd werk en informeer gebruikers en stakeholders over veranderingen.\n\n**Wat breng je mee?**\n\n* Hbo- of wo-denkniveau en minimaal 3 jaar ervaring als Product Owner, business analist of in een vergelijkbare rol binnen een softwareteam.\n* Ervaring met software voor operationele processen, zoals productie, logistiek of fulfilment.\n* Ervaring met backlogbeheer, user sto", "source": "indeed"}, {"company": "CleVR B.V.", "job_title": "Product Owner bij CleVR b.v.", "location": "Rijswijk, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Clevr-B.v.", "job_url": "https://nl.indeed.com/viewjob?jk=d286a829f9cb1a1a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-19", "recruiter_email": null, "applicant_count": null, "description": "**Wil jij werken aan innovatieve Virtual Reality-oplossingen die écht impact maken?**\n\nCleVR ontwikkelt interactieve VR-software voor onder andere de geestelijke gezondheidszorg, het onderwijs en het veiligheidsdomein. Om onze producten verder te ontwikkelen en onze ambities te realiseren, zoeken wij een Product Owner die de verbinding vormt tussen onze klanten, interne stakeholders en het developmentteam.\n\nAls Product Owner werk je samen met een klein, multidisciplinair team van enthousiaste developers en artists. Jij zorgt ervoor dat ideeën, wensen en behoeften worden vertaald naar concrete productfeatures en heldere prioriteiten. Daarbij kijk je niet alleen naar wat technisch mogelijk is, maar vooral naar wat de meeste waarde oplevert voor onze gebruikers én voor CleVR.\n\n**Wat ga je doen?**\n\nJe bent verantwoordelijk voor het begeleiden en prioriteren van de ontwikkeling van onze software. Je haalt actief wensen en functionele eisen op bij klanten en collega’s en vertaalt deze samen met het team naar concrete ontwikkelopdrachten. In overleg bepaal je welke ontwikkelingen prioriteit krijgen. Daarbij houd je overzicht over de roadmap, deadlines, workload en kwaliteit van nieuwe releases.\n\nJe werkzaamheden bestaan onder andere uit:\n\n* wensen en behoeften van klanten en interne stakeholders vertalen naar duidelijke productfeatures;\n* prioriteiten bepalen en beheren binnen de productbacklog;\n* nauw samenwerken met developers en artists;\n* bewaken van voortgang, deadlines en kwaliteit van releases;\n* blokkades voor het developmentteam signaleren en waar mogelijk wegnemen;\n* Actief bijdragen aan een efficiënt en overzichtelijk ontwikkelproces;\n* continu zoeken naar manieren om onze producten beter, gebruiksvriendelijker en relevanter te maken.\n\n**Wat zoeken wij?**\n\nWe zoeken iemand die makkelijk schakelt tussen techniek, gebruikers en organisatie. Je houdt overzicht, durft keuzes te maken en vindt het leuk om samen met een team aan een innovatief product te bouwen.\n\n**Je hebt:**\n\n* ervaring als Product Owner, Business Analyst of Project Manager binnen een Agile ontwikkelomgeving;\n* ervaring met project- en issuetrackingsoftware, zoals Jira, of YouTrack;\n* sterke communicatieve en organisatorische vaardigheden;\n* een goede beheersing van zowel Nederlands als Engels;\n* het vermogen om verschillende belangen te vertalen naar duidelijke prioriteiten.\n\n**Mooi meegenomen:**\n\n* minimaal 2 jaar werkervaring als Product Owner;\n* affiniteit met psychologie, geestelijke gezondheidszorg of onderwijs;\n* interesse in nieuwe technologieën zoals Virtual Reality, AI en interactieve software.\n\n**Wat bieden wij?**\n\nBij CleVR krijg je de kans om te werken aan technologie die niet alleen innovatief is, maar ook daadwerkelijk wordt ingezet om mensen te helpen, professionals te trainen en behandelingen te verbeteren.\n\n**Je kunt rekenen op:**\n\n* werken met de nieuwste ontwikkelingen op het gebied van Virtual Reality en interactieve technologie;\n* een betekenisvolle functie b", "source": "indeed"}, {"company": "Vattenfall", "job_title": "Product Owner - Mijn Vattenfall Zakelijk", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Vattenfall", "job_url": "https://nl.indeed.com/viewjob?jk=6238888687503d2e", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-17", "recruiter_email": null, "applicant_count": null, "description": "**Bedrijfsomschrijving**\n\nVattenfall is één van de grootste energiebedrijven in Europa. We maken stroom en warmte en leveren energie aan miljoenen klanten. Dat doen we in Zweden, Duitsland, het Verenigd Koninkrijk, Frankrijk, Denemarken, Finland én Nederland.\n\nMet zo’n 21.000 werknemers maken we een toekomst mogelijk waarin we voor onze energie minder afhankelijk zijn van het gebruik van fossiele brandstoffen. We lopen voorop in de transitie naar een duurzaam energiesysteem. Om dit ambitieuze doel te kunnen bereiken zijn wij op zoek naar getalenteerde personen die naast hun passie voor hun eigen rol ook een sterke teamspirit hebben en willen bijdragen aan het ondersteunen van een betekenisvolle bedrijfsmissie.\n\n **Vacatureomschrijving**\n\n***Met eigenaarschap en initiatief is er altijd een weg.***\n\nWil jij bepalen hoe onze grootzakelijke klanten hun energiezaken digitaal regelen? Als Product Owner Mijn Vattenfall Zakelijk vertaal je klantbehoeften en bedrijfsdoelstellingen naar digitale oplossingen die onze dienstverlening toegankelijker, slimmer en eenvoudiger maken.\n\n**Over de rol**\n\nMijn Vattenfall Zakelijk is de digitale omgeving voor onze grootzakelijke klanten. Zij krijgen hier inzicht in hun energieverbruik en contractgegevens en kunnen zelf contractzaken regelen, zoals het aanpassen of verlengen van een contract. Ook ontwikkelen we online verkoopmogelijkheden en API’s waarmee klanten gegevens kunnen uitwisselen met hun eigen systemen.\n\nAls Product Owner ben je verantwoordelijk voor de verdere ontwikkeling van deze digitale omgeving. Je werkt nauw samen met developers, testers, UX-specialisten, andere Product Owners en collega’s uit onder meer product- en procesmanagement. Samen bepalen jullie wat wordt ontwikkeld, waarom dit belangrijk is en in welke volgorde het wordt gerealiseerd.\n\nJe maakt deel uit van het Digital Expert Team binnen de zakelijke markt en rapporteert aan de Manager Digital Expert Team. In deze rol combineer je klantgericht denken met commerciële kansen en technische uitvoerbaarheid. Daarmee help je zakelijke klanten hun energiezaken steeds makkelijker en zelfstandiger te organiseren.\n\n**Jouw taken en verantwoordelijkheden**\n\n* Je ontwikkelt en communiceert een heldere productvisie en vertaalt deze naar een roadmap en geprioriteerde backlog.\n* Je houdt overzicht over de roadmap en lopende sprints en duikt waar nodig in de inhoudelijke details.\n* Je beoordeelt nieuwe verzoeken, bewaakt de focus van het team en maakt duidelijke keuzes over prioriteiten.\n* Je geeft vorm aan de inzet van AI binnen het product en in de manier waarop het team analyseert, ontwikkelt en test.\n* Je versterkt samen met het team de agile manier van werken, zowel binnen het team als in de samenwerking met andere afdelingen.\n* Je werkt dagelijks samen met developers, testers, UX-specialisten, stakeholders en andere Product Owners aan de voorbereiding en implementatie van epics, features en user stories.\n* Je brengt wensen en requirements vanuit de org", "source": "indeed"}, {"company": "GlobalOrange", "job_title": "Product Manager", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Globalorange", "job_url": "https://nl.indeed.com/viewjob?jk=3651a1dcf839e828", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Amsterdam · hybride\n\n32–40 uur\n\nBouw digitale producten die echt impact maken, sneller en slimmer met AI. Bij GlobalOrange bouwen we SaaS-producten en platformen voor startups, scale-ups en grotere bedrijven. Als Product Manager ben jij de schakel tussen klant en team: je begrijpt wat de klant nodig heeft, stuurt op waarde en zorgt dat het juiste product op de juiste manier wordt gebouwd.\n\nSolliciteer nu\n\n**Productmanagement met AI**\n----------------------------\n\nAI speelt daarin op twee manieren een grote rol. We gebruiken AI en agents om sneller en beter te bouwen, en we bouwen AI-functionaliteit in de producten van onze klanten, zodat hun eindgebruikers er echt iets aan hebben. Jij snapt beide kanten: hoe je een project met AI aanstuurt, en waar AI in een product waarde toevoegt (en waar niet).\n\nJe werkt nauw samen met onze engineers en architecten aan innovatieve producten. Je bent analytisch sterk, communiceert helder en krijgt energie van klantcontact en productstrategie.\n\n**Wat je gaat doen**\n--------------------\n\n### **Het product**\n\n* Je ontdekt samen met de klant wat écht belangrijk is voor hun eindgebruikers.\n* Je ziet kansen om AI in het product in te zetten, zoals beeldherkenning en -generatie, het automatisch plannen van activiteiten of LLM-integraties en MCP-servers, en je weegt waarde af tegen kosten, risico’s en kwaliteit.\n* Je maakt impact met slimme keuzes: wat bouwen we wel, wat juist niet?\n* Je prioriteert features, beheert de roadmap en bewaakt voortgang en budget.\n\n### **Het project**\n\n* Je stuurt projecten aan waarin AI en agents een groot deel van het bouwwerk doen.\n* Je zorgt voor heldere specificaties en tickets, waar zowel developers als agents mee verder kunnen.\n* Je trekt samen op met een engineer: belangrijke keuzes, zoals het introduceren van AI in een klantproduct, neem je niet alleen.\n* Je communiceert helder en regelmatig met de klant en het team, ook over wat AI wel en niet kan.\n\n### **Het team**\n\n* Je deelt wat werkt en wat niet, zodat het hele team het volgende project sneller en beter doet.\n* Je bouwt mee aan onze gezamenlijke standaarden, tooling en werkwijze, onder andere in onze Product & Tech Guild.\n\n**Jij brengt mee**\n------------------\n\n* 3 tot 5\\* jaar ervaring in digital product ownership of projectmanagement.\n* Je spreekt en schrijft **vloeiend Nederlands én Engels**.\n* Je werkt dagelijks met AI-tools en weet uit ervaring hoe je ze inzet om sneller en beter te werken.\n* Je begrijpt hoe AI-functionaliteit in een product werkt, wat het kost en waar het mis kan gaan, en je kunt dat helder uitleggen aan een klant.\n* Je hebt AI-features in een product gezien of helpen bouwen, of je kunt laten zien hoe je dat zou aanpakken.\n* Je hebt affiniteit met tech en praat makkelijk met developers en architecten.\n* Je hebt een sterk analytisch vermogen en denkt altijd een stap vooruit.\n* Je krijgt energie van klantcontact en het achterhalen van hun échte behoefte.\n* Je werkt gestructureerd, houdt overzicht en neemt ", "source": "indeed"}, {"company": "Universiteit van Amsterdam", "job_title": "Product Owner Data", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Universiteit-Van-Amsterdam", "job_url": "https://nl.indeed.com/viewjob?jk=95e98fc1d0f568fd", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-09", "recruiter_email": null, "applicant_count": null, "description": "* + Bestuur en Bestuursstaf UvA\n  + HBO / Universiteit\n  + 32 - 38 uur\n* + 15646\n  + €5.932 - €7.573\n  + Sluit op\n\n    22-11-2026\n\n  \n\nWord jij blij van het ontwikkelen van goeie en effectieve informatievoorziening? Ben jij klantgericht en vind je het leuk om de wensen van gebruikers te vertalen naar de doorontwikkeling van systemen? En kan jij koers houden in een complexe werkomgeving? Dan is de functie van Product Owner Data bij de UvA wellicht iets voor jou!\n\n  \n\n#### **Werken bij de UvA**\n\n**Kom bij ons werken!**\n-----------------------\n\nBij de afdeling Bestuurlijke Informatie zoeken we een enthousiaste en stevige Product Owner. Je wordt verantwoordelijk voor de twee dataplatformen die binnen de UvA in gebruik zijn; SAP BO/BW (“UvAdata”) en Microsoft Fabric. Beide systemen hebben als doel om data over o.a. studenten, personeel, financiën en gebouwen op een veilige en verantwoorde manier te delen met diverse stakeholders. De stakeholders zijn divers; van bestuurders, hoger management en hun ondersteuners tot operationele teams.\n\nUvAdata bestaat al meer dan 10 jaar en toont enkel opgeschoonde data. Het is daarmee geëvolueerd tot een uitgebreid en goed verzorgd managementinformatiesysteem. MS Fabric is een nieuwe ontwikkeling en heeft ook ruwe data beschikbaar voor diverse operationele teams. Deze teams zitten bijvoorbeeld bij faculteiten of ondersteunende diensten en kunnen hiermee zelf analyses maken ten behoeve van de optimalisatie van hun eigen werkzaamheden. Dit realiseren we door het inrichten van zogenaamde Data Landing Zones (DLZ).\n\nIn beide systemen staat er de komende jaren het nodige te gebeuren. In de SAP-omgeving gaan verschillende onderdelen out of support. Dit betekent dat er nog veel keuzes gemaakt moeten worden die vervolgens ook in plannen gegoten moet worden.\n\nOndertussen gaat de ontwikkeling van de MS Fabric en de DLZs-omgeving ook door. Dit onderdeel bevindt zich in een innovatieve fase waarbij afwegingen over digitale soevereiniteit en AI relevant zullen worden. Daarbij liggen er uitdagingen om de gebruikerservaring te verbeteren, de betrouwbaarheid en veiligheid te verhogen en om met het SAP-team het beheer passend in te regelen.\n\nDaarnaast is er behoefte aan een productvisie Data waarin toekomstbestendige keuzes voor de functionaliteiten die nu geleverd worden met SAP BO/BW en MS Fabric geborgd worden. Een uitdagende klus!\n\n  \n\n### **Een goed salaris**\n\nJe salaris wordt bepaald op basis van jouw ervaring en senioriteit, conform de CAO Universiteiten. Je inschaling en dus de genoemde bedragen zijn gebaseerd op een volledig dienstverband van 38 uur per week.\n\nLees meer\n\n### **232 vakantie-uren**\n\nOok bieden we ouderschapsverlof, partnerverlof en verlof wegens maatschappelijke betrokkenheid. Via de Menukaart Arbeidsvoorwaarden zijn er mogelijkheden tot nog meer vakantie-uren.\n\nLees meer\n\n### **Financiële regelingen**\n\nBovenop je salaris ontvang je vakantiegeld (8%) en een eindejaarsuitkering (8,3%). Je bouwt een goed pensioe", "source": "indeed"}, {"company": "Inkubis", "job_title": "Product Owner AI bij Flowmark", "location": "Amsterdam Westpoort, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Inkubis", "job_url": "https://nl.indeed.com/viewjob?jk=9b4bd859479fb8e3", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "**Product Owner AI bij Flowmark**\n\nPraten over AI kan iedereen. Jij bouwt er liever iets mee.\n\nMet Flowmark beginnen we iets nieuws. Flowmark is een Integratie Intelligentie platform dat organisaties helpt hun integraties beter te begrijpen en beheersen. Het geeft management en teams meer grip op risico’s, continuïteit en veranderingen, zonder dat zij zich hoeven te verdiepen in alle onderliggende technische details.\n\nAls Product Owner bepaal jij de richting, test ideeën en zorgt dat wat werkt ook groot wordt. Herken je jezelf hierin? Lees dan snel verder.\n\n**Jouw rol in het team**\n\n* **Richting geven:** Jij bepaalt de visie en de roadmap van Flowmark. Je weet waar we naartoe gaan en waarom.\n* **Ontdekken:** Je duikt in de processen van de klant en stelt vragen tot je snapt waar de echte winst zit. Die inzichten giet je in use cases, epics en user stories.\n* **Bouwen en testen:** Je wacht niet op een volledig uitgewerkt plan. Met AI-tools en low-code bouw je zelf prototypes en zet je pilots op. Zo zie je snel wat werkt.\n* **Opschalen:** Werkt een pilot? Dan maak je hem samen met onze consultants en architecten klaar voor het echte werk.\n* **Mensen meenemen:** Je houdt klanten en collega’s betrokken bij keuzes en resultaten.\n\n**Jouw bagage**\n\n* Hbo- of wo-denkniveau.\n* Minimaal drie jaar ervaring als Product Owner bij digitale producten.\n* Je kent Agile en Scrum van binnen en buiten. Een PSPO-certificaat is mooi meegenomen.\n* Je hebt al eens zelf iets gebouwd met low-code, no-code of AI-tools. Vibe coding is voor jou geen vreemd woord.\n* AI en automatisering houden je ook buiten werktijd bezig.\n* Je schakelt makkelijk tussen het grote plaatje en de details.\n* Je spreekt en schrijft vlot Nederlands en Engels.\n\n**Hoe jij dit aanpakt**\n\nJe bent het gezicht van Flowmark. Je vertelt het verhaal aan klanten, laat zien wat het oplevert en zorgt samen met het team dat het product zijn weg vindt.\n\nJij bent een aanpakker in hart en nieren, en werkt graag voor én met het team. Je durft kritisch te zijn, ook op je eigen ideeën. Werkt iets niet? Dan gooi je het weg en probeer je het anders. Je denkt in concepten, maar je bent pas tevreden als het in de praktijk werkt. Hard werken? Zeker. Maar samen lachen en successen vieren vinden we minstens zo belangrijk.\n\n**Wat wij jou bieden**\n\n* **Salaris:** Een bruto jaarsalaris tussen de €60.000 en €75.000, passend bij jouw kennis en ervaring.\n* **Uren:** 32 tot 40 uur per week.\n* **Secundaire voorwaarden:** een goede pensioenregeling, telefoon- en internetvergoeding en tal van voordelen vanuit de Cronos Groep.\n* **Groei:** Volop ruimte voor opleidingen en certificeringen, ook op het gebied van AI.\n* **Flexibiliteit:** Flexibele werktijden en de mogelijkheid om thuis te werken.\n* **Innovatie:** Je bouwt Flowmark vanaf het begin mee. Jouw keuzes bepalen hoe het eruit komt te zien.\n\nBij Flowmark krijg je het beste van twee werelden. Een compact team waar jouw inbreng direct zichtbaar is, met de slagkracht van de Cronos G", "source": "indeed"}, {"company": "Brand New Day", "job_title": "Finance transformation & product lead", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Brand-New-Day-eb65d4e5", "job_url": "https://nl.indeed.com/viewjob?jk=7649a19a6d9ac4a8", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-04", "recruiter_email": null, "applicant_count": null, "description": "* Amsterdam\n* Finance & Treasury\n\n**Waarom Brand New Day ?**\n--------------------------\n\n* Een enthousiast en gedreven team om je heen dat vooruit wil\n* Een informele organisatie zonder politiek of hiërarchisch geneuzel\n* Goede bereikbaarheid op loopafstand van station Amsterdam Bijlmer ArenA\n\n**Finance transformation & product lead**\n=========================================\n\nEen goed plan voor finance is mooi. Zorgen dat het ook werkt? Nog mooier. Krijg jij energie van allebei? En schakel je makkelijk tussen een strategisch gesprek met finance-management en de details van een rapportage of systeem? Dan maken we graag kennis met je. We zoeken een finance transformation & product lead die onze veranderplannen voor finance vertaalt naar duidelijke prioriteiten en praktische oplossingen.\n\n**Wat ga je doen als Finance Transformation & Product Lead?**\n\nBij Brand New Day maken we finance steeds een beetje slimmer: betere processen, betere rapportages en betrouwbare data. En waar het kan: minder handmatig werk. Dat scheelt tijd én maakt ruimte voor andere dingen.\n\nAls finance transformation & product lead ben jij verantwoordelijk voor de verander-roadmap van finance en de functionele inrichting en doorontwikkeling van finance-oplossingen. Denk aan rapportages, dashboards, berekeningen, controles en dataproducten. Samen met je collega’s bepaal je wat nodig is en begeleid je de uitvoering. Bij de belangrijkste veranderingen werk je zelf eisen (requirements) uit, breng je in kaart wat ontbreekt en denk je mee over oplossingen.\n\n**Dit ga je doen:**\n\n* **De koers bepalen.** Je beheert de finance-roadmap en -backlog en vertaalt strategie, regelgeving en verbeterideeën naar duidelijke prioriteiten.\n* **Van vraag naar oplossing werken.** Je werkt functionele requirements en data-requirements uit en bepaalt samen met finance, data en IT welke oplossingen nodig zijn.\n* **Regulatory reporting verder brengen**. Je beheert de functionele roadmap, backlog en doorontwikkeling van de applicatie. In januari 2027 starten we met de implementatie.\n* **Processen slimmer maken**. Je verbetert processen, rapportages en controles, met aandacht voor betrouwbare data en minder handmatig werk.\n* **De uitvoering begeleiden.** Je stemt af met teams en leveranciers en coördineert gebruikersacceptatietesten, de opvolging van bevindingen, documentatie en trainingen voor de livegang.\n* **Overzicht houden.** Je bewaakt afhankelijkheden en risico’s, legt requirements en besluiten vast en houdt het management op de hoogte van voortgang en benodigde besluiten.\n\n**Met wie werk je samen?**\n\nJe werkt veel samen met de afdelingen finance, data en IT. Ieder met zijn eigen expertise. Finance weet wat er inhoudelijk nodig is en is verantwoordelijk voor de financiële resultaten en rapportages aan toezichthouders. Data verzorgt het dataplatform en de ontwikkeling van dataoplossingen. IT ondersteunt met onze externe technologiepartners de applicaties en technische infrastructuur.\n\nEn jij? Jij breng", "source": "indeed"}, {"company": "LYNX Beleggen", "job_title": "Product Manager Trading Experience", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/lynx", "job_url": "https://www.linkedin.com/jobs/view/4492035723", "visa_support" ouden voor directie en management\n\n**Dit ben jij**\n\n* Je hebt minimaal twee jaar ervaring met ERP-systemen, bijvoorbeeld als key user, functioneel beheerder of product owner\n* Je begrijpt hoe bedrijfsprocessen samenhangen, van inkoop en voorraad tot verkoop en facturatie\n* Je staat stevig in je schoenen en kunt goed bepalen wat belangrijk is en wat kan wachten\n* Je werkt zelfstandig, pakt zaken actief op en houdt overzicht wanneer het druk is\n* Je schakelt makkelijk met collega’s van verschillende afdelingen en externe partners\n* Je voertaal is Engels of Nederlands\n* Je bent beschikbaar voor 24 tot 40 uur per week en kunt op maandag op ons kantoor in Rotterdam werken\n* Ervaring met NetSuite of een ERP-implementatie is mooi meegenomen\n* Een specifiek diploma is voor deze functie niet nodig. We vinden jouw werkervaring en praktische kennis belangrijker.\n\n**Dit bieden wij**\n\n* Een vast salaris tussen €5.000,- en €5.500,- bruto per maand (o.b.v. fulltime)\n* Een rol met veel vrijheid, eigen verantwoordelijkheid en ruimte voor initiatief\n* 25 vakantiedagen op basis van fulltime\n* 8,33% vakantiegeld, jaarlijks uitbetaald in mei\n* €0,25 reiskostenvergoeding per kilometer bij een woon-werkafstand van minimaal 10 km\n* Een aantrekkelijke pensioenregeling\n* Flexibele werktijden tussen 08.00 en 18.00 uur, in overleg\n* De mogelijkheid om na de eerste maand deels thuis te werken, afhankelijk van hoe zelfstandig je met het systeem kunt werken\n* Een laptop en mobiele telefoon\n* Ruimte om je verder te ontwikkelen, bijvoorbeeld via train", "source": "indeed"}, {"company": "Optics11", "job_title": "Senior Product Manager (Towed Array Solutions)", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/optics11bv", "job_url": "https://www.linkedin.com/jobs/view/4491791930", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-18", "recruiter_email": null, "applicant_count": null, "description": "" d.com/viewjob?jk=1a74f10a84864bdc", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Toevoegen aan favorieten\n\n**Internationaal Product Manager ISMS**\n=======================================\n\nWil jij jouw expertise in informatiebeveiliging inzetten om internationaal het verschil te maken? Als Product Manager ISMS bij TÜV NORD GROUP verbind je technische kennis met commerciële kansen. Je ontwikkelt certificeringsdiensten en werkt samen met collega's in meer dan 30 landen.\n\nNu solliciteren\n\n  \n\n#### **Internationaal Product Manager ISMS**\n\n* Internationaal Product Manager ISMS\n* Certificatie\n* Son en Breugel\n* Eindhoven\n* HBO, WO\n* 36-40 uur\n* n.n.b.\n\nInformatiebeveiliging speelt wereldwijd een steeds belangrijkere rol. Organisaties staan voor nieuwe uitdagingen op het gebied van cybersecurity, wet- en regelgeving en internationale normen. TÜV NORD GROUP ondersteunt organisaties hierbij met onafhankelijke certificeringsdiensten. Om ons internationale portfolio verder te ontwikkelen, zoeken we een ervaren professional die marktontwikkelingen begrijpt, kansen herkent en technische expertise weet te verbinden met commerciële ambities.\n\n**Over de rol**\n---------------\n\nHoe zorg je ervoor dat diensten voor informatiebeveiliging aansluiten op de veranderende behoeften van klanten en markten wereldwijd?\n\nAls Product Manager ISMS speel je een belangrijke rol in de internationale ontwikkeling en groei van ons portfolio voor informatiebeveiliging en cybersecurity. Je combineert diepgaande technische kennis met commercieel inzicht en weet hoe je kansen in de markt vertaalt naar succesvolle producten en diensten.\n\nJe werkt nauw samen met regiomanagers, directeuren, technische experts en commerciële teams in meer dan 30 landen. Daarbij vorm je de verbindende schakel tussen technische expertise, productontwikkeling, marketing en sales.\n\nJe richt je onder andere op certificeringsdiensten rondom ISO/IEC 27001, IEC 62443, ISO/SAE 21434 en TISAX®.\n\nIn deze zelfstandige, internationale functie krijg je de ruimte om nieuwe initiatieven te ontwikkelen, mensen samen te brengen en direct bij te dragen aan de verdere groei van TÜV NORD GROUP.\n\n  \n\nAls Product Manager ISMS ben je verantwoordelijk voor de internationale ontwikkeling, positionering en commerciële groei van ons certificeringsportfolio.\n\nJe houdt je onder andere bezig met:\n\n* Het ontwikkelen en uitbreiden van internationale certificeringsdiensten op het gebied van informatiebeveiliging en cybersecurity.\n* Het ophalen van behoeften en ideeën bij internationale teams en stakeholders en deze vertalen naar relevante producten en diensten.\n* Het volgen van marktontwikkelingen, nieuwe wet- en regelgeving en technologische veranderingen om nieuwe commerciële kansen te signaleren.\n* Het samenwerken met regiomanagers, directeuren en businessleiders in meer dan 30 landen.\n* Het ondersteunen van lokale sales- en keyaccountteams bij het ontwikkelen van commerciële kansen, het binnenhalen van nieuwe opdrachten en het versterken van bestaande klantrelaties.\n* Het samenwerken met marketing en technische expe", "source": "indeed"}, {"company": "Scholt Energy", "job_title": "D365 Finance/F&O product owner", "location": "Eindhoven, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Scholt-Energy-1", "job_url": "https://nl.indeed.com/viewjob?jk=952d814300beb242", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "Location\n\nEindhoven, NL\n\nEmployment type\n\nFull-time\n\nWork mode\n\nOn-site\n\nPosted\n\n16 Sept 2026\n\nOrganisation\n\nScholt Energy\n\nBen jij een ervaren D365 Finance/F&O Consultant die graag verder kijkt dan alleen de technische implementatie?\n\nBij Scholt Energy krijg je een belangrijke rol in onze transitie naar Microsoft Dynamics 365 Finance. J function getSector(company) {
  const cl = company.toLowerCase();
  for (const [key, sec] of Object.entries(SECTOR_MAP)) {
    if (cl.includes(key)) return sec;
  }
  return 'Other';
}

// ── Match scoring ─────────────────────────────────────────────────────────────
function scoreJob(j) {
  const title = (j.job_title || '').toLowerCase();
  const company = (j.company || '').toLowerCase();
  const sector = getSector(j.company);
  const desc = (j.description || '').toLowerCase().slice(0, 800);
  let score = 0;

  // Role type (0–50)
  const ROLES = [
    [50, ['technical product manager','product manager','productmanager','product management']],
    [48, ['associate product manager','apm']],
    [44, ['product owner','product lead']],
    [42, ['product operations','product ops','product strategy','growth product','growth manager']],
    [36, ['technical program manager','program manager','programme manager','tpm']],
    [25, ['head of product','director of product','vp of product']],
  ];
  for (const [pts, kws] of ROLES) {
    if (kws.some(k => title.includes(k))) { score += pts; break; }
  }
  if (score === 0) score += 15;

  // Sector fit (0–30)
  score += ({ Tech:30, Industrial:22, Energy:22, Finance:20, FMCG:14, Consulting:12, Other:12 })[sector] || 12;

  // Company bonus (0–20)
  const CO = [
    [20, ['adyen','booking','uber','databricks','prosus','backbase','catawiki','tomtom','mollie','bol.com','just eat','coolblue','exact']],
    [16, ['asml','nxp','signify','philips','wolters kluwer','vanderlande','tno']],
    [14, ['shell','eneco','vattenfall','tennet','alliander','stedin','orsted','ørsted','sbm offshore','neste','fugro']],
    [12, ['ing ','rabobank','abn amro','nn group','aegon','van lanschot']],
    [10, ['unilever','heineken','akzonobel','dsm','firmenich','ahold','frieslandcampina']],
    [6,  ['bcg','bain','mckinsey','oliver wyman','kearney','strategy&','roland berger','ey-parthenon','deloitte','accenture']],
  ];
  for (const [pts, kws] of CO) {
    if (kws.some(k => company.includes(k))) { score += pts; break; }
  }

  // Keyword signals in title/desc (+0–10)
  let bonus = 0;
  for (const [kw, pts] of [['product',3],['platform',2],['data',2],['growth',2],['energy',2],
      ['roadmap',2],['b2b',1],['saas',1],['analytics',1],['strategy',1]]) {
    if (title.includes(kw)) bonus += pts;
    else if (desc.includes(kw)) bonus += Math.round(pts / 2);
  }
  score += Math.min(10, bonus);
  score = Math.min(100, score);
  // She has no full-time PM job yet, so seniority in the title bounds the fit.
  if (/\b(vp|vice president|head of|director|chief|cpo)\b/i.test(title)) return Math.min(score, 25);
  if (/\b(principal|group|staff|lead)\b/i.test(title)) return Math.min(score, 40);
  if (/\b(senior|sr\.?|expert)\b/i.test(title)) return Math.min(score, 60);
  if (/\b(associate|junior|jr\.?|new grad|graduate|entry|apm)\b/i.test(title)) return Math.min(100, score + 10);
  return Math.min(score, 85);
}

function getAiScores() { try { return JSON.parse(localStorage.getItem(AI_SCORES_KEY) || '{}'); } catch { return {}; } }
function saveAiScores(obj) { try { localStorage.setItem(AI_SCORES_KEY, JSON.stringify(obj)); } catch {} }

function getEffectiveScore(j) {
  // Priority: localStorage (user-triggered) > j.ai_score (server-side) > JS rules
  const entry = getAiScores()[jobKey(j)];
  if (entry) return { score: entry.s, reason: entry.r || '', ai: true };
  if (j.ai_score !== undefined) return { score: j.ai_score, reason: '', ai: true };
  return { score: scoreJob(j), reason: '', ai: false };
}

function matchBadgeHtml(score, isAi, reason) {
  let cls;
  if (score >= 85) cls = 'ex';
  else if (score >= 70) cls = 'str';
  else if (score >= 55) cls = 'gd';
  else if (score >= 40) cls = 'ok';
  else cls = 'low';
  const sup    = isAi ? '<sup style="font-size:8px;margin-left:1px">AI</sup>' : '';
  const tipTxt = isAi && reason ? reason : (isAi ? 'AI-scored by Claude' : 'Keyword match score');
  return `<span class="match-badge match-${cls}" title="${esc(tipTxt)}">${score}%${sup}</span>`;
}

- CV_Product (PM/product/analytics focus): best for product, tech, and data-adjacent roles

=== SCORING RUBRIC ===
90–100  Perfect fit: digital/technical product role at her level + strong employer or domain match (e.g. TomTom Product Manager, Adyen Associate PM, energy-tech Product Manager)
75–89   Strong fit: 2 of 3 dimensions align well; clear mutual value
60–74   Good fit: relevant role or sector, some match gaps
45–59   Decent fit: worth applying but not a standout match
30–44   Weak fit: significant skill/interest mismatch
0–29    Poor fit: wrong language, wrong seniority, or fundamentally misaligned

SENIORITY IS THE MAIN FILTER (judge from title AND description: years asked, people management, scope)
- VP / Head of / Director / Chief: 0-15
- Principal / Group / Staff / Lead PM, or 7+ years of PM experience: 5-25
- Senior PM, or 4-6 years of PM experience: 20-45 at most, even at a dream company
- PM asking about 2-3 years: 45-70 depending on domain match
- Associate / junior / new-grad / MBA programme, or PM with no hard years requirement: 65-95
Do not give a high score just because the title says Product Manager or the company is famous.

PENALISE when:
- Job description or title implies Dutch fluency required ("vloeiend Nederlands", "native Dutch")
- Role is primarily coding/software engineering, design, product marketing or sales (not product management)
- Role is an internship, working-student or thesis position
- 'Product manager' for physical goods / FMCG brand or category with no digital or technical product
- Requires 5+ years of product management experience (Senior/Principal/Head/Director)
- Role is outside Netherlands or requires relocation`;

// ── AI batch scoring ──────────────────────────────────────────────────────────
async function aiScoreAll() {
  let apiKey = localStorage.getItem('vanshika_claude_api_key');
  if (!apiKey) {
    const k = prompt('Enter your Claude API key (sk-ant-…) to enable AI scoring:');
    if (!k || !k.trim()) return;
    apiKey = k.trim();
    localStorage.setItem('vanshika_claude_api_key', apiKey);
  }
  const btn = document.getElementById('ai-score-btn');
  btn.disabled = true; btn.textContent = '⏳ Scoring…';

  const aiScores = getAiScores();
  const unscored = JOBS_DATA.filter(j => !aiScores[jobKey(j)]);
  if (!unscored.length) {
    btn.disabled = false; btn.textContent = '✨ Re-score with AI';
    applyFilters(); return;
  }

  const BATCH = 8;   // smaller batches — full descriptions fit comfortably
  let done = 0;
  try {
    for (let i = 0; i < unscored.length; i += BATCH) {
      const batch = unscored.slice(i, i + BATCH);

      const jobLines = batch.map((j, idx) => {
        const sector  = getSector(j.company);
        const desc    = (j.description || '').trim().slice(0, 1200);
        const descTxt = desc ? `\n   Description: ${desc}` : '';
        return `${idx}. Company: ${j.company} | Role: ${j.job_title} | Location: ${j.location || 'Netherlands'} | Sector: ${sector}${descTxt}`;
      }).join('\n\n');

      const userMsg = `Score these ${batch.length} roles for Vanshika. Reply ONLY with a JSON array — no other text:\n[{"i":0,"s":88,"r":"one sentence why"}, ...]\n\nRoles:\n${jobLines}`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-beta': 'prompt-caching-2024-07-31',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 600,
          system: [{
            type: 'text',
            text: AI_SYSTEM_PROMPT,
            cache_control: { type: 'ephemeral' },
          }],
          messages: [{ role: 'user', content: userMsg }],
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'API ' + res.status);
      }
      const data = await res.json();
      const text = data.content?.[0]?.text || '[]';
      const match = text.match(/\[[\s\S]*\]/);
      if (match) {
        const parsed = JSON.parse(match[0]);
        for (const {i, s, r} of parsed) {
          if (batch[i]) {
            aiScores[jobKey(batch[i])] = {
              s: Math.min(100, Math.max(0, Math.round(s))),
              r: (r || '').slice(0, 120),
            };
          }
        }
      }
      done += batch.length;
      btn.textContent = `⏳ ${done}/${unscored.length}…`;
      saveAiScores(aiScores);
    }
    btn.textContent = '✅ AI Scored!';
  } catch(e) {
    btn.textContent = '⚠ Error — Retry?';
    console.error('AI scoring error:', e);
  } finally {
    btn.disabled = false;
    applyFilters();
    setTimeout(() => { if (btn.textContent !== '⚠ Error — Retry?') btn.textContent = '✨ Re-score with AI'; }, 3000);
  }
}

// ── Job utils ─────────────────────────────────────────────────────────────────
function jobKey(j) { return j.job_url || (j.company + '|' + j.job_title); }

const LS_KEY = 'vanshika_job_statuses';
let statuses = {};
try { statuses = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch {}

function setStatus(key, val) {
  if (val) statuses[key] = val;
  else delete statuses[key];
  localStorage.setItem(LS_KEY, JSON.stringify(statuses));
  applyFilters();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(raw) {
  if (!raw) return null;
  try {
    const d = new Date(raw);
    if (isNaN(d)) return null;
    const diff = Math.round((Date.now() - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff <= 6) return diff + 'd ago';
    if (diff <= 30) return Math.round(diff/7) + 'w ago';
    return d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
  } catch { return null; }
}

function statusLabel(s) {
  return {applied:'✅ Applied', interview:'🎯 Interview', offer:'🎉 Offer',
    rejected:'❌ Rejected', bookmarked:'🔖 Bookmarked'}[s] || '';
}

// ── Filters + sort ────────────────────────────────────────────────────────────
function applyFilters() {
  const search  = document.getElementById('search').value.toLowerCase();
  const sector  = document.getElementById('sector-filter').value;
  const statusF = document.getElementById('status-filter').value;
  const sourceF    = document.getElementById('source-filter').value;
  const sortBy     = document.getElementById('sort-by').value;
  const maxDays    = parseInt(document.getElementById('date-filter').value) || 0;
  const maxApplied = parseInt(document.getElementById('applicant-filter').value) || 0;
  const now        = Date.now();

  let filtered = JOBS_DATA.filter(j => {
    const key = jobKey(j);
    const jobStatus = statuses[key] || '';
    if (statusF === 'unreviewed' && jobStatus) return false;
    if (statusF && statusF !== 'unreviewed' && jobStatus !== statusF) return false;
    if (sector && getSector(j.company) !== sector) return false;
    if (sourceF && (j.source || 'crawler') !== sourceF) return false;
    if (maxDays && j.date_posted) {
      const d = new Date(j.date_posted);
      if (!isNaN(d) && (now - d.getTime()) > maxDays * 86400000) return false;
    }
    if (maxApplied) {
      const count = j.applicant_count;
      if (count == null || count >= maxApplied) return false;
    }
    if (search) {
      const hay = (j.company + ' ' + j.job_title + ' ' + (j.location||'') + ' ' + (j.notes||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  // Sort
  if (sortBy === 'score') {
    filtered.sort((a, b) => getEffectiveScore(b).score - getEffectiveScore(a).score);
  } else if (sortBy === 'date') {
    filtered.sort((a, b) => {
      const da = a.date_posted ? new Date(a.date_posted).getTime() : 0;
      const db = b.date_posted ? new Date(b.date_posted).getTime() : 0;
      return db - da;
    });
  } else if (sortBy === 'company') {
    filtered.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
  }

  renderJobs(filtered);
  updateStats();
}

function renderJobs(list) {
  const container = document.getElementById('list-container');
  const noRes = document.getElementById('no-results');
  if (!list.length) {
    container.innerHTML = '';
    noRes.style.display = 'block';
    document.getElementById('shown-count').textContent = '0';
    return;
  }
  noRes.style.display = 'none';
  document.getElementById('shown-count').textContent = list.length;

  container.innerHTML = list.map(j => {
    const key = jobKey(j);
    const status = statuses[key] || '';
    const sector = getSector(j.company);
    const dateStr = formatDate(j.date_posted);
    const notes = (j.notes || '').replace(/\[Direct link.*?\]/g,'').trim();
    const src = j.source || 'crawler';
    const srcLabel = {linkedin:'LinkedIn', indeed:'Indeed', glassdoor:'Glassdoor', crawler:'Portal'}[src] || src;
    const { score, reason, ai } = getEffectiveScore(j);
    const applicants = j.applicant_count != null
      ? `<span style="color:${j.applicant_count < 10 ? 'var(--green)' : j.applicant_count < 25 ? 'var(--yellow)' : 'var(--text-muted)'}">${j.applicant_count} applicants</span>`
      : '';
    // Recruiter: show email if known, else show "Find" search link for LinkedIn/Indeed jobs
    const recruiterHtml = j.recruiter_email
      ? `<a class="job-link secondary" href="mailto:${esc(j.recruiter_email)}" title="Email recruiter">${esc(j.recruiter_email.split('@')[0])}</a>`
      : (src !== 'crawler'
          ? `<a class="job-link secondary" href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent((j.company||'') + ' recruiter netherlands')}" target="_blank" rel="noopener" title="Find recruiter on LinkedIn">Find Recruiter</a>`
          : '');
    return `<div class="job-card status-${status || 'none'}">
      <div class="job-card-main">
        <div class="job-top">
          <span class="job-company">${esc(j.company)}</span>
          <span class="job-sector">${esc(sector)}</span>
          <span class="source-badge ${esc(src)}">${esc(srcLabel)}</span>
          ${matchBadgeHtml(score, ai, reason)}
        </div>
        <div class="job-title">${esc(j.job_title)}</div>
        <div class="job-meta">
          ${j.location ? '<span>' + esc(j.location) + '</span>' : ''}
          ${dateStr ? '<span>' + esc(dateStr) + '</span>' : ''}
          ${applicants}
          ${status ? '<span style="color:var(--accent)">' + statusLabel(status) + '</span>' : ''}
        </div>
        ${notes ? '<div class="job-notes">' + esc(notes) + '</div>' : ''}
      </div>
      <div class="job-actions">
        <a class="job-link" href="${esc(j.job_url || j.careers_url)}" target="_blank" rel="noopener">Apply →</a>
        ${recruiterHtml}
        ${j.careers_url && j.job_url && !j.recruiter_email ? '<a class="job-link secondary" href="' + esc(j.careers_url) + '" target="_blank" rel="noopener">Careers</a>' : ''}
        <select class="status-select" data-key="${esc(key)}" onchange="handleStatusChange(this)" title="Track status">
          <option value="" ${!status?'selected':''}>Track…</option>
          <option value="bookmarked" ${status==='bookmarked'?'selected':''}>🔖 Bookmark</option>
          <option value="applied" ${status==='applied'?'selected':''}>✅ Applied</option>
          <option value="interview" ${status==='interview'?'selected':''}>🎯 Interview</option>
          <option value="offer" ${status==='offer'?'selected':''}>🎉 Offer</option>
          <option value="rejected" ${status==='rejected'?'selected':''}>❌ Rejected</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

function handleStatusChange(sel) {
  const key = sel.getAttribute('data-key');
  setStatus(key, sel.value);
}

function updateStats() {
  const counts = {bookmarked:0, applied:0, interview:0, offer:0, rejected:0};
  for (const v of Object.values(statuses)) if (counts[v] !== undefined) counts[v]++;
  document.getElementById('chip-bookmarked').textContent = counts.bookmarked + ' Bookmarked';
  document.getElementById('chip-applied').textContent = counts.applied + ' Applied';
  document.getElementById('chip-interview').textContent = counts.interview + ' Interview';
  document.getElementById('chip-offer').textContent = counts.offer + ' Offer';
  document.getElementById('chip-rejected').textContent = counts.rejected + ' Rejected';
  document.getElementById('total-count').textContent = JOBS_DATA.length;
  document.getElementById('total-badge').textContent = JOBS_DATA.length + ' roles';
}

applyFilters();
</script>
