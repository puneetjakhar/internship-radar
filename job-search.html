    #search { flex: 1; min-width: 220px; font-size: 15px; }

    .stats-bar { padding: 10px 24px; display: flex; gap: 14px; align-items: center;
      font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border); }

    .job-company { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }

"visa_support": null, "relocation_support": null, "date_posted": "2026-10-20", "recruiter_email": null, "description": "Are you comfortable navigating complex software systems, working with coding agents, and defining what makes developer tools actually useful? Do you want to shape how developers and AI work together inside IDEs? About JetBrains We create intelligent software development tools for developers and teams. More than 15 million users, over 300,000 companies, and 88 of the Fortune Global Top 100 rely on our products to solve real, complex problems. Our mission is simple: make development teams more productive and AI adoptable at scale. What you’ll do Agentic development is changing how software gets built. Developers no longer just chat with AI – they delegate tasks, run parallel agent sessions, and steer autonomous changes. As agents take on more work, reviewing and owning the output is becoming the hardest part of the process.&nbsp; JetBrains Air is our open system for agentic development. It brings tools like Codex, GitHub Copilot, Claude Agent, Gemini, and Junie directly into JetBrains IDEs, providing an agentic-first user experience. We are looking for a Senior Product Manager to lead key areas of Air. You’ll take ownership of high-impact workflows, work closely with cross-functional teams (including software engineers, designers, ML researchers, analysts, DevRel, and product marketing), and turn technical complexity into clear product direction. Day to day, you will: Take end-to-end ownership of key parts of Air in JetBrains IDEs, driving work from problem framing and discovery to delivery, adoption, and iteration. Define and refine core agentic workflows, including task delegation, session monitoring, steering, and code review. Model complex user flows, system states, permissions, and integration schemes to guide engineering and design decisions. Maintain a transparent roadmap that balances quick improvements with long-term strategic investments. Define telemetry, design experiments, analyze product data, and make evidence-based roadmap decisions. Study how developers interact with leading AI agents and tools to inform product priorities. Engage with the Agent Client Protocol (ACP) ecosystem and collaborate with partners building on it. Partner with enterprise sales and support teams to address governance, privacy, and control requirements. What you’ll bring A systems-thinking mindset that easily breaks down complex architectures, workflows, and dependencies. A data-driven approach to product decisions, including hands-on experience querying and analyzing telemetry. Active personal experience using coding agents and clear perspectives on where current AI tools succeed and fail. Strong product intuition for complex technical user experiences and developer workflows. Clear, concise, and collaborative communication skills with the ability to explain complex technical concepts simply and build alignment across diverse groups of stakeholders. Comfort navigating fast-changing technical landscapes with high ambiguity. What you’ll need Proven experience ", "notes": "Dept: AI DevTools Experience Product. Via Greenhouse board.", "source": "crawler"}, {"company": "Aquablu B.V.", "job_title": "Product Manager Digital Platforms", "location": "Amsterdam, Netherlands", "careers_url": "https://aquablu.recruitee.com/", "job_url": "https://aquablu.recruitee.com/o/product-manager-digital-platforms", "visa_support": null, "relocation_support": null, "date_posted": "2026-07-10", "recruiter_email": null, "description": "🌊 Who are we? We're a smart hydration company rebuilding an industry that still runs on sugar water and single-use packaging. Filtered water, functional flavors, zero bottles. Still, sparkling, cold, and hot. All poured from one tap. We create hydration people want to reach for, starting with the workplace where we help teams thrive. As an AI-native company, we build at speed. In 2025, Aquablu ranked 2nd in the Deloitte Technology Fast 50 (Netherlands) and 30th in the Sifted 250 (Europe), both rankings of the fastest-growing companies by revenue growth. In 2026 we were named a winner of Maya's Culture 100 Europe Awards as one of the best workplaces to thrive in. Growing that fast and thriving comes down to our people. Our team is our biggest asset and one that we’re proud of. We’re committed to maintaining our vibrant culture as we continue to grow. About the role AURA is the platform Aquablu runs on. It replaced about 15 tools with one system of record, gives every colleague their own AI agent, and connects to hundreds of our systems in the field. Version 2.0 just went live. What it becomes next is your call. You own AURA’s direction: what gets built, why, and in what order. Then you build it yourself. You’ll write features with AI coding tools like Claude Code and Cursor, and deploy them to production. Our engineering team sets the architecture, reviews your work, and makes sure the platform stays safe while you move fast. You don’t need to have been an engineer. You do need to want to ship code. You’ll report to our Head of Digital Product.", "notes": "Via Recruitee API.", "source": "crawler"}, {"company": "Tebi B.V.", "job_title": "Senior Product Manager - AI Team", "location": "Amsterdam", "careers_url": "https://jobs.ashbyhq.com/tebi", "job_url": "https://jobs.ashbyhq.com/tebi/9196e58c-31cb-4dc6-a835-a58e3f4e84be", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "description": "About us Tebi is building a modern connected hospitality operating system that helps entrepreneurs run their business more intelligently and smoothly. In one seamless platform, Tebi embeds sales, reservations, kitchen, inventory, and payments (as well as all the data that powers it) helping to automate work, streamline operations, and give hospitality owners the clarity and time they need to focus on what matters the most: creating great guest experiences. Founded b ovider and the (local) payroll leads. You make sure risks are identified early and that the provider delivers what has been agreed. At the same time, you help build our growing Payroll Services team. Is this the next step you are looking for?\n\n**Why Highberg?**\n-----------------\n\nAt Highberg, everything revolves around people. Around colleagues who want to make a difference, take ownership, and work together based on trust and craftsmanship. We believe real change happens when strategy, execution, and humanity come together. That starts with our own team. This is why we create an environment where you can continue to grow, apply your expertise, and expand it further. An environment where you can make lasting impact.\n\n##### **Bringing strategy to life**\n\nAt Highberg, you are not a remote advisor. You work closely with clients on challenges that truly matter, from strategy through to implementation. This allows you to make an immediate impact and see the results of your work in practice.\n\n##### **Collaborative, human, and professional**\n\nWe work closely together, share knowledge, and strengthen one another to achieve the best possible outcomes. Our culture is open and built on trust, with room for both ambition and humanity. We listen, celebrate successes, and hold each other accountable, always with attention to people as well as to quality.\n\n##### **European outlook, locally rooted**\n\nWith teams in the Netherlands and the DACH region, you work in an organization with a broad, European perspective. At the same time, the culture remains personal and close-knit. This gives you the opportunity to collaborate internationally at a high level, within a committed and engaged team.\n\n##### **Culture as a catalyst**\n\nOur culture is a key reason why colleagues enjoy working at Highberg. We place trust in our people, value initiative, and believe it is important that everyone can continue to develop. This enables you to get the best out of yourself, while together contributing to sustainable growth.\n\n**Your role as Payroll Product Owner / Payroll Lead**\n-----------------------------------------------------\n\nAs Payroll Product Owner / Payroll Lead at Highberg, you own the payroll chain. Without a clear owner, issues fall between the cracks; you ensure that collective labour agreement (CAO) and legislative changes go live on time, that systems stay aligned and that payroll runs correctly every period. You work within Payroll Services, the Dutch-speaking payroll team of Highberg | Consultday.\n\n  \n\nYour responsibilities include:\n\n* Managing and prioritising the backlog: planning CAO, legislative and system changes, so that statutory changes go live on time.\n* Ven", "source": "indeed"}, {"company": "C-Teleport BV", "job_title": "Product Owner – Flights (Hybrid, the NL-based)", "location": "Rotterdam, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/C--teleport-Bv", "job_url": "https://nl.indeed.com/viewjob?jk=a45fce3f03a3c706", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-22", "recruiter_email": null, "applicant_count": null, "description": "You will own our most booked product, and decide what flight booking looks like when no one has to search anymore.\n\nFlights are the backbone of crew travel. Miss one and a vessel sails short-handed, or a rig waits for its relief crew. And plans rarely hold: >40% of crew bookings change or get cancelled.\n\nBusiness travel tools wait for someone to search. We don't. Crew travel starts with an operational schedule, so we know who needs to fly before they do. We're moving from \"search and book\" to \"recommended and ready to approve\". Our AI predicts the next booking within the customer's travel policy. It plans 10 crew joining and 10 leaving as one decision. And when the schedule shifts, changes that took hours of handling take minutes. No OTA or TMC is building this, because none of them see the schedule.\n\n#### **Creative within complexity**\n\nFlights are full of rules written to protect airlines, not travellers. Fare rules, re-issue logic and the way airlines handle changes and cancellations often work against our customers. The airlines have no reason to change that.\n\nThe best solutions hide inside those rules. Finding them means understanding the mechanics of distribution deeply enough to see a solution where others see a dead end. That's the job: build what others say can't be done.\n\n#### **About C Teleport**\n\nWe automate crew travel for maritime, aviation and energy companies, and we power white-label booking tools for travel management companies. We're about 90 people in Rotterdam, working lean: small squads, short lines and real ownership.\n\n#### **What success looks like**\n\n* 6 months: You know our flight stack inside out (sources, fares, booking flow, servicing). You've shipped your first improvements, and you've brought at least one new customer opportunity to the roadmap with a clear case behind it.\n* 12 months: Recommended, ready-to-approve bookings are live with pilot customers. You've moved [metric] measurably from [baseline].\n* 18–24 months: C Teleport is the reference for workforce flight booking. Customers approve crew travel instead of searching for it.\n\n#### **Must-haves**\n\n* Hands-on experience as a PO or PM shipping with engineering teams.\n* Deep knowledge of flight distribution: GDS, NDC, fares and fare rules, ticketing, and servicing (re-issues, refunds, exchanges).\n* You've shipped products where data or AI drives the decision, not just the interface.\n* You find creative solutions inside complex rules, and you can show us one you built.\n* You're comfortable with APIs and supplier integrations, enough to work as an equal with engineers.\n\n#### **Nice-to-haves (not required)**\n\n* Experience at an airline, OTA, TMC, GDS or NDC aggregator.\n* Marine or offshore fares, group bookings, or other B2B corporate travel.\n* Building recommendation or prediction models into a product.\n\n#### **This is not for you if…**\n\n* You accept \"the airline doesn't support that\" as an answer.\n* You see flights as a search-and-book funnel to optimise.\n* You'", "source": "indeed"}, {"company": "Impala Terminals", "job_title": "IT Product Owner", "location": "Rotterdam, South Holland, Netherlands", "careers_url": "https://ch.linkedin.com/company/impalaterminals", "job_url": "https://www.linkedin.com/jobs/view/4444580489", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-14", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Accenture the Netherlands", "job_title": "Product Owner", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/accenture-the-netherlands", "job_url": "https://www.linkedin.com/jobs/view/4489584882", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-13", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "UWV", "job_title": "Product Owner II/III–Moderne werkplek, telefonie & printen (4 vacatures )", "location": "Amsterdam, North Holland, Netherlands", "careers_url": "https://nl.linkedin.com/company/uwv", "job_url": "https://www.linkedin.com/jobs/view/4489597254", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-13", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Nederlandse Spoorwegen", "job_title": "Product Owner ServiceNow Platformteam", "location": "Utrecht, Utrecht, Netherlands", "careers_url": "https://nl.linkedin.com/company/nederlandsespoorwegen", "job_url": "https://www.linkedin.com/jobs/view/4489091965", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "Levy Professionals", "job_title ed to your professional development.\n* Team outings, social drinks, and an annual weekend trip with the entire team.\n\n**Who we are**\n\n*“LYNX helps you invest in yourself.” “Working at LYNX means joining the LYNX family.” “The development opportunities make LYNX the best place to work.”*\n\nThis is what our employees say about LYNX, and it reflects exactly what we aim to offer: an environment where you can get the best out of yourself.\n\nFrom our offices in Amsterdam, Ghent, Berlin, and Prague, we work every day to provide private and professional clients with the best trading opportunities through a fast, user-friendly, and reliable platform.\n\nLYNX is an international FinTech company where around 300 colleagues contribute to client success across Europe in an informal, collaborative, and growth-oriented environment.\n\nWe’re an equal-", "source": "indeed"}, {"company": "Thales", "job_title": "Product Manager – Delivery Services", "location": "Amersfoort, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Thales", "job_url": "https://nl.indeed.com/viewjob?jk=466a05adc9db22e0", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-24", "recruiter_email": null, "applicant_count": null, "description": "Location: Amersfoort CDI, Netherlands\n\n**Product Manager – Delivery Services**\n=======================================\n\n**Summary:**\n------------\n\nThis is a Product Manager role within the Identity & Access Management business of Thales' CSP business unit.\n\nThe role is responsible for defining, industrializing and growing Thales' delivery services for hardware authenticators, including smart cards and FIDO tokens. This covers personalization, packaging, fulfillment and distribution services, leveraging internal manufacturing and operational capabilities to deliver scalable, cost-effective and customer-centric solutions.\n\nBeyond service industrialization, the Product Manager will drive business development, market positioning and revenue growth for delivery services. This includes engaging with customers and partners, identifying new business opportunities, developing compelling commercial offers and representing Thales at industry events and trade shows.\n\nThe successful candidate will combine product management, business development and operational expertise to transform existing capabilities into profitable, scalable services that address evolving customer needs.\n\n**Main responsibilities:**\n--------------------------\n\n**Delivery Services Strategy & Roadmap**\n\n* Own the roadmap for Thales delivery services, covering:\n* Card and token personalization.\n* Packaging services.\n* Fulfillment and direct-to-end-user distribution.\n* Industrialize the existing personalization service in Sweden and develop a standardized, scalable offer across regions.\n* Identify new service opportunities based on market trends and customer needs.\n\n**Business Development & Customer Engagement**\n\n* Leverage PAY and IBS capabilities, including personalization, manufacturing and fulfillment.\n* Coordinate engineering, operations and manufacturing teams to standardize processes and improve efficiency.\n* Drive synergies across sites and business units.\n\n**Offer Management & Business Development**\n\n* Define and maintain the service portfolio, value proposition, pricing strategy and profitability.\n* Develop business cases, revenue forecasts and scalable commercial offers, including subscription models.\n* Identify new business opportunities and develop existing customer relationships.\n* Engage directly with customers to understand their needs, present solutions and support commercial negotiations.\n* Identify and develop partnerships to expand service capabilities and market reach.\n\n**Customer Projects & Business Support**\n\n* Lead customer-specific delivery projects, balancing customization, scalability and profitability.\n* Support Sales and Solution Engineering in customer engagements, te ess models, and seamless integration with our partners’ and clients’ systems. As an Open Banking Customer Journey Expert, you will play a pivotal role at the intersection of product strategy and management, platform integrations, and external partnerships.\n\nYou are responsible for shaping how ING collaborates with external partners (e.g. PSPs, fintechs, ERP/TMS providers, high-impact partners) while connecting internal business lines across ING verticals (Retail, Business Banking, Wholesale Banking) to the Open Banking platform.\n\nYou are accountable for translating ecosystem opportunities and regulatory developments into scalable platform adoption, value creation, and strategic partnerships, ensuring ING’s Open Banking capabilities are positioned as a trusted, compliant, and commercially viable platform in the market.\n\nYou will combine deep API and platform knowledge with a strong commercial mindset, enabling ING to expand its Open Banking reach while delivering a frictionless developer and client experience.\n\nYou act as a senior product professional who leads complex initiatives end-to-end, and represents ING Open Banking towards internal and external stakeholders.\n\n  \n  \n\n**Key responsibilities**\n\n* Define and execute the **Open Banking ecosystem and partnership strategy**, aligned with regulatory, technical, and commercial objectives.\n* Act as ING’s **primary Open Banking contact** for external ecosystem partners and strategic alliances.\n* Identify, onboard, and scale partnerships that accelerate adoption, ecosystem reach, and monetisation.\n* Serve as the main liaison between the **Open Banking Platform** and ING business lines (Retail, Business, Wholesale).\n* Translate business strategy and regulatory requirements into **clear platform use cases and integration opportunities**.\n* Design and deliver **secure, low‑friction integrations** in collaboration with Product, IT, Legal, Risk, and Compliance.\n* Lead joint **go‑to‑market initiatives** that drive sustainable platform usage and long‑term value.\n* Track ecosystem performance, define **KPIs**, and optimise partnership and commercial models using data and market insights.\n* Represent ING externally as a **product and technical authority** on Open Banking APIs, standards, and integration patterns.\n* Orchestrate end‑to‑end delivery across Engineering, Architecture, UX, Security, Legal, Compliance, Operations, and Commercial teams.\n  \n\n  \n\n**Your background**\n\n* You are a senior product professional who combines strategic thinking, technical depth, and strong stakeholder skills.\n  \n\n  \n\n**You bring:**\n\n* Senior-level product experience: Extensive experience as a Product Manager or Customer Journey Expert in platforms, APIs, integrations, or ecosy", "source": "indeed"}, {"company": "DeepL SE", "job_title": "Head of Product Growth", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Deepl-Se", "job_url": "https://nl.indeed.com/viewjob?jk=3efe076a33a9b704", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-28", "recruiter_email": null, "applicant_count": null, "description": "**Meet DeepL**\n==============\n\nDeepL is a global AI product and research company focused on building secure, intelligent solutions to complex business problems. Over 200,000 business customers and millions of individuals across 228 global markets today trust DeepL's Language AI platform for human-like translation, improved writing and real-time voice translation.  \nFounded in 2017 by CEO Jaroslaw “Jarek” Kutylowski, DeepL now has around 1,000 passionate employees and is supported by world-renowned investors including Benchmark, IVP, and Index Ventures.\n\nOur goal is to become the global leader in trusted, intelligent AI technology, building products that drive better communication, foster connections, and create a meaningful impact. To achieve this, we need talented people like you to join our journey. If you’re ready to shape the future of AI and grow your career in a fast-moving, purpose-driven environment, DeepL is your next destination.\n\n**What sets us apart**\n----------------------\n\nWhat sets us apart is our blend of cutting-edge AI technology, meaningful work, and a culture where people truly thrive. We’re a team of innovators, researchers, and creators driven by a shared purpose to unlock human potential by making work simpler, smarter, and more connected.\n\nWhen we share what it’s like to work at DeepL, the reactions are overwhelmingly positive. This might be because of our technology that helps millions of people and businesses communicate and work better every day, or because of the trust, curiosity, and care that shape our culture.\n\nWhat we know for sure is this: being part of DeepL means joining a team dedicated to innovation, growth, and well-being. Discover more about life at DeepL onLinkedIn,Instagram, and our Blog.\n\n**Meet the team behind this journey**\n-------------------------------------\n\nDeepL runs product-led growth alongside our sales-led motion, with media translation as the strategic wedge. This role is responsible for turning DeepL into the default platform for translation worldwide driving adoption through product usage, and converting that usage into strong Product Qualified Leads (PQLs) tha convert into revenues and strengthen our sales pipeline. This role drives adoption of our core DeepL Translate features (e.g. Customization Hub, TQE) and cross-sell into adjacent products like DeepL Voice. You will start with a focus on Media Translation.\n\nYour Mission: Put DeepL Translate in the hands of everyone, everywhere and use that reach to grow adoption across DeepL's broader product surface, turning usage into a reliable, high-quality source of PQLs for the business.\n\n**Your responsibilities**\n-------------------------\n\n* **Use case strategy:** prioritize the highest-value use cases for media translation, and and build the growth loops and product surface to drive adoption of them.\n* **Distribution on the DeepL platform (main channel):** drive media translation adoption directly within web, browser extension, and apps. Work c", "source": "indeed"}, {"company": "Lemonade Insurance Company", "job_title": "Senior Product Manager, Growth Platform", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Lemonade-Insurance-Company", "job_url": "https://nl.indeed.com/viewjob?jk=46f0ee7702bc89e9", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-21", "recruiter_email": null, "applicant_count": null, "description": "Amsterdam, Netherlands | Product | Full-time\n\nNot your everyday company\n\nLemonade completely reinvented how insurance works. As a customer-centric tech company, we created an insurance experience that is smart, instant, and delightful.\n\nAt Lemonade, you’ll be working with a group of like-minded makers, who get a kick out of moving fast and delivering great products. We surround ourselves with some of the smartest, most motivated, creative people who are filled with positive energy and good karma.\n\nUnlike most publicly traded companies, we’re nimble and efficient. We take pride in the fact that we still think and operate like a startup. We don’t care much about titles and hierarchy and instead focus on innovation, bold moves, and challenging the status quo.\n\nWe’re built as a lean, data-driven organization that relies on a common understanding of objectives and goals to provide teams with autonomy and ownership. We don’t like spending our days in meetings and we skip committees altogether. At Lemonade, there’s no such thing as going over someone’s head. We have zero tolerance for bureaucracy, office politics, and lean-back personalities.\n\nAs a Public Benefit Corporation and a Certified B Corp, we create positive environmental and social impact through our Giveback program. We’ve partnered with dozens of nonprofit organiza function getSector(company) {
  const cl = company.toLowerCase();
  for (const [key, sec] of Object.entries(SECTOR_MAP)) {
    if (cl.includes(key)) return sec;
  }
  return 'Other';
}

// ── Match scoring ─────────────────────────────────────────────────────────────
function scoreJob(j) {
  const title = (j.job_title || '').toLowerCase();
  const company = (j.company || '').toLowerCase();
  const sector = getSector(j.company);
  const desc = (j.description || '').toLowerCase().slice(0, 800);
  let score = 0;

  // Role type (0–50)
  const ROLES = [
    [50, ['technical product manager','product manager','productmanager','product management']],
    [48, ['associate product manager','apm']],
    [44, ['product owner','product lead']],
    [42, ['product operations','product ops','product strategy','growth product','growth manager']],
    [36, ['technical program manager','program manager','programme manager','tpm']],
    [25, ['head of product','director of product','vp of product']],
  ];
  for (const [pts, kws] of ROLES) {
    if (kws.some(k => title.includes(k))) { score += pts; break; }
  }
  if (score === 0) score += 15;

  // Sector fit (0–30)
  score += ({ Tech:30, Industrial:22, Energy:22, Finance:20, FMCG:14, Consulting:12, Other:12 })[sector] || 12;

  // Company bonus (0–20)
  const CO = [
    [20, ['adyen','booking','uber','databricks','prosus','backbase','catawiki','tomtom','mollie','bol.com','just eat','coolblue','exact']],
    [16, ['asml','nxp','signify','philips','wolters kluwer','vanderlande','tno']],
    [14, ['shell','eneco','vattenfall','tennet','alliander','stedin','orsted','ørsted','sbm offshore','neste','fugro']],
    [12, ['ing ','rabobank','abn amro','nn group','aegon','van lanschot']],
    [10, ['unilever','heineken','akzonobel','dsm','firmenich','ahold','frieslandcampina']],
    [6,  ['bcg','bain','mckinsey','oliver wyman','kearney','strategy&','roland berger','ey-parthenon','deloitte','accenture']],
  ];
  for (const [pts, kws] of CO) {
    if (kws.some(k => company.includes(k))) { score += pts; break; }
  }

  // Keyword signals in title/desc (+0–10)
  let bonus = 0;
  for (const [kw, pts] of [['product',3],['platform',2],['data',2],['growth',2],['energy',2],
      ['roadmap',2],['b2b',1],['saas',1],['analytics',1],['strategy',1]]) {
    if (title.includes(kw)) bonus += pts;
    else if (desc.includes(kw)) bonus += Math.round(pts / 2);
  }
  score += Math.min(10, bonus);
  score = Math.min(100, score);
  // She has no full-time PM job yet, so seniority in the title bounds the fit.
  if (/\b(vp|vice president|head of|director|chief|cpo)\b/i.test(title)) return Math.min(score, 25);
  if (/\b(principal|group|staff|lead)\b/i.test(title)) return Math.min(score, 40);
  if (/\b(senior|sr\.?|expert)\b/i.test(title)) return Math.min(score, 60);
  if (/\b(associate|junior|jr\.?|new grad|graduate|entry|apm)\b/i.test(title)) return Math.min(100, score + 10);
  return Math.min(score, 85);
}

const AI_SCORES_KEY = 'vanshika_ai_scores_v3';
function getAiScores() { try { return JSON.parse(localStorage.getItem(AI_SCORES_KEY) || '{}'); } catch { return {}; } }
function saveAiScores(obj) { try { localStorage.setItem(AI_SCORES_KEY, JSON.stringify(obj)); } catch {} }

function getEffectiveScore(j) {
  // Priority: localStorage (user-triggered) > j.ai_score (server-side) > JS rules
  const entry = getAiScores()[jobKey(j)];
  if (entry) return { score: entry.s, reason: entry.r || '', ai: true };
  if (j.ai_score !== undefined) return { score: j.ai_score, reason: '', ai: true };
  return { score: scoreJob(j), reason: '', ai: false };
}

function matchBadgeHtml(score, isAi, reason) {
  let cls;
  if (score >= 85) cls = 'ex';
  else if (score >= 70) cls = 'str';
  else if (score >= 55) cls = 'gd';
  else if (score >= 40) cls = 'ok';
  else cls = 'low';
  const sup    = isAi ? '<sup style="font-size:8px;margin-left:1px">AI</sup>' : '';
  const tipTxt = isAi && reason ? reason : (isAi ? 'AI-scored by Claude' : 'Keyword match score');
  return `<span class="match-badge match-${cls}" title="${esc(tipTxt)}">${score}%${sup}</span>`;
}

async function aiScoreAll() {
  let apiKey = localStorage.getItem('vanshika_claude_api_key');
  if (!apiKey) {
    const k = prompt('Enter your Claude API key (sk-ant-…) to enable AI scoring:');
    if (!k || !k.trim()) return;
    apiKey = k.trim();
    localStorage.setItem('vanshika_claude_api_key', apiKey);
  }
  const btn = document.getElementById('ai-score-btn');
  btn.disabled = true; btn.textContent = '⏳ Scoring…';

  const aiScores = getAiScores();
  const unscored = JOBS_DATA.filter(j => !aiScores[jobKey(j)]);
  if (!unscored.length) {
    btn.disabled = false; btn.textContent = '✨ Re-score with AI';
    applyFilters(); return;
  }

  const BATCH = 8;   // smaller batches — full descriptions fit comfortably
  let done = 0;
  try {
    for (let i = 0; i < unscored.length; i += BATCH) {
      const batch = unscored.slice(i, i + BATCH);

      const jobLines = batch.map((j, idx) => {
        const sector  = getSector(j.company);
        const desc    = (j.description || '').trim().slice(0, 1200);
        const descTxt = desc ? `\n   Description: ${desc}` : '';
        return `${idx}. Company: ${j.company} | Role: ${j.job_title} | Location: ${j.location || 'Netherlands'} | Sector: ${sector}${descTxt}`;
      }).join('\n\n');

      const userMsg = `Score these ${batch.length} roles for Vanshika. Reply ONLY with a JSON array — no other text:\n[{"i":0,"s":88,"r":"one sentence why"}, ...]\n\nRoles:\n${jobLines}`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-beta': 'prompt-caching-2024-07-31',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 600,
          system: [{
            type: 'text',
            text: AI_SYSTEM_PROMPT,
            cache_control: { type: 'ephemeral' },
          }],
          messages: [{ role: 'user', content: userMsg }],
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'API ' + res.status);
      }
      const data = await res.json();
      const text = data.content?.[0]?.text || '[]';
      const match = text.match(/\[[\s\S]*\]/);
      if (match) {
        const parsed = JSON.parse(match[0]);
        for (const {i, s, r} of parsed) {
          if (batch[i]) {
            aiScores[jobKey(batch[i])] = {
              s: Math.min(100, Math.max(0, Math.round(s))),
              r: (r || '').slice(0, 120),
            };
          }
        }
      }
      done += batch.length;
      btn.textContent = `⏳ ${done}/${unscored.length}…`;
      saveAiScores(aiScores);
    }
    btn.textContent = '✅ AI Scored!';
  } catch(e) {
    btn.textContent = '⚠ Error — Retry?';
    console.error('AI scoring error:', e);
  } finally {
    btn.disabled = false;
    applyFilters();
    setTimeout(() => { if (btn.textContent !== '⚠ Error — Retry?') btn.textContent = '✨ Re-score with AI'; }, 3000);
  }
}

// ── Job utils ─────────────────────────────────────────────────────────────────
function jobKey(j) { return j.job_url || (j.company + '|' + j.job_title); }

const LS_KEY = 'vanshika_job_statuses';
let statuses = {};
try { statuses = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch {}

function setStatus(key, val) {
  if (val) statuses[key] = val;
  else delete statuses[key];
  localStorage.setItem(LS_KEY, JSON.stringify(statuses));
  applyFilters();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(raw) {
  if (!raw) return null;
  try {
    const d = new Date(raw);
    if (isNaN(d)) return null;
    const diff = Math.round((Date.now() - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff <= 6) return diff + 'd ago';
    if (diff <= 30) return Math.round(diff/7) + 'w ago';
    return d.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
  } catch { return null; }
}

function statusLabel(s) {
  return {applied:'✅ Applied', interview:'🎯 Interview', offer:'🎉 Offer',
    rejected:'❌ Rejected', bookmarked:'🔖 Bookmarked'}[s] || '';
}

// ── Filters + sort ────────────────────────────────────────────────────────────
function applyFilters() {
  const search  = document.getElementById('search').value.toLowerCase();
  const sector  = document.getElementById('sector-filter').value;
  const statusF = document.getElementById('status-filter').value;
  const sourceF    = document.getElementById('source-filter').value;
  const sortBy     = document.getElementById('sort-by').value;
  const maxDays    = parseInt(document.getElementById('date-filter').value) || 0;
  const maxApplied = parseInt(document.getElementById('applicant-filter').value) || 0;
  const now        = Date.now();

  let filtered = JOBS_DATA.filter(j => {
    const key = jobKey(j);
    const jobStatus = statuses[key] || '';
    if (statusF === 'unreviewed' && jobStatus) return false;
    if (statusF && statusF !== 'unreviewed' && jobStatus !== statusF) return false;
    if (sector && getSector(j.company) !== sector) return false;
    if (sourceF && (j.source || 'crawler') !== sourceF) return false;
    if (maxDays && j.date_posted) {
      const d = new Date(j.date_posted);
      if (!isNaN(d) && (now - d.getTime()) > maxDays * 86400000) return false;
    }
    if (maxApplied) {
      const count = j.applicant_count;
      if (count == null || count >= maxApplied) return false;
    }
    if (search) {
      const hay = (j.company + ' ' + j.job_title + ' ' + (j.location||'') + ' ' + (j.notes||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  // Sort
  if (sortBy === 'score') {
    filtered.sort((a, b) => getEffectiveScore(b).score - getEffectiveScore(a).score);
  } else if (sortBy === 'date') {
    filtered.sort((a, b) => {
      const da = a.date_posted ? new Date(a.date_posted).getTime() : 0;
      const db = b.date_posted ? new Date(b.date_posted).getTime() : 0;
      return db - da;
    });
  } else if (sortBy === 'company') {
    filtered.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
  }

  renderJobs(filtered);
  updateStats();
}

function renderJobs(list) {
  const container = document.getElementById('list-container');
  const noRes = document.getElementById('no-results');
  if (!list.length) {
    container.innerHTML = '';
    noRes.style.display = 'block';
    document.getElementById('shown-count').textContent = '0';
    return;
  }
  noRes.style.display = 'none';
  document.getElementById('shown-count').textContent = list.length;

  container.innerHTML = list.map(j => {
    const key = jobKey(j);
    const status = statuses[key] || '';
    const sector = getSector(j.company);
    const dateStr = formatDate(j.date_posted);
    const notes = (j.notes || '').replace(/\[Direct link.*?\]/g,'').trim();
    const src = j.source || 'crawler';
    const srcLabel = {linkedin:'LinkedIn', indeed:'Indeed', glassdoor:'Glassdoor', crawler:'Portal'}[src] || src;
    const { score, reason, ai } = getEffectiveScore(j);
    const applicants = j.applicant_count != null
      ? `<span style="color:${j.applicant_count < 10 ? 'var(--green)' : j.applicant_count < 25 ? 'var(--yellow)' : 'var(--text-muted)'}">${j.applicant_count} applicants</span>`
      : '';
    // Recruiter: show email if known, else show "Find" search link for LinkedIn/Indeed jobs
    const recruiterHtml = j.recruiter_email
      ? `<a class="job-link secondary" href="mailto:${esc(j.recruiter_email)}" title="Email recruiter">${esc(j.recruiter_email.split('@')[0])}</a>`
      : (src !== 'crawler'
          ? `<a class="job-link secondary" href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent((j.company||'') + ' recruiter netherlands')}" target="_blank" rel="noopener" title="Find recruiter on LinkedIn">Find Recruiter</a>`
          : '');
    return `<div class="job-card status-${status || 'none'}">
      <div class="job-card-main">
        <div class="job-top">
          <span class="job-company">${esc(j.company)}</span>
          <span class="job-sector">${esc(sector)}</span>
          <span class="source-badge ${esc(src)}">${esc(srcLabel)}</span>
          ${matchBadgeHtml(score, ai, reason)}
        </div>
        <div class="job-title">${esc(j.job_title)}</div>
        <div class="job-meta">
          ${j.location ? '<span>' + esc(j.location) + '</span>' : ''}
          ${dateStr ? '<span>' + esc(dateStr) + '</span>' : ''}
          ${applicants}
          ${status ? '<span style="color:var(--accent)">' + statusLabel(status) + '</span>' : ''}
        </div>
        ${notes ? '<div class="job-notes">' + esc(notes) + '</div>' : ''}
      </div>
      <div class="job-actions">
        <a class="job-link" href="${esc(j.job_url || j.careers_url)}" target="_blank" rel="noopener">Apply →</a>
        ${recruiterHtml}
        ${j.careers_url && j.job_url && !j.recruiter_email ? '<a class="job-link secondary" href="' + esc(j.careers_url) + '" target="_blank" rel="noopener">Careers</a>' : ''}
        <select class="status-select" data-key="${esc(key)}" onchange="handleStatusChange(this)" title="Track status">
          <option value="" ${!status?'selected':''}>Track…</option>
          <option value="bookmarked" ${status==='bookmarked'?'selected':''}>🔖 Bookmark</option>
          <option value="applied" ${status==='applied'?'selected':''}>✅ Applied</option>
          <option value="interview" ${status==='interview'?'selected':''}>🎯 Interview</option>
          <option value="offer" ${status==='offer'?'selected':''}>🎉 Offer</option>
          <option value="rejected" ${status==='rejected'?'selected':''}>❌ Rejected</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

function handleStatusChange(sel) {
  const key = sel.getAttribute('data-key');
  setStatus(key, sel.value);
}

function updateStats() {
  const counts = {bookmarked:0, applied:0, interview:0, offer:0, rejected:0};
  for (const v of Object.values(statuses)) if (counts[v] !== undefined) counts[v]++;
  document.getElementById('chip-bookmarked').textContent = counts.bookmarked + ' Bookmarked';
  document.getElementById('chip-applied').textContent = counts.applied + ' Applied';
  document.getElementById('chip-interview').textContent = counts.interview + ' Interview';
  document.getElementById('chip-offer').textContent = counts.offer + ' Offer';
  document.getElementById('chip-rejected').textContent = counts.rejected + ' Rejected';
  document.getElementById('total-count').textContent = JOBS_DATA.length;
  document.getElementById('total-badge').textContent = JOBS_DATA.length + ' roles';
}

applyFilters();
</script>
</body>
</html>
