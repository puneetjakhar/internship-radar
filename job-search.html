    #search { flex: 1; min-width: 220px; font-size: 15px; }

    .stats-bar { padding: 10px 24px; display: flex; gap: 14px; align-items: center;
      font-size: 13px; color: var(--text-muted); border-bottom: 1px solid var(--border); }

    .job-company { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }

rdam Area", "careers_url": "https://www.linkedin.com/company/maxxton-b.v.", "job_url": "https://www.linkedin.com/jobs/view/4482739861", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-22", "recruiter_email": null, "applicant_count": null, "description": "", "source": "linkedin"}, {"company": "CALDIC", "job_title": "Program Manager (Global)", "location": "Rotterdam, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Caldic", "job_url": "https://nl.indeed.com/viewjob?jk=2a9687d73b65126d", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-16", "recruiter_email": null, "applicant_count": null, "description": "**Program Manager (Global)**\n============================\n\n**Job Details**\n---------------\n\n**Job Title:** Program Manager (Global)\n\n**Based in:** Rotterdam, Netherlands\n\n**Work Arrangement:** Hybrid\n\n**Working Hours:** Full-time\n\n**About the Role**\n------------------\n\nThe Program Manager is responsible for the day-to-day coordination and delivery of Program Nexus, Caldic's global product and supplier data program. The role translates approved objectives, scope and priorities into practical workplans, actions, deliverables and implementation activities. Working closely with functional experts, regional teams, IT, vendors and implementation partners, the Program Manager maintains the integrated plan, organizes working sessions and governance meetings, tracks actions, risks and dependencies, follows up deliverables, and supports testing, deployment and adoption activities.\n\nThe role is hands-on and execution-focused. Product, regulatory, quality, sustainability, business-process, data and technical decisions remain with the accountable functional owners and governance bodies. The Program Manager ensures that required inputs are collected, documented, reviewed, approved and translated into completed implementation activities.\n\nManaging Program Nexus is the primary focus. At natural transition points between program phases or gates, the role may also support other Caldic projects and ESG initiatives, as agreed with the Global ESG Director.\n\n**Key Responsibilities**\n------------------------\n\nAs Program Coordinator, you will play a central role in driving the successful delivery of the Nexus program. You will coordinate project plans, milestones, risks, dependencies, and governance activities, ensuring alignment across global functions, regional teams, IT, data owners, and external partners. Acting as the connective link between stakeholders, you will facilitate workshops, support requirements gathering and decision-making, and ensure actions are followed through to completion.You will also support software selection and implementation activities, coordinate testing, training, deployment, and hypercare, and help ensure a smooth transition into business-as-usual operations. Success in this role requires strong organizational skills, the ability to manage multiple workstreams and stakeholders, and a proactive approach to driving progress in a complex international environment.\n\n**Knowledge & Experience**\n--------------------------\n\n* Bachelor’s or master’s degree in Business Administration, Engineering, Supply Chain, Information Management, Data, Product Management, or a related discipline; equivalent experience is acceptable.\n* Project or program management certification (e.g., PMP, PRINCE2, Agile, Scrum) is a plus.\n* 5+ years of experience in project coordination, PMO, implementation, or transformation roles.Proven experience managing project plans, workstreams, stakeholders, governance, and decision-making processes.\n* Experience facilitating workshop", "source": "indeed"}, {"company": "Nebul", "job_title": "Product Owner HPC Infrastructure", "location": "Werk van thuis, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Nebul", "job_url": "https://nl.indeed.com/viewjob?jk=03a719d66219fe9b", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Nebul - Netherlands office, Remote\n\nFull-time\n\nPermanent employee\n\n  \n\n**about us**\n------------\n\n**Product Owner / Architect – Datacenter Infrastructure | NVIDIA | Mellanox | High Performance Computing | Procurement | English-speaking | EU Work Permit Required**\n---------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\n  \nAt Nebul, we’re building Europe’s sovereign cloud infrastructure — trusted, secure, and scalable for the future of AI. We’re looking for a **Product Owner / Architect Datacenter & Infrastructure** to define the roadmap and architecture of our high-performance datacenter platforms, including procurement and design, reference architecture, power infrastructure, and high-speed networking technologies (NVIDIA, Mellanox).  \nIf you understand what it takes to design, procure, and run a modern HPC datacenter optimized for AI workloads, and thrive at the intersection of product strategy and technical excellence — this role is for you.  \n  \n**What You’ll Do**  \nYou will own and drive the full datacenter infrastructure strategy, including power design, network architecture, and procurement of hardware such as NVIDIA GPUs and Mellanox networking components. You will define the reference architecture for high-performance compute environments, guiding everything from procurement processes to infrastructure deployment. You’ll work closely with engineering and operations to ensure seamless delivery and optimal performance of our AI-ready infrastructure, while interfacing directly with vendors like NVIDIA, NVIDIA Networking (Mellanox), and others to secure best-in-class solutions.  \n  \n**What we’re Looking For**  \nYou have 5+ years of experience in datacenter infrastructure and architecture, including hands-on experience with procurement, reference architectures, and high-performance networking. You are familiar with NVIDIA GPU platforms and networking technologies (Ethernet, InfiniBand). You are a structured, detail-oriented thinker with strong communication skills and experience translating complex infrastructure requirements into scalable designs.  \n  \n**Bonus If You Have**  \n\n* Deep experience with datacenter design for AI/HPC environments\n* Knowledge of OpenStack, Kubernetes and infrastructure automation tools\n* Understanding of lifecycle management for datacenter environments (power, cooling, network scaling)\n* Background in working with sinfrastructure providers\n\n  \n**Why Nebul?**  \n\n* Help design and scale Europe’s most advanced sovereign AI datacenter infrastructure\n* Work directly with NVIDIA, Mellanox and best-in-class vendors\n* Join a growing, mission-driven team building AI infrastructure from the ground up\n* Flexible hybrid setup, based near The Hague and Amsterdam\n* Competitive compensation, equity options, and career growth opportunities\n\n  \n**Must Haves**  \n\n* Based in the Netherlands (commute to The Hague)\n* Valid EU w", "source": "indeed"}, {"company": "Nebul", "job_title": "Product Owner / Architect – Datacenter Infrastructure", "location": "Werk van thuis, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Nebul", "job_url": "https://nl.indeed.com/viewjob?jk=089aaabb7c24d4be", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Nebul - Netherlands office, Remote\n\nFull-time\n\nPermanent employee\n\n  \n\n**about us**\n------------\n\n**Product Owner / Architect – Datacenter Infrastructure**  \n**NVIDIA | HPC | Datacenter Design | Hardware Procurement | EU Work Permit Required**\n\nAt **Nebul**, we’re building Europe’s sovereign cloud infrastructure—trusted, secure, and designed for the future of AI. We're hiring a **Product Owner / Architect, Datacenter Infrastructure** to define and drive the roadmap for our high-performance computing environments. This includes datacenter architecture, hardware procurement, power and cooling strategy, and vendor management with key partners like **NVIDIA**.\n\nIf you know what it takes to design, negotiate, and operate advanced AI datacenters—and you thrive at the intersection of deep technical expertise and strategic execution—this role is for you.\n\n### **What You’ll Do**\n\n* Own the **end-to-end datacenter infrastructure strategy**, including compute, network, power, and physical layout\n* Define **reference architectures** optimized for AI/HPC workloads using NVIDIA GPUs and high-performance systems\n* Lead **hardware procurement**, including vendor evaluations, contract negotiations, and technical alignment\n* Work cross-functionally with engineering, operations, and leadership to ensure on-time infrastructure delivery\n* Oversee **deployment planning**, including power and cooling design, rack layouts, and network architecture\n* Collaborate with leading vendors like **NVIDIA** to assess technologies, secure competitive pricing, and ensure supply chain alignment\n\n### **What We’re Looking For**\n\n* **5+ years** of experience in datacenter infrastructure, system architecture, or hardware procurement—ideally in HPC, hyperscale, or AI environments\n* In-depth knowledge of **NVIDIA GPU platforms** and high-performance compute infrastructure\n* Experience managing **RFPs, BOMs**, and vendor relationships for compute, storage, and network hardware\n* Familiarity with **power, cooling, and lifecycle management** in datacenter environments\n* Strategic mindset with strong communication skills and attention to detail\n\n### **Nice to Have**\n\n* Experience with **AI/HPC-oriented datacenter design**\n* Knowledge of **OpenStack, Kubernetes, or automation tools**\n* Hands-on experience working with **colocation providers or enterprise IT teams**\n* Understanding of **infrastructure compliance and security** in cloud or regulated settings\n\n### **Why Join Nebul?**\n\n* Help build the foundation of **Europe’s sovereign AI infrastructure**\n* Work directly with **NVIDIA** and other world-class technology partners\n* Join a mission-driven team shaping the future of high-performance computing\n* Flexible hybrid work model near **The Hague and Amsterdam**\n* Competitive salary, **equity options**, and clear **career growth paths**\n\n### **Must-Haves**\n\n* **Based in the Netherlands** (commutable to The Hague)\n* Valid **EU work permit** (no sponsorship available)\n* Fluent in **English** (Du", "source": "indeed"}, {"company": "Alcor", "job_title": "Product Owner Cloud", "location": "Apeldoorn, GE, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Alcor", "job_url": "https://nl.indeed.com/viewjob?jk=2c34aaf627211b1e", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Caseware combines over 35 years of industry expertise with AI-powered technology to transform how audit and accounting professionals work. Serving organizations across 130 countries, we bring intelligent automation directly into audit and financial reporting workflows—helping professionals reduce manual work, navigate complexity, and focus on informed decisions. Join our global team and help build technology that strengthens trust in financial information.  \n  \nAs **Product Owne**r for our Cloud solutions, you are responsible for driving the development, maintenance, and continuous improvement of our products. You work closely with a full team—both functional and development—so affinity with both is important. You organize and prioritize the team's work through a well-managed backlog and sprint board, ensuring delivery of maximum value to our customers.  \n  \nThis is a **Full time permanent** position **Location:** This is a **hybrid** role requiring the successful candidate to work **3** **days a week in our Apeldoorn, Netherlands office**, located at **Fauststraat 3, 7323 BA Apeldoorn, Netherlands**\n\n### **What you will be doing:**\n\n* Drive the development, maintenance, and continuous improvement of our Cloud products.\n* Collaborate closely with a full team—both functional and development—so affinity with both is important.\n* Organize and prioritize the team's work through a well-managed backlog and sprint board.\n* Ensure delivery of maximum value to our customers.\n* Define the product roadmap in alignment with strategic goals and market developments.\n* Coach the team to stay aligned with our overall product vision.\n* Focus on financial reporting, audit, and related workflows for the Dutch accountancy market.\n* Act as the final responsible for the success of our Cloud solutions.\n* Understand customer needs and balance various stakeholder demands.\n* Translate insights into clear product decisions and priorities.\n* Share progress regularly via roadmap presentations and other communications.\n* Create clarity and alignment across internal and external stakeholders.\n\n### **What you will bring:**\n\n* Experience or a strong affinity with audit and accounting (hands-on experience in practice is a plus)\n* Possesses deep understanding of the Dutch market and user needs\n* Supports the team in delivering accurate, high-quality, and compliant product content\n* Works effectively both independently and collaboratively, with excellent prioritization skills\n* Excels at translating complex concepts into intuitive, user-friendly solutions\n* Is available full-time and ready to take ownership as a proactive leader within the team\n\n### **What's in it for you:**\n\n* Shape what's next with AI: Help transform audit and accounting through AI-powered technology. Explore new ways to bring AI into our own workflows, rethink how work gets done, and turn ideas into meaningful improvements for our teams and customers.\n* Make an impact that matters: Contribute to solutions that h", "source": "indeed"}, {"company": "Insify", "job_title": "Insurance Product Manager / Underwriter (P&C)", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Insify", "job_url": "https://nl.indeed.com/viewjob?jk=5a47ca3e46adde94", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "Most insurance product roles ask you to perfect one product in one market. This one asks you to build Europe’s SME insurance products: decide what we cover and who we insure, negotiate it with our carriers and get it live, market after market.\n\n**Deep in the wording. Fast in the build.**\n\n**About Insify**\n\nInsurance for entrepreneurs is still built the old way: one market at a time, wordings nobody reads, and cover that leaves out the very businesses that need it most.\n\nWe're doing it differently.\n\nInsify is a high-growth scale-up backed by €43M in total funding from world-class investors like Accel, Munich Re Ventures, and Formula 1 champion Nico Rosberg. In five years, we've expanded from the Netherlands into France, Germany and Ireland, and we're just getting started. Our mission: become the European leader in AI-powered SME insurance.\n\nWe aren't just building a company; we're leading a revolution. Our culture is intense, high-stakes, and mission-driven. We hire smart, ambitious \"owners\" who possess a relentless drive to win. This is an environment for those who thrive on challenges, value intellectual honesty, and share our mindset of becoming a global category leader.\n\nOur founding team consists of seasoned entrepreneurs who have previously built iconic businesses like HelloFresh, Bloomon, and SumUp. We bring that same bias for speed, scale, and high standards to one of the most structurally broken experiences in financial services. Together, we combine that deep fintech and e-commerce expertise with cutting-edge AI to stay ahead of the curve.\n\n### **What you’ll own in your first year**\n\nYou won’t inherit a finished product shelf. You’ll build the engine that fills it.\n\n* **Build the product engine.** Turn how we benchmark a market into a system: compare cover, limits and exclusions across local players, our Dutch home product and our other markets, so every new product starts from facts, not gut feeling.\n\n* **Make the call on cover.** Decide what we cover, what we don’t and who we insure, and turn it into a proposal. The tools do the comparison; the judgment is yours.\n\n* **Get it signed.** Take the proposal to our risk carriers and negotiate it. You know what to push on, what to let go and which clause will set off six red flags.\n\n* **Get it live.** Adapt our wordings to each new market, run the legal review and launch. Less writing from scratch, more making one strong product fit the next market. Then track loss ratios, competition and customer feedback, and sharpen it.\n\n* **Build what doesn’t exist yet.** In the markets where we double down, own custom products from the insurance side, including cover for the trades and businesses others decline.\n\n### **Who you are**\n\nYou’re an insurance expert first and a builder second, but a real one.\n\n* You have **5+ years hands-on** in commercial P&C (Property & Casualty) at an insurer, MGA, (re)insurer or specialist broker, across underwriting, product and wordings, ideally for SMEs.\n* You know **wh", "source": "indeed"}, {"company": "LELY", "job_title": "Product Owner Digital Farming", "location": "Maassluis, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Lely", "job_url": "https://nl.indeed.com/viewjob?jk=38fdff91909a5dde", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "**Company Description**\n\nLely, founded in 1948, is committed to creating a sustainable, profitable, and enjoyable future in agriculture. Driven by the challenges farmers face and the needs of cows, we develop high-quality robots and data systems that improve animal welfare, flexibility, and productivity on dairy farms. Our mission is to support sustainable food production.\n\nFor more than 30 years, we have been a global leader in the sales and service of automated systems for successive generations of dairy farmers. Every day, we inspire our colleagues to provide customers with innovative solutions and to be a reliable partner for long-term advice and support. With our state-of-the-art Lely Campus in Maassluis and a worldwide network of dedicated Lely Centers offering tailored sales and service, Lely operates in more than fifty countries.\n\n **Job Description**\n\nWhat is your role?\n\nImagine your product decisions helping farmers organize their farms more efficiently every day. As Product Owner Digital Farming, you shape digital solutions that help farmers plan, carry out and track their daily work. From task management and smart routing to reporting and operational insights, you make sure technology connects with the realities of day-to-day life on the farm.\n\nYou will join the Farm Managers team within the Digital Farming domain. This team works on Horizon, Lely’s farm management platform. Within the platform, Farm Managers focuses on the daily processes that help farmers stay in control and carry out their work efficiently.\n\nIn this role, you combine strategic product ownership with hands-on business analysis. Together with stakeholders, you shape the product direction while working closely with the development team. You explore what farmers need, balance different interests and translate insights into clear user stories, requirements and acceptance criteria.\n\nYou collaborate closely with software engineers, UX designers, business stakeholders and farmers. Through conversations with them, you identify opportunities, validate solutions and help the team focus on improvements that create real value. This role is ideal for someone who enjoys both defining direction and working closely with a development team to turn ideas into well-defined solutions. Beyond product ownership, you help the team strengthen its focus, collaboration and ways of working, enabling the team to become increasingly effective as our product organization continues to develop.\n\nKey responsibilities include:\n\n* You develop and maintain the product vision, roadmap and priorities for the Farm Managers domain.\n* You bring together customer value, business objectives, technical sustainability and operational needs to make clear product decisions.\n* You build and prioritize the product backlog based on conversations with farmers, product data, business value and technical possibilities.\n* You translate needs into concrete requirements, user stories and acceptance criteria, preparing th", "source": "indeed"}, {"company": "ING", "job_title": "Product Lead - Digital Investment Products", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ing", "job_url": "https://nl.indeed.com/viewjob?jk=8e05d6f3fa6b9a16", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "* REQ-10123537\n* 05/11/2026\n* Customer Journey\n* Amsterdam, Netherlands\n* €6.728 - €10.753\n* ING Bank\n\n  \n\nAre you passionate about investments, digital customer journeys and commercial growth? Do you enjoy bringing product, marketing and sales together to deliver measurable customer and business impact in a highly regulated environment? If so, we have an exciting opportunity and look forward to welcoming you to our team!\n\n  \n  \n\n**The team**\n\nAt Investments, we make investing accessible and help our customers grow their money. We support customers across Private Individuals, Business Banking and Private Banking with compelling propositions, excellent digital experiences and trusted om/viewjob?jk=66a431695aabb766", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-30", "recruiter_email": null, "applicant_count": null, "description": "#### **About Nearfield Instruments**\n\nNearfield Instruments (NFI) is a fast-growing high-tech scale-up. We design, develop, integrate, market and service advanced metrology systems that help the world’s leading chipmakers improve production yields and enable smaller, more powerful microchips.\n\nFounded in 2016, we bring together experts in science and technology to develop a unique, high-throughput Scanning Probe Microscopy system.\n\n**This role involves approximately 35% international travel.**\n\nNearfield Instruments is scaling rapidly in one of the world’s most demanding industries: semiconductor manufacturing.\n\nAs Head of Product, you will lead the product management process, translating customer problems, market developments and technology opportunities into clear product definitions, portfolio choices and development priorities.\n\nYour focus is on the **why and the what**: identifying the right problems to solve, defining product outcomes and requirements, and making evidence-based decisions about where Nearfield should invest.\n\nCombining deep customer understanding, systems thinking and technical judgement, you will guide teams from problem discovery through product definition and roadmap decisions, creating clarity before development commitments are made.\n\nThis role reports to the Director of Product and Program Management.\n\n### **What you will do**\n\n* Own and evolve Nearfield’s **product strategy, portfolio and integrated product roadmap**, translating company strategy, market developments and technology opportunities into clear priorities.\n* Lead **customer and market discovery** to understand the workflows, constraints and unmet needs of leading semiconductor manufacturers and identify the problems worth solving.\n* Translate complex customer needs into **clear product outcomes, system-level requirements and acceptance criteria**.\n* Lead early product definition with System Engineering and Development & Engineering, evaluating solution options, technical feasibility, risk and trade-offs before development commitments are made.\n* Drive **portfolio and roadmap decisions** based on customer value, strategic fit, development effort, lifecycle impact, risk and time-to-impact.\n* Partner with Product Marketing to combine customer evidence, market and competitive insights, installed-base learning and product data into well-founded product opportunities.\n* Connect customers, Sales, System Engineering, Development & Engineering and Operations, creating alignment on **what we build, why we build it and what takes priority**.\n* Lead strategic customer discussions on future use cases, performance requirements and technology readiness.\n* Further professionalize Nearfield’s **product management organization**, establishing clear ownership, decision rights and effective product governance.\n* Build and develop a high-performing product management capability with strong technical depth, customer focus, accountability and fact-based decision-making.\n\n### **Wh", "source": "indeed"}, {"company": "Solera", "job_title": "Product Owner III", "location": "Nieuwegein, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Solera", "job_url": "https://nl.indeed.com/viewjob?jk=58618b4b8ab806e9", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-28", "recruiter_email": null, "applicant_count": null, "description": "**About Solera**\n\n  \n\nAt Solera, we continuously improve our products and services to deliver measurable value to insurers, MGAs, and other insurance market participants. Within the Netherlands market, our Data Processing portfolio consists of CHV (Clearing House Volmachten) and VRA (Volmacht Resultaat Analyse), services that process, validate, enrich, reconcile and deliver insurance portfolio, financial and claims information to insurers and delegated authority organizations.\n\nThe CHV/VRA platform supports critical insurer processes, operational reporting, regulatory reporting, portfolio analysis, data quality monitoring, and management information services. The platform currently serves dozens of insurers and hundreds of MGA data providers and remains a strategic component of Solera's International Underwriting portfolio.\n\n**The Role**\n\nAs Product Owner for CHV/VRA Dataprocessing, you are responsible for defining and executing the product vision, roadmap and backlog for the CHV/VRA portfolio.\n\nYou act as the primary liaison between insurers, MGA organizations, Product Management, Engineering, Operations, Data Processing specialists and commercial teams. You ensure that customer requirements, market developments, regulatory obligations and operational needs are translated into clear priorities and deliverables.\n\nYou provide day-to-day direction to AI driven teams and maintain ownership of the product backlog, release planning and roadmap execution. You balance customer commitments, technical debt, compliance requirements, operational stability and strategic product investments.\n\n**Key Responsibilities:**\n\n**Product Ownership**\n\n* Own and maintain the CHV/VRA product backlog.\n* Define product vision and roadmap in alignment with Product Management.\n* Prioritize features, enhancements and maintenance activities.\n* Translate customer and market needs into epics, features and user stories.\n* Ensure backlog readiness and sprint preparation.\n* Lead backlog grooming and iteration planning activities.\n* Coordinate release planning and production deployment priorities.\n\n**Customer & Market Engagement**\n\n* Act as primary product contact for insurers, MGAs and strategic customers.\n* Conduct requirements workshops and customer alignment sessions.\n* Support customer implementations, migrations and onboarding activities.\n* Participate in customer  oplossingen die maatschappelijke impact maken.  \nSamen bouwen we aan een digit", "source": "indeed"}, {"company": "Athora Netherlands", "job_title": "Productowner", "location": "Amsterdam Westpoort, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Athora-Netherlands", "job_url": "https://nl.indeed.com/viewjob?jk=50bf3408dbda346a", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-23", "recruiter_email": null, "applicant_count": null, "description": "Als Product Owner vertaal je visie naar concrete acties en zorg je dat multidisciplinaire (Business en IT) teams maximale waarde leveren voor klant en organisatie. Je ontwikkelt een krachtige productvisie die naadloos aansluit bij onze strategie en zorgt dat deze daadwerkelijkheid gerealiseerd wordt.\n\n### **Wat je over ons moet weten?**\n\nWij zijn Athora Netherlands, een verzekeringsbedrijf met de bekende merken Zwitserleven en Reaal. Wij houden ons voornamelijk bezig met pensioenen en levensverzekeringen op de Nederlandse markt. Dat doen wij als onderdeel van een Europese groep met vestigingen in Ierland, het Verenigd Koninkrijk, België, Duitsland en Italië. Wij zijn een sterk bedrijf met ruim één miljoen klanten en wij willen de komende jaren doorgroeien tot een van de belangrijkste spelers in de snel veranderende pensioenmarkt. Daarom zoeken wij mensen die niet terugdeinzen voor verandering, die van aanpakken weten, die de ambitie hebben om resultaten neer te zetten en die daarom het beste uit zichzelf en hun team weten te halen. Slimmer samen, noemen wij dat.\n\n### **Wat ga je doen?**\n\nJe bent het gezicht van de business, bouwt sterke relaties met interne en externe stakeholders en neemt beslissingen met mandaat. Je opereert op het snijvlak van Business en IT en stuurt een Agile Business Team aan dat vraagstukken vertaalt naar waardevolle Epics en Features.  \n  \nOnze strategie is gericht op continue verbetering van Operational Excellence, altijd vanuit klantwaarde, waarbij we processen expliciet koppelen aan de bovenliggende klantreis. Met jouw scherpe prioritering houd je de backlog overzichtelijk, definieer je features en stories en bewaak je de kwaliteit volgens de hoogste standaarden en de Definition of Done.  \n  \nMet jouw scherpe prioriteitenbeheer houd je de backlog overzichtelijk, definieer je features en stories en bewaak je de kwaliteit van opgeleverde producten, altijd volgens de hoogste standaarden en de Definition of Done. Binnen het team breng je focus, stimuleer je samenwerking en zorg je voor energie tijdens demo's en retrospectives.  \n  \nJe brengt focus in het team, stimuleert samenwerking en zorgt voor energie tijdens demo's en retrospectives. Tegelijk bewaak je de functionele (klantwaarde, wetgeving, processen) én technische integriteit van oplossingen. Je stuurt actief op KPI's en bent een aanjager van innovatie en optimalisatie.  \n  \nDaarnaast zorg je ervoor dat nieuwe vereisten en proposities tijdig en correct worden doorgevoerd in alle relevante systemen, van administratie tot klantcommunicatie, zodat de klantreis over alle kanalen consistent en effectief is ingericht. We werken in een professionele, resultaatgerichte omgeving met veel aandacht voor samenwerking, eigenaarschap en kwaliteit, en schakelen continu tussen business, IT en compliance.\n\n#### **#LI-DNI**\n\n### **Wat vragen we van jou?**\n\n* Hbo+/wo werk- en denkniveau met analytisch vermogen om complexe processen snel te doorgronden\n* Passie voor de Pensioen Busines", "source": "indeed"}, {"company": "C-Teleport BV", "job_title": "Product Owner – Flights (Hybrid, the NL-based)", "location": "Rotterdam, ZH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/C--teleport-Bv", "job_url": "https://nl.indeed.com/viewjob?jk=a45fce3f03a3c706", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-22", "recruiter_email": null, "applicant_count": null, "description": "You will own our most booked product, and decide what flight booking looks like when no one has to search anymore.\n\nFlights are the backbone of crew travel. Miss one and a vessel sails short-handed, or a rig waits for its relief crew. And plans rarely hold: >40% of crew bookings change or get cancelled.\n\nBusiness travel tools wait for someone to search. We don't. Crew travel starts with an operational schedule, so we know who needs to fly before they do. We're moving from \"search and book\" to \"recommended and ready to approve\". Our AI predicts the next booking within the customer's travel policy. It plans 10 crew joining and 10 leaving as one decision. And when the schedule shifts, changes that took hours of handling take minutes. No OTA or TMC is building this, because none of them see the schedule.\n\n#### **Creative within complexity**\n\nFlights are full of rules written to protect airlines, not travellers. Fare rules, re-issue logic and the way airlines handle changes and cancellations often work against our customers. The airlines have no reason to change that.\n\nThe best solutions hide inside those rules. Finding them means understanding the mechanics of distribution deeply enough to see a solution where others see a dead end. That's the job: build what others say can't be done.\n\n#### **About C Teleport**\n\nWe automate crew travel for maritime, aviation and energy companies, and we power white-label booking tools for travel management companies. We're about 90 people in Rotterdam, working lean: small squads, short lines and real ownership.\n\n#### **What success looks like**\n\n* 6 months: You know our flight stack inside out (sources, fares, booking flow, servicing). You've shipped your first improvements, and you've brought at least one new customer opportunity to the roadmap with a clear case behind it.\n* 12 months: Recommended, ready-to-approve bookings are live with pilot customers. You've moved [metric] measurably from [baseline].\n* 18–24 months: C Teleport is the reference for workforce flight booking. Customers approve crew travel instead of searching for it.\n\n#### **Must-haves**\n\n* Hands-on experience as a PO or PM shipping with engineering teams.\n* Deep knowledge of flight distribution: GDS, NDC, fares and fare rules, ticketing, and servicing (re-issues, refunds, exchanges).\n* You've shipped products where data or AI drives the decision, not just the interface.\n* You find creative solutions inside complex rules, and you can show us one you built.\n* You're comfortable with APIs and supplier integrations, enough to work as an equal with engineers.\n\n#### **Nice-to-haves (not required)**\n\n* Experience at an airline, OTA, TMC, GDS or NDC aggregator.\n* Marine or offshore fares, group bookings, or other B2B corporate travel.\n* Building recommendation or prediction models into a product.\n\n#### **This is not for you if…**\n\n* You accept \"the airline doesn't support that\" as an answer.\n* You see flights as a search-and-book funnel to optimise.\n* You'", "source": "indeed"}, {"company": "CaseWare International", "job_title": "Product Owner Cloud", "location": "Apeldoorn, GE, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Caseware-International", "job_url": "https://nl.indeed.com/viewjob?jk=8ab97fc9ede949be", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-22", "recruiter_email": null, "applicant_count": null, "description": "Caseware combines over 35 years of industry expertise with AI-powered technology to transform how audit and accounting professionals work. Serving organizations across 130 countries, we bring intelligent automation directly into audit and financial reporting workflows—helping professionals reduce manual work, navigate complexity, and focus on informed decisions. Join our global team and help build technology that strengthens trust in financial information.\n\nAs **Product Owne**r for our Cloud solutions, you are responsible for driving the development, maintenance, and continuous improvement of our products. You work closely with a full team—both functional and development—so affinity with both is important. You organize and prioritize the team’s work through a well-managed backlog and sprint board, ensuring delivery of maximum value to our customers.\n\n❗This is a **Full time permanent** position\n\n**Location:**\n\nThis is a **hybrid** role requiring the successful candidate to work **3** **days a week in our Apeldoorn, Netherlands office**, located at **Fauststraat 3, 7323 BA Apeldoorn, Netherlands**\n\n### **What you will be doing:**\n\n* Drive the development, maintenance, and continuous improvement of our Cloud products.\n* Collaborate closely with a full team—both functional and development—so affinity with both is important.\n* Organize and prioritize the team’s work through a well-managed backlog and sprint board.\n* Ensure delivery of maximum value to our customers.\n* Define the product roadmap in alignment with strategic goals and market developments.\n* Coach the team to stay aligned with our overall product vision.\n* Focus on financial reporting, audit, and related workflows for the Dutch accountancy market.\n* Act as the final responsible for the success of our Cloud solutions.\n* Understand customer needs and balance various stakeholder demands.\n* Translate insights into clear product decisions and priorities.\n* Share progress regularly via roadmap presentations and other communications.\n* Create clarity and alignment across internal and external stakeholders.\n\n### **What you will bring:**\n\n* Experience or a strong affinity with audit and accounting (hands-on experience in practice is a plus)\n* Possesses deep understanding of the Dutch market and user needs\n* Supports the team in delivering accurate, high-quality, and compliant product content\n* Works effectively both independently and collaboratively, with excellent prioritization skills\n* Excels at translating complex concepts into intuitive, user-friendly solutions\n* Is io.\n* Collaborate with sales training/sales enablement to develop and execute education plans, sales trainings and to drive new product launches at local level.\n* Develop sales tools, customer engagement programs, events and communication plans for the product or portfolio.\n* Demonstrate financial acumen and prov", "source": "indeed"}, {"company": "Google", "job_title": "Technical Program Manager, Technical Excellence, Physical Security", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Google", "job_url": "https://nl.indeed.com/viewjob?jk=44074bdafbb544ef", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-13", "recruiter_email": null, "applicant_count": null, "description": "Note: By applying to this position you will have an opportunity to share your preferred working location from the following: **Dublin, Ireland; Amsterdam, Netherlands; London, UK**.\n\n### **Minimum qualifications:**\n\n* Bachelor's degree in a technical, engineering, security management, or business field, or equivalent practical experience.\n* 5 years of experience managing physical security technology projects (such as enterprise access control, CCTV, intrusion detection systems, and physical barriers) from design through to deployment and commissioning.\n* 3 years of experience in technical program management leading cross-functional teams in a global or regional environment, specifically within logistics, warehousing, or industrial settings.\n\n  \n\n### **Preferred qualifications:**\n\n* 5 years of experience managing cross-functional or cross-team projects.\n* Experience managing security designers and partnering with architects & engineers to drive excellence in the design process.\n\n**About the job**\n-----------------\n\nA problem isn’t truly solved until it’s solved for all. That’s why Googlers build products that help create opportunities for everyone, whether down the street or across the globe. As a Technical Program -Inc.", "job_url": "https://nl.indeed.com/viewjob?jk=8a2bf620293fc539", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "Cronos is an innovative global cannabinoid company committed to building disruptive intellectual property by advancing cannabis research, technology, and product development. With a passion to responsibly elevate the consumer experience, Cronos is building an iconic brand portfolio. Cronos’ diverse international brand portfolio includes Spinach®, PEACE NATURALS® and Lord Jones®. For more information about Cronos and its brands, please visit: https://thecronosgroup.com/.\n\nAt Cronos Group, we hire talented people who thrive on solving difficult problems and give them the opportunity to hone new skills and approaches. If you want to play a part in shaping an innovative industry and help build a historically significant company, we want to meet you.\n\nThe Manager, Product Development – Netherlands will lead the local implementation, adaptation, and validation of products and processes transferred from Cronos Group’s Canadian R&D Center of Excellence to Netherlands operations.\n\nThis role executes approved product localization and technology-transfer projects with local Operations, Quality, Regulatory, and global R&D teams, within established global priorities and Netherlands regulatory and operational requirements.\n\nThe Manager, Product Development will also plan, execute, and analyze Netherlands sensory sessions with the PD Technician and the local Marketing lead, using methods and standards established by global Sensory Sciences.\n\nReporting to the Senior Director, Product Development, the Manager, Product Development will lead and develop the Netherlands PD Technician and own local delivery of R&D priorities, partnering closely with Canadian R&D and local cross-functional teams.The successful candidate is a hands-on technical lead with strong project execution and cross-functional coordination skills, and has experience translating established technologies into locally deployable products and processes.\n\n**This position is based out of Hellevoetsluis, South Holland, Netherlands.**\n\n**Key Responsibilities**\n------------------------\n\nProduct Development Coordination and R&D Integration\n\n* Own the execution of approved product development and technology-transfer projects in the Netherlands, in line with priorities set by global R&D leadership.\n* Serve as the local technical contact between the Canadian R&D Center of Excellence and Netherlands operations for technology transfer, knowledge sharing, and local adaptation.\n* Build and maintain local project plans (activities, timelines, resource needs, and technical dependencies), and coordinate with Operations, Quality, and Engineering to deliver agreed milestones.\n* Lead local cross-functional project meetings. Report progress, risks, and technical issues to global R&D, and escalate any decision outside approved scope or technical standards.Drive deployment of global R&D outputs locally in partnership with Netherlands operational teams.\n\nTechnology Transfer & Local Adaptation\n\n* Assess transferred formulat", "source": "indeed"}, {"company": "Signify", "job_title": "Global Product Manager Home Entertainment Philips Hue", "location": "Eindhoven, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Signify-4", "job_url": "https://nl.indeed.com/viewjob?jk=a7ffc15b4c5f0e37", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-11", "recruiter_email": null, "applicant_count": null, "description": "Eindhoven, Netherlands Category Marketing Posted Date 11/12/2026 Job Id 366971\n\n  \n\n**About Signify**\n\n  \n  \n\nThrough bold discovery and cutting-edge innovation, we lead an industry that is vital for the future of our planet: lighting. Through our leadership in connected lighting and the Internet of Things, we're breaking new ground in data analytics, AI, and smart solutions for homes, offices, cities, and beyond.\n\n  \n  \n\nAt Signify, you can shape tomorrow by building on our incredible 125+ year legacy while working toward even bolder sustainability goals. Our culture of continuous learning, creativity, and commitment to diversity and inclusion empowers you to grow your skills and career.\n\n  \n  \n\nJoin us, and together, we’ll transform our industry, making a lasting difference for brighter lives and a better world.\n\n  \n  \n\n**More about the role**\n\n  \n  \n\nWe’re looking for a Global Product Manager with a passion for Home Entertainment to join our Philips Hue Product Management team in Eindhoven.\n\nWorking for Signify means being creative and adaptive while working in a fast-paced company. Our culture of continuous learning and commitment to diversity and inclusion creates an environment that allows you to build your skills and career while transforming our industry.\n\nAs the world leader in lighting, we are constantly ahead of the curve. Through our leadership in connected lighting and the Internet of Things, we are breaking new grounds in data analytics, AI, and smart homes, offices, cities and more!\n\nSignify is one of the few companies in the world to achieve carbon neutrality and our next sustainability goals are even bolder: doubling our positive impact on the environment and society by 2025.\n\nAs a Global Product Manager for Philips Hue you will be responsible for leading and developing the global offer strategy and roadmap for our Philips Hue hardware portfolio with a strong focus on home entertainment and gaming propositions. You will help building the business by translating consumer insights into propositions that address end user needs with clear benefits. You will work together with an international team to develop a compelling product roadmap and go-to-market strategy to reach consumers homes around the world.\n\nWe are on the lookout for forward-thinking innovators with a passion for sustainability. If you match this description, get in touch!\n\n  \n  \n\n**This position is a 6 month contract, with opportunity to extend.**\n\n**Key areas of Responsibility**\n-------------------------------\n\n* Value Proposition creation and Portfolio Management\n* You are responsible for leading and developing the complete offer strategy and roadmap for the hardware category\n* You gather insights from the market, initiating user studies and research, to address any opportunities in the hardware roadmap.\n* You define and build required capabilities for the product management function\n* You plan and execute successful launches of products jointly with the market and m", "source": "indeed"}, {"company": "ING", "job_title": "Digital Product Manager – Reporting Factory", "location": "Amsterdam, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Ing", "job_url": "https://nl.indeed.com/viewjob?jk=093897e62112d634", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-09", "recruiter_email": null, "applicant_count": null, "description": "* REQ-10123805\n* 09/11/2026\n* Change Execution\n* Amsterdam, Netherlands\n* €7.761 - €12.343\n* ING Bank\n\n  \n\nShape the future of management reporting and business intelligence at ING. As **Senior Digital Product Manager – Reporting Factory**, you will define and drive the vision for a strategic reporting platform that delivers trusted insights, standardized reporting, and a consistent user experience across ING.\n\nYou will bring together business needs, reporting capabilities, data products, and technology platforms to build a scalable Reporting Factory that enables faster decision-making, improves governance, and creates a single source of truth for management reporting. The role spans strategy, product management, stakeholder engagement, and execution. The Reporting Factory vision includes a unified reporting platform, governed data consumption, reporting standards, reusable components, and migration from legacy reporting solutions.\n\n**The team**\n\nThe Data & Reporting expert team is on a transformation journey to establish a modern reporting ecosystem built on trusted data products and standardized reporting capabilities. The Reporting Factory is a strategic initiative that will provide a single reporting experience, reduce duplication across platforms, improve governance, and accelerate delivery of management information and business insights.\n\nWorking closely with business stakeholders, Report Managers, Data Management teams, Architects, Engineers, and Leadership teams, you will help define how reporting products are designed, delivered, governed, and adopted across the organization.\n\nThis is an opportunity to shape a high-visibility strategic product that sits at the intersection of Data, Analytics, Reporting, Governance, and Digital Transformation.\n\nWe value leadership impact and adaptability as much as strict checklist experience. If your background aligns with the core vision of this role, even if you don't tick every single bullet point, we strongly encourage you to apply. Tell us in your application or cover note what unique perspective and track record you’ll bring to the team.\n\n  \n  \n\n**Roles and responsibilities**\n\nYou will own the Reporting Factory vision and roadmap, ensuring it delivers measurable business value while creating a scalable and future-ready reporting ecosystem.\n\n* Define and own the Reporting Factory product vision, strategy, roadmap, and value proposition.\n* Translate business objectives and reporting needs into a prioritized product backlog.\n* Drive stakeholder alignment across business, data, reporting, architecture, and technology domains.\n* Lead the design and adoption of standardized reporting products, processes, and governance frameworks.\n* Partner with Data Factory, Data Management, and Engineering teams to deliver trusted reporting capabilities.\n* Measure pr et resultaat dat het team als geheel levert, niet op de uitvoering van individuele beheeractiviteiten. Daarbij zorg je dat prioriteiten, afhankelijkheden, voortgang en risico's voor alle betrokkenen inzichtelijk zijn.\n\n  \n\n**Dit krijg je**\n----------------\n\n* Schaal 12\n    \n  €4.818 - €7.094 (bruto)\n* Arbeidsovereenkomst voor onbepaalde tijd\n* 32 - 36 uur\n* Het salaris is gebaseerd op een werkweek van 36 uur.\n\n  \n\n**Dit bieden we nog meer**\n--------------------------\n\nWij vinden het belangrijk dat ", "source": "indeed"}, {"company": "Stichting CliniClowns Nederland", "job_title": "Product Owner", "location": "Amersfoort, UT, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Stichting-Cliniclowns-Nederland-4", "job_url": "https://nl.indeed.com/viewjob?jk=8ef7a88cb3411826", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-12", "recruiter_email": null, "applicant_count": null, "description": "Geef jij richting aan digitale ontwikkelingen en maak je van ideeën concrete verbeteringen? Als Product Owner bij CliniClowns werk je samen met collega’s aan oplossingen die onze missie ondersteunen.\n\n**Wat ga je doen?**  \nJe bent primair Product Owner voor Microsoft Dynamics 365 en Dynamics 365 Customer Insights en wordt waar nodig ingezet voor andere digitale platformen. Je vertaalt behoeften uit de organisatie naar oplossingen die waarde toevoegen voor CliniClowns en onze gebruikers.  \nJe onderzoekt wat nodig is, brengt belangen bij elkaar en zet prioriteiten om in resultaat. Dat kan nieuwe functionaliteit zijn, slimmer gebruik van bestaande mogelijkheden of een beter proces. Je maakt ook duidelijk wat we niet of nog niet oppakken.\n\n**Samen met de Business Analist**  \nJe werkt nauw samen met onze Business Analist, die bedrijfsprocessen en de samenhang tussen processen, informatie en producten op hoofdlijnen onderzoekt. Samen vertalen jullie relevante inzichten naar verbeteringen voor de producten waar jij verantwoordelijk voor bent. Jij brengt product- en gebruikerskennis in en bepaalt de productkeuzes en prioriteiten.  \nDaarnaast haal je zelf actief behoeften op bij gebruikers en stakeholders. Collega’s kunnen ook rechtstreeks ideeën en verzoeken bij je aandragen.\n\n**Jouw plek in de organisatie**  \nJe werkt samen met onder andere twee applicatiebeheerders. Jij geeft richting en stelt prioriteiten; zij brengen kennis van inrichting, beheer en gebruikersvragen in. Met onze leverancier bespreek je verbeterwensen, knelpunten, roadmap en planning. Je bent betrokken bij de voorbereiding, het testen en de ingebruikname van releases.  \nMet het datateam werk je aan de aansluiting van Dynamics 365 op het dataplatform voor analyses en dashboards. Je stemt informatiebehoeften en datakwaliteit af en prioriteert benodigde productaanpassingen. In het bovenliggende team Innovatie, Technologie en Inzicht (ITI) draag je bij aan de samenhang tussen producten, data, technologie en onze digitale koers.\n\nJouw belangrijkste verantwoordelijkheden\n\n* **Je geeft richting.** Je ontwikkelt en bewaakt de productvisie en roadmap voor Dynamics 365 en Customer Insights en waar nodig andere digitale platformen.\n* **Je vertaalt behoeften naar oplossingen.** Je onderzoekt gebruikersvragen en vertaalt deze naar heldere requirements, user stories en concrete verbeteringen.\n* **Je signaleert kansen voor innovatie.** Je onderzoekt updates, releases en nieuwe mogelijkheden van Microsoft en onze leverancier en vertaalt deze naar verbeterkansen voor CliniClowns.\n* **Je stelt prioriteiten.** Je beheert de backlog en weegt met stakeholders af wat de meeste waarde oplevert: nu, later of niet.\n* **Je bewaakt realisatie en kwaliteit.** Je verbindt gebruikers, specialisten en leveranciers en bewaakt voortgang, afhankelijkheden en resultaat. Je test nieuwe functionaliteit en productupdates zelf en beoordeelt met gebruikers of deze goed werken en bestaande processen blijven ondersteunen.\n* *", "source": "indeed"}, {"company": "Alliander", "job_title": "Productmanager Pricing", "location": "Arnhem, GE, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Alliander", "job_url": "https://nl.indeed.com/viewjob?jk=95160a0af6f27e9b", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "* Staf & Support\n* Fulltime (40 uur)\n* € 5.416 - € 7.738\n* Arnhem\n* HBO\n\n  \n\n*Deze vacature sluit op 01 december 2026*\n\nBouw pricing uit tot een volwassen expertise binnen Liander. Ontwikkel prijsstrategieën voor flexproducten en vertaal data, marktinzichten en regelgeving naar concrete keuzes. Zo help je het elektriciteitsnet slimmer te benutten en maatschappelijke kosten te beheersen. Deze functie heeft als standplaats Arnhem en betreft minimaal 32 uur per week. Jij maakt het net slimmer bij Alliander.\n\n**Dit ga je doen**\n------------------\n\n**De energietransitie is onmogelijk zonder jou als Productmanager Pricing**\n===========================================================================\n\nEen goed doordachte vergoeding kan klanten stimuleren om flexibel met energie om te gaan.Jij ontwikkelt daarom pricingstrategieën en pricingmodellen voor vergoedingen van flexproducten. Je bouwt voort op de eerste fase van dit expertisegebied, rondt openstaande onderdelen af en zorgt dat kennis en werkwijzen blijvend worden gebruikt. Daarbij werk je nauw samen met Product Marketing, accountmanagers, projectmanagers, Klant & Ontwerp en Regulatory.\n\nHet energienet van de toekomst maken we voor iedereen, mét iedereen. Als Productmanager Pricing werk jij hieraan mee. Zo ben jij bezig met het:\n\n* ontwikkelen, beheren en evalueren van pricingmodellen voor bestaande en\n\nnieuwe flexproducten;\n\n* opzetten en evalueren van pilots met Product Marketing, gericht op\n\nprijselasticiteit en klantrespons;\n\n* vertalen van marktdata, pilotresultaten en regelgeving naar strategieën voor\n\nverschillende klantsegmenten;\n\n* adviseren van management en directie over pricing, optimalisaties, risico’s en\n\nrelevante regelgeving;\n\n* borgen van modellen, werkwijzen en kennis, zodat de pricingcapability verder\n\ngroeit binnen Liander.  \n  \n\n**Jij maakt het net completer bij Alliander**\n=============================================\n\nAlliander bestaat uit verschillende bedrijven die samen werken aan een betrouwbaar en toekomstbestendig energienet. Met een grote groep vakmensen ontwikkelen en beheren we het energienet voor miljoenen inwoners en ondernemers in Nederland. Alles wat we doen, doen we met oog voor onze klanten. Samen met jou maken we de energietransitie mogelijk, voor en mét onze klanten.\n\nHier werken we aan het beheer, onderhoud en de ontwikkeling van onze elektriciteits- en gasnetten. Veiligheid staat altijd voorop. Zo leveren we energie op een veilige en betrouwbare manier aan huishoudens, bedrijven en andere klanten.\n\nDe drive om te ontdekken wat mogelijk is, kan alleen als jij genoeg energie hebt. Een passende werkomgeving helpt daarbij. Je werkt binnen Product Management, samen met betrokken en eerlijke collega’s. Binnen deze rol verbind je commerciële, maatschappelijke en bestuurlijke belangen. Je bent het inhoudelijke aanspreekpunt voor pricingvraagstukken rond flexproducten. Je werkt hybride: vanuit Arnhem, thuis en waar samenwerking dat vraagt.\n\nWerken aan een organisat", "source": "indeed"}, {"company": "PIDZ Internal", "job_title": "Product Lead AI", "location": "Amsterdam-Zuidoost, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Pidz-Internal", "job_url": "https://nl.indeed.com/viewjob?jk=07c7a45be55b05ac", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-10", "recruiter_email": null, "applicant_count": null, "description": "Wil jij met AI-agents oplossingen bouwen die binnen dagen of weken in de handen van gebruikers liggen? Kom als Product Lead AI ons team in Amsterdam Zuidoost versterken, voor 36 tot 40 uur per week.\n\nWerk je graag direct met de mensen die het probleem hebben, en wil je zelf zorgen dat er een oplossing staat die echt werkt? Als Product Lead AI bij PIDZ zit je dicht op de business. Je vertaalt vage vragen naar heldere doelen, laat AI-agents bouwen wat nodig is en zorgt dat het veilig en betrouwbaar in productie draait. Niet morgen op een roadmap, maar binnen dagen of weken in de handen van gebruikers.\n\nDeze rol combineert drie dingen: productrichting, productontwikkeling en klantgerichte delivery. Het is geen klassieke Product-rol met een backlog voor een ontwikkelteam, en ook geen puur adviserende rol. Jij houdt de eindregie over hoe PIDZ software maakt en stuurt AI-agents, collega’s en externe experts aan als één geheel.\n\n**Wat ga je doen?**\n\n**Richting en regie**\n\n* **Productrichting bepalen.** Je bepaalt wat PIDZ ontwikkelt, waarom en met welke prioriteit. Je vertaalt de strategie naar een heldere productkoers en maakt scherpe keuzes, in afstemming met directie en business.\n* **Eindregie over het agentic proces.** Je stuurt de ‘fabric’ (het samenspel van AI-agents, tooling en koppelingen waarmee we bouwen), je collega’s en externe experts aan als één geheel. Jij bepaalt wie of wat welk werk oppakt.\n* **Samenwerken met externe experts.** Een externe specialist beheert en breidt de technische fabric uit. Jij bent de opdrachtgever: je stelt kaders en prioriteiten en zorgt dat regie en kennis bij PIDZ blijven.\n* **Leidinggeven.** Je geeft leiding aan de productmedewerkers, neemt hen mee in de werkwijze en zorgt dat mens en AI elkaar versterken.\n* **Eigenaar van de werkwijze.** Na de pilot ben jij eigenaar van de nieuwe manier van werken. Je bouwt herbruikbare onderdelen, prompts, templates en evaluaties, zodat elke volgende oplossing sneller en beter gaat.\n\n**Van vraag naar werkende oplossing**\n\n* **Problemen doorgronden.** Je gaat in gesprek met gebruikers: planners, intercedenten, klantenservice, zorgorganisaties en zorgprofessionals. Je brengt processen en knelpunten in kaart en vertaalt vage wensen naar heldere eisen, randvoorwaarden en succescriteria.\n* **Snel een eerste versie neerzetten.** Je laat AI-agents prototypes bouwen en test die zo snel mogelijk met echte gebruikers. Je weet wanneer AI echt waarde toevoegt en wanneer gewone logica of een bestaande oplossing beter werkt.\n* **Agent-ready specificeren en orkestreren.** Je schrijft epics en user stories met toetsbare acceptatiecriteria en precies de context die een AI-agent nodig heeft. Je zet de juiste agents in voor ontwerp, bouw, test en documentatie en stuurt bij op tussenresultaten.\n* **Integreren met wat er al is.** Je zorgt dat oplossingen goed aansluiten op het PIDZ-platform en bestaande systemen zoals Salesforce en AFAS: API’s, datastromen, autorisatie en koppelingen.\n* **Veilig", "source": "indeed"}, {"company": "Enexis", "job_title": "Productmanager kernproducten", "location": "Den Bosch, NB, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Enexis", "job_url": "https://nl.indeed.com/viewjob?jk=69545c2e81b0d8ce", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-05", "recruiter_email": null, "applicant_count": null, "description": "* Den Bosch\n* € 4.223,- en € 6.033,-\n* HBO\n* 32 tot 40 uur\n\n  \n\n* ### **Wat ga je doen?**\n\n  #### **Met jouw energie kan het**\n\n  De energietansitie is in volle gang. Dit betekent nieuwe producten, nieuwe wetgeving en veranderende klantvragen. De energiemarkt is volop in beweging. Jij vertaalt die ontwikkelingen naar producten en diensten die Nederland vooruit helpen in de energietransitie. Samen met experts uit verschillende disciplines maak je producten toekomstbestendig en draag je direct bij aan een flexibel, betrouwbaar en betaalbaar energiesysteem. Je kunt daarbij rekenen op goede arbeidsvoorwaarden zoals een persoonlijk budget, 13e maand en vitaliteitsbudget.\n\n  Als Productmanager kernproducten ben je verantwoordelijk voor de doorontwikkeling van een aantal belangrijke producten en diensten van Enexis voor de zakelijke markt. Je werkt samen met collega's uit de hele organisatie aan de doorontwikkeling van producten en diensten voor de zakelijke markt. Daarbij zorg je dat verbeteringen niet alleen worden bedacht, maar ook succesvol worden gerealiseerd.\n\n  #### **Zo ga jij deze uitdaging aan**\n\n  Als Productmanager kernproducten werk je aan de doorontwikkeling van ons kernproductenportfolio. Denk hierbij aan openbare verlichting, meerdere aansluitingen op één adres, aansluitproducten en andere diensten die dagelijks door klanten worden gebruikt. Je volgt actief ontwikkelingen in wet- en regelgeving, de energiemarkt en klantbehoeften en vertegenwoordigt Enexis in relevante overleggen binnen de sector. De inzichten die je daar opdoet vertaal je naar verbeteringen in producten, processen en dienstverlening. Daarbij overzie je de impact op klantcommunicatie, interne processen, tarieven en de uitvoering binnen Enexis. Je bent de verbindende schakel tussen verschillende disciplines en stakeholders. Om tot de juiste oplossing te komen, werk je nauw samen met collega's uit asset management, IT, relatiemanagement, klantteams en operatie. Jij brengt de juiste mensen bij elkaar, stelt scherpe vragen en zorgt dat verbeteringen niet alleen worden bedacht, maar ook succesvol worden gerealiseerd.\n* ### **Functie-eisen**\n\n  #### **Zo pak jij het aan**\n\n  Je bent analytisch sterk en vindt het leuk om complexe vraagstukken uit te pluizen. Je wacht niet af, maar onderzoekt zelfstandig wat nodig is om een vraagstuk verder te brengen. Daarbij overzie je de gevolgen van veranderingen voor klanten, processen, systemen en andere onderdelen van de organisatie. Je bent communicatief sterk en weet verschillende belangen met elkaar te verbinden. Je werkt graag samen met collega's en stakeholders en creëert draagvlak voor nieuwe ideeën en veranderingen. Dankzij jouw nieuwsgierigheid, zelfstandigheid en organisatiesensitiviteit weet je hoofd- en bijzaken goed van elkaar te onderscheiden in een omgeving die continu in beweging is.\n\n  Verder heb je:\n\n  + Een afgeronde hbo- of wo-opleiding.\n  + Minimaal 3 tot 5 jaar ervaring in productmanagement, propositieontwikkeling, bel", "source": "indeed"}, {"company": "LevelUp Group", "job_title": "Head of Product C2B", "location": "Amsterdam Oost, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Levelup-Group", "job_url": "https://nl.indeed.com/viewjob?jk=f30071a32f1b3b8a", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-03", "recruiter_email": null, "applicant_count": null, "description": "We maken content die mensen willen delen. Voor lovebrands, retailers, foodmerken en bedrijven die durven. Short-form video, YouTube-series, campagnes, employer branding en AI-content: we doen het allemaal, en we doen het goed.\n\nOnze dienstverlening is de afgelopen jaren hard gegroeid. Nu is het tijd om er richting aan te geven. Welke diensten bieden we over twee jaar aan? Hoe maken we ze beter, slimmer en makkelijker op te schalen? En hoe worden we de strategische partner die klanten bellen *voordat* ze een briefing schrijven? Daar zoeken we iemand voor met een heldere visie op content en de drive om die visie te bouwen. Ben jij dat?\n\n**De rol in het kort**\n\nJij bent eigenaar van het ‘product’ van C2B: onze dienstverlening. Je bepaalt welke diensten we aanbieden, hoe ze eruitzien en hoe ze zich ontwikkelen. Je vertaalt trends en klantbehoeften naar proposities, formats en werkwijzen, en zorgt dat ons team ze kan leveren. Onze Creative Lead bewaakt de creatieve lijn en het commerciële team de klantrelaties. Jij zorgt dat wat we aanbieden klopt en werkt, en dat we het blijven vernieuwen.\n\n**Wat ga je doen?**\n\n* **Visie en roadmap.** Je ontwikkelt een visie op de contentmarkt (AI, creators, campagnes, social search, always-on) en vertaalt die naar een productroadmap: welke diensten bouwen we, verbeteren we of stoppen we?\n* **Diensten (door)ontwikkelen.** Je ontwerpt nieuwe proposities en scherpt bestaande aan: inhoud, aanpak, deliverables en prijsmodel.\n* **Van maatwerk naar product.** Je maakt van losse projecten herhaalbare diensten, met heldere formats, werkwijzen en kwaliteitsstandaarden.\n* **Innoveren en testen.** Je volgt nieuwe platforms, formats en AI-tools, start pilots met klanten en schaalt op wat werkt.\n* **Meten en verbeteren.** Je kijkt wat onze diensten klanten opleveren en gebruikt die inzichten om ze beter te maken.\n* **De juiste vragen stellen.** Je schuift aan bij klantgesprekken en haalt op wat klanten echt nodig hebben, ook als ze dat zelf nog niet weten.\n* **Het team meenemen.** Je zorgt dat creatie, studio en productie onze diensten kennen en kunnen leveren, met playbooks, kennisdeling en training.\n* **Commercie voeden.** Je geeft het commerciële team de proposities, cases en argumenten om te verkopen, en denkt mee bij pitches en voorstellen.\n\n**Wie ben jij?**\n\nJe kijkt naar een dienst zoals een productmanager naar een product: voor wie is het, welk probleem lost het op en hoe wordt het beter? Je bent net zo op je plek bij een marketingdirecteur als bij onze makers in de studio. Verder:\n\n* Je hebt een uitgesproken visie op content, social en merken, en op waar die markt naartoe gaat.\n* Je hebt ervaring met het ontwikkelen en lanceren van diensten of proposities, en weet hoe je van idee tot product komt.\n* Je bent strategisch sterk, brengt structuur aan en durft keuzes te maken, ook als dat betekent dat je nee zegt.\n* Je bent commercieel bewust: je weet wat een dienst waardevol maakt voor de klant én rendabel voor ons.\n* Je ben", "source": "indeed"}, {"company": "Blinqx", "job_title": "Product Operations Manager", "location": "Amsterdam-Zuidoost, NH, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Blinqx", "job_url": "https://nl.indeed.com/viewjob?jk=ed29294e827891f8", "visa_support": null, "relocation_support": null, "date_posted": "2026-11-02", "recruiter_email": null, "applicant_count": null, "description": "Onze productmanagers horen bij klanten te zitten, niet in Jira. Jij zorgt dat dat kan. Je bouwt het systeem waarop onze productorganisatie draait: de roadmap die iedereen kan lezen, de processen die niet van één persoon afhangen en de automatisering die handwerk overbodig maakt. En omdat we AI-first werken, is jouw eerste vraag bij elk proces niet \"wie doet dit?\" maar \"moet een mens dit nog doen?\"\n\n**Wat ga je doen?**\n-------------------\n\nBlinqx Verzekering & Hypotheek is gegroeid uit meerdere softwarebedrijven. Dat zie je terug: teams werken elk op hun eigen manier, de status van initiatieven zit te vaak in hoofden en mailboxen en wie wil weten wat er speelt, moet het aan iemand vragen. Daar is het afgelopen halfjaar een begin mee gemaakt, met onder meer een living roadmap in Jira. Jij neemt het van daar over en maakt er een staande organisatie van.\n\nConcreet: je bent eigenaar van de tooling en processen van het productteam. Je zorgt dat elk initiatief een doel, een scope en succescriteria heeft, dat go/no-go-momenten gewoon gebeuren en dat release-communicatie grotendeels vanzelf gaat. Als dat staat, kijk je breder: welke processen rond product, zoals onboarding van nieuwe klanten, kunnen slimmer?\n\n**Jouw verantwoordelijkheden**\n------------------------------\n\n* Je beheert en ontwikkelt de living roadmap in Jira: de initiatieflaag boven de epics, de templates en de afspraken over wat erin hoort.\n* Je bewaakt de ritmes: wekelijkse roadmap-afstemming, go/no-go-momenten en de rapportage richting directie.\n* Je automatiseert release-communicatie: van ticket naar releasenote naar klantbericht, zo min mogelijk handwerk.\n* Je zorgt dat signalen uit support, customer success en sales gestructureerd bij productmanagement landen.\n* Je zet samen met BI de productdashboards op: adoptie, gebruik en resultaat per initiatief.\n* Je zoekt actief naar werk dat AI of automatisering kan overnemen, en bouwt die oplossingen zelf of samen met R&D.\n* Je bent het aanspreekpunt voor Jira en aanverwante tooling, en helpt teams die nog op andere tools of spreadsheets werken over te stappen.\n* Je legt vast hoe we werken, zodat nieuwe collega's snel meedraaien.\n\n**Over het team**\n-----------------\n\nBlinqx Verzekering & Hypotheek bouwt software die dagelijks wordt gebruikt door hypotheekadviseurs, advieskantoren en volmachtkantoren in heel Nederland: voor advies, CRM, compliance, volmachtbeheer en documentbeheer, met AI als kern. We maken deel uit van Blinqx, een groep van ruim 700 collega's op meer dan tien kantoren, die software bouwt voor financiële en zakelijke dienstverleners: verzekeringen en hypotheken, accountancy, legal en finance.\n\nJe werkt vanuit Amsterdam binnen het productteam van Blinqx Verzekering & Hypotheek en rapporteert aan de CPO. Je werkt dagelijks met productmanagers, R&D, sales, support en customer success en je wordt begeleid door de Head of Product van de groep, die deze werkwijze mee heeft opgezet.\n\nJe hoeft dit niet al jaren te doen. Wel moet je sn", "source": "indeed"}, {"company": "Rode Kruis", "job_title": "Productmanager Verbindingsdienst", "location": "Duiven, GE, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Rode-Kruis", "job_url": "https://nl.indeed.com/viewjob?jk=0d75e3bf1bec99f5", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-29", "recruiter_email": null, "applicant_count": null, "description": "*32 uren per week | Standplaats* *Duiven*\n\nDe verbindingsdienst van het Rode Kruis zorgt er mede voor dat er gecommuniceerd kan worden via portofoons en mobilofoons tijdens evenementen en noodhulpsituaties in Nederland. De verbindingsdienst is momenteel bezig met de uitrol van diverse nieuwe projecten en werkgroepen, waarbij de functie van de productmanagers essentieel is.\n\n#### **Wat kan je verwachten?**\n\nEerst een beetje achtergrond:\n\nVoor de tijdelijke vervanging, voor een periode van 6 maanden, van een collega zoeken wij een productmanager Verbindingsdienst. Als productmanager Verbindingsdienst ben jij verantwoordelijk voor de opleidingen, schrijf je mee aan beleid en begeleid je de implementatie van de nieuwe werkwijze van de Verbindingsdienst in onze mooie organisatie. Je werkt samen met de 10 Rode Kruis regio’s en met de verschillende regionale verbindingsdiensten door het land.\n\nHet team is een onderdeel van het cluster Verenigingsmanagement en je zal samenwerken met de overige productmanagers, de teamleider en natuurlijk diverse vrijwilligers van de landelijke verbindingsdienst.\n\n#### **Wat ga je doen?**\n\n* Je bent medeverantwoordelijk voor de landelijke ondersteuning van de regio’s van het Nederlandse Rode Kruis.\n* Je zal de opleidingen van de landelijke verbindingsdienst vormgeven, uitrollen en implementeren. Denk hierbij aan de opleidingen m.b.t. portofonie en centralisten opleidingen.\n* Je bent medeverantwoordelijk voor het uitdragen van het beleid van de landelijke verbindingsdienst m.b.t. evenementen- en noodhulp.\n* Je gaat helpen bij het projectmatig opzetten van ondersteuning van grote evenementen waar het Rode Kruis bij betrokken is.\n* Je draagt je steentje bij aan de implementatie van een nieuw logistiek uitvoerend systeem binnen het Rode Kruis.\n* Je gaat samen met de werkgroepen de technische kaders van de verbindingsdienst verbeteren en implementeren.\n\n#### **Wat breng je mee of wie zoeken we?**\n\n* Relevante werkervaring binnen het maatschappelijk veld\n* Goede sociale en communicatieve vaardigheden\n* Flexibiliteit: je vindt het niet erg om met verschillende projecten bezig te zijn en bent flexibel inzetbaar\n* Een proactieve houding: je durft vernieuwingen door te voeren en hebt een hands-on mentaliteit.\n* Affiniteit met technologie en geautomatiseerde systemen, zoals o.a. TRBOnet, CMA, IP-netwerken.\n* Kennis van een vrijwilligersorganisatie en hoe deze opereert.\n* Helpen zit in je DNA.\n\n##### **Je talenten**\n\n* Sterke affiniteit met technologie\n* Een teamplayer én het werken met vrijwilligers\n* Goede beheersing van de Nederlandse taal (woord en schrift).\n\n#### **Wat bieden we jou?**\n\nHet werk dat je doet heeft maatschappelijke relevantie en maakt impact. Dat betekent soms ook impact op jezelf. Daarom hebben we oog voor je welzijn en bieden we handvaten om hierin een goede balans te vinden. We zijn een flexibele en mensgerichte werkomgeving met ruimte voor initiatief en ontwikkeling.\n\nHet salaris voor deze positie valt in sala", "source": "indeed"}, {"company": "Kieback&Peter Nederland", "job_title": "(Junior) Product Owner Dataplatform - IoT & Slimme Gebouwen", "location": "Zwolle, OV, Netherlands", "careers_url": "https://nl.indeed.com/cmp/Kieback&Peter-Nederland", "job_url": "https://nl.indeed.com/viewjob?jk=169ae07ee2dda53e", "visa_support": null, "relocation_support": null, "date_posted": "2026-10-29", "recruiter_email": null, "applicant_count": null, "description": "**(Junior) Product Owner Dataplatform – IoT & Slimme Gebouwen**\n\n**Zwolle | 40 uur | Internationaal team | € 3.200–€ 5.500 bruto per maand**\n\nPremievrij pensioen · Strategische rol · Eigen dataplatform · Ook voor ambitieuze starters\n\nGebouwen produceren elke dag enorm veel data. Met brix2bytes, het dataplatform van Kieback&Peter, analyseren we die data automatisch met AI. Dat doen we op een soevereine manier: gebouwdata gaat nooit naar derden zonder duidelijke afspraken. Als Product Owner bepaal jij mee welke kant dit platform op gaat.\n\nJe werkt in een internationaal team van ontwikkelaars, data- en gebouwspecialisten binnen de Kieback&Peter-groep. Je standplaats is ons kantoor in Zwolle. Een goed product begint bij de praktijk. Daarom is het ideaal als je zoveel mogelijk fysiek aanwezig bent, dicht bij applicatiebeheer, service en de operatie. Zo hoor je direct wat er speelt en zie je hoe het platform dagelijks wordt gebruikt.\n\n**Wat ga je doen?**\n\nJe
